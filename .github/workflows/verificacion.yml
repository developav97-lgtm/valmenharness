# Verificación del harness.
#
# Existe por un motivo concreto: el tipo de `npm run build` **no compila los
# tests** —cada paquete incluye solo `src/**/*.ts`—, así que los tests quedaron
# fuera del compilador y nueve errores de tipos se acumularon allí sin que nada
# los viera. `vitest` tampoco los ve: borra los tipos antes de ejecutar.
#
# Este flujo corre el typecheck completo, que sí incluye los tests, y la suite.
# Sin él, el sistema de tipos protege el código de producción y nada más, que es
# justo la mitad que se rompe al escribir un test con prisa.
name: verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` y no `npm install`: instala exactamente lo que dice el lockfile.
      # Un CI que resuelve versiones nuevas cada vez avisa de fallos que no son
      # del código.
      - run: npm ci

      # El typecheck va primero porque es el que más se olvida, y su salida
      # nombra el archivo y la línea: un fallo aquí se arregla sin abrir nada.
      #
      # **Construye lo que necesita**, y eso no es un detalle de estilo: el
      # `--noEmit` sobre un proyecto compuesto exige que los proyectos
      # referenciados ya estén construidos, así que sin este orden la
      # comprobación falla en un clon limpio con un TS6305 que no habla del
      # código. Medido: sin construir, 17 errores; construyendo, 0.
      - name: Tipos de todo, tests incluidos
        run: npm run typecheck

      # El lint va después del typecheck porque comprueba lo que el compilador no
      # ve: una promesa sin esperar, un `any` colado, una `Promise` dentro de un
      # `forEach`. Pocas reglas a propósito — ver `eslint.config.js`.
      - name: Lint
        run: npm run lint

      # Una exportación que nada consume pasa el typecheck, el lint y la suite: el
      # compilador no mira exportaciones y el lint solo cuenta un `export` como uso. Este
      # paso corre `knip` y falla ante una exportación nueva sin consumidor de
      # `packages/*/src`, nombrando el símbolo y su archivo. Lo que ya existía está en
      # `scripts/exports-sin-uso.linea-base.json`, que **solo se achica**: quien borra el
      # código muerto quita su entrada, y el paso falla si una entrada ya no aplica.
      #
      # Va después del typecheck porque los guiones de `scripts/` importan el `dist`, y
      # `knip` solo lo reconoce construido. Ojo con las pruebas: un `import * as` de un
      # índice que se pasa entero a `Object.keys` marca como consumido todo el paquete y lo
      # vuelve a cegar (por eso `tests/retiro-disparador.test.ts` importa el índice con una
      # ruta que se arma al ejecutar).
      - name: Exportaciones sin consumidor
        run: npm run exports:check

      # El formato, para que nadie tenga que discutirlo en una revisión.
      - name: Formato
        run: npm run format:check

      # La proyección de `.valmen/` a los archivos que leen los agentes tiene que
      # ser **determinista**, y eso solo se puede comprobar generándola. No está
      # en la suite porque la suite no puede: los archivos proyectados no se
      # versionan, así que en un clon limpio no existen y un test sobre ellos
      # estaría midiendo el estado del disco de quien lo escribe, no el código.
      #
      # Aquí sí existen, porque el paso anterior los acaba de construir.
      - name: La proyección está al día
        run: |
          node packages/cli/dist/main.js sync
          node packages/cli/dist/main.js sync --check

      # El registro es la fuente de verdad del repositorio, y sus tickets tienen
      # que pasar el contrato del propio motor. Hasta ahora ningún paso miraba
      # los tickets: la proyección se comprobaba y el registro, no.
      - name: El registro se valida con el propio motor
        run: node packages/cli/dist/main.js validate --all

      # La interfaz se **ejecuta**, además de compilarse: el módulo vive dentro de
      # un HTML que ningún test cubría, y así se cazó un identificador perdido que
      # llegó al navegador. El test de la suite ya lo hace, pero se corre aquí
      # también para que su salida quede en el registro de la CI con el motivo.
      - name: La interfaz se ejecuta
        run: node scripts/verificar-interfaz.mjs

      # La suite no necesita red ni credenciales: los gates que consultan a un
      # proveedor están desactivados por defecto y la prueba diferencial contra
      # `ticket.py` se activa con `VALMEN_REFERENCE_TICKET_PY`.
      - name: Pruebas
        run: npm test
