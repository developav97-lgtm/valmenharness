# Routing de modelos por rol de workflow.
#
# Generado desde Mission Control. Los comentarios escritos a mano en este
# archivo se pierden al guardarlo desde la aplicación: para conservarlos,
# edítalo con un editor de texto y no desde la interfaz.
# Línea acordada por el PO (2026-09-30): los dos proyectos que corren con este
# harness llevan el MISMO routing —«la misma metodología, el mismo harness y la
# misma calidad»—. Kimi en lo que decide de conjunto (descomposición,
# orquestador), DeepSeek en el juicio de compuertas.
#
# Espejo exacto de: 10-Proyectos/SaiOpenCloud/.valmen/routing.yaml. Un cambio en
# uno se replica en el otro.
#
# 2026-10-01: el rol escalation (kimi-k3) y el gate-judge sobre openrouter
# entraron con la tanda control-jornadas; el espejo con SaiOpenCloud queda
# pendiente de replicar.

preset: quality
# Máxima calidad. Para trabajo crítico o cuando el coste no importa.

roles:
  architect:
    provider: opencode-go
    model: kimi-k3
    effort: high
  escalation:
    provider: opencode-go
    model: kimi-k3
    effort: medium
  gate-judge:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash
    effort: auto
  orchestrator:
    provider: opencode-go
    model: kimi-k3
    effort: high
