# Routing de modelos por rol de workflow.
#
# Generado desde Mission Control. Los comentarios escritos a mano en este
# archivo se pierden al guardarlo desde la aplicación: para conservarlos,
# edítalo con un editor de texto y no desde la interfaz.

preset: quality
# Máxima calidad. Para trabajo crítico o cuando el coste no importa.

# Sin overrides: los tres roles —gate-evaluator, gate-judge y orchestrator— se
# resuelven del preset de arriba.
#
# Aquí había un `explorer` con opencode-go/glm-5.3, escrito cuando el harness
# declaraba doce roles. Ese rol se retiró al comprobar que nadie lo leía, y el
# archivo quedó con una clave que ya no existe: `parseRouting` la rechaza, así
# que **todo** `valmen gate` fallaba antes de llegar al evaluador, con el error
# apuntando al rol y no a que el archivo estaba viejo.
roles: {}
