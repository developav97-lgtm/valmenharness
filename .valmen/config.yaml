# Configuración del harness en este proyecto.
#
# Generado por `valmen adopt`. Revise y ajuste lo que corresponda:
# el harness solo escribió lo que pudo comprobar en el disco.

name: ValmenHarness
tickets-dir: tickets

# Dependencias clave detectadas. No son una regla: son un punto de partida
# para escribir `.valmen/rules/stack.md`.
#   typescript 5.7.2  (package.json)

# Gates del proyecto. Empiezan sin configurar a propósito: el modo por
# defecto de un gate es humano, y automatizarlo es una decisión que se toma
# con evidencia, no al adoptar.
gates: []

# Los comandos que el gate mecánico puede ejecutar como verificación.
#
# Los criterios de un ticket declaran su test (`<!-- test: … -->`), y el comando
# sale del ticket —que lo escribe quien el gate tiene que controlar—, así que solo
# se ejecuta lo que empiece con uno de estos prefijos. Sin la lista, un criterio
# sería una orden arbitraria que el gate obedece.
test-commands:
  - npx vitest run
  - node
# Modelos que este proyecto quiere tener a mano en el selector, por proveedor.
#
# Van **primero** en el desplegable. Sirven para dos cosas: subir arriba los que
# se usan de verdad —en una lista de 76 buscarlos cada vez es el trabajo que esto
# evita— y poder usar un modelo que el catálogo del proveedor no lista pero su
# endpoint acepta.
#
# Hace falta de verdad cuando el proveedor no publica su catálogo. Ya no es el caso
# de ninguno de los configurados, así que aquí están como atajo.
#
# El identificador tiene que ser el que acepta el proveedor. Se comprueba con el
# botón «Probar» de Mission Control antes de fiarse: uno mal escrito pasa la
# configuración y falla después, en mitad de un gate.
providers:
  codex:
    candidates:
      - gpt-5.6-terra
      - gpt-5.6-sol
      - gpt-5.6-luna
      - gpt-6-astra
