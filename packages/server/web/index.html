      /* ── Tickets y detalle: turno, avance y ciclo de ocho pasos ─────────
         (FEATURE-WEB-TRABAJO-TICKETS-20261014, bocetos assets/tickets.html y
         assets/ticket.html). Solo tokens: ámbar decide una persona, lila trabaja un
         modelo, cian decide el código o ya se hizo, verde está cerrado. */
      .vista-tickets, .vista-ticket { display: flex; flex-direction: column; gap: 20px; max-width: 1240px; min-width: 0; }
      .tickets-cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .tickets-migas { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--codigo); }
      .tickets-migas .tickets-migas-actual, .tickets-migas .tickets-migas-sep { color: var(--tenue); }
      .tickets-titulo, .ticket-titulo-detalle { margin: 6px 0 0; font-family: var(--fuente-titulo); font-weight: 600; font-size: 40px; line-height: 1.08; letter-spacing: -0.01em; color: var(--texto); text-transform: none; }
      .ticket-titulo-detalle { font-size: 34px; margin: 0; }
      .boton-nuevo-ticket { display: inline-flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--acento); color: var(--sobre-acento); font-weight: 600; font-size: 14px; }
      .boton-nuevo-mas { font-size: 18px; line-height: 1; }
      .panel-nuevo-ticket { border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
      .panel-nuevo-ticket[hidden] { display: none; }
      .vista-ticket { margin-bottom: 16px; }
      .panel-nuevo-texto { color: var(--tenue); font-size: 14px; }
      .tickets-barra { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; }
      .tickets-pestanas { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); }
      .tickets-pestana { display: inline-flex; align-items: center; gap: 8px; border: 1px solid transparent; background: transparent; color: var(--texto); font-size: 14px; padding: 8px 12px; border-radius: 8px; }
      .tickets-pestana.elegida { border-color: var(--borde); background: var(--panel-alto); }
      .tickets-cuenta { font-family: var(--mono); font-size: 12px; color: var(--tenue); }
      .tickets-pestana.persona .tickets-cuenta { color: var(--persona); }
      .tickets-buscador { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); }
      .tickets-buscador input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 0; font-size: 14px; }
      .icono-buscar { position: relative; flex: none; width: 10px; height: 10px; border: 2px solid var(--tenue); border-radius: 50%; }
      .icono-buscar::after { content: ""; position: absolute; right: -5px; bottom: -4px; width: 6px; height: 2px; background: var(--tenue); transform: rotate(45deg); }
      .mas-filtros { margin: 0; }
      .mas-filtros-cuerpo { padding-top: 12px; min-width: 0; }
      .mas-filtros-cuerpo .filtros { flex-wrap: wrap; }
      .casilla-filtro, .campo-orden { display: flex; align-items: center; gap: 6px; margin: 0; }
      .tabla-caja { overflow-x: auto; max-width: 100%; border: 1px solid var(--borde); border-radius: 14px; background: var(--panel); }
      .tabla-tickets { min-width: 760px; }
      .tabla-tickets th { position: static; background: transparent; font-family: var(--mono); letter-spacing: 0.12em; padding: 16px 18px; }
      .tabla-tickets td { padding: 14px 18px; }
      .tabla-tickets tbody tr { cursor: pointer; }
      .tabla-tickets tbody tr:hover td { background: var(--panel-hover); }
      .tabla-tickets tbody tr:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
      .ticket-titulo { display: block; color: var(--acento); font-weight: 600; font-size: 15px; text-decoration: none; max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .celda-ticket .id { font-size: 12px; }
      .ticket-marcas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
      .marca-puntos { font-size: 11px; color: var(--alerta); }
      .barra-avance { display: flex; gap: 3px; width: 150px; }
      .barra-avance .segmento { flex: 1; height: 5px; border-radius: 3px; background: var(--borde); }
      .barra-avance .segmento.hecho { background: var(--codigo); }
      .barra-avance .segmento.actual.persona { background: var(--persona); }
      .barra-avance .segmento.actual.agente { background: var(--modelo); }
      .barra-avance .segmento.cerrado { background: var(--hecho); }
      .avance-rotulo { margin-top: 6px; font-family: var(--mono); font-size: 12px; color: var(--tenue); }
      .turno-quien { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
      .turno-punto { width: 8px; height: 8px; border-radius: 50%; background: var(--tenue); }
      .turno-quien.persona { color: var(--persona); }
      .turno-quien.persona .turno-punto { background: var(--persona); }
      .turno-quien.agente { color: var(--modelo); }
      .turno-quien.agente .turno-punto { background: var(--modelo); }
      .turno-quien.nadie .turno-punto { background: var(--hecho); }
      .celda-turno .corrida-estado { display: block; margin-top: 4px; font-size: 11px; }
      .celda-modulo, .celda-edad { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
      .comando-copiable, .comando-manual { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 12px; border: 1px solid var(--borde); border-radius: 8px; background: var(--fondo-2); }
      .comando-n { font-family: var(--mono); color: var(--tenue); }
      .comando-texto { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-family: var(--mono); font-size: 14px; scrollbar-width: thin; scrollbar-color: var(--borde) transparent; }
      .comando-manual-texto { flex: 1; min-width: 0; }
      .comando-copiar { border: 0; background: transparent; color: var(--tenue); font-family: var(--mono); font-size: 12px; padding: 0; }
      .comando-marca { font-family: var(--mono); font-size: 12px; color: var(--tenue); }
      .ticket-migas { font-family: var(--mono); font-size: 13px; color: var(--tenue); }
      .ticket-migas-enlace { color: var(--acento); text-decoration: none; }
      .cabecera-ticket { display: flex; flex-direction: column; gap: 10px; }
      .ticket-marcas-detalle { display: flex; flex-wrap: wrap; gap: 8px; }
      .marca-ticket { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border: 1px solid currentColor; border-radius: 999px; color: var(--texto); }
      .marca-ticket.tipo { color: var(--acento); }
      .marca-ticket.estado.persona { color: var(--persona); }
      .ciclo-ticket { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
      .paso-ciclo { display: flex; flex-direction: column; gap: 4px; padding: 12px; border: 1px solid var(--borde); border-radius: 10px; background: var(--panel); }
      .paso-ciclo.pendiente { opacity: 0.55; }
      .paso-ciclo.actual.persona { border-color: var(--persona); background: var(--alerta-suave); }
      .paso-ciclo.actual.agente { border-color: var(--modelo); background: var(--modelo-suave); }
      .paso-n { font-family: var(--mono); font-size: 11px; color: var(--tenue); }
      .paso-ciclo.actual.persona .paso-n { color: var(--persona); }
      .paso-ciclo.actual.agente .paso-n { color: var(--modelo); }
      .paso-nombre { font-family: var(--fuente-titulo); font-size: 17px; font-weight: 600; }
      .paso-quien { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .paso-quien::before { content: "● "; }
      .paso-quien.q-persona, .paso-quien.q-politica { color: var(--persona); }
      .paso-quien.q-modelo { color: var(--modelo); }
      .paso-quien.q-codigo { color: var(--codigo); }
      .te-toca { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1px solid var(--persona); border-radius: 14px; background: var(--panel); min-width: 0; }
      .te-toca-cabeza { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; }
      .te-toca-titulo { margin: 0; font-family: var(--fuente-titulo); font-size: 20px; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--persona); }
      .te-toca-bajada { color: var(--tenue); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
      .te-toca-lista { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .te-toca-item { color: var(--texto); font-size: 14px; }
      .te-toca-acciones, .formulario-acciones { display: flex; flex-wrap: wrap; gap: 8px; }
      .boton-ok, .boton-no, .boton-neutro, .boton-confirmar { height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; }
      .boton-ok, .boton-confirmar { background: var(--hecho); border-color: var(--hecho); color: var(--sobre-acento); }
      .boton-no { background: transparent; border-color: var(--error); color: var(--error); }
      .boton-neutro { background: transparent; border-color: transparent; color: var(--tenue); }
      .formulario-resultado { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--borde); border-radius: 10px; background: var(--fondo-2); }
      .formulario-titulo { font-weight: 600; }
      .formulario-campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--tenue); }
      .pestanas-ticket { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--borde); }
      .pestana-ticket { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent; color: var(--tenue); font-size: 15px; padding: 8px 2px 10px; }
      .pestana-ticket.elegida { color: var(--texto); border-bottom-color: var(--acento); }
      .pestana-cuenta { margin-left: 6px; font-family: var(--mono); font-size: 12px; }
      .pestana-cuenta.persona { color: var(--persona); }
      .panel-ticket { min-width: 0; }
      .resumen-rejilla { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
      .resumen-rejilla > .tarjeta-ticket { flex: 999 1 420px; min-width: 0; }
      .resumen-lateral { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
      .tarjeta-ticket { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border: 1px solid var(--borde); border-radius: 14px; background: var(--panel); }
      .tarjeta-ticket-titulo { margin: 0; font-family: var(--fuente-titulo); font-size: 20px; font-weight: 600; text-transform: none; letter-spacing: normal; color: var(--texto); }
      .criterios-resumen { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .criterio-resumen { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
      .criterio-marca { color: var(--persona); }
      .criterio-resumen.hecho .criterio-marca { color: var(--hecho); }
      .criterio-via { font-family: var(--mono); font-size: 12px; color: var(--codigo); }
      .criterio-via.manual, .criterio-via.dev { color: var(--persona); }
      .compuertas-resumen { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 14px; }
      .compuerta-resultado { font-family: var(--mono); color: var(--tenue); }
      .compuerta-resultado.approve, .compuerta-resultado.pass { color: var(--hecho); }
      .compuerta-resultado.review { color: var(--persona); }
      .compuerta-resultado.block, .compuerta-resultado.fail { color: var(--error); }
      .resumen-estado { margin-top: 8px; }
      @media (max-width: 767px) {
        .tickets-titulo { font-size: 32px; }
        .ticket-titulo-detalle { font-size: 26px; }
        .tickets-pestanas, .tickets-buscador { flex: 1 1 100%; }
        .tickets-pestana { padding: 8px; }
        .boton-nuevo-ticket { width: 100%; justify-content: center; }
      }

      /* ── Barra de guardado, fija mientras se edita ────────────────────── */
      /* El botón de guardar estaba al final de una tabla de trece roles, y no se
         encontraba. Una barra fija dice que hay cambios pendientes y los guarda
         sin obligar a recorrer la página. */
      .barra-guardado {
        position: sticky; bottom: 0; z-index: 30;
        display: flex; gap: 12px; align-items: center;
        padding: 12px 16px; margin-top: 18px;
        background: var(--panel-alto); border: 1px solid var(--borde);
        border-radius: 8px;
      }
      .barra-guardado .cuenta { font-size: 13px; color: var(--tenue); flex: 1; }
      .barra-guardado .cuenta.pendiente { color: var(--alerta); }
      .barra-guardado .resultado { flex: 1; }

      /* ── Selector de modelo en dos niveles ────────────────────────────── */
      /* Proveedor y modelo, con el modelo en un desplegable que se puede
         escribir: una lista de cientos de modelos sin búsqueda es una lista que
         nadie recorre, y un `select` no deja teclear. */
      .fila-perfil, .fila-rol-perfil, .elecciones-perfil {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid var(--borde-suave);
      }
      .origen-perfil, .marca-perfil { color: var(--tenue); font-size: 12px; }
      .marca-perfil { color: var(--acento); }
      .editor-perfil label { display: block; margin: 6px 0; }

      .par-modelo {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .par-modelo select {
        max-width: 150px;
      }
      .par-modelo .caja-modelo {
        position: relative;
        flex: 1;
        min-width: 220px;
      }
      .par-modelo input {
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      .lista-modelos {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 260px;
        overflow: auto;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        margin-top: 2px;
      }
      .lista-modelos div {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lista-modelos div:hover,
      .lista-modelos div.marcado {
        background: var(--panel);
      }
      .lista-modelos .nombre {
        font-family: inherit;
        color: var(--tenue);
      }
      .lista-modelos .vacio {
        cursor: default;
        color: var(--tenue);
        padding: 10px;
      }
      .cargando-modelos {
        font-size: 12px;
        color: var(--tenue);
      }
      .selector-modelo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pie-modelo {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .pie-modelo button {
        font-size: 12px;
      }
      .pie-modelo .resultado {
        flex: 1;
        word-break: break-word;
      }

      /* ── Features ─────────────────────────────────────────────────────── */
      .acciones-feature {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--borde);
      }
      .acciones-feature button {
        font-size: 12px;
      }
      a.enlace {
        color: var(--acento);
        text-decoration: none;
      }
      a.enlace:hover {
        text-decoration: underline;
      }
      /* Los cuatro artefactos de una feature, siempre visibles: la pregunta
         «¿en qué punto está?» se responde mirando, no abriendo. */
      .artefactos {
        display: flex;
        gap: 4px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .artefactos span {
        color: var(--borde);
      }
      .artefactos span.hecho {
        color: var(--ok);
      }
      .sprint {
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 14px;
      }
      .sprint > header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 12px 16px;
        border-bottom: 1px solid var(--borde);
        background: none;
      }
      .sprint > header .id {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--acento);
      }
      .sprint > header h3 {
        font-size: 14px;
        font-weight: 500;
      }
      .sprint table {
        border: none;
      }
      .sprint td {
        border-bottom: 1px solid var(--borde);
      }
      .sprint tr:last-child td {
        border-bottom: none;
      }
      /* Un ticket del grafo que todavía no existe en el registro. Se marca para
         que la diferencia entre «planeado» y «escrito» no se pierda. */
      tr.planeado td {
        opacity: 0.55;
      }
      .depende {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .huecos {
        border-left: 3px solid var(--error);
      }
      .huecos .fila {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        font-size: 13px;
      }
      .huecos .fila + .fila {
        border-top: 1px solid var(--borde);
      }

      /* ── Ticket: cabecera y gates ─────────────────────────────────────── */
      .volver {
        font-size: 13px;
        margin-bottom: 14px;
        display: inline-block;
      }
      .cabecera-ticket {
        margin-bottom: 22px;
      }
      .cabecera-ticket h2 {
        font-size: 20px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--texto);
        margin-bottom: 6px;
      }
      .cabecera-ticket .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      .ruta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
        margin-top: 8px;
      }
      .gate {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .gate-cabecera {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .gate-meta {
        font-size: 12px;
        color: var(--tenue);
        margin-bottom: 12px;
      }
      .checks {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
      }
      .check {
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .check .marca {
        font-family: var(--mono);
        width: 12px;
      }
      .check .marca.pass {
        color: var(--ok);
      }
      .check .marca.fail {
        color: var(--error);
      }
      .check .marca.warn {
        color: var(--alerta);
      }
      .check .marca.skip {
        color: var(--tenue);
      }
      .check .detalle {
        color: var(--tenue);
      }
      .gate .acciones {
        justify-content: flex-start;
      }
      .veredicto {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        margin-top: 14px;
      }
      .veredicto .salida {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
      }
      .veredicto .salida.approve {
        color: var(--ok);
      }
      .veredicto .salida.block {
        color: var(--error);
      }
      .veredicto .salida.review {
        color: var(--alerta);
      }
      .veredicto .motivo {
        font-size: 13px;
        color: var(--tenue);
        flex: 1 1 320px;
      }
      .obsoleto {
        background: var(--alerta-suave);
        border: 1px solid var(--alerta);
        color: var(--alerta);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        margin-top: 12px;
      }
      .proposiciones {
        margin-top: 14px;
      }
      .proposiciones td {
        padding: 8px 10px;
        font-size: 13px;
      }
      .proposiciones .etiqueta-proposicion {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .proposiciones .criterio-texto {
        font-size: 13px;
        margin-bottom: 2px;
      }
      /* La barra hace visible lo que decide: el número y los dos umbrales. */
      .barra {
        position: relative;
        width: 150px;
        height: 8px;
        border-radius: 4px;
        background: var(--fondo);
        border: 1px solid var(--borde);
      }
      .barra .relleno {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: var(--tenue);
      }
      .barra .relleno.approve {
        background: var(--ok);
      }
      .barra .relleno.block {
        background: var(--error);
      }
      .barra .relleno.review {
        background: var(--alerta);
      }
      .barra .corte {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 1px;
        background: var(--tenue);
        opacity: 0.7;
      }
      .cifra {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
      }
      .descriptiva {
        color: var(--tenue);
        font-style: italic;
      }

      /* Resumen de la vista de tickets. Las tarjetas que filtran se distinguen de
         la que solo informa: si todas parecieran igual de pulsables, la mitad no
         haría nada al hacer clic. */
      .tarjeta {
        font: inherit;
        color: inherit;
        text-align: left;
      }
      button.tarjeta {
        cursor: pointer;
        transition: border-color 0.12s ease;
      }
      button.tarjeta:hover {
        border-color: var(--acento);
      }
      button.tarjeta.aplicada {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 14%, var(--panel));
      }
      button.tarjeta.aplicada .rotulo {
        color: var(--acento);
      }
      button.tarjeta.aplicada .rotulo::after {
        content: " ✕";
        font-size: 10px;
      }
      .filtros-aplicados {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 12px;
        flex-wrap: wrap;
      }
      .filtros-aplicados button {
        padding: 4px 10px;
        font-size: 12px;
      }

      /* Cabecera ordenable. El botón hereda el aspecto del `th` y solo se nota al
         pasar por encima: una cabecera llena de botones con borde compite con la
         tabla, que es lo que se viene a leer. */
      th button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: inherit;
        letter-spacing: inherit;
      }
      th button:hover {
        color: var(--texto);
      }
      th button.orden-activo {
        color: var(--acento);
      }
      .orden-flecha {
        font-size: 11px;
      }

      /* Progreso de una feature. La barra es estrecha a propósito: da el golpe de
         vista y la cifra de al lado da el dato. */
      .progreso {
        width: 90px;
        height: 6px;
        background: var(--borde);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .progreso-relleno {
        height: 100%;
        background: var(--acento);
        border-radius: 999px;
      }
      .progreso-relleno.completo {
        background: var(--ok);
      }

      /* Rango de fechas. Va en su propia línea dentro de la barra de filtros: con
         los dos campos, el selector y los cinco atajos, compartir línea con la
         búsqueda dejaba todo apretado y sin jerarquía. */
      .rango-fechas {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        flex-basis: 100%;
        padding-top: 8px;
        border-top: 1px solid var(--borde);
      }
      .campo-fecha {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .campo-fecha input {
        font: inherit;
        font-size: 12px;
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .atajos-fecha {
        display: inline-flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .atajos-fecha button {
        font-size: 11px;
        padding: 5px 9px;
        background: var(--panel);
        color: var(--tenue);
        border: 1px solid var(--borde);
        border-radius: 999px;
        cursor: pointer;
      }
      .atajos-fecha button:hover {
        color: var(--texto);
        border-color: var(--acento);
      }

      /* ── Estado del ticket ──────────────────────────────────────────────
         La tira de avance responde "¿por dónde va?" de un golpe. Los pasos
         cumplidos se apagan para que el actual destaque sin competir. */
      .estado-ticket {
        border: 1px solid var(--borde);
        background: var(--panel);
        border-radius: 10px;
        padding: 14px 16px;
        margin: 4px 0 18px;
      }
      /* La banda conserva la historia temporal, separada de la navegación. */
      .banda-fases {
        margin: 4px 0 18px;
        color: var(--texto);
      }
      .banda-fases-tramos {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .banda-fase {
        flex: 1 1 180px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      .banda-fase.actual {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 16%, var(--panel));
      }
      .banda-fase.motivo-de-bloqueo {
        border-color: var(--error);
      }
      .banda-fase-tiempo {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 4px;
      }
      .banda-fase-motivo {
        margin-top: 6px;
        color: var(--texto);
        font-size: 12px;
      }
      .estado-tira {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .estado-paso {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        opacity: 0.55;
        font: inherit;
        color: inherit;
        background: none;
        cursor: pointer;
      }
      .estado-paso:hover {
        opacity: 1;
        border-color: var(--acento);
      }
      .estado-paso.hecho,
      .estado-paso.actual {
        opacity: 1;
      }
      .estado-paso.hecho {
        border-color: color-mix(in srgb, var(--ok) 45%, var(--borde));
      }
      .estado-paso.actual {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 16%, transparent);
      }
      .estado-paso.bloqueado {
        opacity: 1;
        border-color: var(--error);
        background: color-mix(in srgb, var(--error) 12%, transparent);
      }
      .estado-numero {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--tenue);
      }
      .estado-rotulo {
        font-size: 12px;
      }
      .estado-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        font-size: 11px;
      }
      .chip-rotulo {
        color: var(--tenue);
      }
      .chip-valor {
        font-family: var(--mono);
      }
      .chip.activo {
        border-color: var(--acento);
      }
      .chip.bueno {
        border-color: color-mix(in srgb, var(--ok) 50%, var(--borde));
      }
      .chip.bueno .chip-valor {
        color: var(--ok);
      }
      .chip.malo {
        border-color: color-mix(in srgb, var(--error) 50%, var(--borde));
      }
      .chip.malo .chip-valor {
        color: var(--error);
      }

      /* Historial de compuertas: una tira de veredictos, con la fecha y el actor
         en el título para no llenar la pantalla de metadatos. */
      .historial-gates {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip-gate {
        display: inline-flex;
        gap: 5px;
        padding: 3px 9px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        font-size: 11px;
        cursor: help;
      }
      .chip-gate.approve {
        border-color: color-mix(in srgb, var(--ok) 50%, var(--borde));
        color: var(--ok);
      }
      .chip-gate.block {
        border-color: color-mix(in srgb, var(--error) 50%, var(--borde));
        color: var(--error);
      }
      .chip-gate.review {
        border-color: color-mix(in srgb, var(--alerta) 50%, var(--borde));
        color: var(--alerta);
      }
      .chip-gate.obsoleto {
        opacity: 0.5;
        text-decoration: line-through;
      }

      /* ── Acordeones ────────────────────────────────────────────────────── */
      .acordeon {
        border: 1px solid var(--borde);
        border-radius: 10px;
        background: var(--panel);
        margin-bottom: 8px;
        overflow: hidden;
      }
      .acordeon > summary {
        cursor: pointer;
        padding: 11px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        list-style: none;
        user-select: none;
      }
      .acordeon > summary::-webkit-details-marker {
        display: none;
      }
      .acordeon > summary::before {
        content: "▸";
        color: var(--tenue);
        font-size: 11px;
      }
      .acordeon[open] > summary::before {
        content: "▾";
      }
      .acordeon > summary:hover {
        background: var(--panel-alto);
      }
      .acordeon-titulo {
        font-weight: 600;
        font-size: 13px;
      }
      .acordeon-resumen {
        color: var(--tenue);
        font-size: 12px;
        font-family: var(--mono);
      }
      .acordeon-cuerpo {
        padding: 0 14px 14px;
        border-top: 1px solid var(--borde);
        padding-top: 12px;
      }

      /* ── Tarjetas de registro ──────────────────────────────────────────── */
      .tarjetas-datos {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tarjeta-dato {
        border: 1px solid var(--borde);
        border-left: 3px solid var(--borde);
        border-radius: 8px;
        background: var(--panel-alto);
        padding: 10px 12px;
      }
      .tarjeta-dato-cabecera {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 6px;
      }
      .tarjeta-dato-nota {
        font-size: 12px;
        color: var(--tenue);
        line-height: 1.5;
      }
      .tarjeta-dato-cobertura {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px solid var(--borde);
      }
      .tarjeta-dato-cobertura ul {
        margin: 4px 0 0;
        padding-left: 18px;
      }
      .lista-criterios {
        margin: 0;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13px;
        line-height: 1.5;
      }

      /* ── Un documento, no un muro ────────────────────────────────────────
         El plan de un ticket tiene títulos, pasos numerados con subpasos y código
         en línea. Como `<pre>` se lee como una pared; aquí se lee como documento.
         Ocupa todo el ancho de su contenedor: limitarlo a una medida de lectura
         dejaba media tarjeta vacía, y el documento ya vive dentro de un ancho
         acotado. */
      .md {
        font-size: 14px;
        line-height: 1.65;
      }
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0 0 12px;
      }
      .md-titulo {
        margin: 20px 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--texto);
      }
      h4.md-titulo {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .md-lista {
        margin: 0 0 12px;
        padding-left: 22px;
      }
      .md-lista li {
        margin-bottom: 8px;
      }
      .md-lista li::marker {
        color: var(--tenue);
      }
      /* Una lista anidada es el detalle de un paso: se separa un poco y se apaga,
         para que el paso siga leyéndose como la unidad. */
      .md-lista .md-lista {
        margin: 8px 0 4px;
      }
      .md-codigo {
        font-family: var(--mono);
        font-size: 12.5px;
        background: color-mix(in srgb, var(--acento) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--acento) 22%, transparent);
        border-radius: 4px;
        padding: 1px 5px;
        word-break: break-word;
      }
      .md-bloque {
        font-family: var(--mono);
        font-size: 12.5px;
        background: var(--fondo);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 10px 12px;
        overflow-x: auto;
        margin: 0 0 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .md a {
        color: var(--acento);
      }
      .seccion-ticket {
        position: relative;
      }
      .seccion-pie {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--borde);
      }
      .seccion-pie button {
        font-size: 11px;
        color: var(--tenue);
        background: none;
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 4px 9px;
        cursor: pointer;
      }
      .seccion-pie button:hover {
        color: var(--texto);
        border-color: var(--acento);
      }

      /* Línea de tiempo del ticket. El fallo se marca en la fila entera y no en una
         palabra: lo que hay que ver de un vistazo es dónde se corrigió, porque eso
         es trabajo que costó dinero. */
      .tabla-intervenciones td:first-child,
      .tabla-intervenciones th:first-child {
        width: 1%;
        white-space: nowrap;
      }
      .tabla-intervenciones tr.fallo td {
        background: color-mix(in srgb, var(--error) 12%, transparent);
      }
      .tabla-intervenciones tr.fallo td:nth-child(3) {
        color: var(--error);
        font-weight: 600;
      }
      .pie-recibo {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--tenue);
        margin-top: 12px;
      }
      .pie-recibo code {
        font-family: var(--mono);
        color: var(--texto);
      }
      .transiciones {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 24px;
      }
      .transicion {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .transicion .resultado {
        min-width: 150px;
      }
      .correccion {
        background: var(--alerta-suave);
        border: 1px solid var(--alerta);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      .correccion-titulo {
        font-weight: 600;
        color: var(--alerta);
        margin-bottom: 4px;
      }
      .correccion-motivo {
        font-size: 13px;
        margin-top: 8px;
        padding-left: 12px;
        border-left: 2px solid var(--borde);
        white-space: pre-wrap;
      }
      .responsable {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .responsable label {
        margin: 0;
        white-space: nowrap;
      }
      .decision-humana {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--borde);
      }
      .decision-humana .quien {
        font-size: 13px;
      }
      .decision-humana .quien strong {
        color: var(--texto);
      }
      .historial {
        font-size: 12px;
        color: var(--tenue);
        margin-top: 10px;
      }

      /* proyecto-ajustes:inicio */
      /* ── Proyecto: bloques con interruptores (boceto assets/proyecto.html) ─
         Ámbar decide una persona; verde encendido; lila el agente; rojo lo que
         siempre es de una persona. Solo tokens del tema. */
      .cabecera-proyecto { margin-bottom: 22px; }
      .migas-proyecto {
        font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--acento);
      }
      .migas-proyecto span { color: var(--tenue); }
      .titulo-proyecto {
        font-family: var(--fuente-titulo); font-size: 38px; font-weight: 600; line-height: 1.08;
        margin: 8px 0; border: 0; padding: 0;
        text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .bajada-proyecto { color: var(--tenue); font-size: 17px; max-width: 70ch; margin: 0; }
      .bloque-proyecto {
        display: flex; flex-direction: column; gap: 14px;
        background: var(--panel); border: 1px solid var(--borde); border-radius: 14px;
        padding: 20px 22px; margin-bottom: 22px; min-width: 0;
      }
      .bloque-proyecto.bloque-aprobacion { border-color: var(--persona); }
      .bloque-proyecto h2.titulo-bloque {
        font-family: var(--fuente-titulo); font-size: 21px; font-weight: 600;
        margin: 0; border: 0; padding: 0;
        text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .cabeza-bloque { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
      .cabeza-bloque .texto-bloque { flex: 999 1 300px; min-width: 0; }
      .detalle-bloque { color: var(--tenue); font-size: 14.5px; margin-top: 4px; }
      .estado-bloque {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--tenue);
      }
      .estado-bloque.encendido { color: var(--ok); }
      .interruptor {
        position: relative; flex: none; width: 52px; height: 30px; padding: 0;
        border-radius: 15px; border: 0; cursor: pointer; background: var(--borde);
      }
      .interruptor .perilla {
        position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
        border-radius: 50%; background: var(--tenue); transition: left 0.15s;
      }
      .interruptor[aria-checked="true"] { background: var(--ok); }
      .interruptor[aria-checked="true"] .perilla { left: 25px; background: var(--sobre-acento); }
      .interruptor:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
      .interruptor:disabled { cursor: not-allowed; opacity: 0.5; }
      .proyecto-tarjetas {
        margin: 0; padding: 0; list-style: none; display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px;
      }
      .proyecto-tarjetas li {
        padding: 12px 14px; border-radius: 10px; background: var(--fondo); font-size: 14px;
      }
      .proyecto-tarjetas li b { display: block; }
      .proyecto-tarjetas .decide b { color: var(--modelo); }
      .proyecto-tarjetas .ratificas b { color: var(--persona); }
      .proyecto-tarjetas .siempre b { color: var(--error); }
      .candado-proyecto {
        display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--persona);
      }
      .candado-proyecto .icono-candado {
        position: relative; width: 11px; height: 8px; margin-top: 5px; flex: none;
        border: 2px solid currentColor; border-radius: 2px;
      }
      .candado-proyecto .icono-candado::before {
        content: ""; position: absolute; left: 0; top: -8px; width: 7px; height: 7px;
        border: 2px solid currentColor; border-bottom: 0; border-radius: 5px 5px 0 0;
      }
      .proyecto-rejilla {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px; margin-bottom: 22px;
      }
      .proyecto-rejilla .bloque-proyecto { margin-bottom: 0; }
      .fila-aviso { display: flex; align-items: center; gap: 12px; }
      .fila-aviso .texto-aviso { flex: 1; min-width: 0; }
      .fila-aviso .detalle-bloque { font-size: 13.5px; margin-top: 0; }
      .chips-prueba { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .chip-prueba {
        font-family: var(--mono); font-size: 13px; padding: 4px 10px; border-radius: 8px;
        background: var(--fondo); border: 1px solid var(--borde); overflow-wrap: anywhere;
      }
      .bloque-proyecto button.anadir-prueba {
        background: none; border: 0; padding: 4px 6px; color: var(--acento); font-size: 13px;
      }
      .anadir-prueba-campo { display: flex; flex-wrap: wrap; gap: 8px; }
      .anadir-prueba-campo[hidden] { display: none; }
      .filas-aviso, .cuerpo-pruebas { display: flex; flex-direction: column; gap: 14px; }
      .bloque-proyecto input[type="text"],
      .bloque-proyecto input[type="number"] {
        height: 36px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--borde);
        background: var(--fondo); color: var(--texto); font: inherit;
      }
      .tiempo-prueba { display: flex; align-items: center; gap: 10px; font-size: 14px; }
      .tiempo-prueba input[type="number"] { width: 90px; }
      .nota-bloque { color: var(--tenue); font-size: 13px; }
      .nota-bloque:empty { display: none; }
      .bloque-proyecto .qa-revocar { display: flex; flex-wrap: wrap; gap: 8px; }
      .bloque-proyecto .qa-mensaje.mal { color: var(--error); }
      .bloque-qa .qa-agente { margin: 0; padding: 0; border: 0; background: none; }
      details.avanzado-proyecto,
      details.avanzado-autorizaciones {
        background: var(--panel); border: 1px solid var(--borde); border-radius: 14px;
        padding: 18px 22px; margin-bottom: 22px;
      }
      details.avanzado-proyecto > summary,
      details.avanzado-autorizaciones > summary { cursor: pointer; color: var(--tenue); }
      @media (max-width: 767px) {
        .titulo-proyecto { font-size: 28px; }
        .bloque-proyecto { padding: 16px; }
        .cabeza-bloque { flex-direction: column; align-items: flex-start; }
        .cabeza-bloque .texto-bloque { flex: none; width: 100%; }
        .proyecto-tarjetas { grid-template-columns: 1fr; }
        .proyecto-rejilla { grid-template-columns: 1fr; }
        details.avanzado-proyecto .ruta,
        .bloque-proyecto .qa-item { overflow-wrap: anywhere; }
      }
      /* proyecto-ajustes:fin */

      /* ── Configuración: editor y diferencias ──────────────────────────── */
      .editor {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        padding: 14px;
        border-radius: 8px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .editor:focus {
        outline: none;
        border-color: var(--acento);
      }
      .editor.mal {
        border-color: var(--error);
      }
      .interpretacion {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .interpretacion .campo {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .interpretacion .rotulo {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .interpretacion .valor {
        font-family: var(--mono);
        font-size: 13px;
        margin-top: 4px;
        word-break: break-word;
      }
      .qa-agente {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 12px 14px;
        margin: 16px 0;
      }
      .qa-agente .qa-fila {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
        margin: 8px 0;
      }
      .qa-agente label {
        display: grid;
        gap: 4px;
        font-size: 12px;
        color: var(--tenue);
      }
      .qa-agente input {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--borde);
        border-radius: 6px;
        background: var(--fondo);
        color: inherit;
      }
      .qa-agente .qa-item {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 0;
        border-top: 1px solid var(--borde);
        font-size: 13px;
      }
      .qa-agente .qa-revocar {
        flex-basis: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .qa-agente .qa-revocar input {
        flex: 1 1 200px;
        min-width: 0;
      }
      .qa-agente .qa-estado {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .qa-agente .qa-estado.vigente {
        color: var(--ok);
      }
      .qa-agente .qa-mensaje {
        font-size: 13px;
        margin-top: 6px;
      }
      .qa-agente .qa-mensaje.mal {
        color: var(--error);
      }
      /* autorizacion-casillas:inicio */
      .qa-agente .qa-fila {
        align-items: start;
      }
      .qa-agente .casillas {
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 8px 10px;
        margin: 0;
        min-width: 0;
      }
      .qa-agente .casillas legend {
        font-size: 12px;
        color: var(--tenue);
        padding: 0 4px;
      }
      .qa-agente .casillas .casillas-lista {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        max-height: 240px;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .qa-agente .casillas label {
        display: inline-flex;
        grid-template-columns: none;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--texto);
      }
      .qa-agente .casillas input[type="checkbox"],
      .qa-agente .casillas input[type="radio"] {
        padding: 0;
        margin: 0;
        accent-color: var(--acento);
        background: var(--fondo);
        border: 1px solid var(--borde);
      }
      .qa-agente .casillas .casillas-todos {
        flex-basis: 100%;
        color: var(--acento);
        font-weight: 600;
      }
      .qa-agente .casillas .casillas-cuenta {
        color: var(--tenue);
        font-size: 11px;
      }
      .qa-agente .casillas .casillas-aviso {
        font-size: 12px;
        color: var(--alerta);
        margin-top: 6px;
      }
      .qa-agente .casillas .casillas-vacio {
        font-size: 12px;
        color: var(--tenue);
      }
      /* autorizacion-casillas:fin */
      .politicas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .politica {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .politica .titulo-politica {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-weight: 600;
      }
      .politica .estado-politica {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .politica.activa .estado-politica {
        color: var(--ok);
      }
      .politica.error {
        border-color: var(--error);
      }
      .politica.error .estado-politica {
        color: var(--error);
      }
      .politica ul {
        margin: 8px 0;
        padding-left: 18px;
        font-size: 13px;
      }
      .politica .error-politica {
        color: var(--error);
        font-family: var(--mono);
        font-size: 12px;
        margin: 8px 0;
        word-break: break-word;
      }
      .politica .nota-politica {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 8px;
      }
      .diff {
        font-family: var(--mono);
        font-size: 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .diff div {
        padding: 2px 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .diff .add {
        background: var(--ok-suave);
        color: var(--ok);
      }
      .diff .remove {
        background: var(--error-suave);
        color: var(--error);
      }
      .diff .same {
        color: var(--tenue);
      }
      /* ── Configurar por chat ──────────────────────────────────────────── */
      .conversacion {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 18px;
      }
      .turno {
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 14px 16px;
        background: var(--panel);
      }
      .turno.tuyo {
        background: var(--panel-alto);
      }
      .turno .quien {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
        margin-bottom: 6px;
      }
      .turno .texto {
        white-space: pre-wrap;
      }
      .propuesta {
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 14px 16px;
        margin-top: 12px;
        background: var(--fondo);
      }
      .propuesta h4 {
        margin: 0 0 4px;
        font-size: 14px;
        font-family: var(--mono);
      }
      .propuesta .motivo {
        font-size: 13px;
        color: var(--tenue);
        margin-bottom: 10px;
      }
      .propuesta.invalida {
        border-color: var(--error);
      }
      .propuesta.sensible {
        border-color: var(--alerta);
      }
      .confirmacion {
        margin-top: 10px;
      }
      .confirmacion code {
        font-family: var(--mono);
        color: var(--alerta);
      }
      .confirmacion input {
        margin-top: 6px;
        font-family: var(--mono);
      }
      textarea {
        width: 100%;
        min-height: 76px;
        resize: vertical;
        font: inherit;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      textarea:focus {
        outline: none;
        border-color: var(--acento);
      }
      .ejemplos {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .ejemplos button {
        font-size: 12px;
      }

      /* ── Modelos: routing por rol ─────────────────────────────────────── */
      .roles td {
        vertical-align: top;
      }
      .roles select,
      .roles input {
        min-width: 0;
        width: 100%;
      }
      .roles .rol {
        font-family: var(--mono);
        font-size: 12px;
      }
      .roles .descripcion {
        font-size: 12px;
        color: var(--tenue);
      }
      /* ── Modelos: modelo por fase ─────────────────────────────────────── */
      .modelo-fase {
        width: 100%;
        margin-bottom: 24px;
      }
      .modelo-fase td {
        vertical-align: top;
        overflow-wrap: anywhere;
      }
      @media (min-width: 641px) {
        .modelo-fase td:first-child {
          overflow-wrap: normal;
          white-space: nowrap;
        }
      }
      .modelo-fase .fase-nombre,
      .modelo-fase .modelo-id {
        font-family: var(--mono);
        font-size: 12px;
      }
      .modelo-fase .detalle-fase {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 2px;
      }
      .modelo-fase tr.discrepancia {
        background: var(--alerta-suave);
      }
      .modelo-fase tr.discrepancia td:first-child {
        box-shadow: inset 3px 0 0 var(--alerta);
      }
      .modelo-fase .marca-discrepancia {
        color: var(--alerta);
        font-weight: 620;
        font-size: 12px;
        margin-top: 2px;
      }
      .selector-ejecutor {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .selector-ejecutor select {
        min-width: 0;
        max-width: 100%;
      }
      @media (max-width: 640px) {
        .modelo-fase,
        .modelo-fase tbody,
        .modelo-fase tr,
        .modelo-fase td {
          display: block;
          width: 100%;
        }
        .modelo-fase thead {
          display: none;
        }
        .modelo-fase tr {
          background: var(--panel);
          border: 1px solid var(--borde);
          border-radius: var(--radio);
          padding: 8px 12px;
          margin-bottom: 12px;
        }
        .modelo-fase tr.discrepancia {
          background: var(--alerta-suave);
          border-color: var(--alerta);
        }
        .modelo-fase td {
          border: 0;
          padding: 4px 0;
        }
        .modelo-fase td::before {
          content: attr(data-rotulo);
          display: block;
          font-size: 11px;
          color: var(--tenue);
          text-transform: uppercase;
          letter-spacing: 0.06em;
        }
      }
      /* ── Modelos: perfil activo, aviso de cliente y roles agrupados ───── */
      /* Lila es el modelo y ámbar lo que decidió una persona en el proyecto
         (boceto assets/modelos.html). */
      .cabecera-modelos { margin-bottom: 20px; }
      .migas-modelos {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--acento);
      }
      .migas-modelos span { color: var(--tenue); }
      .titulo-modelos {
        font-family: var(--fuente-titulo); font-size: 32px; font-weight: 600;
        margin: 6px 0 8px; border: 0; padding: 0;
        text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .bajada-modelos { color: var(--tenue); max-width: 680px; margin: 0; }
      .perfil-activo-modelos {
        border: 1px solid var(--modelo); border-radius: 14px;
        background: var(--modelo-suave); padding: 20px 24px; margin-bottom: 20px;
      }
      .perfil-fila { display: flex; gap: 20px; justify-content: space-between; flex-wrap: wrap; }
      .perfil-cuerpo { min-width: 0; flex: 1 1 320px; }
      .rotulo-perfil {
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--modelo);
      }
      .perfil-id {
        font-family: var(--fuente-titulo); font-size: 26px; font-weight: 600;
        margin: 4px 0; overflow-wrap: anywhere;
      }
      .perfil-origen { font-family: var(--mono); font-size: 13px; color: var(--tenue); }
      .perfil-desc { margin: 8px 0; }
      .marcas-eleccion, .marcas-fase { display: flex; flex-wrap: wrap; gap: 8px; }
      .marca-eleccion, .marca-origen, .marca-esfuerzo {
        font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.05em;
        padding: 3px 9px; border-radius: 999px; white-space: nowrap;
        background: var(--panel-alto); color: var(--texto);
      }
      .marca-eleccion { background: var(--modelo-suave); }
      .marca-origen::before { content: "● "; }
      .marca-origen.aqui { background: var(--alerta-suave); color: var(--persona); }
      .marca-origen.perfil { background: var(--modelo-suave); color: var(--modelo); }
      .marca-origen.base { background: var(--panel-alto); color: var(--tenue); }
      .perfil-acciones { display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
      .perfil-acciones button { min-height: 40px; }
      .boton-perfil {
        background: var(--modelo); color: var(--sobre-acento); border-color: var(--modelo);
        font-weight: 600;
      }
      .precedencia {
        display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borde);
        font-size: 13.5px; color: var(--tenue);
      }
      .aviso-cliente {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
        border-radius: 12px; padding: 14px 18px; margin-bottom: 24px;
        border: 1px solid var(--borde); background: var(--panel);
      }
      .aviso-cliente.sin-cliente { border-color: var(--persona); background: var(--alerta-suave); }
      .aviso-cliente .texto-aviso { flex: 1 1 320px; min-width: 0; }
      .aviso-cliente code { font-family: var(--mono); overflow-wrap: anywhere; }
      .aviso-cliente label { display: flex; gap: 8px; align-items: center; color: var(--tenue); }
      .icono-aviso {
        display: inline-grid; place-items: center; width: 22px; height: 22px;
        border-radius: 50%; border: 2px solid var(--persona); color: var(--persona); font-weight: 700;
      }
      .boton-declarar {
        background: var(--persona); color: var(--sobre-acento); border-color: var(--persona);
        font-weight: 600;
      }
      .enlace-modelos {
        background: none; border: 0; padding: 0; color: var(--acento);
        text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
      }
      .grupo-roles { margin-bottom: 28px; }
      .cabecera-grupo { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; margin-bottom: 12px; }
      .cabecera-grupo h2 {
        font-family: var(--fuente-titulo); font-size: 22px; margin: 0; border: 0; padding: 0;
        text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .bajada-grupo { color: var(--tenue); font-size: 14px; }
      .tarjetas-fase { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .tarjeta-fase {
        display: flex; flex-direction: column; gap: 10px; min-width: 0;
        background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 16px;
      }
      .tarjeta-fase.cambiada { border-color: var(--persona); }
      .cab-fase { display: flex; justify-content: space-between; align-items: baseline; }
      .nombre-fase { font-family: var(--fuente-titulo); font-size: 18px; font-weight: 600; }
      .numero-fase { font-family: var(--mono); font-size: 12px; color: var(--tenue); }
      .modelo-tarjeta, .modelo-diria, .celda-modelo, .proveedor-rol {
        font-family: var(--mono); overflow-wrap: anywhere;
      }
      .modelo-tarjeta { font-size: 15px; font-weight: 600; }
      .modelo-diria { color: var(--modelo); }
      .perfil-diria { font-size: 13.5px; color: var(--tenue); }
      .pie-fase { margin-top: auto; }
      .volver-perfil .diff { margin: 8px 0; }
      .acciones-volver { display: flex; gap: 8px; flex-wrap: wrap; }
      .tabla-roles { border: 1px solid var(--borde); border-radius: 12px; background: var(--panel); }
      .fila-rol {
        display: grid; gap: 14px; align-items: center; padding: 12px 16px;
        grid-template-columns: minmax(150px, 1.1fr) minmax(200px, 1.6fr) 90px minmax(120px, 0.9fr);
        border-bottom: 1px solid var(--borde);
      }
      .fila-rol:last-child { border-bottom: 0; }
      .fila-rol.cabecera {
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--tenue);
      }
      .celda-trabajo { display: flex; flex-direction: column; gap: 2px; }
      .detalle-trabajo { font-size: 13px; color: var(--tenue); }
      .proveedor-rol { color: var(--tenue); }
      .avanzado-modelos { margin-top: 8px; border-top: 1px solid var(--borde); padding-top: 12px; }
      .avanzado-modelos > summary { cursor: pointer; color: var(--tenue); }
      @media (max-width: 1100px) {
        .tarjetas-fase { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 767px) {
        .tarjetas-fase { grid-template-columns: 1fr; }
        .perfil-activo-modelos { padding: 16px; }
        .perfil-acciones { min-width: 0; width: 100%; }
        .titulo-modelos { font-size: 26px; }
        .fila-rol { grid-template-columns: 1fr; gap: 6px; }
        .fila-rol.cabecera { display: none; }
        .fila-rol [data-rotulo]::before {
          content: attr(data-rotulo); display: block; font-size: 11px; color: var(--tenue);
          text-transform: uppercase; letter-spacing: 0.06em;
        }
      }
      /* ── Modelos › Cambiar de perfil (boceto assets/modelos-cambiar-perfil.html) ─────── */
      /* Lila es el perfil elegido, cian la marca de selección, ámbar lo que decidió una persona. */
      .cambiar-perfil { display: flex; flex-direction: column; gap: 24px; max-width: 1240px; }
      .miga-perfil {
        font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em;
        text-transform: uppercase; color: var(--tenue);
      }
      .miga-perfil a { color: var(--acento); text-decoration: none; }
      .titulo-cambiar-perfil {
        font-family: var(--fuente-titulo); font-size: 36px; font-weight: 600; line-height: 1.08;
        margin: 0; border: 0; padding: 0; text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .rejilla-perfiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
      .tarjeta-perfil, .tarjeta-nueva {
        display: flex; flex-direction: column; gap: 8px; min-height: 150px; min-width: 0;
        padding: 18px; border-radius: 14px; text-align: left; cursor: pointer;
        background: var(--panel); color: var(--texto); border: 1px solid var(--borde); font: inherit;
      }
      .tarjeta-perfil:hover, .tarjeta-nueva:hover { background: var(--panel-alto); }
      .tarjeta-perfil[aria-pressed="true"] { border-color: var(--modelo); box-shadow: inset 0 0 0 1px var(--modelo); background: var(--modelo-suave); }
      .tarjeta-nueva {
        align-items: center; justify-content: center; text-align: center;
        border-style: dashed; background: transparent; color: var(--tenue);
      }
      .tarjeta-nueva .mas { font-size: 26px; line-height: 1; color: var(--acento); }
      .tarjeta-nueva .nueva-titulo { font-weight: 600; color: var(--texto); }
      .cab-tarjeta-perfil { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .titulo-perfil {
        font-family: var(--fuente-titulo); font-weight: 600; font-size: 20px; overflow-wrap: anywhere; min-width: 0;
      }
      .marca-tarjeta { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acento); }
      .marca-tarjeta.activo { color: var(--modelo); }
      .origen-tarjeta { font-family: var(--mono); font-size: 12.5px; color: var(--tenue); }
      .desc-tarjeta { font-size: 14px; color: var(--texto); }
      .proveedores-tarjeta { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
      .proveedor-tarjeta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--tenue); }
      .punto-proveedor { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
      .punto-proveedor.falta { background: var(--persona); }
      .que-cambia { display: flex; flex-direction: column; gap: 12px; }
      .que-cambia h2, .alcance-perfil legend {
        font-family: var(--fuente-titulo); font-weight: 600; font-size: 22px; margin: 0;
        border: 0; padding: 0; text-transform: none; letter-spacing: normal; color: var(--texto);
      }
      .que-cambia h2 .id-elegido { color: var(--modelo); }
      .caja-cambio { border: 1px solid var(--borde); border-radius: 14px; background: var(--panel); overflow-x: auto; }
      .tabla-cambio { width: 100%; border-collapse: collapse; }
      .tabla-cambio th, .tabla-cambio td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--borde); font-size: 14.5px; }
      .tabla-cambio thead th {
        font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--tenue); font-weight: 500;
        position: static; background: transparent;
      }
      .tabla-cambio .trabajo-cambio { font-weight: 600; }
      .tabla-cambio .antes {
        font-family: var(--mono); color: var(--tenue);
        text-decoration: line-through; text-decoration-color: var(--tenue-deco); overflow-wrap: anywhere;
      }
      .tabla-cambio .flecha { color: var(--modelo); width: 24px; }
      .tabla-cambio .despues { font-family: var(--mono); color: var(--texto); overflow-wrap: anywhere; }
      .nota-cambio { padding: 12px 14px; font-size: 13.5px; color: var(--tenue); }
      .aviso-fase {
        display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px;

          id="clave"

    <script type="module">
      // La interfaz no sabe nada del harness: llama a la API y muestra lo que
      // devuelve. Toda la lógica vive en el motor, así que un botón y un comando
      // de terminal no pueden divergir.
      const $ = (id) => document.getElementById(id);

      /** Llama a la API y devuelve el cuerpo, o lanza con el mensaje del servidor. */
      async function api(method, ruta, cuerpo) {
        if (method !== "GET") ocupado = true;
        try {
          return await enviar(method, ruta, cuerpo);
        } finally {
          if (method !== "GET") ocupado = false;
        }
      }

      /**
       * El token de escritura (R-CTRL-003): solo lo pide un servidor abierto a la red.
       * Se recuerda en este navegador y se envía en toda escritura.
       */
      function tokenDeEscritura() {
        try {
          return localStorage.getItem("valmen.token") ?? "";
        } catch {
          return "";
        }
      }

      async function enviar(method, ruta, cuerpo, yaPidioToken = false) {
        const url = new URL(ruta, "http://127.0.0.1");
        const vistaConjunta = url.pathname === "/api/portafolio";
        const seleccionDeLaPeticion = proyectoSeleccionado;
        const token = method === "GET" ? "" : tokenDeEscritura();
        const respuesta = await fetch(ruta, {
          method,
          headers: {
            ...(cuerpo === undefined ? {} : { "Content-Type": "application/json" }),
            ...(token === "" ? {} : { Authorization: `Bearer ${token}` }),
            ...(vistaConjunta || seleccionDeLaPeticion === ""
              ? {}
              : { "X-Valmen-Project": seleccionDeLaPeticion }),
          },
          body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
        });
        // Un servidor abierto a la red responde 401 a una escritura sin token: se pide
        // una vez y se repite. Si el token sigue sin valer, el error se muestra tal cual.
        if (respuesta.status === 401 && method !== "GET" && !yaPidioToken && typeof prompt === "function") {
          const dado = prompt(
            "Este servidor escucha en la red y las escrituras exigen un token. Pégalo aquí (lo imprimió `valmen serve` al arrancar):",
          );
          if (dado !== null && dado.trim() !== "") {
            try {
              localStorage.setItem("valmen.token", dado.trim());
            } catch {
              // Sin almacenamiento, el token sirve solo para esta petición.
            }
            return enviar(method, ruta, cuerpo, true);
          }
        }
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error ?? `HTTP ${respuesta.status}`);
        if (!vistaConjunta && seleccionDeLaPeticion !== proyectoSeleccionado) {
          throw RESPUESTA_DE_PROYECTO_OBSOLETA;
        }
        return datos;
      }

      /** Crea un elemento con texto. Nunca se usa innerHTML con datos del registro. */
      function el(tag, texto, clase) {
        const nodo = document.createElement(tag);
        if (texto !== undefined) nodo.textContent = texto;
        if (clase !== undefined) nodo.className = clase;
        return nodo;
      }

      /**
       * Un grupo de casillas (o de radios, con `unico: true`) para el formulario de autorizaciones.
       * `opciones` son `{ valor, etiqueta, cuenta? }`. Con `conTodos: true` agrega «Seleccionar todos»,
       * que solo marca las casillas: su palabra nunca viaja en `valores()`.
       */
      function grupoDeCasillas(titulo, opciones, { conTodos, marcadas = [], unico = false, aviso = "", vacio = "" } = {}) {
        const nodo = el("fieldset", undefined, "casillas");
        nodo.append(el("legend", titulo));
        const lista = el("div", undefined, "casillas-lista");
        const nombre = `grupo-${titulo}`;
        const cajas = [];
        let todos = null;
        const sincronizar = () => {
          if (todos !== null) todos.checked = cajas.length > 0 && cajas.every((c) => c.checked);
        };
        if (conTodos && !unico && opciones.length > 0) {
          const rotulo = el("label", undefined, "casillas-todos");
          todos = el("input");
          todos.type = "checkbox";
          todos.addEventListener("change", () => {
            for (const c of cajas) c.checked = todos.checked;
          });
          rotulo.append(todos, el("span", "Seleccionar todos"));
          lista.append(rotulo);
        }
        for (const o of opciones) {
          const rotulo = el("label");
          const caja = el("input");
          if (unico) {
            caja.type = "radio";
            caja.name = nombre;
          } else {
            caja.type = "checkbox";
          }
          caja.value = o.valor;
          caja.checked = marcadas.includes(o.valor);
          caja.addEventListener("change", sincronizar);
          cajas.push(caja);
          rotulo.append(caja, el("span", o.etiqueta ?? o.valor));
          if (o.cuenta !== undefined) rotulo.append(el("span", `(${o.cuenta})`, "casillas-cuenta"));
          lista.append(rotulo);
        }
        if (opciones.length === 0 && vacio !== "") lista.append(el("span", vacio, "casillas-vacio"));
        nodo.append(lista);
        if (aviso !== "") nodo.append(el("div", aviso, "casillas-aviso"));
        sincronizar();
        return { nodo, valores: () => cajas.filter((c) => c.checked).map((c) => c.value) };
      }

      /**
       * El botón «Revocar» de una autorización abre en su fila los campos de nombre y de frase
       * literal. No usa `prompt()`: el navegador integrado no lo admite y el botón quedaba mudo.
       */
      function conRevocacion(fila, revocar, mensaje, enviarRevocacion) {
        let abierta = null;
        revocar.addEventListener("click", () => {
          if (abierta !== null) {
            abierta.remove();
            abierta = null;
            return;
          }
          const caja = el("div", undefined, "qa-revocar");
          const actor = el("input");
          actor.type = "text";
          actor.placeholder = "Tu nombre";
          actor.value = responsable;
          const frase = el("input");
          frase.type = "text";
          frase.placeholder = "Tu frase literal de revocación";
          const confirmar = el("button", "Confirmar revocación");
          const cancelar = el("button", "Cancelar");
          cancelar.addEventListener("click", () => {
            caja.remove();
            abierta = null;
          });
          confirmar.addEventListener("click", async () => {
            if (actor.value.trim() === "" || frase.value.trim() === "") {
              mensaje.textContent = "Escribe tu nombre y tu frase literal para revocar.";
              mensaje.className = "qa-mensaje mal";
              return;
            }
            try {
              await enviarRevocacion(actor.value.trim(), frase.value.trim());
            } catch (falla) {
              mensaje.textContent = String(falla.message ?? falla);
              mensaje.className = "qa-mensaje mal";
            }
          });
          caja.append(actor, frase, confirmar, cancelar);
          fila.append(caja);
          abierta = caja;
          actor.focus();
        });
      }

      /** El responsable de las decisiones humanas: se recuerda entre visitas. */
      let responsable = localStorage.getItem("valmen.actor") ?? "";
      let proyectoSeleccionado = localStorage.getItem("valmen.project") ?? "";
      const RESPUESTA_DE_PROYECTO_OBSOLETA = Symbol("respuesta de proyecto obsoleta");
      const guardarResponsable = (valor) => {
        responsable = valor;
        localStorage.setItem("valmen.actor", valor);
      };

      function mostrarProyecto(salud) {
        const raiz = $("raiz");
        if (raiz === null) return;
        const partes = String(salud.root).split("/").filter((parte) => parte !== "");
        raiz.textContent = partes[partes.length - 1] ?? salud.root;
        raiz.title = salud.root;
      }

      async function refrescarProyectoVisible() {
        try {
          mostrarProyecto(await api("GET", "/api/health"));
        } catch (error) {
          if (error !== RESPUESTA_DE_PROYECTO_OBSOLETA) throw error;
        }
      }

      function seleccionarProyecto(projectId) {
        proyectoSeleccionado = projectId;
        if (projectId === "") localStorage.removeItem("valmen.project");
        else localStorage.setItem("valmen.project", projectId);
        conectarEventos();
        void refrescarProyectoVisible();
        void marcarPerfilActivo();
        void marcarPendientes();
        if (projectId === "") location.hash = "#/portafolio";
        void navegar();
      }

      async function cargarSelectorDeProyectos() {
        const selector = $("selector-proyectos");
        if (selector === null) return;
        const datos = await api("GET", "/api/portafolio");
        if (!Array.isArray(datos.projects)) return;
        selector.replaceChildren(new Option("Vista conjunta", ""));
        for (const proyecto of datos.projects) {
          if (proyecto.available) selector.append(new Option(proyecto.name, proyecto.projectId));
        }
        const existe = datos.projects.some(
          (proyecto) => proyecto.available && proyecto.projectId === proyectoSeleccionado,
        );
        if (proyectoSeleccionado !== "" && !existe) {
          proyectoSeleccionado = "";
          localStorage.removeItem("valmen.project");
        }
        selector.value = proyectoSeleccionado;
        selector.addEventListener("change", () => seleccionarProyecto(selector.value));
      }

      // ── Vista: inicio ─────────────────────────────────────────────────────

      /**
       * El paso del ciclo de ocho en que está un ticket, según su estado: registro,
       * análisis, plan, aprobación, implementación, tus pruebas, QA y cierre. El paso
       * actual es el que un agente está haciendo; `null` si el estado no es del ciclo.
       */
      const PASO_DE_INICIO = {
        intake: 2,
        analyzed: 3,
        planned: 4,
        approved: 5,
        in_progress: 5,
        changes_requested: 5,
        awaiting_user_tests: 6,
        in_qa: 7,
        qa_approved: 8,
      };

      /** Lo que dice cada tarjeta de Inicio, por tipo de pendiente (D-002: la acción abre el ticket). */
      function textosDeTarjetaDeInicio(p) {
        if (p.tipo === "ratificar") {
          const n = p.cuantas ?? 0;
          return {
            chip: "Ratificar",
            donde: "antes de cerrar",
            titulo: `El agente decidió ${n} ${n === 1 ? "cosa" : "cosas"} por ti en este ticket`,
            detalle: `${p.titulo}. Revísalas en el ticket y ratifícalas juntas para poder cerrar.`,
            accion: "Revisar y ratificar",
          };
        }
        if (p.tipo === "pruebas") {
          return {
            chip: "Tus pruebas",
            donde: p.estado,
            titulo: "La implementación está lista para que la pruebes",
            detalle: `${p.titulo}. Si no lo pruebas, el ticket no avanza.`,
            accion: "Abrir contrato de pruebas",
          };
        }
        const etapa =
          p.gate === "plan" ? "el plan" : p.gate === "analysis" ? "el análisis" : `la compuerta ${p.gate}`;
        return {
          chip: "Compuerta en REVIEW",
          donde: p.gate ?? "",
          titulo: `El evaluador no pudo decidir ${etapa}`,
          detalle: p.titulo,
          accion: "Revisar la compuerta",
        };
      }

      function tarjetaDeInicio(p) {
        const t = textosDeTarjetaDeInicio(p);
        const tarjeta = el("article", undefined, "inicio-tarjeta");
        const cabeza = el("div", undefined, "inicio-tarjeta-cabeza");
        cabeza.append(
          el("span", t.chip, "inicio-chip"),
          el("span", p.ticket, "inicio-id"),
          el("span", undefined, "inicio-espacio"),
          el("span", t.donde, "inicio-donde"),
        );
        const detalle = el("div", undefined, "inicio-tarjeta-detalle");
        detalle.append(el("span", t.detalle));
        const dudas = p.dudas ?? [];
        if (dudas.length > 0) {
          detalle.append(el("span", `Dudó en ${dudas.length} ${dudas.length === 1 ? "proposición" : "proposiciones"}:`));
          for (const duda of dudas) detalle.append(el("span", duda, "inicio-duda"));
        }
        const accion = el("a", t.accion, "inicio-accion persona");
        accion.setAttribute("href", `#/ticket/${encodeURIComponent(p.ticket)}`);
        const acciones = el("div", undefined, "inicio-acciones");
        acciones.append(accion);
        tarjeta.append(cabeza, el("div", t.titulo, "inicio-tarjeta-titulo"), detalle, acciones);
        return tarjeta;
      }

      function agenteDeInicio(agente) {
        const caja = el("div", undefined, "inicio-agente");
        caja.append(el("div", agente.ticket ?? agente.agente, "inicio-agente-id"));
        const paso = PASO_DE_INICIO[agente.ticketEstado] ?? null;
        const fase = fraseDeFase(agente);
        if (paso !== null) {
          const pasos = el("div", undefined, "inicio-pasos");
          pasos.setAttribute("aria-label", `Paso ${paso} de 8: ${fase.texto}`);
          for (let i = 1; i <= 8; i += 1) {
            pasos.append(el("span", undefined, `inicio-paso${i < paso ? " hecho" : i === paso ? " actual" : ""}`));
          }
          caja.append(pasos);
        }
        const pie = el("div", undefined, "inicio-agente-pie");
        pie.append(
          el("span", fase.inferida ? `${fase.texto} (inferida)` : fase.texto),
          el("span", agente.modelo ?? "modelo sin dato", "inicio-agente-modelo"),
        );
        caja.append(pie);
        return caja;
      }

      /**
       * Inicio (R-MARCO-005): la pantalla de apertura dice qué está parado por la
       * persona. Primero lo que espera su decisión —una tarjeta por cosa, con su id y
       * su botón ámbar—; al lado, lo que hacen los agentes ahora y lo hecho hoy.
       */
      async function vistaInicio() {
        const cont = $("contenido");
        const [inicio, agentes] = await Promise.all([
          api("GET", "/api/inicio"),
          proyectoSeleccionado === ""
