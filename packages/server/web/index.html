<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ValmenHarness · Mission Control</title>
    <style>
      /* Sin framework y sin paso de compilación: esta interfaz tiene que
         arrancar con el servidor, y su objetivo es mostrar el estado, no
         impresionar. Una hoja propia se lee entera en un minuto. */
      /* Las fuentes del tema viajan con el servidor (`fuentes/`, subconjunto
         latino de @fontsource 5.3.0, licencia SIL OFL 1.1 en `fuentes/OFL.txt`):
         Mission Control corre en local y puede no tener red, y cargarlas de un
         tercero le contaría cada visita. Sin ellas quedan las pilas del sistema. */
      @font-face {
        font-family: "Chakra Petch";
        font-weight: 500;
        font-display: swap;
        src: url("fuentes/chakra-petch-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chakra Petch";
        font-weight: 600;
        font-display: swap;
        src: url("fuentes/chakra-petch-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Chakra Petch";
        font-weight: 700;
        font-display: swap;
        src: url("fuentes/chakra-petch-latin-700-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 400;
        font-display: swap;
        src: url("fuentes/ibm-plex-sans-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 500;
        font-display: swap;
        src: url("fuentes/ibm-plex-sans-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-weight: 600;
        font-display: swap;
        src: url("fuentes/ibm-plex-sans-latin-600-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        font-display: swap;
        src: url("fuentes/ibm-plex-mono-latin-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        font-display: swap;
        src: url("fuentes/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 600;
        font-display: swap;
        src: url("fuentes/ibm-plex-mono-latin-600-normal.woff2") format("woff2");
      }
      /* El tema «sala de control» (design.md del rediseño, Decisión 3). Cada
         acento tiene un significado fijo: ámbar decide una persona, cian decide
         el código, lila trabaja un modelo, verde hecho, rojo negado. Los nombres
         de siempre (--panel, --acento, --alerta…) se conservan con los valores
         nuevos porque todas las vistas los consumen; los nombres del tema son
         alias del mismo valor. --tenue es el «atenuado» de la tabla: el «tenue»
         no llega a AA como texto y queda en --tenue-deco, solo para decoración. */
      :root {
        --fondo: #0a1114;
        --fondo-2: #0e181c;
        --panel: #122027;
        --panel-alto: #172a32;
        --panel-hover: #1d343d;
        --borde: #24383f;
        --borde-suave: #1b2d33;
        --texto: #e8f0f2;
        --tenue: #9aaeb4;
        --tenue-deco: #5f767d;
        --acento: #4cc8e6;
        --codigo: #4cc8e6;
        --acento-suave: rgba(76, 200, 230, 0.12);
        --acento-halo: rgba(76, 200, 230, 0.07);
        --acento-2: #ad9ff4;
        --modelo: #ad9ff4;
        --modelo-suave: rgba(173, 159, 244, 0.12);
        --halo-ok: 0 0 0 3px rgba(98, 214, 158, 0.15);
        --alerta-suave: rgba(242, 180, 63, 0.12);
        --ok-suave: rgba(98, 214, 158, 0.12);
        --error-suave: rgba(243, 106, 93, 0.12);
        --barra: rgba(14, 24, 28, 0.85);
        --ok: #62d69e;
        --hecho: #62d69e;
        --alerta: #f2b43f;
        --persona: #f2b43f;
        --error: #f36a5d;
        --negado: #f36a5d;
        --cuadricula: rgba(120, 170, 185, 0.07);
        --sobre-acento: #0a1114;
        --velo: rgba(5, 10, 12, 0.6);
        --fuente-titulo: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
        --fuente-texto: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --lateral: 264px;
        --radio: 8px;
      }
      /* La preferencia de tema pertenece al sistema: no se guarda una segunda
         decisión local ni se cambia el contrato de la vista. Todos los controles
         consumen estas variables semánticas, por lo que el tema claro conserva
         la misma jerarquía y los mismos estados que el oscuro. */
      @media (prefers-color-scheme: light) {
        :root {
          --fondo: #f2f6f7;
          --fondo-2: #e8eef0;
          --panel: #ffffff;
          --panel-alto: #f4f8f9;
          --panel-hover: #e8eef0;
          --borde: #c9d6da;
          --borde-suave: #dde6e9;
          --texto: #0d1a1f;
          --tenue: #4a5f66;
          --tenue-deco: #7d9198;
          --acento: #0a7898;
          --codigo: #0a7898;
          --acento-suave: rgba(10, 120, 152, 0.12);
          --acento-halo: rgba(10, 120, 152, 0.07);
          --acento-2: #5a45c4;
          --modelo: #5a45c4;
          --modelo-suave: rgba(90, 69, 196, 0.12);
          --halo-ok: 0 0 0 3px rgba(27, 127, 77, 0.15);
          --alerta-suave: rgba(154, 97, 0, 0.12);
          --ok-suave: rgba(27, 127, 77, 0.12);
          --error-suave: rgba(191, 51, 38, 0.12);
          --barra: rgba(242, 246, 247, 0.88);
          --ok: #1b7f4d;
          --hecho: #1b7f4d;
          --alerta: #9a6100;
          --persona: #9a6100;
          --error: #bf3326;
          --negado: #bf3326;
          --cuadricula: rgba(20, 70, 90, 0.06);
          --sobre-acento: #ffffff;
          --velo: rgba(13, 26, 31, 0.35);
        }
      }
      * {
        box-sizing: border-box;
      }
      /* El foco por teclado debe ser igual de reconocible en enlaces, botones,
         resúmenes y campos. El texto y los roles siguen expresando los estados;
         el anillo solo señala dónde actuará el teclado. */
      a:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--acento);
        outline-offset: 2px;
      }
      /* El fondo de sala de control: una cuadrícula de 40 px sobre el fondo, fija
         para que no se mueva con el contenido. */
      body {
        margin: 0;
        background:
          linear-gradient(var(--cuadricula) 1px, transparent 1px) 0 0 / 40px 40px fixed,
          linear-gradient(90deg, var(--cuadricula) 1px, transparent 1px) 0 0 / 40px 40px fixed,
          var(--fondo);
        color: var(--texto);
        font: 15px/1.5 var(--fuente-texto);
      }
      h1, h2, h3 {
        font-family: var(--fuente-titulo);
      }
      /* ── El armazón ──────────────────────────────────────────────────────
         Barra lateral fija y una columna de contenido. La navegación deja de
         competir con el contenido por el ancho de arriba: en una pantalla de
         registro hay ocho destinos y ninguno es «el principal», así que una
         barra horizontal obliga a leerlos todos en cada vista. */
      body.armazon {
        display: grid;
        grid-template-columns: var(--lateral) 1fr;
        min-height: 100vh;
      }
      body.armazon.lateral-oculta {
        grid-template-columns: 0 1fr;
      }
      /* La barra va sobre --fondo-2, como el boceto del menú. En modo claro el
         cian, el ámbar y el verde no llegan a AA como texto sobre ese fondo
         (4.28-4.39): aquí no se usan como texto. Las cuentas son sólidas con
         --sobre-acento, la de agentes vivos va en lila y los rótulos en --tenue
         (decisión D-003 de FEATURE-WEB-MENU-GRUPOS-20261014). */
      .lateral {
        background: var(--fondo-2);
        color: var(--texto);
        border-right: 1px solid var(--borde);
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 16px 12px 14px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .lateral [hidden] {
        display: none;
      }
      body.lateral-oculta .lateral {
        padding: 0;
        border: 0;
      }
      body.lateral-oculta .lateral > * {
        display: none;
      }
      .lateral .marca {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 6px 14px;
      }
      .lateral .marca .icono-marca {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--acento);
        display: grid;
        place-items: center;
        color: var(--sobre-acento);
        font-family: var(--fuente-titulo);
        font-size: 16px;
        font-weight: 700;
        flex: none;
      }
      .lateral .marca .nombre {
        font-family: var(--fuente-titulo);
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .lateral .marca .nombre span {
        color: var(--acento);
        font-weight: 600;
      }
      .lateral .proyecto-activo {
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 12px;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .lateral .proyecto-activo .rotulo {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin: 0;
      }
      .lateral .proyecto-activo select {
        background: transparent;
        color: var(--texto);
        border: 0;
        padding: 0;
        font: 600 14.5px/1.4 var(--fuente-texto);
        width: 100%;
        cursor: pointer;
      }
      .lateral .proyecto-activo .ruta {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 11px;
        word-break: break-all;
        line-height: 1.4;
      }
      .lateral .perfil-activo {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0 4px;
        padding: 7px 12px;
        border-radius: 10px;
        background: var(--modelo-suave);
        color: var(--tenue);
        text-decoration: none;
        font-size: 13px;
        min-width: 0;
      }
      .lateral .perfil-activo:hover {
        box-shadow: inset 0 0 0 1px var(--modelo);
      }
      .lateral .perfil-activo .punto-perfil {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--modelo);
        flex: none;
      }
      .lateral .perfil-activo .id {
        color: var(--modelo);
        font-family: var(--mono);
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lateral .grupo {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 14px 10px 6px;
      }
      .lateral nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .lateral nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--tenue);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        min-height: 38px;
        padding: 0 10px;
        border-radius: 9px;
        border: 0;
      }
      .lateral nav a svg {
        width: 17px;
        height: 17px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .lateral nav a:hover {
        background: var(--panel-hover);
        color: var(--texto);
      }
      .lateral nav a[aria-current="page"] {
        background: var(--acento-suave);
        color: var(--texto);
        box-shadow: inset 0 0 0 1px var(--acento);
      }
      .lateral nav a[aria-current="page"] svg {
        color: var(--acento);
      }
      /* La cuenta va detrás del rótulo aunque en el marcado vaya delante: el
         rótulo cierra el enlace (`Agentes</a>`), que es lo que leen las pruebas. */
      .lateral nav a .cuenta {
        order: 1;
        margin-left: auto;
        min-width: 22px;
        background: var(--acento);
        color: var(--sobre-acento);
        border-radius: 11px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 600;
        padding: 1px 6px;
        line-height: 1.6;
        text-align: center;
      }
      .lateral nav a .cuenta.alerta {
        background: var(--alerta);
        color: var(--sobre-acento);
      }
      .lateral nav a .cuenta.vivos {
        background: transparent;
        color: var(--modelo);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        padding: 0;
      }
      .lateral nav a .cuenta.vivos[hidden] {
        display: none;
      }
      .lateral nav a .cuenta.vivos::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--modelo);
      }
      .lateral .pie {
        margin-top: auto;
        padding: 20px 0 4px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        gap: 10px;
      }
      .lateral .pedir-cambio {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px dashed var(--borde);
        background: transparent;
        color: var(--texto);
        font: 500 14px/1.4 var(--fuente-texto);
        cursor: pointer;
        text-align: left;
      }
      .lateral .pedir-cambio:hover {
        border-color: var(--acento);
      }
      .lateral .pedir-cambio svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--acento);
        stroke-width: 1.8;
        stroke-linejoin: round;
        flex: none;
      }
      .lateral .pedir-cambio .texto {
        flex: 1;
      }
      .lateral .pedir-cambio .atajo {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 11.5px;
        background: transparent;
        border: 0;
      }
      .visualmente-oculto {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .lateral .pie .latido {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 10px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
      }
      .lateral .pie .punto {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: var(--halo-ok);
        flex: none;
      }
      /* «Pedir un cambio»: el chat de configuración como panel sobre la pantalla
         en la que se estaba, no como una vista que la reemplaza. */
      dialog.panel-cambio {
        max-width: 760px;
        max-height: calc(100vh - 48px);
        overflow: auto;
      }
      .panel-cambio-cabecera {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px 0;
      }
      .panel-cambio-cabecera h2 {
        margin: 0;
        font-size: 18px;
      }
      .panel-cambio-cuerpo {
        padding: 12px 24px 20px;
      }
      /* En el celular la barra se apila sobre el contenido y las entradas van en
         dos columnas, para que el menú no ocupe más de una pantalla. */
      @media (max-width: 767px) {
        body.armazon {
          grid-template-columns: minmax(0, 1fr);
        }
        body.armazon.lateral-oculta {
          grid-template-columns: minmax(0, 1fr);
        }
        .lateral {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--borde);
        }
        .lateral nav {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .lateral .grupo {
          grid-column: 1 / -1;
        }
        /* `body` sube la especificidad: la regla base del halo va más abajo. */
        body .principal::before {
          left: 0;
        }
      }
      /* Inicio (R-MARCO-005): lo que espera una decisión de la persona, como el boceto
         `assets/inicio.html`. Solo tokens: el ámbar es «decide una persona», el lila
         «trabaja un modelo», el cian «decide el código» y el verde «hecho». */
      .inicio {
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 1240px;
      }
      .inicio-cabecera {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .inicio-fecha {
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--codigo);
      }
      .inicio-fecha .inicio-proyecto {
        color: var(--tenue);
      }
      .inicio h1 {
        margin: 0;
        font-family: var(--fuente-titulo);
        font-weight: 600;
        font-size: 40px;
        line-height: 1.08;
        letter-spacing: -0.01em;
      }
      .inicio-bajada {
        margin: 0;
        color: var(--tenue);
        font-size: 17px;
        max-width: 62ch;
      }
      .inicio-cifras {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .inicio-cifra {
        padding: 16px 18px;
        border-radius: 14px;
        border: 1px solid var(--borde);
        background: var(--panel);
      }
      .inicio-cifra.persona {
        border-color: var(--persona);
        background: var(--alerta-suave);
      }
      .inicio-cifra-valor {
        font-family: var(--fuente-titulo);
        font-weight: 600;
        font-size: 36px;
        line-height: 1;
      }
      .inicio-cifra.persona .inicio-cifra-valor {
        color: var(--persona);
      }
      .inicio-cifra.modelo .inicio-cifra-valor {
        color: var(--modelo);
      }
      .inicio-cifra.codigo .inicio-cifra-valor {
        color: var(--codigo);
      }
      .inicio-cifra.hecho .inicio-cifra-valor {
        color: var(--hecho);
      }
      .inicio-cifra-rotulo {
        margin-top: 6px;
        font-size: 14px;
        color: var(--tenue);
      }
      .inicio-cifra.persona .inicio-cifra-rotulo {
        color: var(--texto);
      }
      .inicio-columnas {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        align-items: flex-start;
      }
      .inicio-decision {
        flex: 999 1 520px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .inicio h2 {
        margin: 0;
        font-family: var(--fuente-titulo);
        font-weight: 600;
        font-size: 22px;
        text-transform: none;
        letter-spacing: normal;
        color: var(--texto);
      }
      .inicio-lado {
        flex: 1 1 320px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .inicio-tarjeta,
      .inicio-caja {
        padding: 18px 20px;
        border-radius: 14px;
        border: 1px solid var(--borde);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .inicio-caja {
        padding: 18px;
      }
      .inicio-caja h2 {
        font-size: 19px;
      }
      .inicio-tarjeta-cabeza,
      .inicio-caja-cabeza {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .inicio-caja-cabeza {
        justify-content: space-between;
      }
      .inicio-caja-cabeza a {
        font-size: 13.5px;
        text-decoration: none;
        color: var(--acento);
      }
      .inicio-chip {
        display: inline-flex;
        align-items: center;
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid currentColor;
        color: var(--persona);
        white-space: nowrap;
      }
      .inicio-id {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--tenue);
        overflow-wrap: anywhere;
      }
      .inicio-espacio {
        flex: 1;
      }
      .inicio-donde {
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--tenue);
      }
      .inicio-tarjeta-titulo {
        font-size: 18px;
        font-weight: 600;
      }
      .inicio-tarjeta-detalle {
        color: var(--tenue);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .inicio-duda {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--modelo);
        background: var(--modelo-suave);
        padding: 2px 8px;
        border-radius: 6px;
      }
      .inicio-acciones {
        display: flex;

      /* En el celular las dos columnas se apilan y el título baja de tamaño, sin

      @media (max-width: 767px) {

        font-size: 11px;

      .pliegue {

        border-radius: 6px;
        color: var(--tenue);
        cursor: pointer;
        width: 28px;
        height: 26px;
        display: grid;

      header.heredado {
        display: flex;

        font-size: 12px;
      }
      #actualizado {
        color: var(--ok);
      }
      /* El aviso de que hay cambios **sin** mover la pantalla. Aparece solo cuando
         el refresco se difirió —hay un diálogo abierto, o el foco está en un
         campo— y es la salida para no quedarse leyendo algo viejo sin saberlo. */
      .barra-vista .cambios {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--acento);
        background: transparent;
        color: var(--acento);
        cursor: pointer;
      }
      .barra-vista .cambios[hidden] {
        display: none;
      }
      /* El contenido usa **todo** el ancho disponible, como un `container-fluid`:
         una tabla de tickets con siete columnas y un tablero de feature no se
         leen mejor centrados con doscientos píxeles muertos a cada lado. Lo que
         necesita medida corta —un diálogo, un párrafo largo— la pide él mismo. */
      main {
        width: 100%;
        padding: 20px 28px 56px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--tenue);
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0;
      }
      /* El contenido vive en una columna con un halo suave arriba: da
         profundidad sin imágenes ni degradados que compitan con los datos. */
      .principal::before {
        content: "";
        position: fixed;
        inset: 0 0 auto var(--lateral);
        height: 220px;
        background: radial-gradient(
          900px 220px at 18% -40%,
          var(--acento-halo),

        );

      .nota {

      table {

      th {

        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
        font-weight: 600;
        padding: 10px;

      .punto {

      /* ── Ajustes › Proveedores (R-AJU-005) ──────────────────────────────
         Boceto: .valmen/features/rediseno-mission-control/assets/proveedores.html.
         Una tarjeta por proveedor; el punto distingue configurado (lleno),
         detectado (anillo) y sin configurar (gris). */
      .cabecera-proveedores {

        font-weight: 600;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 1.08;
      }
      .cabecera-proveedores p {

        font-size: 17px;

      .proveedor-punto.configurado {

      .proveedor-punto.detectado {

      .proveedor-punto.sin-configurar {

      }
      .proveedores {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
        gap: 14px;
      }
      .proveedor {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
        padding: 20px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        background: var(--panel);
      }
      .proveedor.del-perfil {
        border-color: color-mix(in srgb, var(--modelo) 50%, transparent);

      .proveedor-cabeza h2 {

        min-width: 0;

        font-weight: 600;
        letter-spacing: normal;

        color: var(--texto);
      }
      .proveedor-uso {

        font-size: 11px;

        color: var(--tenue);

      }
      .proveedor-uso.activo {

      .proveedor-datos {

        font-size: 14px;

      .proveedor-datos dt {

      .proveedor-datos dd {

      .proveedor .acciones {
        flex-wrap: wrap;
        justify-content: flex-start;
        margin-top: auto;
        padding-top: 12px;
      }
      .proveedor .acciones button {
        min-height: 40px;
        padding: 0 14px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        background: var(--fondo-2);
      }
      .acciones {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        background: var(--panel-alto);

        border: 1px solid var(--borde);
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          transform 0.06s ease;

      button:hover:not(:disabled) {

        opacity: 0.45;
        cursor: default;

        background: var(--acento);

      .resultado {
        font-size: 12px;

        color: var(--ok);
      }
      .resultado.error {
        color: var(--error);

      .resultado.alerta {
        color: var(--alerta);

      .etiqueta {

        border-radius: 10px;
        border: 1px solid var(--borde);
        color: var(--tenue);
        font-family: var(--mono);

      .etiqueta.critico {
        border-color: var(--alerta);
        color: var(--alerta);
      }

        border: 1px solid var(--borde);

        margin-bottom: 12px;
        padding: 12px;

        font-size: 15px;
        font-weight: 600;
        margin: 6px 0;

      .barra-progreso {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
        margin-bottom: 6px;
        max-width: 220px;
      }
      .barra-progreso-lleno {
        background: linear-gradient(90deg, var(--acento), var(--acento-2));
        height: 100%;
        border-radius: 999px;
        transition: width 0.2s ease;

      /* El tablero de una feature: columnas por dónde está cada ticket.
         Se desplaza en horizontal en vez de encogerse: una columna de tarjetas
         ilegibles es peor que tener que desplazar. */
      .tablero {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 10px;
        align-items: flex-start;
        width: 100%;
      }
      /* El título de una tarjeta se recorta a tres renglones: el del modelo puede
         tener doscientos caracteres y en una columna angosta se come la tarjeta.
         El texto completo queda en el `title`, que es donde se consulta. */
      .tarjeta-ticket .titulo-ticket {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .vacio-tablero {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 2px;
      }
      /* Las columnas se reparten el ancho disponible. Antes tenían un mínimo de
         210 px y con ocho etapas el tablero pedía mil setecientos: había que
         desplazarse para ver la mitad del trabajo. Ahora caben las que hay, y el
         desplazamiento queda solo como salida para una pantalla muy angosta. */
      .columna-tablero {
        flex: 1 1 0;
        min-width: 180px;
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 10px;
      }
      .columna-tablero .titulo {
        font-size: 13px;
        font-weight: 600;
        color: var(--tenue);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 10px;
      }
      .tarjeta-ticket {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 9px;
        margin-bottom: 8px;
      }
      .tarjeta-ticket .titulo-ticket {
        font-weight: 600;
        margin: 4px 0 6px;
      }
      .tarjeta-ticket .espera {
        color: var(--alerta);
      }
      .tarjeta-ticket .listo {
        color: var(--ok);
      }

      /* Lo ya decidido: se lee, pero no compite con lo que pide una acción. */
      .tarjeta-estandar.historial {
        border-left: 3px solid var(--borde);
        margin: 8px 0 8px 12px;
        opacity: 0.85;
      }
      /* El margen es del historial, no de todo desplegable: puesto como
         `details > summary` global engordaba los acordeones de un ticket —los
         dejaba en setenta píxeles de alto— y el usuario lo notó antes que yo. */
      .historial-estandares > summary {
        cursor: pointer;
        margin: 14px 0 8px;
      }

      /* La sección que toca mirar en el estado actual. */
      .acordeon.de-turno {
        border-left: 3px solid var(--acento);
        padding-left: 10px;
      }
      .marca-turno {
        background: var(--acento);
        border-radius: 3px;
        color: var(--fondo);
        font-size: 10px;
        letter-spacing: 0.03em;
        margin-left: 8px;
        padding: 1px 6px;
        text-transform: uppercase;
        vertical-align: middle;

      th.columna-impactos,

        display: flex;

        letter-spacing: 0.02em;
        padding: 0 5px;
        text-transform: uppercase;

        color: var(--error);
      }
      .etiqueta.aprueba {
        border-color: var(--ok);
        color: var(--ok);
      }
      .etiqueta.bloquea {
        border-color: var(--error);
        color: var(--error);
      }
      .etiqueta.revisa {
        border-color: var(--alerta);
        color: var(--alerta);
      }
      .filtros {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .filtros input,
      .filtros select,
      select,
      input[type="text"] {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;

        color: var(--texto);

      }
      .filtros input:focus,
      .filtros select:focus,
      select:focus,
      input:focus {

        border-color: var(--acento);
      }
      .tarjetas {

        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .tarjeta {
        background: linear-gradient(180deg, var(--panel-alto), var(--panel));
        border: 1px solid var(--borde);
        border-radius: var(--radio);
        padding: 14px 16px;
      }
      .tarjeta .valor {

      .tarjeta .rotulo {
