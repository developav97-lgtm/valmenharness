        const totalTickets = datos.features.reduce((suma, f) => suma + f.tickets, 0);
        const cerrados = datos.features.reduce((suma, f) => suma + f.closedTickets, 0);

        const metricas = [
          ["Features", r.total],
          ["Descompuestas", r.decomposed],
          ["Con huecos", r.withGaps],
          ["Tickets de features", totalTickets],
          ["De esos, cerrados", cerrados],
        ];
        if (r.invalid > 0) metricas.push(["Inválidas", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        if (datos.features.length === 0) {
          const vacio = el("div", undefined, "vacio");
          vacio.append(
            el("div", "No hay features en este proyecto."),
            el(
              "div",
              "Una feature es trabajo que excede un ticket: spec, diseño y varios tickets hijos.",
              "resultado",
            ),
            el("div", "Se crea con: valmen feature new <slug> --title <título>", "ruta"),
          );
          cont.append(vacio);
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of [
          "Feature",
          "Estado",
          "Artefactos",
          "Requisitos",
          "Progreso",
          "Huecos",
          "Actualizada",
          "",
        ]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);

        const tbody = el("tbody");
        for (const f of datos.features) {
          const tr = el("tr");

          const celdaNombre = el("td");
          celdaNombre.append(el("div", f.title, "nombre"), el("div", f.id, "id"));
          tr.append(celdaNombre);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", f.state));
          if (f.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválida", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          const celdaArtefactos = el("td");
          celdaArtefactos.append(marcasArtefactos(f));
          tr.append(celdaArtefactos);

          tr.append(el("td", f.requirements === 0 ? "—" : String(f.requirements), "id"));

          // El progreso es lo que convierte la lista en una vista de conjunto:
          // sin él se ve que una feature está «descompuesta» y la pregunta que se
          // hace de verdad —«¿por dónde va?»— obliga a abrir los tickets uno a uno.
          const celdaProgreso = el("td");
          if (!f.hasDecomposition || f.tickets === 0) {
            celdaProgreso.textContent = "—";
          } else {
            celdaProgreso.append(
              barraDeProgreso(f.closedTickets, f.tickets),
              el("div", `${f.closedTickets} de ${f.tickets} cerrados`, "resultado"),
            );
          }
          tr.append(celdaProgreso);

          // Los huecos van en rojo y no en «inválida»: una feature con la
          // cobertura incompleta no está rota, está a medio descomponer, y son
          // dos cosas distintas que hay que poder distinguir de un vistazo.
          const celdaHuecos = el("td");
          if (f.gaps > 0) {
            celdaHuecos.append(el("span", `${f.gaps} sin cubrir`, "etiqueta roto"));
          } else if (f.hasDecomposition) {
            celdaHuecos.append(el("span", "completa", "etiqueta aprueba"));
          } else {
            celdaHuecos.textContent = "—";
          }
          tr.append(celdaHuecos);

          tr.append(el("td", f.updated, "id"));

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/feature/${f.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: una feature, con su grafo y su cobertura ───────────────────

      /** Una sección colapsable con texto en crudo. */
      function bloqueCrudo(titulo, texto, abierto) {
        const detalle = document.createElement("details");
        if (abierto) detalle.open = true;
        detalle.append(el("summary", titulo));
        detalle.append(el("pre", texto));
        return detalle;
      }

      /** La tabla de requisitos, con quién lo cubre y en qué estado está. */
      function tablaRequisitos(requisitos, ticketsPorId) {
        const tabla = el("table");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Requisito", "Cubierto por", "Estado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const req of requisitos) {
          const tr = el("tr");

          const celda = el("td");
          celda.append(
            el("div", req.statement),
            el("div", `${req.id} · ${req.domain}`, "id"),
          );
          tr.append(celda);

          const celdaCubre = el("td");
          if (req.coveredBy.length === 0) {
            celdaCubre.append(el("span", "ninguno", "etiqueta roto"));
          } else {
            for (const id of req.coveredBy) {
              const linea = el("div");
              linea.append(el("span", id, "id"));
              if (!ticketsPorId.has(id)) {
                // Un `covered_by` que apunta a un ticket que no está en ningún
                // sprint cubre lo mismo que ninguno, y el motor lo trata así.
                linea.append(el("span", " fuera del grafo", "etiqueta roto"));
              }
              celdaCubre.append(linea);
            }
          }
          tr.append(celdaCubre);

          const celdaEstado = el("td");
          if (req.coveredBy.length === 0) {
            celdaEstado.append(el("span", "sin cubrir", "etiqueta roto"));
          } else {
            const estados = req.coveredBy
              .filter((id) => ticketsPorId.has(id))
              .map((id) => ticketsPorId.get(id));
            if (estados.length === 0) {
              celdaEstado.append(el("span", "no escrito", "etiqueta"));
            } else if (estados.every((e) => e === "closed")) {
              celdaEstado.append(el("span", "cerrado", "etiqueta aprueba"));
            } else {
              celdaEstado.append(el("span", "en curso", "etiqueta"));
            }
          }
          tr.append(celdaEstado);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        return tabla;
      }

      /** Los estados a los que una feature puede ir hoy, según el contrato. */
      async function transicionesDeFeature(slug) {
        const f = await api("GET", `/api/features/${slug}`);
        return f;
      }

      /**
       * Mueve el estado de una feature.
       *
       * Los destinos vienen del servidor, que los saca de la tabla del contrato:
       * si la interfaz los dedujera, un cambio en la máquina de estados dejaría a
       * la pantalla ofreciendo movimientos ilegales.
       */
      async function moverFeature(slug, to) {
        try {
          const r = await api("POST", `/api/features/${slug}/transition`, { to });
          await vistaFeature(slug);
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado ok resultado-feature";
            salida.textContent = r.details;
          }
        } catch (fallo) {
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = fallo.message;
          }
        }
      }

      /**
       * Descompone una feature y muestra el grafo.
       *
       * Es el paso que más valor tiene de esta vista y el único que obligaba a
       * abrir la terminal para completar el ciclo. Se avisa de lo que cuesta antes
       * de pulsar: una llamada al modelo del rol `architect`.
       */
      async function descomponerFeature(slug, boton, salida) {
        boton.disabled = true;
        boton.textContent = "Descomponiendo…";
        salida.className = "resultado resultado-feature";
        salida.textContent =
          "Consultando al modelo del rol architect. Puede tardar un minuto.";
        try {
          const r = await api("POST", `/api/features/${slug}/decompose`, {});
          if (!r.ok) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = r.error;
            return;
          }
          salida.className = "resultado ok resultado-feature";
          salida.textContent =
            `Descomposición escrita: ${r.document.decomposition.sprints.length} sprint(s), ` +
            `${r.document.decomposition.coverage.length} requisito(s) cubierto(s). ` +
            `Modelo: ${r.decomposer.provider}/${r.decomposer.model}`;
          await vistaFeature(slug);
        } catch (fallo) {
          salida.className = "resultado error resultado-feature";
          salida.textContent = fallo.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Descomponer";
        }
      }

      async function vistaFeature(slug) {
        const cont = $("contenido");
        cont.textContent = "";

        const f = await api("GET", `/api/features/${slug}`);

        const volver = el("a", "← Todas las features", "volver enlace");
        volver.href = "#/features";
        cont.append(volver);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", f.title));
        const meta = el("div", undefined, "meta");
        meta.append(el("span", f.id, "id"), el("span", f.state, "etiqueta"));
        if (f.invalid !== null) meta.append(el("span", "inválida", "etiqueta roto"));
        cabecera.append(meta, marcasArtefactos(f), el("div", f.path, "ruta"));
        cont.append(cabecera);

        if (f.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "La feature no valida. "), el("span", f.invalid));
          cont.append(nota);
        }

        // ── Huecos de cobertura ──
        //
        // Va antes que nada operativo a propósito: es lo que impide empezar a
        // trabajar, y enterrarlo bajo tres tablas obliga a buscarlo.
        const huecos = f.decomposition === null ? [] : f.decomposition.gaps;
        if (f.decompositionError !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(
            el("strong", "El tickets.yaml no se puede leer. "),
            el("span", f.decompositionError, "resultado error"),
          );
          cont.append(nota);
        }
        if (huecos.length > 0) {
          const caja = el("div", undefined, "nota alerta huecos");
          caja.append(
            el("strong", `${huecos.length} requisito(s) sin ticket que los cubra. `),
            el(
              "span",
              "La compuerta de descomposición no pasa con huecos: cada requisito necesita al menos un ticket en un sprint.",
            ),
          );
          for (const hueco of huecos) {
            const fila = el("div", undefined, "fila");
            fila.append(
              el("span", hueco.requirement || "declarado", "id"),
              el("span", hueco.statement),
            );
            caja.append(fila);
          }
          cont.append(caja);
        }
        if (f.cycles.length > 0) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El grafo de dependencias tiene ciclos. "));
          for (const ciclo of f.cycles) {
            nota.append(el("div", ciclo.join(" → "), "id"));
          }
          cont.append(nota);
        }

        // El estado de cada ticket del grafo, para saber qué está escrito ya.
        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        // ── Pestañas ──
        const barra = el("div", undefined, "secciones");
        const zona = el("div");
        const pestanas = [
          ["Resumen", () => panelResumen(f)],
          ["Requisitos", () => panelRequisitos(f)],
          ["Grafo", () => panelGrafo(f)],
          ["Brief", () => bloqueCrudo("feature.md", f.brief, true)],
        ];
        // El tablero va primero cuando hay grafo: es la respuesta a «¿por dónde
        // va?», que es la pregunta con la que se entra a una feature en curso.
        if (f.hasDecomposition) pestanas.unshift(["Tablero", () => panelTablero(f)]);
        if (f.design !== null)
          pestanas.push(["Diseño", () => bloqueCrudo("design.md", f.design)]);
        if (f.ticketsYaml !== null) {
          pestanas.push([
            "tickets.yaml",
            () => bloqueCrudo("tickets.yaml", f.ticketsYaml, true),
          ]);
        }
        for (const spec of f.specs) {
          pestanas.push([
            `spec · ${spec.domain}`,
            () => bloqueCrudo(spec.source, spec.text),
          ]);
        }

        const pintar = (indice) => {
          zona.textContent = "";
          zona.append(pestanas[indice][1]());
          for (const [i, boton] of [...barra.children].entries()) {
            boton.setAttribute("aria-pressed", String(i === indice));
          }
        };
        pestanas.forEach(([nombre], indice) => {
          const boton = el("button", nombre);
          boton.addEventListener("click", () => pintar(indice));
          barra.append(boton);
        });
        cont.append(barra, zona);
        pintar(0);
      }

      /** El resumen: qué hay, quién lo generó y en qué punto está. */
      function panelResumen(f) {
        const caja = el("div");

        const tabla = el("table");
        const tbody = el("tbody");
        const fila = (rotulo, valor) => {
          const tr = el("tr");
          tr.append(el("td", rotulo, "id"), el("td", valor));
          tbody.append(tr);
        };
        fila("Estado", f.state);
        fila("Creada", f.created);
        fila("Actualizada", f.updated);
        fila(
          "Requisitos",
          f.requirements === 0
            ? "La spec no declara requisitos todavía."
            : `${f.requirements} en ${f.specs.length} dominio(s)`,
        );
        fila(
          "Tickets",
          f.hasDecomposition
            ? `${f.tickets} en ${f.decomposition?.sprints.length ?? 0} sprint(s)`
            : "Sin descomponer",
        );
        if (f.decomposition?.origin) {
          fila(
            "Descompuesta por",
            `${f.decomposition.origin.provider}/${f.decomposition.origin.model}`,
          );
        }
        tabla.append(tbody);
        caja.append(tabla);

        // ── Acciones ──
        //
        // Mover el estado y descomponer, desde aquí. Es lo que cierra el ciclo sin
        // abrir la terminal, y descomponer es el paso que más valor tiene: es el
        // que convierte la spec en trabajo.
        const acciones = el("div", undefined, "acciones-feature");
        const salida = el("div", "resultado resultado-feature");

        if (!f.hasDecomposition && f.requirements > 0) {
          const boton = el("button", "Descomponer", "principal");
          boton.title =
            "Pide el grafo de tickets al modelo del rol architect. Cuesta una llamada.";
          boton.addEventListener(
            "click",
            () => void descomponerFeature(f.id, boton, salida),
          );
          acciones.append(boton);
        }
        if (f.requirements === 0) {
          acciones.append(
            el(
              "span",
              `Falta la spec: escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con ` +
                'requisitos en RFC 2119 — "### Requirement: R-XXX-001 — El sistema DEBE …".',
              "resultado",
            ),
          );
        }

        // Los movimientos legales, con el estado actual fuera: ofrecer el que ya
        // se tiene es ofrecer un botón que no hace nada.
        const destinos = (f.transitions ?? []).filter((estado) => estado !== f.state);
        if (destinos.length > 0) {
          const etiqueta = el("span", "Mover a:", "resultado");
          acciones.append(etiqueta);
          for (const destino of destinos) {
            const boton = el("button", destino);
            boton.addEventListener("click", () => void moverFeature(f.id, destino));
            acciones.append(boton);
          }
        }

        if (acciones.children.length > 0) {
          caja.append(acciones, salida);
        }
        if (f.requirements === 0) {
          const nota = el("div", undefined, "nota");
          nota.append(
            el("strong", "Falta la spec. "),
            el(
              "span",
              `Escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con requisitos en RFC 2119: "### Requirement: R-XXX-001 — El sistema DEBE …".`,
              "resultado",
            ),
          );
          caja.append(nota);
        }
        return caja;
      }

      /** Los requisitos, con la cobertura declarada y el estado real. */
      function panelRequisitos(f) {
        const caja = el("div");
        const requisitos = f.specs.flatMap((spec) => spec.requirements);

        if (requisitos.length === 0) {
          caja.append(el("div", "La spec no declara requisitos.", "vacio"));
          return caja;
        }

        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        caja.append(tablaRequisitos(requisitos, ticketsPorId));

        if (f.decomposition === null) {
          caja.append(
            el(
              "div",
              "Sin tickets.yaml no hay cobertura declarada: la columna «Cubierto por» está vacía por eso, no porque falte trabajo.",
              "nota",
            ),
          );
        }
        return caja;
      }

      /**
       * El tablero: los tickets de la feature, agrupados por dónde están.
       *
       * Es el grafo mirado al revés. La tabla de sprints responde «qué se planeó»,
       * que es lo que se pregunta antes de empezar; el tablero responde «por dónde
       * va», que es lo que se pregunta todos los días mientras se trabaja. Y
       * responde una tercera, que es la que hace falta para ponerse a trabajar:
       * **cuál se puede empezar ya** —el que no espera a nadie—, porque una
       * dependencia sin cerrar es una razón para no tocarlo todavía.
       *
       * Un ticket del grafo que todavía no está en el registro no se esconde ni se
       * disfraza: tiene su columna, «Sin crear», que es el estado en que queda una
       * feature descompuesta y todavía sin tickets escritos.
       */
      function panelTablero(f) {
        const caja = el("div");
        const tickets = [...(f.decomposition?.sprints ?? [])].flatMap((sprint) =>
          sprint.tickets.map((t) => ({ ...t, sprint: sprint.id })),
        );

        if (tickets.length === 0) {
          caja.append(
            el(
              "div",
              "El grafo no tiene tickets todavía. Descompone la feature o escribe el tickets.yaml.",
              "vacio",
            ),
          );
          return caja;
        }

        const porId = new Map(tickets.map((t) => [t.id, t]));
        /** Un ticket está terminado cuando su trabajo ya no bloquea a nadie. */
        const terminado = (id) => {
          const otro = porId.get(id);
          return (
            otro !== undefined &&
            (otro.state === "closed" || otro.state === "qa_approved")
          );
        };
        const espera = (t) => t.dependsOn.filter((id) => !terminado(id));

        const etapas = [
          ["Sin crear", (t) => !t.exists],
          ["Por analizar", (t) => t.exists && t.state === "intake"],
          ["Planeado", (t) => ["analyzed", "planned"].includes(t.state)],
          ["Aprobado", (t) => t.state === "approved"],
          [
            "En curso",
            (t) => ["in_progress", "changes_requested"].includes(t.state),
          ],
          ["Por probar", (t) => ["awaiting_user_tests", "in_qa"].includes(t.state)],
          ["Cerrado", (t) => ["qa_approved", "closed"].includes(t.state)],
          ["Bloqueado", (t) => t.state === "blocked"],
        ];

        const tablero = el("div", undefined, "tablero");
        const vacias = [];
        for (const [nombre, coincide] of etapas) {
          const suyos = tickets.filter(coincide);
          // Una columna sin tarjetas no se pinta: ocho etapas con seis vacías
          // obligaban a desplazarse para ver las dos que tienen trabajo. La forma
          // del tablero no se pierde —las vacías se nombran al pie— y lo que se
          // gana es que el trabajo entre en la pantalla.
          if (suyos.length === 0) {
            vacias.push(nombre);
            continue;
          }

          const columna = el("div", undefined, "columna-tablero");
          columna.append(el("div", `${nombre} · ${suyos.length}`, "titulo"));
          for (const t of suyos) {
            const tarjeta = el("div", undefined, "tarjeta-ticket");
            const identificador = el("div", t.id, "id");
            // El identificador lleva al ticket cuando existe: es lo que se hace
            // después de mirar el tablero.
            if (t.exists) {
              const enlace = el("a", t.id, "enlace");
              enlace.href = `#/ticket/${t.id}`;
              identificador.textContent = "";
              identificador.append(enlace);
            }
            tarjeta.append(identificador);
            const titulo = el("div", t.title || "(sin título)", "titulo-ticket");
            // El texto completo, para cuando el recorte de tres renglones lo corta.
            titulo.title = t.title || "(sin título)";
            tarjeta.append(titulo);
            const meta = el("div", undefined, "meta");
            meta.append(
              el("span", t.exists ? t.state : "sin crear", "etiqueta"),
              el("span", t.sprint, "id"),
            );
            tarjeta.append(meta);

            const pendientes = espera(t);
            if (pendientes.length > 0) {
              tarjeta.append(
                el("div", `espera a ${pendientes.join(", ")}`, "espera resultado"),
              );
            } else if (t.exists && !["closed", "qa_approved"].includes(t.state)) {
              tarjeta.append(el("div", "listo para empezar", "listo resultado"));
            }
            columna.append(tarjeta);
          }
          tablero.append(columna);
        }

        caja.append(tablero);
        if (vacias.length > 0) {
          caja.append(el("div", `Sin tarjetas: ${vacias.join(", ")}.`, "vacio-tablero"));
        }

        const sinCrear = tickets.filter((t) => !t.exists).length;
        // El paso que convierte el plan en trabajo. Está acá, junto al dato que lo
        // justifica —cuántos faltan— y no en el grafo: es lo que se quiere hacer
        // después de ver qué no está escrito.
        if (sinCrear > 0) {
          const pie = el("div", undefined, "responsable");
          const escribir = el("button", `Escribir los ${sinCrear} que faltan en el registro`);
          const salida = el("div", undefined, "resultado");
          escribir.addEventListener("click", async () => {
            escribir.disabled = true;
            salida.className = "resultado";
            salida.textContent = "Creando…";
            try {
              const r = await api("POST", `/api/features/${f.id}/materialize`, {});
              if (!r.ok) throw new Error(r.error);
              salida.className = "resultado ok";
              salida.textContent = r.details;
              await vistaFeature(f.id);
            } catch (fallo) {
              salida.className = "resultado error";
              salida.textContent = fallo.message;
              escribir.disabled = false;
            }
          });
          pie.append(escribir, salida);
          caja.append(pie);
        }
        caja.append(
          el(
            "div",
            sinCrear === 0
              ? `${tickets.length} ticket(s) del grafo están escritos en el registro.`
              : `${sinCrear} de ${tickets.length} ticket(s) del grafo todavía no están ` +
                  "escritos en el registro: el grafo es el plan, y cada uno se crea para " +
                  "poder trabajarlo. Los que esperan a otro conviene no empezarlos antes.",
            "nota",
          ),
        );
        return caja;
      }

      /** El grafo: sprints, tickets, dependencias y quién existe ya. */
      function panelGrafo(f) {
        const caja = el("div");

        if (f.decomposition === null) {
          caja.append(
            el("div", f.decompositionError ?? "Todavía no hay descomposición.", "vacio"),
          );
          return caja;
        }

        for (const sprint of f.decomposition.sprints) {
          const cajaSprint = el("div", undefined, "sprint");
          const cabecera = el("header");
          cabecera.append(el("span", sprint.id, "id"), el("h3", sprint.goal));
          cajaSprint.append(cabecera);

          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Ticket", "Estado", "Depende de"])
            fila.append(el("th", columna));
          thead.append(fila);

          const tbody = el("tbody");
          for (const t of sprint.tickets) {
            // Un ticket del grafo que aún no está en el registro se atenúa: la
            // diferencia entre «planeado» y «escrito» es lo que se mira aquí.
            const tr = el("tr", undefined, t.exists ? "" : "planeado");

            const celda = el("td");
            celda.append(el("div", t.title || "(sin título)"), el("div", t.id, "id"));
            tr.append(celda);

            const celdaEstado = el("td");
            celdaEstado.append(
              t.exists
                ? el("span", t.state, "etiqueta")
                : el("span", "por crear", "etiqueta"),
            );
            tr.append(celdaEstado);

            const celdaDeps = el("td");
            celdaDeps.append(
              el(
                "span",
                t.dependsOn.length === 0 ? "—" : t.dependsOn.join(", "),
                "depende",
              ),
            );
            tr.append(celdaDeps);

            tbody.append(tr);
          }

          tabla.append(thead, tbody);
          cajaSprint.append(tabla);
          caja.append(cajaSprint);
        }

        const creados = [...(f.decomposition?.sprints ?? [])]
          .flatMap((s) => s.tickets)
          .filter((t) => t.exists).length;
        const total = [...(f.decomposition?.sprints ?? [])].flatMap(
          (s) => s.tickets,
        ).length;
        caja.append(
          el(
            "div",
            `${creados} de ${total} ticket(s) del grafo existen ya en el registro. Los atenuados están planeados y todavía no escritos.`,
            "nota",
          ),
        );
        return caja;
      }

      /**
       * La barra de progreso de una feature: cuántos de sus tickets cerraron.
       *
       * Faltaba, y la vista la llamaba desde que se escribió la columna de
       * progreso: en un proyecto sin features descompuestas nadie pasaba por esa
       * rama, y en cuanto hubo una, la pantalla entera respondió «Can't find
       * variable: barraDeProgreso». Un `undefined` a la vista no aparece hasta
       * que el dato existe.
       */
      function barraDeProgreso(cerrados, total) {
        const caja = el("div", undefined, "barra-progreso");
        const lleno = el("div", undefined, "barra-progreso-lleno");
        const proporcion = total === 0 ? 0 : Math.round((cerrados / total) * 100);
        lleno.style.width = `${proporcion}%`;
        caja.append(lleno);
        caja.title = `${cerrados} de ${total} cerrados`;
        return caja;
      }

      /**
       * Descarga el reporte Markdown.
       *
       * Se pide el texto a la API y se arma el archivo en el navegador con un
       * `Blob`: un enlace directo a `/api/report` abriría el Markdown en una
       * pestaña, que es lo contrario de lo que se quiere —pegarlo en un correo—.
       */
      async function descargarReporte() {
        // El rango sale de los filtros de la lista: el reporte semanal es sobre lo
        // que se cerró esa semana, así que el botón tiene que exportar **lo que se
        // está viendo** y no un rango fijo. El reporte siempre cuenta por fecha de
        // cierre, que es la del bloque `## Cierre`.
        const params = new URLSearchParams();
        if (filtros.desde !== "") params.set("desde", filtros.desde);
        if (filtros.hasta !== "") params.set("hasta", filtros.hasta);

        const datos = await api("GET", `/api/report?${params.toString()}`);
        const blob = new Blob([datos.markdown], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = datos.filename;
        enlace.click();
        URL.revokeObjectURL(url);
      }

      // ── Vista: un ticket, con sus gates ───────────────────────────────────

      /** Los colores y el nombre legible de cada tipo de proposición. */
      const MODALIDAD = { human: "humano", auto: "automático", hybrid: "híbrido" };
      const MARCA = { pass: "✓", fail: "✗", warn: "!", skip: "·" };

      /** Una barra con el valor y los dos umbrales: hace visible la decisión. */
      function barraValor(valor, mark, policy) {
        const barra = el("div", undefined, "barra");
        const relleno = el("div", undefined, `relleno ${mark}`);
        relleno.style.width = `${Math.max(0, Math.min(1, valor)) * 100}%`;
        barra.append(relleno);
        for (const corte of [policy.blockAt, policy.approveAt]) {
          const marca = el("div", undefined, "corte");
          marca.style.left = `${corte * 100}%`;
          barra.append(marca);
        }
        return barra;
      }

      /** Los checks que decide el código, sin coste y antes de evaluar. */
      function listaChecks(checks) {
        const lista = el("div", undefined, "checks");
        for (const check of checks) {
          const fila = el("div", undefined, "check");
          fila.append(
            el("span", MARCA[check.result] ?? "·", `marca ${check.result}`),
            el("span", check.id),
            el("span", check.detail ?? "", "detalle"),
          );
          lista.append(fila);
        }
        return lista;
      }

      /** Las proposiciones evaluadas, con la probabilidad que se comparó. */
      function tablaProposiciones(recibo, policy) {
        const tabla = el("table", undefined, "proposiciones");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proposición", "Valor", "", "Umbral", "Resultado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const p of recibo.propositions) {
          const tr = el("tr");

          // Lo que se juzgó va primero y en su texto: `criterio_03` en banda de
          // revisión no dice nada, y el criterio que representa sí. Debajo queda
          // el identificador con su valor, que es lo que hace falta para
          // rastrearlo en el recibo.
          const celdaProposicion = el("td");
          if (p.description) {
            celdaProposicion.append(
              el("div", p.description, "criterio-texto"),
              el("div", p.label || p.id, "etiqueta-proposicion"),
            );
          } else {
            celdaProposicion.append(el("div", p.label || p.id, "etiqueta-proposicion"));
          }
          tr.append(celdaProposicion);
          tr.append(el("td", p.value.toFixed(3), "cifra"));

          const celdaBarra = el("td");
          celdaBarra.append(barraValor(p.value, p.mark, policy));
          tr.append(celdaBarra);

          tr.append(
            el(
              "td",
              p.verdict ? `${policy.approveAt} / ${policy.blockAt}` : "no veta",
              "cifra",
            ),
          );

          const celdaResultado = el("td");
          const texto = {
            approve: "aprueba",
            block: "bloquea",
            review: "en banda media",
            descriptive: "descriptiva",
          }[p.mark];
          celdaResultado.append(
            el("span", texto, p.mark === "descriptive" ? "descriptiva" : "etiqueta"),
          );
          if (p.reason) celdaResultado.append(el("div", p.reason, "resultado"));
          tr.append(celdaResultado);

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        return tabla;
      }

      /** La decisión vigente de un gate, con todo lo que la hace auditable. */
      function bloqueDecision(recibo, gate, ticketId, alDecidir) {
        const cont = el("div");

        const veredicto = el("div", undefined, "veredicto");
        veredicto.append(
          el("span", recibo.outcome.toUpperCase(), `salida ${recibo.outcome}`),
          el("span", recibo.reason, "motivo"),
          el("span", recibo.actor, "etiqueta"),
        );
        cont.append(veredicto);

        // Una aprobación de un estado que ya no existe no es una aprobación.
        if (recibo.stale) {
          cont.append(
            el(
              "div",
              "El ticket cambió desde que se emitió este recibo. La decisión es sobre el " +
                "estado congelado, no sobre el ticket actual: hay que volver a evaluar.",
              "obsoleto",
            ),
          );
        }

        // Un renglón que explique la banda antes de la tabla: sin él, «en banda
        // media» es una palabra que hay que interpretar.
        if (recibo.propositions.some((p) => p.mark === "review")) {
          cont.append(
            el(
              "div",
              `Ninguna proposición llegó a los umbrales: por debajo de ${gate.policy.blockAt} bloquea, ` +
                `a partir de ${gate.policy.approveAt} aprueba, y lo que cae en medio es lo que tienes que decidir tú. ` +
                "Las que aparecen como «descriptiva» se registran pero no vetan.",
              "resultado",
            ),
          );
        }
        cont.append(
          tablaProposiciones(recibo, gate.policy),
          listaChecks(recibo.mechanicalChecks),
        );

        const pie = el("div", undefined, "pie-recibo");
        pie.append(
          el("span", undefined, `media ponderada ${recibo.weightedMean.toFixed(3)}`),
          el(
            "span",
            undefined,
            `evaluador ${recibo.model?.resolvedVersion ?? "— (decisión en código)"}`,
          ),
          el("span", undefined, `coste $${(recibo.usage?.costUsd ?? 0).toFixed(6)}`),
          el("span", undefined, `${recibo.latencyMs ?? 0} ms`),
          el("span", undefined, `congelado ${recibo.stateHash.slice(0, 23)}…`),
        );
        cont.append(pie);

        // La decisión humana.
        if (recibo.humanDecision !== null) {
          const humana = el("div", undefined, "decision-humana");
          const quien = el("div", undefined, "quien");
          quien.append(
            el("strong", recibo.humanDecision.actor),
            el(
              "span",
              ` ${recibo.humanDecision.decision === "approve" ? "aprobó" : "rechazó"} · ${recibo.humanDecision.decidedAt}`,
            ),
          );
          humana.append(quien);
          if (recibo.humanDecision.reason) {
            humana.append(el("div", recibo.humanDecision.reason, "resultado"));
          }
          cont.append(humana);
        } else if (recibo.escalatedTo === "human") {
          const humana = el("div", undefined, "decision-humana");
          humana.append(
            el(
              "div",
              "El evaluador no alcanzó ninguno de los dos umbrales: la decisión es de una persona.",
              "resultado",
            ),
          );

          const acciones = el("div", undefined, "acciones");
          acciones.style.justifyContent = "flex-start";
          acciones.style.marginTop = "10px";

          const motivo = document.createElement("input");
          motivo.type = "text";
          motivo.placeholder = "Motivo de la decisión";
          motivo.style.flex = "1 1 260px";

          const aprobar = el("button", "Aprobar", "principal");
          const rechazar = el("button", "Rechazar", "peligro");
          const decidir = async (decision, boton) => {
            if (responsable.trim() === "") {
              alert(
                "Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.",
              );
              return;
            }
            boton.disabled = true;
            try {
              await api(
                "POST",
                `/api/tickets/${ticketId}/gates/${recibo.receiptId}/decision`,
                {
                  decision,
                  actor: responsable,
                  reason: motivo.value,
                },
              );
              await alDecidir();
            } catch (error) {
              alert(error.message);
              boton.disabled = false;
            }
          };
          aprobar.addEventListener("click", () => void decidir("approve", aprobar));
          rechazar.addEventListener("click", () => void decidir("reject", rechazar));

          acciones.append(motivo, aprobar, rechazar);
          humana.append(acciones);
          cont.append(humana);
        } else if (recibo.outcome === "block") {
          // Un bloqueo también admite la firma de una persona (R-CDEF-004): tras dos
          // bloqueos del mismo motivo, lo normal es un artefacto ya corregido que se autoriza
          // sin una tercera corrida. Solo se ofrece «Autorizar», con la frase literal
          // obligatoria; «Rechazar» un bloqueo no cambia nada, y el de la compuerta mecánica
          // es un comando que falló: un hecho, no una opinión.
          const humana = el("div", undefined, "decision-humana");
          if (recibo.gate === "qa-mechanical") {
            humana.append(
              el(
                "div",
                "La compuerta mecánica bloqueó porque un comando falló, y eso es un hecho y no " +
                  "una opinión: no admite una decisión humana. Corrige lo que falla y vuelve a correrla.",
                "resultado",
              ),
            );
          } else {
            humana.append(
              el(
                "div",
                "El evaluador bloqueó. Si decides seguir de todos modos —por ejemplo tras dos " +
                  "bloqueos por el mismo motivo, con el artefacto ya corregido—, tu autorización " +
                  "queda en el registro con tu frase literal. Autorizar no avanza el ticket: la " +
                  "transición es otro paso. También se puede autorizar un bloqueo obsoleto.",
                "resultado",
              ),
            );

            const acciones = el("div", undefined, "acciones");
            acciones.style.justifyContent = "flex-start";
            acciones.style.marginTop = "10px";

            const frase = document.createElement("input");
            frase.type = "text";
            frase.placeholder = "Frase literal de quien autoriza (obligatoria)";
            frase.style.flex = "1 1 320px";

            const autorizar = el("button", "Autorizar seguir pese al bloqueo", "principal");
            // Sin la frase el motor rechaza la decisión: el botón no se habilita antes.
            autorizar.disabled = true;
            frase.addEventListener("input", () => {
              autorizar.disabled = frase.value.trim() === "";
            });
            autorizar.addEventListener("click", async () => {
              if (responsable.trim() === "") {
                alert(
                  "Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.",
                );
                return;
              }
              autorizar.disabled = true;
              try {
                await api(
                  "POST",
                  `/api/tickets/${ticketId}/gates/${recibo.receiptId}/decision`,
                  { decision: "approve", actor: responsable, reason: frase.value },
                );
                await alDecidir();
              } catch (error) {
                alert(error.message);
                autorizar.disabled = false;
              }
            });

            acciones.append(frase, autorizar);
            humana.append(acciones);
          }
          cont.append(humana);
        }

        const detalles = el("details");
        detalles.append(el("summary", "Ver el informe del CLI, tal cual"));
        const pre = el(
          "pre",
          recibo.report || "(el informe solo se guarda al evaluar desde la interfaz)",
        );
        detalles.append(pre);
        cont.append(detalles);

        return cont;
      }

      /** Una tarjeta de gate: lo que ya sabe el código y lo que se puede hacer. */
      function tarjetaGate(gate, decisiones, recargar) {
        const cont = el("section", undefined, "gate");

        const cabecera = el("div", undefined, "gate-cabecera");
        cabecera.append(
          el("h3", `${gate.id} — ${gate.title}`),
          el("span", MODALIDAD[gate.mode], "etiqueta"),
          el("span", gate.transition, "etiqueta"),
          gate.applies
            ? el("span", "aplica", "etiqueta aprueba")
            : el(
                "span",
                `no aplica en ${gate.workflowStatus || "un ticket ilegible"}`,
                "etiqueta",
              ),
        );
        cont.append(cabecera);

        cont.append(
          el(
            "div",
            `Umbrales: aprueba ≥ ${gate.policy.approveAt} · bloquea ≤ ${gate.policy.blockAt} · ` +
              `${gate.propositionCount} proposición(es)` +
              (gate.blockedByCode ? " · el código ya sabe que va a bloquear" : ""),
            "gate-meta",
          ),
        );

        const vigente = decisiones.find((d) => d.gate === gate.id);
        // Los checks se muestran antes de evaluar; después van dentro del
        // recibo, donde son parte de la auditoría y no un duplicado.
        if (vigente === undefined) cont.append(listaChecks(gate.mechanicalChecks));

        const acciones = el("div", undefined, "acciones");
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        // Solo se ofrecen los evaluadores que pueden decidir **este** gate. Un
        // desplegable con una opción que siempre falla es una trampa.
        const evaluador = document.createElement("select");
        const opciones = [
          [
            "auto",
            gate.hasCommandChecks
              ? "evaluador automático (código primero)"
              : "evaluador automático",
          ],
          ["jev", "Jev (probabilidades)"],
          ["llm-judge", "modelo de chat"],
        ];
        // La cascada solo se ofrece donde queda algo que un verificador pueda
        // comprobar: un gate que se resuelve entero en código no gasta llamadas
        // aunque se la pida, y un desplegable que ofrece una opción que no hace
        // nada enseña a no creerle al desplegable.
        if (gate.needsModel)
          opciones.push(["cascade", "cascada verificada (barato, verifica, escala)"]);
        if (gate.hasCommandChecks) opciones.push(["command", "solo checks deterministas"]);
        for (const [valor, etiqueta] of opciones) {
          evaluador.append(new Option(etiqueta, valor));
        }

        const evaluar = el(
          "button",
          "Evaluar",
          gate.applies && !gate.blockedByCode ? "principal" : "",
        );
        evaluar.disabled = !gate.applies || gate.blockedByCode;
        evaluar.addEventListener("click", async () => {
          evaluar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "evaluando…";
          try {
            const r = await api(
              "POST",
              `/api/tickets/${gate.ticketId}/gates/${gate.id}/run`,
              {
                evaluator: evaluador.value,
              },
            );
            if (!r.ok) {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
            await recargar();
          } catch (error) {
            salida.className = "resultado error";
            salida.textContent = error.message;
          } finally {
            evaluar.disabled = false;
          }
        });

        acciones.append(salida, evaluador, evaluar);
        cont.append(acciones);

        if (vigente !== undefined) {
          cont.append(bloqueDecision(vigente, gate, gate.ticketId, recargar));
          const anteriores = decisiones.filter((d) => d.gate === gate.id).length - 1;
          if (anteriores > 0) {
            cont.append(
              el(
                "div",
                `${anteriores} recibo(s) anterior(es) en el registro append-only`,
                "historial",
              ),
            );
          }
        } else {
          cont.append(el("div", "Sin evaluar todavía.", "resultado"));
        }

        return cont;
      }

      /** Solo la banda de la vista vigente puede recibir el refresco parcial. */
      let bandaDeFasesActual = null;

      /** La API de fases es complementaria: no frena el resto de la vista. */
      function pintarBandaDeFases(cont, ticket, id) {
        const banda = el("section", undefined, "banda-fases");
        banda.setAttribute("aria-label", "Fases del ticket");
        banda.append(el("h3", "Fases del ticket"));
        const tramos = el("div", undefined, "banda-fases-tramos");
        tramos.setAttribute("aria-live", "polite");
        tramos.append(el("div", "Leyendo las fases…", "resultado"));
        banda.append(tramos);
        cont.append(banda);

        const rotulos = {
          intake: "Alta",
          analyzed: "Analizado",
          planned: "Plan",
          approved: "Aprobado",
          in_progress: "En curso",
          awaiting_user_tests: "Pruebas",
          in_qa: "QA",
          qa_approved: "QA aprobado",
          closed: "Cerrado",
          blocked: "Bloqueado",
          changes_requested: "Cambios solicitados",
        };
        const duracion = (ms) => {
          if (ms === null || !Number.isFinite(ms)) return "Sin duración registrada";
          const segundos = Math.floor(Math.max(0, ms) / 1000);
          const dias = Math.floor(segundos / 86400);
          const horas = Math.floor((segundos % 86400) / 3600);
          const minutos = Math.floor((segundos % 3600) / 60);
          return `${dias ? `${dias} d ` : ""}${horas} h ${minutos} min ${segundos % 60} s`;
        };
        const fecha = (valor) => {
          if (valor === null || !Number.isFinite(Date.parse(valor))) {
            return "Sin hora registrada";
          }
          return new Date(valor).toLocaleString("es-CO");
        };

        async function refrescar(inicial = false) {
          try {
            const datos = await api(
              "GET",
              `/api/ticket/fases?ticket=${encodeURIComponent(ticket.id)}`,
            );
            // Una respuesta tardía no modifica una vista abandonada ni una pantalla
            // que quedó ocupada mientras se consultaban las fases.
            if (
              !inicial &&
              (bandaDeFasesActual?.refrescar !== refrescar || !puedeRefrescar())
            ) {
              if (bandaDeFasesActual?.refrescar === refrescar) avisarQueHayCambios();
              return;
            }
            const nuevos = [];
            if (datos.fases.length === 0) {
              nuevos.push(el("div", "Sin línea de fases", "resultado"));
            }
            for (const fase of datos.fases) {
              const conMotivo =
                ["blocked", "changes_requested"].includes(fase.estado) && fase.motivo;
              const tramo = el("div", undefined, "banda-fase");
              if (fase.enCurso) tramo.className += " actual";
              if (conMotivo) tramo.className += " motivo-de-bloqueo";
              tramo.append(
                el("strong", rotulos[fase.estado] ?? fase.estado),
                el("div", `Inicio: ${fecha(fase.inicio)}`, "banda-fase-tiempo"),
              );
              if (fase.enCurso) {
                const ms = fase.inicio === null ? null : Date.now() - Date.parse(fase.inicio);
                tramo.append(el("div", `En curso · Tiempo llevado: ${duracion(ms)}`, "banda-fase-tiempo"));
              } else {
                tramo.append(
                  el("div", `Fin: ${fecha(fase.fin)}`, "banda-fase-tiempo"),
                  el("div", `Duración: ${duracion(fase.ms)}`, "banda-fase-tiempo"),
                );
              }
              if (conMotivo) {
                tramo.append(el("div", `Motivo del bloqueo: ${fase.motivo}`, "banda-fase-motivo"));
              }
              nuevos.push(tramo);
            }
            tramos.textContent = "";
            tramos.replaceChildren(...nuevos);
          } catch {
            // Solo la carga inicial muestra la fila vacía: un fallo transitorio
            // del refresco conserva el último historial que la persona vio.
            if (inicial) {
              tramos.textContent = "";
              tramos.append(el("div", "Sin línea de fases", "resultado"));
            }
          }
        }
        bandaDeFasesActual = { id, refrescar };
        void refrescar(true);
        return refrescar;
      }

      /** El detalle de un ticket, con la pantalla de gates delante. */
      async function vistaTicket(id) {
        const cont = $("contenido");
        cont.textContent = "";

        const t = await api("GET", `/api/tickets/${id}`);

        const volver = el("a", "← Todos los tickets", "volver enlace");
        volver.href = "#/tickets";
        cont.append(volver);

        const PUNTOS_ABIERTOS = ["open", "analyzed", "in_progress", "awaiting_retest"];
        const abiertos = t.points.filter((p) =>
          PUNTOS_ABIERTOS.includes(String(p.status)),
        ).length;

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", t.title));
        const meta = el("div", undefined, "meta");
        meta.append(
          el("span", t.id, "id"),
          el("span", `${t.type} · ${t.module}`, "etiqueta"),
          el("span", `creado ${t.created}`, "etiqueta"),
        );
        if (t.invalid !== null) {
          meta.append(el("span", "inválido", "etiqueta roto"));
        }
        cabecera.append(meta, el("div", t.path, "ruta"));
        cont.append(cabecera);

        // El estado primero, y visual: es lo que se viene a mirar.
        cont.append(tiraDeEstado(t, abiertos));
        pintarBandaDeFases(cont, t, id);

        if (t.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El ticket no valida. "), el("span", t.invalid));
          cont.append(nota);
        }

        // ── Gates ──
        cont.append(el("h2", "Gates"));

        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las decisiones");
        etiquetaResponsable.htmlFor = "responsable";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () =>
          guardarResponsable(entradaResponsable.value),
        );
        const ayudaResponsable = el(
          "span",
          "Se registra en el recibo junto a la decisión: aprobar sin nombre no es auditable.",
          "resultado",
        );
        barraResponsable.append(etiquetaResponsable, entradaResponsable, ayudaResponsable);
        cont.append(barraResponsable);

        // ── Lo que pide acción, primero ──
        //
        // Antes, para ver un gate pendiente había que pasar por la cabecera, el
        // diagnóstico, el plan y la línea de tiempo: lo urgente quedaba debajo de
        // lo informativo. Ahora el orden del documento es el orden en que se
        // necesita.
        const acordeonGates = acordeon("Compuertas", undefined, true);

        const zonaGates = el("div");
        acordeonGates.cuerpo.append(zonaGates);

        const zonaCorrecciones = el("div");
        acordeonGates.cuerpo.append(zonaCorrecciones);

        const acordeonHistorial = acordeon("Historial de decisiones");

        const pintarCorrecciones = (correcciones) => {
          zonaCorrecciones.textContent = "";
          for (const c of correcciones) {
            const caja = el("div", undefined, "correccion");
            caja.append(
              el(
                "div",
                c.retryExhausted
                  ? `Segundo rechazo del gate ${c.gate}: no queda reintento automático`
                  : `Corrección pendiente del gate ${c.gate}`,
                "correccion-titulo",
              ),
            );
            const quien = el("div", undefined, "resultado");
            quien.append(
              el("span", `Rechazado por ${c.actor} · ${c.decidedAt.slice(0, 10)}`),
              c.retryExhausted
                ? el(
                    "span",
                    " — el autor ya corrigió una vez y volvió a rechazarse. Decide tú: aprobar, o cambiar el plan a mano.",
                  )
                : el(
                    "span",
                    " — el motivo está en el historial del ticket, listo para corregir.",
                  ),
            );
            caja.append(quien);
            if (c.reason) caja.append(el("div", c.reason, "correccion-motivo"));
            zonaCorrecciones.append(caja);
          }
        };

        const cargarGates = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaGates.textContent = "";
          acordeonHistorial.cuerpo.textContent = "";
          acordeonHistorial.cuerpo.append(tiraDeDecisiones(datos.decisions ?? []));
          pintarCorrecciones(datos.corrections ?? []);
          for (const gate of datos.gates) {
            zonaGates.append(
              tarjetaGate({ ...gate, ticketId: id }, datos.decisions, async () => {
                guardarResponsable(entradaResponsable.value);
                await cargarGates();
              }),
            );
          }
        };
        await cargarGates();

        // ── Avanzar el estado ──
        // Los estados los calcula el servidor desde la tabla del contrato. Aquí
        // solo se pintan: ofrecer un movimiento que la tabla no permite sería
        // ofrecer un botón que falla.
        const acordeonTransiciones = acordeon("Avanzar el estado", undefined, true);
        const zonaTransiciones = el("div");
        acordeonTransiciones.cuerpo.append(zonaTransiciones);

        const cargarTransiciones = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaTransiciones.textContent = "";
          const t = datos.transitions;
          if (t === null) {
            zonaTransiciones.append(
              el("div", "Todos los movimientos de este ticket están hechos.", "resultado"),
            );
            return;
          }

          const caja = el("div", undefined, "transiciones");

          const fila = (etiqueta, desde, destinos, entidad, pointId) => {
            const linea = el("div", undefined, "transicion");
            linea.append(el("span", `${etiqueta}: ${desde}`, "resultado"));
            if (destinos.length === 0) {
              linea.append(el("span", "sin salidas", "resultado"));
            }
            for (const destino of destinos) {
              const boton = el("button", destino);
              boton.addEventListener("click", async () => {
                boton.disabled = true;
                salidaTransicion.className = "resultado";
                salidaTransicion.textContent = "moviendo…";
                try {
                  const r = await api("POST", `/api/tickets/${id}/transition`, {
                    entity: entidad,
                    to: destino,
                    ...(pointId === undefined ? {} : { pointId }),
                  });
                  salidaTransicion.className = "resultado ok";
                  salidaTransicion.textContent = r.details;
                  await navegar();
                } catch (fallo) {
                  // Un rechazo del motor —precondición incumplida, transición
                  // ilegal— se muestra tal cual: es la explicación.
                  salidaTransicion.className = "resultado error";
                  salidaTransicion.textContent = fallo.message;
                  boton.disabled = false;
                }
              });
              linea.append(boton);
            }
            return linea;
          };

          const salidaTransicion = el("div", undefined, "resultado");
          caja.append(fila("Ticket", "→", t.ticket, "ticket"));
          caja.append(fila("Release", "→", t.release, "release"));
          for (const punto of t.points) {
            if (punto.to.length === 0) continue;
            caja.append(fila(punto.id, "→", punto.to, "point", punto.id));
          }
          caja.append(salidaTransicion);
          zonaTransiciones.append(caja);
        };
        await cargarTransiciones();

        // ── Contenido, en acordeones ──
        //
        // Cada artefacto se abre cuando se necesita. El diagnóstico arranca
        // abierto porque es lo que más se relee cuando algo va mal; el plan, la
        // solicitud y las pruebas arrancan plegados, que es lo que devuelve la
        // pantalla al tamaño de una lectura.
        const solicitud = acordeonDeSeccion("Solicitud original", undefined, t.workflowStatus);
        solicitud.cuerpo.append(
          t.request.trim() === ""
            ? el("div", "(vacía)", "vacio")
            : seccionDeTicket(t.request),
        );
        cont.append(solicitud.caja);

        const descripcion = acordeonDeSeccion(
          "Descripción funcional",
          undefined,
          t.workflowStatus,
        );
        descripcion.cuerpo.append(
          (t.sections["Descripción funcional"] ?? "").trim() === ""
            ? el("div", "(vacía)", "vacio")
            : seccionDeTicket(t.sections["Descripción funcional"]),
        );
        cont.append(descripcion.caja);

        const diagnostico = acordeonDeSeccion(
          "Diagnóstico",
          t.sections["Diagnóstico"] ? "" : "vacío",
          t.workflowStatus,
        );
        diagnostico.cuerpo.append(
          (t.sections["Diagnóstico"] ?? "").trim() === ""
            ? el("div", "(vacío)", "vacio")
            : seccionDeTicket(t.sections["Diagnóstico"]),
        );
        cont.append(diagnostico.caja);

        const plan = acordeonDeSeccion("Plan", t.sections["Plan"] ? "" : "vacío", t.workflowStatus);
        plan.cuerpo.append(
          (t.sections["Plan"] ?? "").trim() === ""
            ? el("div", "(vacío)", "vacio")
            : seccionDeTicket(t.sections["Plan"]),
        );
        cont.append(plan.caja);

        // Los criterios se cuentan y se pintan como lista: son la lista contra la
        // que el plan se mide, y en texto plano un `- [ ]` no se distingue de una
        // nota.
        const criterios = (t.sections["Criterios de aceptación"] ?? "")
          .split("\n")
          .map((linea) => /^\s*[-*]\s+\[[ xX]\]\s*(.*)$/.exec(linea))
          .filter((m) => m !== null && (m[1] ?? "").trim() !== "")
          .map((m) => m[1].trim());
        const acordeonCriterios = acordeonDeSeccion(
          "Criterios de aceptación",
          `${criterios.length}`,
          t.workflowStatus,
        );
        if (criterios.length === 0) {
          acordeonCriterios.cuerpo.append(
            el("div", "El ticket no declara criterios de aceptación.", "vacio"),
          );
        } else {
          const lista = el("ul", undefined, "lista-criterios");
          for (const criterio of criterios) lista.append(el("li", criterio));
          acordeonCriterios.cuerpo.append(lista);
        }
        cont.append(acordeonCriterios.caja);

        const implementacion = acordeonDeSeccion("Implementación", undefined, t.workflowStatus);
        implementacion.cuerpo.append(
          (t.sections["Implementación"] ?? "").trim() === ""
            ? el("div", "(vacía)", "vacio")
            : seccionDeTicket(t.sections["Implementación"]),
        );
        cont.append(implementacion.caja);

        const pruebas = acordeonDeSeccion("Pruebas", undefined, t.workflowStatus);
        pruebas.cuerpo.append(
          (t.sections["Pruebas"] ?? "").trim() === ""
            ? el("div", "(vacía)", "vacio")
            : seccionDeTicket(t.sections["Pruebas"]),
        );
        cont.append(pruebas.caja);

        // ── La maquinaria, después del contenido ──
        //
        // El orden del documento es el orden en que se lee un ticket: primero el
        // artefacto del estado en que está —y ese viene abierto y marcado—, y
        // después lo que se hace con él. Antes las compuertas y las transiciones
        // iban arriba de todo, así que la pantalla abría con botones y dejaba el
        // diagnóstico tres secciones más abajo.
        cont.append(acordeonGates.caja);
        cont.append(acordeonTransiciones.caja);
        cont.append(acordeonHistorial.caja);

        const acordeonEjecucion = acordeon("Actividad del ejecutor");
        const zonaEjecucion = el("div", "Leyendo ejecuciones declaradas…", "vacio");
        acordeonEjecucion.cuerpo.append(zonaEjecucion);
        cont.append(acordeonEjecucion.caja);
        void pintarActividadDelEjecutor(id).then((nodo) => {
          zonaEjecucion.textContent = "";
          zonaEjecucion.append(nodo);
        }).catch((fallo) => {
          zonaEjecucion.textContent = "";
          zonaEjecucion.append(el("div", fallo.message, "resultado"));
        });

        // ── Línea de tiempo y coste ──
        const acordeonLinea = acordeon("Línea de tiempo y coste");
        cont.append(acordeonLinea.caja);
        const zonaLinea = el("div");
        zonaLinea.append(el("div", "Leyendo la contabilidad del cliente…", "vacio"));
        acordeonLinea.cuerpo.append(zonaLinea);
        void pintarLineaDeTiempo(id).then((nodo) => {
          if (nodo === null) return;
          zonaLinea.textContent = "";
          zonaLinea.append(nodo);
        });

        // Guardar el consumo vive con los datos que describe, no al final de todo:
        // es una decisión sobre el registro, y estaba a media pantalla de su tabla.
        const pieConsumo = el("div", undefined, "responsable");
        const guardarConsumo = el("button", "Guardar el consumo en el ticket");
        const avisoConsumo = el("div", undefined, "resultado");
        pieConsumo.append(guardarConsumo, avisoConsumo);
        acordeonLinea.cuerpo.append(pieConsumo);
        guardarConsumo.addEventListener("click", async () => {
          guardarConsumo.disabled = true;
          avisoConsumo.className = "resultado";
          avisoConsumo.textContent = "Guardando…";
          try {
            const r = await api("POST", `/api/tickets/${encodeURIComponent(id)}/consumo`);
            avisoConsumo.className = "resultado ok";
            avisoConsumo.textContent = `${r.entradas.join(", ")} — ${r.detalle}`;
          } catch (fallo) {
            avisoConsumo.className = "resultado error";
            avisoConsumo.textContent = fallo.message;
          } finally {
            guardarConsumo.disabled = false;
          }
        });

        // ── Registros, como tarjetas ──
        const acordeonConsumo = acordeon("Consumo de IA", `${t.usage.length}`);
        acordeonConsumo.cuerpo.append(
          tarjetasDe(t.usage, tarjetaConsumo, "El consumo no se ha registrado todavía."),
        );
        cont.append(acordeonConsumo.caja);

        const acordeonEventos = acordeon("Eventos", `${t.events.length}`);
        acordeonEventos.cuerpo.append(
          tarjetasDe(t.events.slice().reverse(), tarjetaEvento, "Sin eventos registrados."),
        );
        cont.append(acordeonEventos.caja);

        // Los puntos y los ciclos de QA son registros con forma propia, y su
        // detalle importa: van como tarjetas de datos genéricas para no inventar
        // una forma por bloque ni dejar un JSON en pantalla.
        const bloques = [
          ["Puntos", t.points],
          ["QA", t.qa],
          ["Evidencia", t.evidence],
          ["Retests", t.retests],
          ["Cierre", t.closures],
        ];
        for (const [titulo, items] of bloques) {
          const caja = acordeon(titulo, `${items.length}`);
          caja.cuerpo.append(
            tarjetasDe(items, tarjetaDato, `Sin registros en ${titulo.toLowerCase()}.`),
          );
          cont.append(caja.caja);
        }

        const release = acordeon("Release");
        release.cuerpo.append(
          (t.sections["Release"] ?? "").trim() === ""
            ? el("div", "(vacía)", "vacio")
            : seccionDeTicket(t.sections["Release"]),
        );
        cont.append(release.caja);
      }

      /** La foto no abre conversaciones: cada sesión pide su propia página al pulsar. */
      async function pintarActividadDelEjecutor(ticketId) {
        const datos = await api("GET", `/api/tickets/${encodeURIComponent(ticketId)}/executions`);
        const zona = el("div");
        if ((datos.executions ?? []).length === 0) {
          zona.append(el("div", "No hay ejecuciones declaradas para este ticket.", "vacio"));
          return zona;
        }
        for (const ejecucion of datos.executions) {
          const caja = el("div", undefined, "seccion-ticket");
          caja.append(el("strong", `Ejecución ${ejecucion.identity.executionId}`));
          caja.append(el("div", `Workflow: ${ejecucion.status.validatedStatus ?? "desconocido"} · actividad: ${ejecucion.status.liveness}`, "resultado"));
          for (const intento of ejecucion.attempts) {
            const intentoNodo = el("div", undefined, "resultado");
            intentoNodo.append(el("strong", `Intento ${intento.attemptId}`));
            for (const actividad of intento.activity) intentoNodo.append(el("div", `${actividad.state} · ${actividad.source} · ${actividad.occurredAt}`));
            for (const modelo of intento.configuredModels) intentoNodo.append(el("div", `Modelo configurado: ${modelo.model.provider}/${modelo.model.model}`));
            for (const modelo of intento.effectiveModels) intentoNodo.append(el("div", `Modelo efectivo: ${modelo.model.provider}/${modelo.model.model}`));
            for (const sesion of intento.sessions) {
              const sesionNodo = el("div", undefined, "nota");
              sesionNodo.append(el("div", `Sesión ejecutora: ${sesion.executor.adapter}/${sesion.executor.scope}/${sesion.executor.sessionId}`));
              if (sesion.capabilities !== null) sesionNodo.append(el("div", sesion.capabilities.capabilities.map((c) => `${c.capability}: ${c.available ? "disponible" : c.limitation}`).join(" · "), "resultado"));
              if (!sesion.messages.available) {
                sesionNodo.append(el("div", sesion.messages.reason, "resultado"));
              } else {
                const mensajes = el("div");
                const cargar = el("button", "Cargar mensajes visibles");
                let cursor = 0;
                cargar.addEventListener("click", async () => {
                  cargar.disabled = true;
                  try {
                    const ruta = `/api/tickets/${encodeURIComponent(ticketId)}/executions/${encodeURIComponent(ejecucion.identity.executionId)}/messages?attempt=${encodeURIComponent(intento.attemptId)}&session=${encodeURIComponent(sesion.executor.sessionId)}&after=${cursor}&limit=100`;
                    const pagina = await api("GET", ruta);
                    for (const mensaje of pagina.messages) mensajes.append(el("div", `${mensaje.role}: ${mensaje.content}`, "resultado"));
                    cursor = pagina.nextCursor;
                    cargar.textContent = pagina.messages.length === 0 ? "No hay más mensajes" : "Cargar más mensajes";
                    cargar.disabled = pagina.messages.length === 0;
                  } catch (fallo) {
                    mensajes.append(el("div", fallo.message, "error"));
                    cargar.disabled = false;
                  }
                });
                sesionNodo.append(cargar, mensajes);
              }
              intentoNodo.append(sesionNodo);
            }
            caja.append(intentoNodo);
          }
          zona.append(caja);
        }
        return zona;
      }

      // ── Línea de tiempo del ticket ────────────────────────────────────────
      //
      // Responde a una pregunta que el registro no contestaba: quién intervino,
      // con qué modelo y a qué coste. Los recibos de compuerta traen el coste
      // porque el harness evaluó y lo sabe de primera mano; el trabajo del agente
      // —explorar, escribir, corregir— no estaba en ninguna parte.
      //
      // El dato se **lee** de la contabilidad que el cliente ya escribe, no se le
      // pregunta al modelo: un agente que reporta su propio gasto puede reportar
      // de menos y no habría forma de notarlo.
      //
      // El desglose importa más de lo que parece: en el primer ticket medido, dos
      // tercios del gasto se fueron en explorar el código y no en el harness. Sin
      // esta vista, ese dinero era invisible.
      async function pintarLineaDeTiempo(id) {
        let datos;
        try {
          datos = await api("GET", `/api/timeline?ticket=${encodeURIComponent(id)}`);
        } catch {
          return null;
        }
        // Las compuertas se pintan con sesiones o sin ellas: el harness las pagó y
        // las conoce de primera mano, y que ninguna sesión se haya podido leer no
        // las borra. Esta vista las escondía cuando no había sesiones, y un ticket
        // trabajado desde un agente que el harness aún no lee quedaba sin ningún
        // dato aunque sus recibos existieran.
        const compuertas = datos.compuertas ?? [];
        const costeCompuertas = compuertas.reduce((suma, c) => suma + (c.costUsd ?? 0), 0);
        const tablaDeCompuertas = () => {
          const tablaCompuertas = el("table", undefined, "tabla-intervenciones");
          const cabCompuertas = el("tr");
          for (const titulo of ["compuerta", "resultado", "actor", "modelo", "tokens", "coste"]) {
            cabCompuertas.append(el("th", titulo));
          }
          tablaCompuertas.append(cabCompuertas);
          for (const c of compuertas) {
            const fila = el("tr");
            fila.append(
              el("td", c.gate, "id"),
              el("td", c.outcome),
              el("td", c.actor),
              el("td", c.model ?? "mecánico (sin modelo)", "id"),
              el("td", `${((c.inputTokens + c.outputTokens) / 1e3).toFixed(1)}K`, "id"),
              el("td", `$${(c.costUsd ?? 0).toFixed(6)}`, "cifra"),
            );
            tablaCompuertas.append(fila);
          }
          return tablaCompuertas;
        };

        if (datos.available !== true) {
          const aviso = el(
            "div",
            `Sin datos de consumo: ${datos.reason ?? "no se encontró la contabilidad del cliente."}`,
            "nota",
          );
          if (compuertas.length === 0) return aviso;
          const zonaSinDatos = el("div");
          zonaSinDatos.append(
            aviso,
            el(
              "div",
              `Las compuertas sí constan: ${compuertas.length} ($${costeCompuertas.toFixed(6)}).`,
              "resultado",
            ),
            tablaDeCompuertas(),
          );
          return zonaSinDatos;
        }

        const zona = el("div");
        const sesiones = datos.sessions ?? [];

        // Sin sesiones que hayan trabajado **este** ticket, se dice. Antes esta
        // vista mostraba el gasto de todas las sesiones del proyecto como si
        // fueran del ticket: un número con aspecto de dato y sin relación con lo
        // que se estaba mirando.
        if (sesiones.length === 0) {
          zona.append(
            el(
              "div",
              "Ninguna sesión trabajó este ticket: ni de opencode, ni de codex, ni de " +
                "Claude Code, ni de Hermes. El consumo se registra buscando el identificador " +
                "en lo que hizo cada sesión, así que un ticket que se trabajó a mano no " +
                "tiene nada que mostrar.",
              "vacio",
            ),
          );
          if (compuertas.length > 0) {
            zona.append(
              el(
                "div",
                `El harness sí evaluó ${compuertas.length} compuerta(s) ($${costeCompuertas.toFixed(6)}):`,
                "resultado",
              ),
              tablaDeCompuertas(),
            );
          }
          return zona;
        }

        const conCoste = sesiones.filter((s) => s.costUsd !== null);
        const coste = conCoste.reduce((suma, s) => suma + s.costUsd, 0);
        const tokens = sesiones.reduce(
          (suma, s) =>
            suma + s.inputTokens + s.outputTokens + s.reasoningTokens + s.cacheReadTokens,
          0,
        );

        // Las llamadas al registro de las sesiones de Claude Code, que no entran en
        // `datos.intervenciones` (esa lista es por llamada y con coste, y Claude
        // Code no guarda el coste de cada mensaje). Una compartida no se suma: su
        // trabajo es de varios tickets.
        const llamadasDeClaude = sesiones
          .filter((s) => s.source === "claude" && s.reparto === undefined)
          .reduce((suma, s) => suma + s.intervenciones, 0);

        const resumen = el("div", undefined, "meta");
        resumen.append(
          el("span", `coste $${coste.toFixed(6)}`, "etiqueta"),
          el("span", `${(tokens / 1e6).toFixed(1)}M tokens`, "etiqueta"),
          el("span", `${sesiones.length} sesión(es)`, "etiqueta"),
          el(
            "span",
            `${datos.intervenciones.length + llamadasDeClaude} intervención(es) sobre el registro`,
            "etiqueta",
          ),
        );
        // El costo de decidir también es costo del ticket: las compuertas que el
        // harness pagó van al total, separadas para que se lea qué fue decisión
        // y qué fue trabajo.
        if (compuertas.length > 0) {
          resumen.append(
            el(
              "span",
              `${compuertas.length} compuerta(s) ($${costeCompuertas.toFixed(6)})`,
              "etiqueta",
            ),
          );
        }
        if (datos.sesionesSinCoste > 0) {
          // Un proveedor por suscripción no tiene precio por token: se dice, en
          // vez de sumar un cero que se leería como «gratis».
          resumen.append(
            el("span", `${datos.sesionesSinCoste} sin coste por token (suscripción)`, "etiqueta"),
          );
        }
        if (datos.sesionesCompartidas > 0) {
          // Una sesión que sirvió a varios tickets tiene un solo gasto y ningún
          // modo de repartirlo: se muestra marcada y **no** entra en el total, en
          // vez de adjudicarle a este ticket lo que costaron los otros.
          resumen.append(
            el(
              "span",
              `${datos.sesionesCompartidas} compartida(s) entre varios tickets ` +
                // Un coste cero que no existe —suscripción— se leería como «gratis».
                ((datos.costeCompartidoUsd ?? 0) > 0
                  ? `($${datos.costeCompartidoUsd.toFixed(4)} sin sumar)`
                  : "(sin sumar)"),
              "etiqueta",
            ),
          );
        }
        zona.append(
          el(
            "div",
            "Harness es lo que costó llamar a las herramientas del registro; " +
              "exploración es leer, buscar y editar. El desglose solo cuenta las sesiones " +
              "con coste por token, y deja fuera las compartidas: su gasto es de todos los " +
              "tickets que atendieron.",
            "resultado",
          ),
          resumen,
        );

        // Las sesiones, con su origen: una de codex o de Hermes se entiende sabiendo
        // de dónde viene, porque su coste puede no existir y sus tokens sí.
        const tablaSesiones = el("table", undefined, "tabla-intervenciones");
        const cabSesiones = el("tr");
        for (const titulo of ["origen", "agente", "modelo", "tokens", "coste", "intervenciones"]) {
          cabSesiones.append(el("th", titulo));
        }
        tablaSesiones.append(cabSesiones);
        for (const sesion of sesiones) {
          const fila = el("tr");
          const suyos = sesion.inputTokens + sesion.outputTokens + sesion.reasoningTokens;
          const cuantos = (sesion.reparto ?? []).length;
          fila.append(
            el("td", sesion.source, "id"),
            el(
              "td",
              cuantos === 0
                ? sesion.agent || "—"
                : `${sesion.agent || "—"} · compartida entre ${cuantos} tickets`,
            ),
            el(
              "td",
              sesion.model === ""
                ? "—"
                : // Una sesión con subagentes o con un cambio de modelo trae varios:
                  // `model` es el que más produjo y el resto se cuenta.
                  (sesion.modelos ?? []).length > 1
                  ? `${sesion.model} (+${sesion.modelos.length - 1})`
                  : sesion.model,
              "id",
            ),
            el("td", `${(suyos / 1e6).toFixed(2)}M`, "id"),
            el(
              "td",
              sesion.costUsd === null
                ? "suscripción"
                : `$${sesion.costUsd.toFixed(4)}${cuantos === 0 ? "" : " · no se suma"}`,
              "id",
            ),
            el("td", String(sesion.intervenciones), "id"),
          );
          tablaSesiones.append(fila);
        }
        zona.append(tablaSesiones);

        // El desglose de compuertas del ticket: qué evaluó el harness, con qué
        // modelo, qué costó decidir. Va antes del corte de intervenciones porque
        // un ticket sin llamadas al registro —el caso del cron— igual pagó sus
        // compuertas, y ocultarlas sería mostrar un costo de menos.
        if (compuertas.length > 0) {
          zona.append(tablaDeCompuertas());
        }

        if (datos.intervenciones.length === 0) {
          // Claude Code cuenta sus llamadas al registro una por una, pero no guarda
          // el coste de cada mensaje: sus llamadas están en la fila de la sesión y
          // no en esta lista. Decir que «ninguna llamó» sería falso.
          zona.append(
            el(
              "div",
              llamadasDeClaude > 0
