       * por rol y lo usado por fase— queda entero en «Avanzado», plegado.
       */
      async function vistaModelos() {
        const raiz = $("contenido");
        raiz.textContent = "";
        const cont = document.createElement("details");
        cont.className = "avanzado-modelos";
        cont.append(el("summary", "Avanzado: perfiles, preset base y archivo de configuración"));
        // El control de cada rol en «Modelo por rol», para «Cambiar solo esta fase» (D-005).
        const controlDeRol = new Map();

        const datos = await api("GET", "/api/routing");
        const guardado = datos.routing;

        // El modelo de cada rol tal como está ahora: se compara con lo que el
        // usuario elija para saber si hay algo que guardar.
        const eleccion = {};
        for (const rol of guardado.roles) {
          eleccion[rol.role] = {
            provider: rol.provider,
            model: rol.model,
            effort: rol.effort,
            source: rol.source,
          };
        }

        // Los proveedores con su lista de modelos. Se pide aquí y no al cambiar de
        // proveedor para que el desplegable de la izquierda sea instantáneo.
        const catalogo = await catalogoDeModelos();
        let preset = guardado.preset === "" ? "balanced" : guardado.preset;
        let textoPrevio = guardado.text;

        const accionesDePerfil = await seccionPerfiles(cont, catalogo);
        await seccionModeloPorFase(cont);
        await pintarResumenDeModelos(raiz, {
          routing: guardado,
          avanzado: cont,
          perfiles: accionesDePerfil ?? null,
          controlDeRol,
        });
        raiz.append(cont);
        abrirNuevoPerfilPedido(cont, accionesDePerfil);
        cont.append(el("h2", "Preset"));

        const presets = el("div", undefined, "presets");
        const explicacion = el("div", undefined, "resultado");
        const botonesPreset = new Map();
        for (const p of guardado.presets) {
          const boton = el("button", p.id);
          boton.addEventListener("click", () => {
            preset = p.id;
            // Elegir un preset no reescribe lo que el proyecto ya decidió: los
            // overrides se quedan, y la columna de origen lo dirá.
            for (const boton of botonesPreset.values())
              boton.setAttribute("aria-pressed", "false");
            boton.setAttribute("aria-pressed", "true");
            explicacion.textContent = p.description;
            void refrescar();
          });
          botonesPreset.set(p.id, boton);
          presets.append(boton);
        }
        for (const [id, boton] of botonesPreset) {
          boton.setAttribute("aria-pressed", String(id === preset));
          if (id === preset) {
            explicacion.textContent =
              guardado.presets.find((p) => p.id === id)?.description ?? "";
          }
        }
        cont.append(presets, explicacion);

        // De dónde sale cada lista. Se dice porque un desplegable corto sin
        // explicación parece un fallo, y lo que pasa es que ese proveedor no
        // publica sus modelos o no respondió.
        const sinLista = [...catalogo.values()].filter((e) => e.models === null);
        const conError = sinLista.filter((e) => e.error !== null);
        const origenCatalogo = el(
          "div",
          `${catalogo.size} proveedor(es) configurado(s). ` +
            (sinLista.length === 0
              ? "Todos publican su lista de modelos."
              : `Sin lista: ${sinLista.map((e) => e.provider.name).join(", ")}. En esos, el modelo se escribe.`) +
            (conError.length === 0
              ? ""
              : ` No respondieron: ${conError.map((e) => `${e.provider.name} (${e.error})`).join("; ")}.`),
          "resultado",
        );
        cont.append(origenCatalogo);

        cont.append(el("h2", "Modelo por rol"));

        const tabla = el("table", undefined, "roles");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Rol", "Modelo", "Esfuerzo", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        /**
         * El selector de un rol: proveedor y modelo.
         *
         * Antes era una sola lista con el catálogo de OpenRouter, así que elegir
         * un modelo de otro proveedor era imposible desde la pantalla: había que
         * editar el YAML. Y el proveedor viaja con el modelo porque los dos son la
         * decisión —el mismo identificador puede existir en dos y no ser el
         * mismo modelo—.
         */
        const modeloSelect = (rol) =>
          selectorDeModelo({
            provider: eleccion[rol.role].provider,
            model: eleccion[rol.role].model,
            catalog: catalogo,
            onProvider: (id) => {
              eleccion[rol.role].provider = id;
              explicitos.add(rol.role);
              void refrescar();
            },
            onModel: (id) => {
              eleccion[rol.role].model = id;
              explicitos.add(rol.role);
              void refrescar();
            },
          });

        const esfuerzoSelect = (rol) => {
          const sel = document.createElement("select");
          for (const valor of ["auto", "low", "medium", "high"]) {
            sel.append(new Option(valor, valor));
          }
          sel.value = eleccion[rol.role].effort;
          sel.addEventListener("change", () => {
            eleccion[rol.role].effort = sel.value;
            explicitos.add(rol.role);
            void refrescar();
          });
          return sel;
        };

        for (const rol of guardado.roles) {
          const tr = el("tr");

          const celdaRol = el("td");
          celdaRol.append(
            el("div", rol.role, "rol"),
            el("div", rol.description, "descripcion"),
          );
          if (rol.consumer === null) {
            celdaRol.append(
              el("div", "declarado: todavía no lo ejecuta nada", "sin-consumidor"),
            );
          }
          tr.append(celdaRol);

          const celdaModelo = el("td");
          const control = modeloSelect(rol);
          controlDeRol.set(rol.role, control);
          celdaModelo.append(control);
          tr.append(celdaModelo);

          const celdaEsfuerzo = el("td");
          celdaEsfuerzo.append(esfuerzoSelect(rol));
          tr.append(celdaEsfuerzo);

          const ORIGEN = {
            proyecto: "definido en este proyecto",
            perfil: rol.perfil ? `perfil ${rol.perfil.id} (${rol.perfil.alcance})` : "perfil",
            preset: `del preset ${preset}`,
            sistema: "valor del sistema",
            "sin-asignar": "sin asignar",
          };
          const celdaOrigen = el("td");
          celdaOrigen.append(el("span", ORIGEN[rol.source] ?? rol.source, "resultado"));
          if (rol.consumer !== null) {
            celdaOrigen.append(el("div", rol.consumer, "sin-consumidor"));
          }
          tr.append(celdaOrigen);

          tr.append(el("td"));
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);

        // El aviso que evita perder la reproducibilidad sin enterarse.
        const avisoJev = el("div", undefined, "aviso-jev");
        cont.append(avisoJev);

        cont.append(el("h2", "Diferencias antes de guardar"));
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;
        const salida = el("div", "resultado");
        // La barra va **fija** al pie de la vista: el botón estaba al final de la
        // tabla y no se encontraba. Dice cuántos cambios hay pendientes, que es lo
        // que hacía falta saber sin bajar.
        const cuenta = el("div", "", "cuenta");
        const guardar = el("button", "Guardar el routing", "principal");
        guardar.disabled = true;
        const acciones = el("div", undefined, "barra-guardado");
        acciones.append(cuenta, salida, guardar);
        cont.append(diff, error, acciones);

        /**
         * Los roles que se escriben en el archivo.
         *
         * Solo los explícitos: los que ya estaban definidos en el proyecto y los
         * que el usuario acaba de tocar. Escribir los trece haría creer que el
         * proyecto decidió sobre los trece, y cambiar el preset dejaría de tener
         * efecto sin que nadie entendiera por qué.
         */
        const explicitos = new Set(
          guardado.roles.filter((rol) => rol.source === "proyecto").map((rol) => rol.role),
        );
        const rolesDelFormulario = () => {
          const roles = {};
          for (const rol of guardado.roles) {
            if (!explicitos.has(rol.role)) continue;
            roles[rol.role] = {
              provider: eleccion[rol.role].provider,
              model: eleccion[rol.role].model,
              effort: eleccion[rol.role].effort,
            };
          }
          return roles;
        };

        const refrescar = async () => {
          try {
            const previsualizacion = await api("POST", "/api/routing/preview", {
              preset,
              roles: rolesDelFormulario(),
            });
            const estado = previsualizacion.routing;

            error.hidden = estado.ok;
            error.textContent = estado.ok ? "" : estado.error;

            diff.textContent = "";
            const cambios = estado.diff.filter((linea) => linea.kind !== "same");
            if (cambios.length === 0) {
              diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
            } else {
              for (const linea of estado.diff) {
                diff.append(
                  el(
                    "div",
                    `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                    linea.kind,
                  ),
                );
              }
            }

            const evaluador = estado.roles.find((r) => r.role === "gate-evaluator");
            // El aviso lleva números medidos, no adjetivos: en el mismo gate de
            // 14 proposiciones, Jev tarda 0,8 s y cuesta $0,000158; un modelo de
            // chat con razonamiento por defecto **no termina** en 90 s.
            avisoJev.textContent =
              evaluador !== undefined && evaluador.probabilistic
                ? "El evaluador de gates usa Jev: emite probabilidades calibradas y el código compara contra umbrales. Medido en un gate de 14 proposiciones: 0,8 s y $0,000158."
                : "⚠ El evaluador de gates está configurado con un modelo de chat. El gate sigue funcionando, pero pasa a ser un juez que interpreta texto: pierde la calibración y dos ejecuciones del mismo ticket pueden no coincidir. Medido: 36 s y $0,00073 con esfuerzo bajo, y más de 90 s —el límite— con el razonamiento por defecto. Si eliges esta vía, pon el esfuerzo en «low».";

            guardar.disabled = !estado.ok || cambios.length === 0;
            guardar.textContent =
              cambios.length === 0 ? "Sin cambios" : "Guardar el routing";
            // La cuenta de la barra fija: es lo que dice si hay algo pendiente sin
            // tener que bajar hasta el botón.
            cuenta.className = cambios.length === 0 ? "cuenta" : "cuenta pendiente";
            cuenta.textContent =
              cambios.length === 0
                ? "Todo guardado."
                : `${cambios.length} cambio(s) sin guardar.`;
            textoPrevio = previsualizacion.text;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          try {
            const r = await api("PUT", "/api/routing", { text: textoPrevio });
            if (r.routing.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
              guardado.text = r.text;
              // Se recarga la vista: los orígenes cambian de "preset" a
              // "proyecto", y esa es justamente la información que importa.
              await vistaModelos();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.routing.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        });

        await refrescar();
      }

      // ── Perfiles de modelos ──────────────────────────────────────────────

      /**
       * La sección «Perfiles» de la vista Modelos: ver, crear a partir de otro,
       * editar y elegir. Solo habla con `/api/perfiles`; el archivo lo escribe el
       * servidor con las mismas funciones que usa el código.
       */
      /**
       * «Modelo por fase»: el modelo efectivo de cada fase del agente con su origen, y al lado
       * el último que el cliente reportó haber usado (R-PERF-005, R-PERF-006).
       *
       * Solo lee `GET /api/modelos/fases`. El costo es el que reportó el cliente
       * (equivalente de suscripción, no factura) y se rotula así.
       */
      async function seccionModeloPorFase(cont) {
        cont.append(el("h2", "Modelo por fase"));
        const barra = el("div", undefined, "selector-ejecutor");
        const salida = el("div", undefined, "resultado");
        const zona = el("div");
        cont.append(barra, salida, zona);

        const ORIGEN_FASE = {
          proyecto: "definido en el proyecto",
          preset: "del preset",
          sistema: "valor del sistema",
          "sin-asignar": "sin asignar",
        };
        const origenLegible = (origen) =>
          origen.source === "perfil" && origen.perfil
            ? `perfil ${origen.perfil.id} (${origen.perfil.alcance})`
            : (ORIGEN_FASE[origen.source] ?? origen.source);

        const pintar = (datos) => {
          zona.textContent = "";
          if (datos.aviso) {
            salida.className = "resultado error";
            salida.textContent = datos.aviso;
          } else {
            salida.className = "resultado";
            salida.textContent = "";
          }
          if (!datos.fases || datos.fases.length === 0) return;
          const tabla = el("table", undefined, "modelo-fase");
          const cabecera = el("tr");
          for (const columna of ["Fase", "Efectivo", "Origen", "Usado"]) cabecera.append(el("th", columna));
          const thead = el("thead");
          thead.append(cabecera);
          const tbody = el("tbody");
          for (const fase of datos.fases) {
            const u = fase.usado;
            const tr = el("tr", undefined, u !== null && u.coincide === false ? "discrepancia" : undefined);
            const celda = (rotulo) => {
              const td = el("td");
              td.setAttribute("data-rotulo", rotulo);
              return td;
            };

            const cFase = celda("Fase");
            cFase.append(el("div", fase.fase, "fase-nombre"));
            const cEfectivo = celda("Efectivo");
            cEfectivo.append(
              el("div", fase.model === "" ? "(sin modelo)" : fase.model, "modelo-id"),
              el("div", `${fase.provider === "" ? "(sin proveedor)" : fase.provider} · esfuerzo ${fase.effort}`, "detalle-fase"),
            );
            const cOrigen = celda("Origen");
            cOrigen.append(el("span", origenLegible(fase.origen), "resultado"));

            const cUsado = celda("Usado");
            if (u === null) {
              cUsado.append(el("span", "sin registros", "resultado"));
            } else {
              cUsado.append(
                el("div", u.modeloUsado === null ? "sin reportar" : u.modeloUsado, "modelo-id"),
                el("div", `ticket ${u.ticketId} · ${u.ejecutor}`, "detalle-fase"),
                el(
                  "div",
                  u.costeUsd === null ? "costo: sin reportar" : `costo: US$ ${u.costeUsd.toFixed(4)} (reportado por el cliente)`,
                  "detalle-fase",
                ),
              );
              if (u.coincide === false) {
                cUsado.append(el("div", `discrepancia: se declaró ${u.modelo}`, "marca-discrepancia"));
              }
            }
            tr.append(cFase, cEfectivo, cOrigen, cUsado);
            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          zona.append(tabla);
        };

        const cargar = async (ejecutor) => {
          salida.className = "resultado";
          salida.textContent = "Cargando el modelo por fase…";
          try {
            pintar(
              await api(
                "GET",
                ejecutor === "" ? "/api/modelos/fases" : "/api/modelos/fases?ejecutor=" + encodeURIComponent(ejecutor),
              ),
            );
          } catch (fallo) {
            zona.textContent = "";
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        let datos;
        try {
          datos = await api("GET", "/api/modelos/fases");
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
          return;
        }
        const etiquetaEjecutor = el("label", "Ejecutor");
        const selector = document.createElement("select");
        selector.append(new Option("sin ejecutor", ""));
        for (const id of datos.ejecutores ?? []) selector.append(new Option(id, id));
        selector.addEventListener("change", () => void cargar(selector.value));
        barra.append(etiquetaEjecutor, selector);
        pintar(datos);
      }

      async function seccionPerfiles(cont, catalogo) {
        cont.append(el("h2", "Perfiles"));
        const salida = el("div", undefined, "resultado");
        const lista = el("div", undefined, "perfiles");
        const editor = el("div", undefined, "editor-perfil");
        cont.append(lista, salida, editor);

        salida.textContent = "Cargando perfiles…";
        let datos;
        try {
          datos = await api("GET", "/api/perfiles");
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
          return;
        }
        salida.textContent = "";
        if (datos.error) {
          salida.className = "resultado error";
          salida.textContent = datos.error;
        }
        const { perfiles, seleccion, ejecutores, roles } = datos;

        const recargar = async () => {
          await vistaModelos();
        };

        const elegir = async (perfil, ejecutor) => {
          salida.className = "resultado";
          salida.textContent = "Guardando la elección…";
          try {
            const cuerpo = ejecutor === undefined ? { perfil } : { perfil, ejecutor };
            const r = await api("PUT", "/api/perfiles/seleccion", cuerpo);
            if (r.written) {
              await recargar();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.errores.join(" ");
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        const abrirEditor = (base, editando) => {
          editor.textContent = "";
          const copia = {};
          for (const rol of roles) {
            const ruta = base.roles[rol.id];
            copia[rol.id] = {
              provider: ruta?.provider ?? "",
              model: ruta?.model ?? "",
              effort: ruta?.effort ?? "auto",
            };
          }
          editor.append(
            el("h3", editando ? `Editar ${base.id}` : `Nuevo perfil a partir de ${base.id}`),
          );

          const etiquetaId = el("label", "Id del perfil");
          const campoId = document.createElement("input");
          campoId.type = "text";
          campoId.value = editando ? base.id : "";
          campoId.disabled = editando;
          campoId.spellcheck = false;
          campoId.placeholder = "mi-perfil";
          etiquetaId.append(campoId);

          const etiquetaDesc = el("label", "Descripción");
          const campoDesc = document.createElement("input");
          campoDesc.type = "text";
          campoDesc.value = editando ? base.description : "";
          etiquetaDesc.append(campoDesc);
          editor.append(etiquetaId, etiquetaDesc);

          for (const rol of roles) {
            const fila = el("div", undefined, "fila-rol-perfil");
            fila.append(el("div", rol.id, "rol"));
            fila.append(
              selectorDeModelo({
                provider: copia[rol.id].provider,
                model: copia[rol.id].model,
                catalog: catalogo,
                onProvider: (id) => {
                  copia[rol.id].provider = id;
                },
                onModel: (id) => {
                  copia[rol.id].model = id;
                },
              }),
            );
            const etiquetaEsfuerzo = el("label", `Esfuerzo de ${rol.id}`);
            const esfuerzo = document.createElement("select");
            for (const valor of ["auto", "low", "medium", "high"]) {
              esfuerzo.append(new Option(valor, valor));
            }
            esfuerzo.value = copia[rol.id].effort;
            esfuerzo.addEventListener("change", () => {
              copia[rol.id].effort = esfuerzo.value;
            });
            etiquetaEsfuerzo.append(esfuerzo);
            fila.append(etiquetaEsfuerzo);
            editor.append(fila);
          }

          const guardarPerfil = el("button", "Guardar el perfil");
          const cancelar = el("button", "Cancelar");
          const resultado = el("div", undefined, "resultado");
          cancelar.addEventListener("click", () => {
            editor.textContent = "";
          });
          guardarPerfil.addEventListener("click", async () => {
            guardarPerfil.disabled = true;
            resultado.className = "resultado";
            resultado.textContent = "Guardando…";
            try {
              const cuerpo = {
                id: campoId.value.trim(),
                description: campoDesc.value.trim(),
                roles: copia,
              };
              if (!editando) cuerpo.base = base.id;
              const r = await api("PUT", "/api/perfiles", cuerpo);
              if (r.written) {
                await recargar();
                return;
              }
              // Cada línea tal como llega: dice el rol y el modelo que no existe.
              resultado.className = "resultado error";
              resultado.textContent = "";
              for (const linea of r.errores) resultado.append(el("div", linea));
            } catch (fallo) {
              resultado.className = "resultado error";
              resultado.textContent = fallo.message;
            } finally {
              guardarPerfil.disabled = false;
            }
          });
          editor.append(guardarPerfil, cancelar, resultado);
        };

        for (const perfil of perfiles) {
          const delProyecto = perfil.origen === "proyecto";
          const fila = el("div", undefined, "fila-perfil");
          fila.append(
            el("strong", perfil.id),
            el("span", delProyecto ? "del proyecto" : "incorporado", "origen-perfil"),
            el("span", perfil.description, "descripcion"),
          );
          if (seleccion.proyecto === perfil.id) {
            fila.append(el("span", "elegido para el proyecto", "marca-perfil"));
          }
          for (const ejecutor of ejecutores) {
            if (seleccion.ejecutores[ejecutor] === perfil.id) {
              fila.append(el("span", `elegido para ${ejecutor}`, "marca-perfil"));
            }
          }
          const crear = el("button", "Crear a partir de este");
          crear.addEventListener("click", () => abrirEditor(perfil, false));
          fila.append(crear);
          if (delProyecto) {
            const editar = el("button", "Editar");
            editar.addEventListener("click", () => abrirEditor(perfil, true));
            fila.append(editar);
          }
          lista.append(fila);
        }

        const selectorDeEleccion = (titulo, actual, ejecutor) => {
          const etiqueta = el("label", titulo);
          const sel = document.createElement("select");
          sel.append(new Option(ejecutor === undefined ? "sin perfil" : "sin perfil propio", ""));
          for (const perfil of perfiles) sel.append(new Option(perfil.id, perfil.id));
          sel.value = actual ?? "";
          sel.addEventListener("change", () => {
            void elegir(sel.value === "" ? null : sel.value, ejecutor);
          });
          etiqueta.append(sel);
          if (ejecutor === undefined) selectorDelProyecto = sel;
          return etiqueta;
        };
        let selectorDelProyecto = null;
        const elecciones = el("div", undefined, "elecciones-perfil");
        elecciones.append(selectorDeEleccion("Perfil del proyecto", seleccion.proyecto, undefined));
        for (const ejecutor of ejecutores) {
          elecciones.append(
            selectorDeEleccion(`Perfil de ${ejecutor}`, seleccion.ejecutores[ejecutor], ejecutor),
          );
        }
        cont.insertBefore(elecciones, salida);
        // Lo que usa el bloque del perfil activo: sus datos, el editor («Duplicar y
        // editar») y el selector al que lleva «Cambiar de perfil» (D-002).
        return { datos, abrirEditor, selectorDelProyecto };
      }

      // ── Modelos: perfil activo, aviso de cliente y roles agrupados ───────

      const NOMBRE_DE_CLIENTE = {
        claude: "Claude Code",
        codex: "Codex",
        opencode: "OpenCode",
        hermes: "Hermes",
      };
      const ESFUERZO_LEGIBLE = { auto: "auto", low: "bajo", medium: "medio", high: "alto" };
      const CLAVE_CLIENTE_MODELOS = "valmen-cliente-modelos";
      const FASES_DE_MODELOS = [
        ["agent-analysis", "Análisis"],
        ["agent-plan", "Plan"],
        ["agent-implementation", "Implementación"],
        ["agent-verification", "Verificación"],
      ];
      const ROLES_DE_COORDINACION = [
        ["orchestrator", "Orquestador", "reparte tickets entre agentes"],
        ["architect", "Arquitecto", "parte una feature en tickets"],
        ["ui-specs", "Especificación de UI", "describe pantallas antes del código"],
      ];
      const ROLES_DE_COMPUERTAS = [
        ["gate-evaluator", "Evaluador de compuertas"],
        ["verifier", "Verificador"],
        ["gate-judge", "Juez de respaldo"],
        ["producer", "Productor"],
        ["reviewer", "Revisor"],
        ["escalation", "Escalada"],
      ];

      /** La marca de origen de un modelo: el proyecto gana al perfil, y el perfil al preset (D-003). */
      function marcaDeOrigen(source) {
        const [texto, tono] =
          source === "proyecto"
            ? ["cambiado aquí", "aqui"]
            : source === "perfil"
              ? ["del perfil", "perfil"]
              : source === "sin-asignar"
                ? ["sin asignar", "base"]
                : ["preset base", "base"];
        return el("span", texto, `marca-origen ${tono}`);
      }

      /**
       * Lo que se mira antes de editar: el perfil activo (R-AJU-001), el aviso de cliente
       * (R-AJU-003) y los roles agrupados con su origen (R-AJU-002). Lee lo mismo que la
       * pantalla ya pedía; solo «Volver al perfil» escribe, y tras confirmar las diferencias.
       */
      async function pintarResumenDeModelos(raiz, { routing, avanzado, perfiles, controlDeRol }) {
        const abrirAvanzado = () => {
          avanzado.open = true;
        };
        const datosPerfiles = perfiles?.datos ?? null;
        const seleccion = datosPerfiles?.seleccion ?? { proyecto: null, ejecutores: {} };
        const activo =
          (datosPerfiles?.perfiles ?? []).find((p) => p.id === seleccion.proyecto) ?? null;

        const cabecera = el("div", undefined, "cabecera-modelos");
        const migas = el("div", "Ajustes ", "migas-modelos");
        migas.append(el("span", "· Modelos"));
        cabecera.append(
          migas,
          el("h2", "Qué modelo hace cada trabajo", "titulo-modelos"),
          el(
            "p",
            "Un perfil reparte los modelos de una vez. Si cambias uno aquí, ese trabajo deja de seguir al perfil hasta que lo devuelvas.",
            "bajada-modelos",
          ),
        );

        const tarjeta = el("section", undefined, "perfil-activo-modelos");
        tarjeta.setAttribute("aria-label", "Perfil activo");
        const cuerpo = el("div", undefined, "perfil-cuerpo");
        cuerpo.append(el("div", "Perfil activo", "rotulo-perfil"));
        if (activo === null) {
          cuerpo.append(
            el("div", "sin perfil", "perfil-id"),
            el("div", "Ningún perfil elegido: cada modelo sale del proyecto o del preset base.", "perfil-desc"),
          );
        } else {
          const marcas = el("div", undefined, "marcas-eleccion");
          marcas.append(el("span", "elegido para el proyecto", "marca-eleccion"));
          for (const [ejecutor, id] of Object.entries(seleccion.ejecutores ?? {})) {
            if (id !== activo.id) continue;
            marcas.append(
              el("span", `elegido para ${NOMBRE_DE_CLIENTE[ejecutor] ?? ejecutor}`, "marca-eleccion"),
            );
          }
          cuerpo.append(
            el("div", activo.id, "perfil-id"),
            el("div", activo.origen === "proyecto" ? "del proyecto" : "incorporado", "perfil-origen"),
            el("div", activo.description, "perfil-desc"),
            marcas,
          );
        }
        const botones = el("div", undefined, "perfil-acciones");
        const cambiar = el("button", "Cambiar de perfil", "boton-perfil");
        cambiar.type = "button";
        // Lleva a la pantalla que muestra qué cambia antes de aplicar (R-AJU-004, D-009 de
        // FEATURE-WEB-AJUSTES-CAMBIAR-PERFIL-20261014; reemplaza el atajo provisional D-002).
        cambiar.addEventListener("click", () => {
          location.hash = "#/modelos/perfil";
        });
        botones.append(cambiar);
        if (activo !== null && perfiles?.abrirEditor) {
          const duplicar = el("button", "Duplicar y editar");
          duplicar.type = "button";
          duplicar.addEventListener("click", () => {
            abrirAvanzado();
            perfiles.abrirEditor(activo, false);
          });
          botones.append(duplicar);
        }
        const fila = el("div", undefined, "perfil-fila");
        fila.append(cuerpo, botones);
        const precedencia = el("div", undefined, "precedencia");
        precedencia.append(
          el("span", "Cómo se decide cada modelo:"),
          marcaDeOrigen("proyecto"),
          el("span", "gana a", "gana"),
          marcaDeOrigen("perfil"),
          el("span", "gana a", "gana"),
          marcaDeOrigen("preset"),
        );
        tarjeta.append(fila, precedencia);

        const aviso = el("div", undefined, "aviso-cliente");
        aviso.setAttribute("role", "status");
        await pintarAvisoDeCliente(aviso, datosPerfiles?.ejecutores ?? [], seleccion);

        const rutas = new Map((routing.roles ?? []).map((r) => [r.role, r]));
        raiz.append(
          cabecera,
          tarjeta,
          aviso,
          grupoDelAgente(rutas, activo?.roles ?? {}, routing, abrirAvanzado, controlDeRol),
          tablaDeRoles(
            ["Coordinación", "reparte el trabajo y diseña antes de programar", "t-coordinacion"],
            ROLES_DE_COORDINACION,
            "Origen",
            rutas,
          ),
          tablaDeRoles(
            ["Compuertas y revisión", "el modelo responde, el código decide", "t-compuertas"],
            ROLES_DE_COMPUERTAS,
            "Proveedor",
            rutas,
          ),
        );
      }

      /**
       * El aviso de R-AJU-003. El cliente de una sesión no se guarda en ningún archivo (es
       * `--cliente`), así que «Declarar» lo declara para esta pantalla y dice la corrección
       * de la sesión, sin escribir nada (D-001).
       */
      async function pintarAvisoDeCliente(aviso, ejecutores, seleccion, elegido = null) {
        let recordado = elegido;
        try {
          recordado ??= localStorage.getItem(CLAVE_CLIENTE_MODELOS);
        } catch {
          recordado = null;
        }
        let declarado = null;
        try {
          const fases = await api(
            "GET",
            recordado ? "/api/modelos/fases?ejecutor=" + encodeURIComponent(recordado) : "/api/modelos/fases",
          );
          declarado = fases?.ejecutor ?? null;
        } catch (fallo) {
          if (fallo === RESPUESTA_DE_PROYECTO_OBSOLETA) throw fallo;
        }
        aviso.textContent = "";
        const repintar = () => void pintarAvisoDeCliente(aviso, ejecutores, seleccion);

        if (declarado !== null) {
          aviso.className = "aviso-cliente declarado";
          const linea = el("div", undefined, "texto-aviso");
          linea.append(
            el("b", `Cliente declarado en esta pantalla: ${NOMBRE_DE_CLIENTE[declarado] ?? declarado}.`),
            el("span", " En la sesión: "),
            el("code", `valmen resume --cliente ${declarado}`),
          );
          const otro = el("button", "Cambiar", "enlace-modelos");
          otro.type = "button";
          otro.addEventListener("click", () => {
            try {
              localStorage.removeItem(CLAVE_CLIENTE_MODELOS);
            } catch {
              // Sin almacenamiento el aviso vuelve igual: no había nada que borrar.
            }
            repintar();
          });
          aviso.append(linea, otro);
          return;
        }

        aviso.className = "aviso-cliente sin-cliente";
        const icono = el("span", "!", "icono-aviso");
        icono.setAttribute("aria-hidden", "true");
        const texto = el("div", undefined, "texto-aviso");
        texto.append(
          el("b", "Las fases del agente usan el modelo de la sesión."),
          el("span", " Falta declarar con qué cliente trabajas; sin eso, el perfil no se aplica."),
        );
        const etiqueta = el("label", "Cliente");
        const selector = document.createElement("select");
        for (const id of ejecutores) selector.append(new Option(NOMBRE_DE_CLIENTE[id] ?? id, id));
        selector.value =
          ejecutores.find((id) => seleccion.ejecutores?.[id]) ??
          (ejecutores.includes("claude") ? "claude" : (ejecutores[0] ?? ""));
        etiqueta.append(selector);
        const declarar = el("button", "Declarar", "boton-declarar");
        declarar.type = "button";
        declarar.addEventListener("click", async () => {
          if (selector.value === "") return;
          try {
            localStorage.setItem(CLAVE_CLIENTE_MODELOS, selector.value);
          } catch {
            // Sin almacenamiento se declara igual para lo que queda de la visita.
          }
          await pintarAvisoDeCliente(aviso, ejecutores, seleccion, selector.value);
        });
        aviso.append(icono, texto, etiqueta, declarar);
      }

      /** Un grupo de roles con su título y su bajada, como en el boceto. */
      function seccionDeGrupo([titulo, bajada, id]) {
        const seccion = el("section", undefined, "grupo-roles");
        seccion.setAttribute("aria-labelledby", id);
        const cabecera = el("div", undefined, "cabecera-grupo");
        const h2 = el("h2", titulo);
        h2.id = id;
        cabecera.append(h2, el("span", bajada, "bajada-grupo"));
        seccion.append(cabecera);
        return seccion;
      }

      /**
       * «El agente»: una tarjeta por fase. Una fase definida en el proyecto dice qué daría el
       * perfil y ofrece volver a él; las demás llevan a su rol en «Modelo por rol» (D-005).
       */
      function grupoDelAgente(rutas, rolesDelPerfil, routing, abrirAvanzado, controlDeRol) {
        const seccion = seccionDeGrupo(["El agente", "las cuatro fases de un ticket", "t-agente"]);
        const rejilla = el("div", undefined, "tarjetas-fase");
        FASES_DE_MODELOS.forEach(([rol, nombre], i) => {
          const ruta = rutas.get(rol);
          const cambiada = ruta?.source === "proyecto";
          const tarjeta = el("article", undefined, cambiada ? "tarjeta-fase cambiada" : "tarjeta-fase");
          const cabecera = el("div", undefined, "cab-fase");
          cabecera.append(el("span", nombre, "nombre-fase"), el("span", String(i + 1), "numero-fase"));
          const marcas = el("div", undefined, "marcas-fase");
          marcas.append(
            el("span", `esfuerzo ${ESFUERZO_LEGIBLE[ruta?.effort] ?? ruta?.effort ?? "auto"}`, "marca-esfuerzo"),
            marcaDeOrigen(ruta?.source ?? "sin-asignar"),
          );
          tarjeta.append(cabecera, el("div", ruta?.model || "(sin modelo)", "modelo-tarjeta"), marcas);
          const pie = el("div", undefined, "pie-fase");
          const delPerfil = rolesDelPerfil[rol];
          if (cambiada && delPerfil) {
            const diria = el("div", undefined, "perfil-diria");
            if (delPerfil.model === ruta.model) diria.append(el("span", "El perfil diría lo mismo"));
            else diria.append(el("span", "El perfil diría "), el("span", delPerfil.model, "modelo-diria"));
            const zona = el("div", undefined, "volver-perfil");
            const volver = el("button", "Volver al perfil", "enlace-modelos");
            volver.type = "button";
            volver.addEventListener("click", () => void previsualizarVolver(rol, routing, zona));
            pie.append(volver);
            tarjeta.append(diria, pie, zona);
          } else {
            const solo = el("button", "Cambiar solo esta fase", "enlace-modelos");
            solo.type = "button";
            solo.addEventListener("click", () => {
              abrirAvanzado();
              controlDeRol.get(rol)?.querySelector?.("select, input")?.focus();
            });
            pie.append(solo);
            tarjeta.append(pie);
          }
          rejilla.append(tarjeta);
        });
        seccion.append(rejilla);
        return seccion;
      }

      /**
       * «Volver al perfil»: quita la fase de `.valmen/routing.yaml`. Los roles que se escriben
       * son los que el archivo ya declara bajo `roles:` menos esa fase (D-004), y el archivo
       * solo se escribe al confirmar las diferencias.
       */
      async function previsualizarVolver(rol, routing, zona, alTerminar = vistaModelos) {
        zona.textContent = "";
        const declarados = new Set(
          [...String(routing.text ?? "").matchAll(/^ {2}([a-z][a-z0-9-]*):/gm)].map((m) => m[1]),
        );
        const roles = {};
        for (const ruta of routing.roles ?? []) {
          if (ruta.role === rol || !declarados.has(ruta.role)) continue;
          roles[ruta.role] = { provider: ruta.provider, model: ruta.model, effort: ruta.effort };
        }
        let previa;
        try {
          previa = await api("POST", "/api/routing/preview", {
            preset: routing.preset === "" ? "balanced" : routing.preset,
            roles,
          });
        } catch (fallo) {
          zona.append(el("div", fallo.message, "resultado error"));
          return;
        }
        if (!previa?.routing?.ok) {
          zona.append(el("div", previa?.routing?.error || "No se pudo preparar el cambio.", "resultado error"));
          return;
        }
        const diff = el("div", undefined, "diff");
        for (const linea of previa.routing.diff ?? []) {
          if (linea.kind === "same") continue;
          diff.append(el("div", `${linea.kind === "add" ? "+" : "-"} ${linea.text}`, linea.kind));
        }
        const confirmar = el("button", "Confirmar", "principal");
        const cancelar = el("button", "Cancelar");
        const resultado = el("div", undefined, "resultado");
        cancelar.addEventListener("click", () => {
          zona.textContent = "";
        });
        confirmar.addEventListener("click", async () => {
          confirmar.disabled = true;
          try {
            const r = await api("PUT", "/api/routing", { text: previa.text });
            if (r.routing?.written) {
              await alTerminar();
              return;
            }
            resultado.className = "resultado error";
            resultado.textContent = r.routing?.error || "No se guardó.";
          } catch (fallo) {
            resultado.className = "resultado error";
            resultado.textContent = fallo.message;
          }
          confirmar.disabled = false;
        });
        const acciones = el("div", undefined, "acciones-volver");
        acciones.append(confirmar, cancelar);
        zona.append(el("div", "Diferencias en .valmen/routing.yaml:", "nota-volver"), diff, acciones, resultado);
      }

      /** Una tabla de roles: trabajo, modelo, esfuerzo y la columna final (origen o proveedor). */
      function tablaDeRoles(cabeceraDeGrupo, filas, columnaFinal, rutas) {
        const seccion = seccionDeGrupo(cabeceraDeGrupo);
        const tabla = el("div", undefined, "tabla-roles");
        const cabecera = el("div", undefined, "fila-rol cabecera");
        for (const columna of ["Trabajo", "Modelo", "Esfuerzo", columnaFinal]) cabecera.append(el("span", columna));
        tabla.append(cabecera);
        for (const [rol, nombre, detalle] of filas) {
          const ruta = rutas.get(rol);
          const fila = el("div", undefined, "fila-rol");
          const trabajo = el("div", undefined, "celda-trabajo");
          trabajo.append(el("b", nombre, "trabajo"));
          if (detalle) trabajo.append(el("span", detalle, "detalle-trabajo"));
          const modelo = el("div", ruta?.model || "(sin modelo)", "celda-modelo");
          modelo.setAttribute("data-rotulo", "Modelo");
          const esfuerzo = el("div", ESFUERZO_LEGIBLE[ruta?.effort] ?? ruta?.effort ?? "auto", "celda-esfuerzo");
          esfuerzo.setAttribute("data-rotulo", "Esfuerzo");
          const final = el("div", undefined, "celda-final");
          final.setAttribute("data-rotulo", columnaFinal);
          final.append(
            columnaFinal === "Origen"
              ? marcaDeOrigen(ruta?.source ?? "sin-asignar")
              : el("span", ruta?.provider || "(sin proveedor)", "proveedor-rol"),
          );
          fila.append(trabajo, modelo, esfuerzo, final);
          tabla.append(fila);
        }
        seccion.append(tabla);
        return seccion;
      }

      // ── Modelos › Cambiar de perfil (R-AJU-004) ──────────────────────────

      /** Los siete trabajos que reparte un perfil, en el orden del boceto. */
      const TRABAJOS_DE_PERFIL = [...FASES_DE_MODELOS, ...ROLES_DE_COORDINACION.map(([rol, nombre]) => [rol, nombre])];
      const ESTADO_DE_PROVEEDOR = { cli: "detectado", environment: "configurado", "credentials-file": "configurado" };
      const CLAVE_NUEVO_PERFIL = "valmen-nuevo-perfil-desde";

      /** La elección a medias: sobrevive al refresco en vivo y se olvida al navegar o aplicar (D-007). */
      let eleccionDeCambioDePerfil = null;

      const textoDeRuta = (ruta) =>
        ruta ? `${ruta.model || "(sin modelo)"} · ${ESFUERZO_LEGIBLE[ruta.effort] ?? ruta.effort ?? "auto"}` : "(sin asignar)";
      const mismaRuta = (a, b) =>
        (a?.provider ?? "") === (b?.provider ?? "") &&
        (a?.model ?? "") === (b?.model ?? "") &&
        (a?.effort ?? "") === (b?.effort ?? "");
      const unirConY = (lista) =>
        lista.length <= 1 ? (lista[0] ?? "") : `${lista.slice(0, -1).join(", ")} y ${lista[lista.length - 1]}`;

      /** El estado de un proveedor como lo dice la persona (D-006); nunca la clave. */
      function estadoDeProveedor(proveedor) {
        if (proveedor?.configured) return ESTADO_DE_PROVEEDOR[proveedor.source] ?? "configurado";
        return "sin configurar";
      }

      /**
       * «Nuevo perfil a partir del seleccionado» llega aquí desde Cambiar de perfil (D-004): abre
       * «Avanzado» con el editor de siempre, que valida contra el catálogo antes de guardar.
       */
      function abrirNuevoPerfilPedido(avanzado, acciones) {
        let id = null;
        try {
          id = sessionStorage.getItem(CLAVE_NUEVO_PERFIL);
          sessionStorage.removeItem(CLAVE_NUEVO_PERFIL);
        } catch {
          id = null;
        }
        const base = (acciones?.datos?.perfiles ?? []).find((p) => p.id === id);
        if (!base || !acciones?.abrirEditor) return;
        avanzado.open = true;
        acciones.abrirEditor(base, false);
      }

      /**
       * Cambiar de perfil (`#/modelos/perfil`, boceto assets/modelos-cambiar-perfil.html): elegir no
       * escribe nada; se ve antes qué trabajos cambian, cuáles no, qué fases del proyecto se quedan
       * y dónde se aplica. Solo «Aplicar» escribe, con `PUT /api/perfiles/seleccion`.
       */
      async function vistaCambiarPerfil(conservar = false) {
        if (!conservar) eleccionDeCambioDePerfil = null;
        const raiz = $("contenido");
        const leer = async (ruta) => {
          try {
            return (await api("GET", ruta)) ?? {};
          } catch (fallo) {
            if (fallo === RESPUESTA_DE_PROYECTO_OBSOLETA) throw fallo;
            return {};
          }
        };
        const [datosPerfiles, datosRouting, datosProveedores] = await Promise.all([
          leer("/api/perfiles"),
          leer("/api/routing"),
          leer("/api/providers"),
        ]);
        const perfiles = Array.isArray(datosPerfiles.perfiles) ? datosPerfiles.perfiles : [];
        const seleccion = datosPerfiles.seleccion ?? { proyecto: null, ejecutores: {} };
        const ejecutores = Array.isArray(datosPerfiles.ejecutores) ? datosPerfiles.ejecutores : [];
        const routing = datosRouting.routing ?? { roles: [], text: "", preset: "" };
        const resueltas = new Map((routing.roles ?? []).map((r) => [r.role, r]));
        const proveedores = new Map((datosProveedores.providers ?? []).map((p) => [p.id, p]));
        const porId = (id) => perfiles.find((p) => p.id === id) ?? null;
        // El perfil que rige hoy en el alcance elegido (D-001): el del cliente, si lo tiene.
        const vigente = (e) =>
          e.alcance === "cliente"
            ? (seleccion.ejecutores?.[e.cliente] ?? seleccion.proyecto ?? null)
            : (seleccion.proyecto ?? null);

        let e = eleccionDeCambioDePerfil;
        if (e === null || porId(e.perfil) === null) {
          e = {
            perfil: porId(seleccion.proyecto)?.id ?? perfiles[0]?.id ?? null,
            alcance: "proyecto",
            cliente: ejecutores.includes("claude") ? "claude" : (ejecutores[0] ?? ""),
          };
        }
        eleccionDeCambioDePerfil = e;

        const proveedoresDe = (perfil) => [
          ...new Set(TRABAJOS_DE_PERFIL.map(([rol]) => perfil.roles?.[rol]?.provider).filter(Boolean)),
        ];
        const nombreDeProveedor = (id) => String(proveedores.get(id)?.name ?? id).replace(/\s*\(.*\)\s*$/, "");

        const tarjetaDe = (perfil) => {
          const elegida = perfil.id === e.perfil;
          const activa = perfil.id === seleccion.proyecto;
          const tarjeta = el("button", undefined, "tarjeta-perfil");
          tarjeta.type = "button";
          tarjeta.setAttribute("aria-pressed", elegida ? "true" : "false");
          const cabecera = el("span", undefined, "cab-tarjeta-perfil");
          cabecera.append(
            el("span", perfil.id, "titulo-perfil"),
            el("span", activa ? "activo" : elegida ? "seleccionado" : "", activa ? "marca-tarjeta activo" : "marca-tarjeta"),
          );
          const lista = el("span", undefined, "proveedores-tarjeta");
          for (const id of proveedoresDe(perfil)) {
            const linea = el("span", undefined, "proveedor-tarjeta");
            if (proveedores.size === 0) {
              linea.append(document.createTextNode(id));
            } else {
              const estado = estadoDeProveedor(proveedores.get(id));
              const punto = el("span", undefined, estado === "sin configurar" ? "punto-proveedor falta" : "punto-proveedor");
              punto.setAttribute("aria-hidden", "true");
              linea.append(punto, document.createTextNode(`${id} · ${estado}`));
            }
            lista.append(linea);
          }
          tarjeta.append(
            cabecera,
            el("span", perfil.origen === "proyecto" ? "del proyecto" : "incorporado", "origen-tarjeta"),
            el("span", perfil.description ?? "", "desc-tarjeta"),
            lista,
          );
          tarjeta.addEventListener("click", () => {
            e.perfil = perfil.id;
            pintar();
          });
          return tarjeta;
        };

        const seccionDelCambio = (elegido, actual) => {
          const ahora = (rol) => (actual ? actual.roles?.[rol] : resueltas.get(rol));
          const filas = [];
          const igualesDelAgente = [];
          const compuertasIguales = [];
          for (const [rol, nombre] of TRABAJOS_DE_PERFIL) {
            if (mismaRuta(ahora(rol), elegido.roles?.[rol])) igualesDelAgente.push(nombre);
            else filas.push([rol, nombre]);
          }
          for (const [rol, nombre] of ROLES_DE_COMPUERTAS) {
            if (mismaRuta(ahora(rol), elegido.roles?.[rol])) compuertasIguales.push(rol);
            else filas.push([rol, nombre]);
          }

          const seccion = el("section", undefined, "que-cambia");
          seccion.setAttribute("aria-labelledby", "t-que-cambia");
          const titulo = el("h2", "Qué cambia con ");
          titulo.id = "t-que-cambia";
          titulo.append(el("span", elegido.id, "id-elegido"));
          const caja = el("div", undefined, "caja-cambio");
          if (filas.length > 0) {
            const tabla = el("table", undefined, "tabla-cambio");
            const thead = el("thead");
            const cabecera = el("tr");
            const paso = el("th");
            paso.setAttribute("aria-label", "pasa a");
            cabecera.append(el("th", "Trabajo"), el("th", "Ahora"), paso, el("th", "Después"));
            thead.append(cabecera);
            const tbody = el("tbody");
            for (const [rol, nombre] of filas) {
              const tr = el("tr", undefined, "fila-cambio");
              const flecha = el("td", "→", "flecha");
              flecha.setAttribute("aria-hidden", "true");
              tr.append(
                el("td", nombre, "trabajo-cambio"),
                el("td", textoDeRuta(ahora(rol)), "antes"),
                flecha,
                el("td", textoDeRuta(elegido.roles?.[rol]), "despues"),
              );
              tbody.append(tr);
            }
            tabla.append(thead, tbody);
            caja.append(tabla);
          }
          // Lo que no cambia, en una nota (D-008): las compuertas y, si los hay, los trabajos iguales.
          const notas = [];
          if (filas.length === 0) notas.push("Los dos perfiles asignan los mismos modelos: no cambia ningún trabajo.");
          if (compuertasIguales.length > 0 && filas.length > 0) {
            const donde = [];
            if (compuertasIguales.some((rol) => /jev/i.test(String(ahora(rol)?.model ?? "")))) donde.push("Jev");
            for (const id of new Set(compuertasIguales.map((rol) => ahora(rol)?.provider).filter(Boolean))) {
              donde.push(nombreDeProveedor(id));
            }
            const todas = compuertasIguales.length === ROLES_DE_COMPUERTAS.length;
            notas.push(
              compuertasIguales.length === 1
                ? `La compuerta restante no cambia: sigue en ${unirConY(donde)}.`
                : `Las ${compuertasIguales.length} compuertas y revisiones ${todas ? "" : "restantes "}no cambian: siguen en ${unirConY(donde)}.`,
            );
          }
          if (igualesDelAgente.length > 0 && filas.length > 0) notas.push(`Tampoco cambia: ${unirConY(igualesDelAgente)}.`);
          if (notas.length > 0) caja.append(el("div", notas.join(" "), "nota-cambio"));
          seccion.append(titulo, caja);

          // Las fases definidas en el proyecto ganan al perfil y se quedan (D-008, D-005).
          for (const [rol, nombre] of filas) {
            if (resueltas.get(rol)?.source !== "proyecto") continue;
            const aviso = el("div", undefined, "aviso-fase");
            const punto = el("span", undefined, "punto-aviso");
            punto.setAttribute("aria-hidden", "true");
            const femenino = /ción\b|^Especificación/.test(nombre);
            const texto = el("span", undefined, "texto-aviso-fase");
            texto.append(
              el("b", nombre),
              document.createTextNode(` está ${femenino ? "cambiada" : "cambiado"} en este proyecto y se queda como está. `),
            );
            const zona = el("div", undefined, "volver-perfil");
            const seguir = el("button", "Que también siga al perfil", "enlace-modelos");
            seguir.type = "button";
            seguir.addEventListener(
              "click",
              () => void previsualizarVolver(rol, routing, zona, () => vistaCambiarPerfil(true)),
            );
            texto.append(seguir);
            aviso.append(punto, texto, zona);
            seccion.append(aviso);
          }
          return seccion;
        };

        const seccionDelAlcance = () => {
          const campo = el("fieldset", undefined, "alcance-perfil");
          campo.append(el("legend", "Dónde se aplica"));
          const opcion = (valor, titulo, detalle, recomendado) => {
            const etiqueta = el("label", undefined, "opcion-alcance");
            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "alcance-perfil";
            radio.value = valor;
            radio.checked = e.alcance === valor;
            radio.addEventListener("change", () => {
              if (!radio.checked) return;
              e.alcance = valor;
              pintar();
            });
            const texto = el("span");
            texto.append(el("b", titulo));
            if (recomendado) texto.append(document.createTextNode(" "), el("span", "recomendado", "recomendado"));
            texto.append(el("span", detalle, "detalle-alcance"));
            etiqueta.append(radio, texto);
            return etiqueta;
          };
          campo.append(
            opcion("proyecto", "Todo el proyecto", "Cualquier cliente con el que trabajes usa este perfil.", true),
            opcion(
              "cliente",
              "Solo cuando trabajo con un cliente",
              "El proyecto sigue con su perfil; este se usa solo con el cliente elegido.",
              false,
            ),
          );
          // Sin cliente no hay `ejecutor` que mandar: el selector aparece con esa opción (D-003).
          if (e.alcance === "cliente") {
            const etiqueta = el("label", "Cliente", "cliente-alcance");
            const selector = document.createElement("select");
            for (const id of ejecutores) selector.append(new Option(NOMBRE_DE_CLIENTE[id] ?? id, id));
            selector.value = e.cliente;
            selector.addEventListener("change", () => {
              e.cliente = selector.value;
              pintar();
            });
            etiqueta.append(selector);
            campo.append(etiqueta);
          }
          return campo;
        };

        const accionesDe = (elegido) => {
          const acciones = el("div", undefined, "acciones-perfil");
          const aplicar = el("button", `Aplicar ${elegido.id}`, "aplicar-perfil");
          aplicar.type = "button";
          const cancelar = el("a", "Cancelar", "cancelar-perfil");
          cancelar.href = "#/modelos";
          const resultado = el("div", undefined, "resultado");
          aplicar.addEventListener("click", async () => {
            aplicar.disabled = true;
            resultado.className = "resultado";
            resultado.textContent = "Aplicando el perfil…";
            try {
              const cuerpo =
                e.alcance === "cliente" && e.cliente !== ""
                  ? { perfil: elegido.id, ejecutor: e.cliente }
                  : { perfil: elegido.id };
              const r = await api("PUT", "/api/perfiles/seleccion", cuerpo);
              if (r?.written) {
                eleccionDeCambioDePerfil = null;
                void marcarPerfilActivo();
                location.hash = "#/modelos";
                return;
              }
              resultado.className = "resultado error";
              resultado.textContent = (r?.errores ?? ["No se aplicó el perfil."]).join(" ");
            } catch (fallo) {
              if (fallo === RESPUESTA_DE_PROYECTO_OBSOLETA) return;
              resultado.className = "resultado error";
              resultado.textContent = fallo.message;
            }
            aplicar.disabled = false;
          });
          acciones.append(aplicar, cancelar, resultado);
          return acciones;
        };

        const pintar = () => {
          raiz.textContent = "";
          const pagina = el("div", undefined, "cambiar-perfil");
          const miga = el("nav", undefined, "miga-perfil");
          miga.setAttribute("aria-label", "Ruta");
          const volver = el("a", "Ajustes · Modelos");
          volver.href = "#/modelos";
          const separador = el("span", " › ");
          separador.setAttribute("aria-hidden", "true");
          miga.append(volver, separador, document.createTextNode("Cambiar de perfil"));
          pagina.append(miga, el("h1", "Elige un perfil y mira qué cambia antes de aplicarlo", "titulo-cambiar-perfil"));

          const rejilla = el("div", undefined, "rejilla-perfiles");
          for (const perfil of perfiles) rejilla.append(tarjetaDe(perfil));
          const nueva = el("button", undefined, "tarjeta-nueva");
          nueva.type = "button";
          const mas = el("span", "+", "mas");
          mas.setAttribute("aria-hidden", "true");
          nueva.append(mas, el("span", "Nuevo perfil", "nueva-titulo"), el("span", "a partir del seleccionado"));
          nueva.addEventListener("click", () => {
            try {
              if (e.perfil !== null) sessionStorage.setItem(CLAVE_NUEVO_PERFIL, e.perfil);
            } catch {
              // Sin almacenamiento, Modelos abre sin el editor: se crea desde «Avanzado».
            }
            location.hash = "#/modelos";
          });
          rejilla.append(nueva);
          pagina.append(rejilla);

          const elegido = porId(e.perfil);
          if (elegido === null) {
            pagina.append(el("div", "No hay perfiles para elegir.", "ya-activo"));
          } else if (elegido.id === vigente(e)) {
            pagina.append(el("div", "Este ya es el perfil activo. Elige otro para ver qué cambiaría.", "ya-activo"));
            // Con un cliente elegido, el alcance sigue a la vista para poder volver al proyecto.
            if (e.alcance === "cliente") pagina.append(seccionDelAlcance());
          } else {
            pagina.append(seccionDelCambio(elegido, porId(vigente(e))), seccionDelAlcance(), accionesDe(elegido));
          }
          raiz.append(pagina);
        };
        pintar();
      }

      // ── Vista: configuración ──────────────────────────────────────────────

      // Ajustes › Proyecto por bloques (FEATURE-WEB-AJUSTES-PROYECTO-20261014, boceto
      // assets/proyecto.html). Los interruptores de Avisos y los controles de Pruebas no
      // guardan: cambian el texto del editor y la persona guarda tras ver las diferencias.

      /** Un interruptor accesible: `role="switch"` con su estado en `aria-checked`. */
      function interruptorDeProyecto(etiqueta, encendido) {
        const boton = el("button", undefined, "interruptor");
        boton.type = "button";
        boton.setAttribute("role", "switch");
        boton.setAttribute("aria-checked", encendido ? "true" : "false");
        boton.setAttribute("aria-label", etiqueta);
        boton.append(el("span", undefined, "perilla"));
        return boton;
      }

      /** El bloque de nivel superior de `clave:` en el texto: [inicio, fin) o `null`. */
      function bloqueDeClave(lineas, clave) {
        const inicio = lineas.findIndex((l) => new RegExp(`^${clave}:\\s*(#.*)?$`).test(l));
        if (inicio < 0) return null;
        let fin = inicio + 1;
        while (fin < lineas.length && (lineas[fin].trim() === "" || /^\s/.test(lineas[fin]))) fin += 1;
        while (fin > inicio + 1 && lineas[fin - 1].trim() === "") fin -= 1;
        return [inicio, fin];
      }

      /** Con `hermes.enabled` y, si se da, `hermes.notify.gate` cambiados; el resto del texto intacto. */
      function conClaveHermes(texto, { enabled, gate }) {
        const lineas = texto.split("\n");
        const rango = bloqueDeClave(lineas, "hermes");
        if (rango === null) {
          if (!enabled) return texto;
          const base = texto === "" || texto.endsWith("\n") ? texto : `${texto}\n`;
          return `${base}\nhermes:\n  enabled: true\n  notify:\n    gate: ${gate}\n`;
        }
        const [inicio, fin] = rango;
        const bloque = lineas.slice(inicio + 1, fin);
        const iEnabled = bloque.findIndex((l) => /^  enabled:/.test(l));
        if (iEnabled >= 0) bloque[iEnabled] = `  enabled: ${enabled}`;
        else bloque.unshift(`  enabled: ${enabled}`);
        if (gate !== undefined) {
          const iNotify = bloque.findIndex((l) => /^  notify:\s*(#.*)?$/.test(l));
          if (iNotify < 0) {
            bloque.push("  notify:", `    gate: ${gate}`);
          } else {
            let iGate = -1;
            for (let j = iNotify + 1; j < bloque.length && (/^    /.test(bloque[j]) || bloque[j].trim() === ""); j += 1) {
              if (/^    gate:/.test(bloque[j])) iGate = j;
            }
            if (iGate >= 0) bloque[iGate] = `    gate: ${gate}`;
            else bloque.splice(iNotify + 1, 0, `    gate: ${gate}`);
          }
        }
        return [...lineas.slice(0, inicio + 1), ...bloque, ...lineas.slice(fin)].join("\n");
      }

      /** Con `comando` al final de `test-commands` (la lista se crea si no existe). */
      function conComandoDePrueba(texto, comando) {
        const lineas = texto.split("\n");
        const vacia = lineas.findIndex((l) => /^test-commands:\s*\[\]\s*$/.test(l));
        if (vacia >= 0) lineas[vacia] = "test-commands:";
        const rango = bloqueDeClave(lineas, "test-commands");
        if (rango === null) {
          const unido = lineas.join("\n");
          const base = unido === "" || unido.endsWith("\n") ? unido : `${unido}\n`;
          return `${base}test-commands:\n  - ${comando}\n`;
        }
        const [inicio, fin] = rango;
        let ultimo = inicio;
        for (let j = inicio + 1; j < fin; j += 1) if (/^\s*- /.test(lineas[j])) ultimo = j;
        const sangria = ultimo > inicio ? (lineas[ultimo].match(/^\s*/)?.[0] ?? "  ") : "  ";
        lineas.splice(ultimo + 1, 0, `${sangria}- ${comando}`);
        return lineas.join("\n");
      }

      /** Con `test-timeout` en `segundos` (la línea se agrega si no existe). */
      function conTiempoMaximo(texto, segundos) {
        if (/^test-timeout:.*$/m.test(texto)) return texto.replace(/^test-timeout:.*$/m, `test-timeout: ${segundos}`);
        const base = texto === "" || texto.endsWith("\n") ? texto : `${texto}\n`;
        return `${base}test-timeout: ${segundos}\n`;
      }

      /**
       * «Quién aprueba el análisis y el plan»: la aprobación por defecto con su interruptor.
       * Apagarla pide nombre y frase literal (`conRevocacion`) antes de revocar; encender una
       * revocada no crea nada: lleva al formulario de autorización explícita (D-002, D-003).
       */
      function bloqueAprobacionPorDefecto(seccion, { abrirExplicitas }) {
        const pintarBloque = async () => {
          seccion.textContent = "";
          let porDefecto = null;
          try {
            porDefecto = (await enviar("GET", "/api/approval/authorizations"))?.porDefecto ?? null;
          } catch {
            porDefecto = null;
          }
          const sinDato = porDefecto === null || porDefecto.estado === "desconocida";
          const activa = !sinDato && porDefecto.estado === "vigente";
          const cabeza = el("div", undefined, "cabeza-bloque");
          const texto = el("div", undefined, "texto-bloque");
          const titulo = el("h2", "Quién aprueba el análisis y el plan", "titulo-bloque");
          titulo.id = "titulo-aprobacion-proyecto";
          seccion.setAttribute("aria-labelledby", titulo.id);
          texto.append(
            titulo,
            el(
              "div",
              sinDato
                ? "No se pudo leer si la aprobación por defecto está activa; el interruptor queda quieto hasta saberlo."
                : activa
                  ? "Aprobación por defecto: si la compuerta da APPROVE, el agente avanza sin esperarte; si da REVIEW, decide el revisor."
                  : "Apagada: cada análisis y cada plan esperan tu aprobación.",
              "detalle-bloque",
            ),
          );
          const estado = el("span", sinDato ? "sin dato" : activa ? "activa" : "apagada", `estado-bloque${activa ? " encendido" : ""}`);
          const interruptor = interruptorDeProyecto("Aprobación por defecto", activa);
          interruptor.disabled = sinDato;
          cabeza.append(texto, estado, interruptor);

          const tarjetas = el("ul", undefined, "proyecto-tarjetas");
          for (const [clase, quien, que] of [
            ["decide", "El agente decide", "lo validable, y lo deja en el ticket con criterio, fuente y cómo revertirlo."],
            ["ratificas", "Tú ratificas", "todo junto antes de cerrar. Lo que no ratifiques vuelve como cambios pedidos."],
            ["siempre", "Siempre tuyo", "SECURITY, riesgo alto, migraciones, despliegue, un BLOCK que persiste y lo irreversible."],
          ]) {
            const tarjeta = el("li", undefined, clase);
            tarjeta.append(el("b", quien), el("span", que));
            tarjetas.append(tarjeta);
          }
          const candado = el("div", undefined, "candado-proyecto");
          candado.append(
            el("span", undefined, "icono-candado"),
            el("span", "Crear o ampliar esta autorización lo hace una persona; el agente no puede."),
          );
          const mensaje = el("div", "", "qa-mensaje nota-bloque");
          seccion.append(cabeza, tarjetas, candado, mensaje);

          if (activa) {
            conRevocacion(seccion, interruptor, mensaje, async (actor, frase) => {
              await enviar("POST", "/api/approval/authorizations/revoke", {
                id: "POLITICA-POR-DEFECTO",
                actor,
                quote: frase,
              });
              await pintarBloque();
            });
          } else if (!sinDato) {
            interruptor.addEventListener("click", () => {
              mensaje.className = "qa-mensaje nota-bloque";
              mensaje.textContent =
                "La aprobación por defecto revocada no vuelve sola: una persona crea una autorización nueva con su nombre y su frase literal, aquí abajo.";
              abrirExplicitas();
            });
          }
        };
        return pintarBloque;
      }

      /** «Avisos»: un interruptor por canal según `hermes:` (D-005); pulsar prepara el cambio. */
      function bloqueAvisos(seccion, { prepararCambio }) {
        const cuerpo = el("div", undefined, "filas-aviso");
        const nota = el("div", "", "nota-bloque");
        seccion.append(
          el("h2", "Avisos", "titulo-bloque"),
          cuerpo,
          el(
            "div",
            "Los avisos de la jornada (arranque y pruebas tuyas) salen por el gateway con --to telegram y no dependen de estos interruptores.",
            "nota-bloque",
          ),
          nota,
        );
        const canales = [
          { id: "telegram", nombre: "Telegram", detalle: "compuertas en REVIEW y presupuesto" },
          { id: "slack", nombre: "Slack", detalle: "canal secundario" },
        ];
        return (resumen) => {
          const avisos = resumen?.avisos ?? { enabled: false, gate: "", budget: "" };
          cuerpo.textContent = "";
          for (const canal of canales) {
            const encendido =
              avisos.enabled &&
              [avisos.gate, avisos.budget].some((d) => String(d).split(":")[0].trim() === canal.id);
            const fila = el("div", undefined, "fila-aviso");
            const texto = el("div", undefined, "texto-aviso");
            texto.append(el("b", canal.nombre), el("div", canal.detalle, "detalle-bloque"));
            const interruptor = interruptorDeProyecto(`Avisos por ${canal.nombre}`, encendido);
            interruptor.addEventListener("click", () =>
              prepararCambio(
                (actual) =>
                  encendido ? conClaveHermes(actual, { enabled: false }) : conClaveHermes(actual, { enabled: true, gate: canal.id }),
                nota,
              ),
            );
            fila.append(texto, interruptor);
            cuerpo.append(fila);
          }
        };
      }

      /** «Pruebas»: los comandos permitidos y el tiempo máximo (D-006); cambiar prepara el texto. */
      function bloquePruebas(seccion, { prepararCambio }) {
        const cuerpo = el("div", undefined, "cuerpo-pruebas");
        const nota = el("div", "", "nota-bloque");
        seccion.append(el("h2", "Pruebas", "titulo-bloque"), cuerpo, nota);
        return (resumen) => {
          const comandos = resumen?.testCommands ?? [];
          cuerpo.textContent = "";
          const chips = el("div", undefined, "chips-prueba");
          for (const comando of comandos) chips.append(el("span", comando, "chip-prueba"));
          const anadir = el("button", "+ añadir", "anadir-prueba");
          anadir.type = "button";
          chips.append(anadir);
          const formulario = el("div", undefined, "anadir-prueba-campo");
          formulario.hidden = true;
          const campo = el("input");
          campo.type = "text";
          campo.placeholder = "npx eslint";
          campo.setAttribute("aria-label", "Comando que se añade");
          const confirmar = el("button", "Añadir");
          confirmar.type = "button";
          formulario.append(campo, confirmar);
          anadir.addEventListener("click", () => {
            formulario.hidden = !formulario.hidden;
            if (!formulario.hidden) campo.focus();
          });
          confirmar.addEventListener("click", async () => {
            const comando = campo.value.trim();
            if (comando === "") {
              nota.textContent = "Escribe el comando que se añade.";
              return;
            }
            if (comandos.includes(comando)) {
              nota.textContent = `«${comando}» ya está en la lista.`;
              return;
            }
            await prepararCambio((actual) => conComandoDePrueba(actual, comando), nota);
          });
          const rotulo = el("label", "Tiempo máximo", "tiempo-prueba");
          const tiempo = el("input");
          tiempo.type = "number";
          tiempo.min = "1";
          tiempo.value = resumen?.testTimeout === null || resumen?.testTimeout === undefined ? "" : String(resumen.testTimeout);
          tiempo.addEventListener("change", async () => {
            const segundos = Number(tiempo.value);
            if (!Number.isInteger(segundos) || segundos <= 0) {
              nota.textContent = "El tiempo máximo es un número entero de segundos mayor que cero.";
              return;
            }
            await prepararCambio((actual) => conTiempoMaximo(actual, segundos), nota);
          });
          rotulo.append(tiempo, el("span", "s"));
          cuerpo.append(
            el("div", "Comandos que las compuertas pueden correr", "detalle-bloque"),
            chips,
            formulario,
            rotulo,
          );
        };
      }

      /**
       * El editor de `.valmen/config.yaml`.
       *
       * El texto es la fuente y se edita en crudo, así que los comentarios
       * sobreviven. Antes de guardar se muestra qué entendió el harness y qué
       * archivos generados quedan desactualizados: sin eso, el usuario tendría
       * que saber que `AGENTS.md` se genera, que es justo el conocimiento que la
       * app debe evitar exigir.
       */
      async function vistaConfiguracion() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/config");
        const estadoInicial = datos.config;

        // Los bloques del boceto, en su orden; el editor de siempre queda en «Avanzado».
        const cabecera = el("div", undefined, "cabecera-proyecto");
        const migas = el("div", "Ajustes ", "migas-proyecto");
        migas.append(el("span", "· Proyecto"));
        cabecera.append(
          migas,
          el(
            "h2",
            `Cómo trabaja el harness en ${estadoInicial.summary?.name ?? "este proyecto"}`,
            "titulo-proyecto",
          ),
          el(
            "p",
            "Antes «Configuración». Cada cambio muestra las diferencias del archivo antes de guardarse.",
            "bajada-proyecto",
          ),
        );
        const seccionAprobacion = el("section", undefined, "bloque-proyecto bloque-aprobacion");
        const seccionQa = el("section", undefined, "bloque-proyecto bloque-qa");
        const rejilla = el("div", undefined, "proyecto-rejilla");
        const seccionAvisos = el("section", undefined, "bloque-proyecto bloque-avisos");
        const seccionPruebas = el("section", undefined, "bloque-proyecto bloque-pruebas");
        rejilla.append(seccionAvisos, seccionPruebas);
        const avanzadoConfig = el("details", undefined, "avanzado-proyecto");
        avanzadoConfig.append(el("summary", "Avanzado: editar config.yaml a mano"));
        const avanzadoAutorizaciones = el("details", undefined, "avanzado-autorizaciones");
        avanzadoAutorizaciones.append(el("summary", "Avanzado: autorizaciones explícitas de aprobación"));
        cont.append(cabecera, seccionAprobacion, seccionQa, rejilla, avanzadoConfig, avanzadoAutorizaciones);

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Se guarda solo si el harness puede leerlo. "),
          el(
            "span",
            "El formato admite un subconjunto de YAML: escalares, listas de bloque y mapas por indentación. Si algo no encaja, se dice aquí y el archivo no se toca.",
          ),
        );
        avanzadoConfig.append(nota, el("h2", "Configuración del proyecto"));
        avanzadoConfig.append(el("div", estadoInicial.path, "ruta"));

        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.spellcheck = false;
        editor.value = estadoInicial.text;
        editor.setAttribute("aria-label", "Contenido de .valmen/config.yaml");

        // El panel de interpretación: lo que el harness entendió del texto.
        const interpretacion = el("div", undefined, "interpretacion");
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;

        const guardar = el("button", "Guardar los cambios", "principal");
        guardar.disabled = true;
        const regenerar = el("button", "Regenerar");
        regenerar.hidden = true;
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        let ultimo = null;

        const campo = (rotulo, valor) => {
          const caja = el("div", undefined, "campo");
          caja.append(el("div", rotulo, "rotulo"), el("div", valor, "valor"));
          return caja;
        };

        // Las políticas autónomas: lo que el harness entendió de cada una. «Editar» no
        // abre otro formato: lleva el editor de texto a la línea de la clave, o le agrega
        // un ejemplo comentado, y guardar sigue siendo el camino que valida y muestra el
        // efecto. Insertar el ejemplo no activa nada: está comentado.
        const politicas = el("div", undefined, "politicas");
        const editarPolitica = (politica) => {
          const lineas = editor.value.split("\n");
          const indice = lineas.findIndex((linea) => linea.startsWith(`${politica.clave}:`));
          if (indice >= 0) {
            if (typeof editor.setSelectionRange === "function") {
              const inicio = lineas.slice(0, indice).join("\n").length + (indice > 0 ? 1 : 0);
              editor.focus();
              editor.setSelectionRange(inicio, inicio + lineas[indice].length);
              editor.scrollTop = indice * 18;
            }
            return;
          }
          if (politica.ejemplo === null) return;
          const separador = editor.value === "" || editor.value.endsWith("\n") ? "" : "\n";
          editor.value = `${editor.value}${separador}\n${politica.ejemplo}\n`;
          analizar();
        };
        const pintarPoliticas = (resumen) => {
          politicas.textContent = "";
          politicas.hidden = resumen === null;
          if (resumen === null) return;
          politicas.append(
            el(
              "div",
              "Solo actúan las que dicen «activa»; una apagada no hace nada hasta que escribas su clave en el archivo.",
              "nota-politica",
            ),
          );
          for (const politica of resumen.policies ?? []) {
            const tarjeta = el("div", undefined, `politica ${politica.estado}`);
            const titulo = el("div", undefined, "titulo-politica");
            titulo.append(
              el("span", politica.titulo),
              el("span", politica.estado, "estado-politica"),
            );
            tarjeta.append(titulo);
            if (politica.error !== null) {
              tarjeta.append(el("div", politica.error, "error-politica"));
            } else {
              const lista = el("ul");
              for (const linea of politica.resumen) lista.append(el("li", linea));
              tarjeta.append(lista);
            }
            if (politica.soloLectura) {
              tarjeta.append(
                el(
                  "div",
                  "Solo lectura: los umbrales los firma una persona en el archivo, con su nombre y el motivo.",
                  "nota-politica",
                ),
              );
            } else {
              const existe = resumen.keys.includes(politica.clave);
              const editar = el(
                "button",
                existe ? "Editar en el archivo" : "Agregar un ejemplo",
              );
              editar.addEventListener("click", () => editarPolitica(politica));
              tarjeta.append(editar);
              if (!existe) {
                tarjeta.append(
                  el(
                    "div",
                    "El ejemplo se agrega comentado: no activa nada hasta que lo descomentes y guardes.",
                    "nota-politica",
                  ),
                );
              }
            }
            politicas.append(tarjeta);
          }
        };

        // Avisos y Pruebas no guardan: preparan el texto, abren «Avanzado» con las diferencias
        // y la persona guarda (D-005, D-006). Se declara como función para que los bloques la
        // reciban antes de que exista `pintar`.
