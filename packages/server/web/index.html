<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ValmenHarness · Mission Control</title>
    <style>
      /* Sin framework y sin paso de compilación: esta interfaz tiene que
         arrancar con el servidor, y su objetivo es mostrar el estado, no
         impresionar. Una hoja propia se lee entera en un minuto. */
      :root {
        --fondo: #0f1115;
        --panel: #171a21;
        --panel-alto: #1e222b;
        --borde: #2a2f3a;
        --texto: #e6e8ee;
        --tenue: #8b93a7;
        --acento: #4f8cff;
        --ok: #3fb950;
        --alerta: #d29922;
        --error: #f85149;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--fondo); color: var(--texto);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header {
        display: flex; align-items: baseline; gap: 20px;
        padding: 0 24px; border-bottom: 1px solid var(--borde); background: var(--panel);
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; padding: 16px 0; }
      nav { display: flex; gap: 4px; }
      nav a {
        color: var(--tenue); text-decoration: none; font-size: 14px;
        padding: 16px 12px; border-bottom: 2px solid transparent;
      }
      nav a:hover { color: var(--texto); }
      nav a[aria-current="page"] { color: var(--texto); border-bottom-color: var(--acento); }
      header .raiz { margin-left: auto; color: var(--tenue); font-family: var(--mono); font-size: 12px; }
      main { max-width: 1180px; margin: 0 auto; padding: 24px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--tenue); margin: 0 0 12px; }
      h3 { font-size: 15px; margin: 0; }
      .nota {
        background: var(--panel-alto); border: 1px solid var(--borde); border-left: 3px solid var(--acento);
        border-radius: 6px; padding: 12px 16px; margin-bottom: 24px; color: var(--tenue); font-size: 13px;
      }
      .nota strong { color: var(--texto); }
      .nota.alerta { border-left-color: var(--alerta); }
      table { width: 100%; border-collapse: collapse; }
      th {
        text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--tenue); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--borde);
        white-space: nowrap;
      }
      td { padding: 10px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
      tbody tr:hover td { background: var(--panel); }
      .nombre { font-weight: 500; }
      .id { font-family: var(--mono); font-size: 11px; color: var(--tenue); }
      .punto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; }
      .punto.ok { background: var(--ok); }
      .punto.no { background: var(--tenue); opacity: 0.4; }
      .punto.error { background: var(--error); }
      .punto.alerta { background: var(--alerta); }
      .acciones { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
      button {
        font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 5px; cursor: pointer;
        background: var(--panel-alto); color: var(--texto); border: 1px solid var(--borde);
      }
      button:hover:not(:disabled) { border-color: var(--acento); }
      button:disabled { opacity: 0.45; cursor: default; }
      button.principal { background: var(--acento); border-color: var(--acento); color: #fff; }
      button.peligro:hover:not(:disabled) { border-color: var(--error); color: var(--error); }
      button.enlace { background: none; border: none; color: var(--acento); padding: 0; }
      .resultado { font-size: 12px; color: var(--tenue); }
      .resultado.ok { color: var(--ok); }
      .resultado.error { color: var(--error); }
      .etiqueta {
        display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
        border: 1px solid var(--borde); color: var(--tenue); font-family: var(--mono);
      }
      .etiqueta.critico { border-color: var(--alerta); color: var(--alerta); }
      .etiqueta.roto { border-color: var(--error); color: var(--error); }
      .etiqueta.aprueba { border-color: var(--ok); color: var(--ok); }
      .etiqueta.bloquea { border-color: var(--error); color: var(--error); }
      .etiqueta.revisa { border-color: var(--alerta); color: var(--alerta); }
      .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
      .filtros input, .filtros select, select, input[type="text"] {
        font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 6px;
        background: var(--panel); color: var(--texto); border: 1px solid var(--borde);
      }
      .filtros input:focus, .filtros select:focus, select:focus, input:focus {
        outline: none; border-color: var(--acento);
      }
      .tarjetas { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
      .tarjeta { background: var(--panel); border: 1px solid var(--borde); border-radius: 8px; padding: 14px 16px; }
      .tarjeta .valor { font-size: 24px; font-weight: 600; }
      .tarjeta .rotulo { font-size: 12px; color: var(--tenue); }
      dialog {
        background: var(--panel); color: var(--texto); border: 1px solid var(--borde);
        border-radius: 10px; padding: 0; max-width: 520px; width: calc(100% - 32px);
      }
      dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
      .dialogo { padding: 20px 24px; }
      .dialogo h3 { margin: 0 0 4px; font-size: 16px; }
      .dialogo p { margin: 0 0 16px; color: var(--tenue); font-size: 13px; }
      label { display: block; font-size: 12px; color: var(--tenue); margin-bottom: 6px; }
      input[type="password"], input[type="text"] {
        width: 100%; font: inherit; font-family: var(--mono); font-size: 13px;
        padding: 9px 11px; border-radius: 6px; background: var(--fondo);
        color: var(--texto); border: 1px solid var(--borde);
      }
      .aviso { font-size: 12px; color: var(--tenue); margin-top: 8px; }
      .pie { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
      pre {
        background: var(--fondo); border: 1px solid var(--borde); border-radius: 6px;
        padding: 12px; overflow: auto; font-family: var(--mono); font-size: 12px;
        max-height: 60vh; white-space: pre-wrap; word-break: break-word;
      }
      .secciones { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
      .secciones button { font-size: 12px; }
      .secciones button[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); }
      .vacio { color: var(--tenue); text-align: center; padding: 40px; }

      /* ── Ticket: cabecera y gates ─────────────────────────────────────── */
      .volver { font-size: 13px; margin-bottom: 14px; display: inline-block; }
      .cabecera-ticket { margin-bottom: 22px; }
      .cabecera-ticket h2 { font-size: 20px; text-transform: none; letter-spacing: 0; color: var(--texto); margin-bottom: 6px; }
      .cabecera-ticket .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
      .ruta { font-family: var(--mono); font-size: 12px; color: var(--tenue); margin-top: 8px; }
      .gate {
        background: var(--panel); border: 1px solid var(--borde); border-radius: 8px;
        padding: 16px 18px; margin-bottom: 16px;
      }
      .gate-cabecera { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
      .gate-meta { font-size: 12px; color: var(--tenue); margin-bottom: 12px; }
      .checks { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
      .check { font-size: 12px; display: flex; gap: 8px; align-items: baseline; }
      .check .marca { font-family: var(--mono); width: 12px; }
      .check .marca.pass { color: var(--ok); }
      .check .marca.fail { color: var(--error); }
      .check .marca.warn { color: var(--alerta); }
      .check .marca.skip { color: var(--tenue); }
      .check .detalle { color: var(--tenue); }
      .gate .acciones { justify-content: flex-start; }
      .veredicto {
        display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        padding: 12px 14px; border-radius: 6px; background: var(--panel-alto);
        border: 1px solid var(--borde); margin-top: 14px;
      }
      .veredicto .salida { font-family: var(--mono); font-size: 13px; font-weight: 600; }
      .veredicto .salida.approve { color: var(--ok); }
      .veredicto .salida.block { color: var(--error); }
      .veredicto .salida.review { color: var(--alerta); }
      .veredicto .motivo { font-size: 13px; color: var(--tenue); flex: 1 1 320px; }
      .obsoleto {
        background: rgba(210, 153, 34, 0.12); border: 1px solid var(--alerta); color: var(--alerta);
        border-radius: 6px; padding: 10px 12px; font-size: 13px; margin-top: 12px;
      }
      .proposiciones { margin-top: 14px; }
      .proposiciones td { padding: 8px 10px; font-size: 13px; }
      .proposiciones .etiqueta-proposicion { font-family: var(--mono); font-size: 11px; color: var(--tenue); }
      .proposiciones .criterio-texto { font-size: 13px; margin-bottom: 2px; }
      /* La barra hace visible lo que decide: el número y los dos umbrales. */
      .barra { position: relative; width: 150px; height: 8px; border-radius: 4px; background: var(--fondo); border: 1px solid var(--borde); }
      .barra .relleno { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--tenue); }
      .barra .relleno.approve { background: var(--ok); }
      .barra .relleno.block { background: var(--error); }
      .barra .relleno.review { background: var(--alerta); }
      .barra .corte { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--tenue); opacity: 0.7; }
      .cifra { font-family: var(--mono); font-size: 12px; color: var(--tenue); }
      .descriptiva { color: var(--tenue); font-style: italic; }
      .pie-recibo { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tenue); margin-top: 12px; }
      .pie-recibo code { font-family: var(--mono); color: var(--texto); }
      .correccion {
        background: rgba(210, 153, 34, 0.12); border: 1px solid var(--alerta);
        border-radius: 8px; padding: 12px 16px; margin-bottom: 16px;
      }
      .correccion-titulo { font-weight: 600; color: var(--alerta); margin-bottom: 4px; }
      .correccion-motivo {
        font-size: 13px; margin-top: 8px; padding-left: 12px;
        border-left: 2px solid var(--borde); white-space: pre-wrap;
      }
      .responsable { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
      .responsable label { margin: 0; white-space: nowrap; }
      .decision-humana { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--borde); }
      .decision-humana .quien { font-size: 13px; }
      .decision-humana .quien strong { color: var(--texto); }
      .historial { font-size: 12px; color: var(--tenue); margin-top: 10px; }

      /* ── Configuración: editor y diferencias ──────────────────────────── */
      .editor { width: 100%; min-height: 320px; resize: vertical; font-family: var(--mono);
        font-size: 13px; line-height: 1.6; padding: 14px; border-radius: 8px;
        background: var(--fondo); color: var(--texto); border: 1px solid var(--borde); }
      .editor:focus { outline: none; border-color: var(--acento); }
      .editor.mal { border-color: var(--error); }
      .interpretacion { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px; margin: 16px 0; }
      .interpretacion .campo { background: var(--panel); border: 1px solid var(--borde);
        border-radius: 8px; padding: 12px 14px; }
      .interpretacion .rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
        color: var(--tenue); }
      .interpretacion .valor { font-family: var(--mono); font-size: 13px; margin-top: 4px; word-break: break-word; }
      .diff { font-family: var(--mono); font-size: 12px; border: 1px solid var(--borde);
        border-radius: 8px; overflow: hidden; margin-bottom: 16px; }
      .diff div { padding: 2px 12px; white-space: pre-wrap; word-break: break-word; }
      .diff .add { background: rgba(63, 185, 80, 0.12); color: var(--ok); }
      .diff .remove { background: rgba(248, 81, 73, 0.12); color: var(--error); }
      .diff .same { color: var(--tenue); }
      /* ── Configurar por chat ──────────────────────────────────────────── */
      .conversacion { display: flex; flex-direction: column; gap: 14px; margin-bottom: 18px; }
      .turno { border: 1px solid var(--borde); border-radius: 8px; padding: 14px 16px; background: var(--panel); }
      .turno.tuyo { background: var(--panel-alto); }
      .turno .quien { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--tenue); margin-bottom: 6px; }
      .turno .texto { white-space: pre-wrap; }
      .propuesta { border: 1px solid var(--borde); border-radius: 8px; padding: 14px 16px; margin-top: 12px; background: var(--fondo); }
      .propuesta h4 { margin: 0 0 4px; font-size: 14px; font-family: var(--mono); }
      .propuesta .motivo { font-size: 13px; color: var(--tenue); margin-bottom: 10px; }
      .propuesta.invalida { border-color: var(--error); }
      .propuesta.sensible { border-color: var(--alerta); }
      .confirmacion { margin-top: 10px; }
      .confirmacion code { font-family: var(--mono); color: var(--alerta); }
      .confirmacion input { margin-top: 6px; font-family: var(--mono); }
      textarea {
        width: 100%; min-height: 76px; resize: vertical; font: inherit; font-size: 14px;
        padding: 10px 12px; border-radius: 8px; background: var(--fondo);
        color: var(--texto); border: 1px solid var(--borde);
      }
      textarea:focus { outline: none; border-color: var(--acento); }
      .ejemplos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .ejemplos button { font-size: 12px; }

      /* ── Modelos: routing por rol ─────────────────────────────────────── */
      .roles td { vertical-align: top; }
      .roles select, .roles input { min-width: 0; width: 100%; }
      .roles .rol { font-family: var(--mono); font-size: 12px; }
      .roles .descripcion { font-size: 12px; color: var(--tenue); }
      .presets { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
      .presets button[aria-pressed="true"] { border-color: var(--acento); color: var(--acento); }
      .presets + .resultado { margin-bottom: 18px; }
      .sin-consumidor { font-size: 11px; color: var(--tenue); font-style: italic; }
      .aviso-jev {
        background: rgba(79, 140, 255, 0.10); border: 1px solid var(--acento);
        border-radius: 6px; padding: 10px 12px; font-size: 13px; margin: 14px 0;
      }
      .error-parser { background: rgba(248, 81, 73, 0.12); border: 1px solid var(--error);
        color: var(--error); border-radius: 6px; padding: 10px 12px; font-family: var(--mono);
        font-size: 12px; white-space: pre-wrap; margin-bottom: 16px; }
      details { margin-top: 12px; }
      summary { font-size: 12px; color: var(--tenue); cursor: pointer; }
      summary:hover { color: var(--texto); }
    </style>
  </head>
  <body>
    <header>
      <h1>ValmenHarness</h1>
      <nav>
        <a href="#/tickets" data-vista="tickets">Tickets</a>
        <a href="#/configurar" data-vista="configurar">Configurar</a>
        <a href="#/modelos" data-vista="modelos">Modelos</a>
        <a href="#/configuracion" data-vista="configuracion">Configuración</a>
        <a href="#/proveedores" data-vista="proveedores">Proveedores</a>
      </nav>
      <span class="raiz" id="raiz"></span>
    </header>

    <main id="contenido"></main>

    <dialog id="dialogo">
      <div class="dialogo">
        <h3 id="titulo"></h3>
        <p id="ayuda"></p>
        <label for="clave">Clave</label>
        <input id="clave" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
        <div class="aviso" id="aviso"></div>
        <div class="pie">
          <button id="cancelar">Cancelar</button>
          <button id="guardar" class="principal">Probar y guardar</button>
        </div>
      </div>
    </dialog>

    <script type="module">
      // La interfaz no sabe nada del harness: llama a la API y muestra lo que
      // devuelve. Toda la lógica vive en el motor, así que un botón y un comando
      // de terminal no pueden divergir.
      const $ = (id) => document.getElementById(id);

      /** Llama a la API y devuelve el cuerpo, o lanza con el mensaje del servidor. */
      async function api(method, ruta, cuerpo) {
        const respuesta = await fetch(ruta, {
          method,
          headers: cuerpo === undefined ? {} : { "Content-Type": "application/json" },
          body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error ?? `HTTP ${respuesta.status}`);
        return datos;
      }

      /** Crea un elemento con texto. Nunca se usa innerHTML con datos del registro. */
      function el(tag, texto, clase) {
        const nodo = document.createElement(tag);
        if (texto !== undefined) nodo.textContent = texto;
        if (clase !== undefined) nodo.className = clase;
        return nodo;
      }

      /** El responsable de las decisiones humanas: se recuerda entre visitas. */
      let responsable = localStorage.getItem("valmen.actor") ?? "";
      const guardarResponsable = (valor) => {
        responsable = valor;
        localStorage.setItem("valmen.actor", valor);
      };

      // ── Vista: tickets ────────────────────────────────────────────────────

      const filtros = { q: "", workflow: "", type: "", open: false, invalid: false };

      async function vistaTickets() {
        const cont = $("contenido");
        cont.textContent = "";

        const params = new URLSearchParams();
        if (filtros.q !== "") params.set("q", filtros.q);
        if (filtros.workflow !== "") params.set("workflow", filtros.workflow);
        if (filtros.type !== "") params.set("type", filtros.type);
        if (filtros.open) params.set("open", "1");
        if (filtros.invalid) params.set("invalid", "1");

        const datos = await api("GET", `/api/tickets?${params.toString()}`);
        const r = datos.summary;

        // Tarjetas de resumen: es lo que responde "¿qué está pasando?" sin leer
        // la tabla.
        const tarjetas = el("div", undefined, "tarjetas");
        const metricas = [
          ["Tickets", r.total],
          ["En curso", r.total - (r.byWorkflow.closed ?? 0)],
          ["Cerrados", r.byWorkflow.closed ?? 0],
          ["Con puntos abiertos", r.withOpenPoints],
          ["Impacto crítico", r.criticalImpacts],
        ];
        if (r.invalid > 0) metricas.push(["Inválidos", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        // Filtros.
        const barra = el("div", undefined, "filtros");
        const busqueda = document.createElement("input");
        busqueda.type = "text";
        busqueda.placeholder = "Buscar por id, título o módulo…";
        busqueda.value = filtros.q;
        busqueda.style.minWidth = "280px";
        let temporizador;
        busqueda.addEventListener("input", () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            filtros.q = busqueda.value;
            void vistaTickets();
          }, 250);
        });
        barra.append(busqueda);

        const selector = (etiqueta, clave, valores, actual) => {
          const sel = document.createElement("select");
          sel.append(new Option(etiqueta, ""));
          for (const v of valores) sel.append(new Option(v, v));
          sel.value = actual;
          sel.addEventListener("change", () => {
            filtros[clave] = sel.value;
            void vistaTickets();
          });
          return sel;
        };
        barra.append(
          selector("Todos los estados", "workflow", Object.keys(r.byWorkflow).sort(), filtros.workflow),
          selector("Todos los tipos", "type", Object.keys(r.byType).sort(), filtros.type),
        );

        const casilla = (texto, clave) => {
          const label = el("label");
          label.style.display = "flex";
          label.style.alignItems = "center";
          label.style.gap = "6px";
          label.style.margin = "0";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = filtros[clave];
          input.addEventListener("change", () => {
            filtros[clave] = input.checked;
            void vistaTickets();
          });
          label.append(input, el("span", texto));
          return label;
        };
        barra.append(casilla("Solo abiertos", "open"), casilla("Solo inválidos", "invalid"));
        cont.append(barra);

        if (datos.tickets.length === 0) {
          cont.append(el("div", "Ningún ticket coincide con los filtros.", "vacio"));
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Ticket", "Tipo", "Estado", "QA", "Release", "Puntos", "Actualizado", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const t of datos.tickets) {
          const tr = el("tr");

          const celdaId = el("td");
          celdaId.append(el("div", t.title, "nombre"), el("div", t.id, "id"));
          tr.append(celdaId);

          const celdaTipo = el("td");
          celdaTipo.append(el("span", `${t.type} · ${t.module}`, "etiqueta"));
          tr.append(celdaTipo);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", t.workflowStatus));
          if (t.criticalImpacts.length > 0) {
            const critico = el("div");
            critico.append(el("span", t.criticalImpacts.join(" · "), "etiqueta critico"));
            celdaEstado.append(critico);
          }
          if (t.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválido", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          tr.append(el("td", t.qaStatus));
          tr.append(el("td", t.releaseStatus));

          const celdaPuntos = el("td");
          celdaPuntos.textContent =
            t.totalPoints === 0 ? "—" : `${t.totalPoints - t.openPoints}/${t.totalPoints}`;
          if (t.openPoints > 0) celdaPuntos.style.color = "var(--alerta)";
          tr.append(celdaPuntos);

          tr.append(el("td", t.updated, "id"));

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/ticket/${t.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: un ticket, con sus gates ───────────────────────────────────

      /** Los colores y el nombre legible de cada tipo de proposición. */
      const MODALIDAD = { human: "humano", auto: "automático", hybrid: "híbrido" };
      const MARCA = { pass: "✓", fail: "✗", warn: "!", skip: "·" };

      /** Una barra con el valor y los dos umbrales: hace visible la decisión. */
      function barraValor(valor, mark, policy) {
        const barra = el("div", undefined, "barra");
        const relleno = el("div", undefined, `relleno ${mark}`);
        relleno.style.width = `${Math.max(0, Math.min(1, valor)) * 100}%`;
        barra.append(relleno);
        for (const corte of [policy.blockAt, policy.approveAt]) {
          const marca = el("div", undefined, "corte");
          marca.style.left = `${corte * 100}%`;
          barra.append(marca);
        }
        return barra;
      }

      /** Los checks que decide el código, sin coste y antes de evaluar. */
      function listaChecks(checks) {
        const lista = el("div", undefined, "checks");
        for (const check of checks) {
          const fila = el("div", undefined, "check");
          fila.append(
            el("span", MARCA[check.result] ?? "·", `marca ${check.result}`),
            el("span", check.id),
            el("span", check.detail ?? "", "detalle"),
          );
          lista.append(fila);
        }
        return lista;
      }

      /** Las proposiciones evaluadas, con la probabilidad que se comparó. */
      function tablaProposiciones(recibo, policy) {
        const tabla = el("table", undefined, "proposiciones");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proposición", "Valor", "", "Umbral", "Resultado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const p of recibo.propositions) {
          const tr = el("tr");

          // Lo que se juzgó va primero y en su texto: `criterio_03` en banda de
          // revisión no dice nada, y el criterio que representa sí. Debajo queda
          // el identificador con su valor, que es lo que hace falta para
          // rastrearlo en el recibo.
          const celdaProposicion = el("td");
          if (p.description) {
            celdaProposicion.append(
              el("div", p.description, "criterio-texto"),
              el("div", p.label || p.id, "etiqueta-proposicion"),
            );
          } else {
            celdaProposicion.append(el("div", p.label || p.id, "etiqueta-proposicion"));
          }
          tr.append(celdaProposicion);
          tr.append(el("td", p.value.toFixed(3), "cifra"));

          const celdaBarra = el("td");
          celdaBarra.append(barraValor(p.value, p.mark, policy));
          tr.append(celdaBarra);

          tr.append(
            el("td", p.verdict ? `${policy.approveAt} / ${policy.blockAt}` : "no veta", "cifra"),
          );

          const celdaResultado = el("td");
          const texto = {
            approve: "aprueba",
            block: "bloquea",
            review: "en banda media",
            descriptive: "descriptiva",
          }[p.mark];
          celdaResultado.append(
            el("span", texto, p.mark === "descriptive" ? "descriptiva" : "etiqueta"),
          );
          if (p.reason) celdaResultado.append(el("div", p.reason, "resultado"));
          tr.append(celdaResultado);

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        return tabla;
      }

      /** La decisión vigente de un gate, con todo lo que la hace auditable. */
      function bloqueDecision(recibo, gate, ticketId, alDecidir) {
        const cont = el("div");

        const veredicto = el("div", undefined, "veredicto");
        veredicto.append(
          el("span", recibo.outcome.toUpperCase(), `salida ${recibo.outcome}`),
          el("span", recibo.reason, "motivo"),
          el("span", recibo.actor, "etiqueta"),
        );
        cont.append(veredicto);

        // Una aprobación de un estado que ya no existe no es una aprobación.
        if (recibo.stale) {
          cont.append(
            el(
              "div",
              "El ticket cambió desde que se emitió este recibo. La decisión es sobre el " +
                "estado congelado, no sobre el ticket actual: hay que volver a evaluar.",
              "obsoleto",
            ),
          );
        }

        // Un renglón que explique la banda antes de la tabla: sin él, «en banda
        // media» es una palabra que hay que interpretar.
        if (recibo.propositions.some((p) => p.mark === "review")) {
          cont.append(
            el(
              "div",
              `Ninguna proposición llegó a los umbrales: por debajo de ${gate.policy.blockAt} bloquea, ` +
                `a partir de ${gate.policy.approveAt} aprueba, y lo que cae en medio es lo que tienes que decidir tú. ` +
                "Las que aparecen como «descriptiva» se registran pero no vetan.",
              "resultado",
            ),
          );
        }
        cont.append(tablaProposiciones(recibo, gate.policy), listaChecks(recibo.mechanicalChecks));

        const pie = el("div", undefined, "pie-recibo");
        pie.append(
          el("span", undefined, `media ponderada ${recibo.weightedMean.toFixed(3)}`),
          el("span", undefined, `evaluador ${recibo.model?.resolvedVersion ?? "— (decisión en código)"}`),
          el("span", undefined, `coste $${(recibo.usage?.costUsd ?? 0).toFixed(6)}`),
          el("span", undefined, `${recibo.latencyMs ?? 0} ms`),
          el("span", undefined, `congelado ${recibo.stateHash.slice(0, 23)}…`),
        );
        cont.append(pie);

        // La decisión humana.
        if (recibo.humanDecision !== null) {
          const humana = el("div", undefined, "decision-humana");
          const quien = el("div", undefined, "quien");
          quien.append(
            el("strong", recibo.humanDecision.actor),
            el("span", ` ${recibo.humanDecision.decision === "approve" ? "aprobó" : "rechazó"} · ${recibo.humanDecision.decidedAt}`),
          );
          humana.append(quien);
          if (recibo.humanDecision.reason) {
            humana.append(el("div", recibo.humanDecision.reason, "resultado"));
          }
          cont.append(humana);
        } else if (recibo.escalatedTo === "human") {
          const humana = el("div", undefined, "decision-humana");
          humana.append(
            el("div", "El evaluador no alcanzó ninguno de los dos umbrales: la decisión es de una persona.", "resultado"),
          );

          const acciones = el("div", undefined, "acciones");
          acciones.style.justifyContent = "flex-start";
          acciones.style.marginTop = "10px";

          const motivo = document.createElement("input");
          motivo.type = "text";
          motivo.placeholder = "Motivo de la decisión";
          motivo.style.flex = "1 1 260px";

          const aprobar = el("button", "Aprobar", "principal");
          const rechazar = el("button", "Rechazar", "peligro");
          const decidir = async (decision, boton) => {
            if (responsable.trim() === "") {
              alert("Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.");
              return;
            }
            boton.disabled = true;
            try {
              await api("POST", `/api/tickets/${ticketId}/gates/${recibo.gate}/${recibo.receiptId}/decision`, {
                decision,
                actor: responsable,
                reason: motivo.value,
              });
              await alDecidir();
            } catch (error) {
              alert(error.message);
              boton.disabled = false;
            }
          };
          aprobar.addEventListener("click", () => void decidir("approve", aprobar));
          rechazar.addEventListener("click", () => void decidir("reject", rechazar));

          acciones.append(motivo, aprobar, rechazar);
          humana.append(acciones);
          cont.append(humana);
        }

        const detalles = el("details");
        detalles.append(el("summary", "Ver el informe del CLI, tal cual"));
        const pre = el("pre", recibo.report || "(el informe solo se guarda al evaluar desde la interfaz)");
        detalles.append(pre);
        cont.append(detalles);

        return cont;
      }

      /** Una tarjeta de gate: lo que ya sabe el código y lo que se puede hacer. */
      function tarjetaGate(gate, decisiones, recargar) {
        const cont = el("section", undefined, "gate");

        const cabecera = el("div", undefined, "gate-cabecera");
        cabecera.append(
          el("h3", `${gate.id} — ${gate.title}`),
          el("span", MODALIDAD[gate.mode], "etiqueta"),
          el("span", gate.transition, "etiqueta"),
          gate.applies
            ? el("span", "aplica", "etiqueta aprueba")
            : el("span", `no aplica en ${gate.workflowStatus || "un ticket ilegible"}`, "etiqueta"),
        );
        cont.append(cabecera);

        cont.append(
          el(
            "div",
            `Umbrales: aprueba ≥ ${gate.policy.approveAt} · bloquea ≤ ${gate.policy.blockAt} · ` +
              `${gate.propositionCount} proposición(es)` +
              (gate.blockedByCode ? " · el código ya sabe que va a bloquear" : ""),
            "gate-meta",
          ),
        );

        const vigente = decisiones.find((d) => d.gate === gate.id);
        // Los checks se muestran antes de evaluar; después van dentro del
        // recibo, donde son parte de la auditoría y no un duplicado.
        if (vigente === undefined) cont.append(listaChecks(gate.mechanicalChecks));

        const acciones = el("div", undefined, "acciones");
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        // Solo se ofrecen los evaluadores que pueden decidir **este** gate. Un
        // desplegable con una opción que siempre falla es una trampa.
        const evaluador = document.createElement("select");
        const opciones = [
          ["auto", gate.hasCommandChecks ? "evaluador automático (código primero)" : "evaluador automático"],
          ["jev", "Jev (probabilidades)"],
          ["llm-judge", "modelo de chat"],
        ];
        if (gate.hasCommandChecks) opciones.push(["command", "solo checks deterministas"]);
        for (const [valor, etiqueta] of opciones) {
          evaluador.append(new Option(etiqueta, valor));
        }

        const evaluar = el("button", "Evaluar", gate.applies && !gate.blockedByCode ? "principal" : "");
        evaluar.disabled = !gate.applies || gate.blockedByCode;
        evaluar.addEventListener("click", async () => {
          evaluar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "evaluando…";
          try {
            const r = await api("POST", `/api/tickets/${gate.ticketId}/gates/${gate.id}/run`, {
              evaluator: evaluador.value,
            });
            if (!r.ok) {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
            await recargar();
          } catch (error) {
            salida.className = "resultado error";
            salida.textContent = error.message;
          } finally {
            evaluar.disabled = false;
          }
        });

        acciones.append(salida, evaluador, evaluar);
        cont.append(acciones);

        if (vigente !== undefined) {
          cont.append(bloqueDecision(vigente, gate, gate.ticketId, recargar));
          const anteriores = decisiones.filter((d) => d.gate === gate.id).length - 1;
          if (anteriores > 0) {
            cont.append(
              el("div", `${anteriores} recibo(s) anterior(es) en el registro append-only`, "historial"),
            );
          }
        } else {
          cont.append(el("div", "Sin evaluar todavía.", "resultado"));
        }

        return cont;
      }

      /** El detalle de un ticket, con la pantalla de gates delante. */
      async function vistaTicket(id) {
        const cont = $("contenido");
        cont.textContent = "";

        const t = await api("GET", `/api/tickets/${id}`);

        const volver = el("a", "← Todos los tickets", "volver enlace");
        volver.href = "#/tickets";
        cont.append(volver);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", t.title));
        const meta = el("div", undefined, "meta");
        meta.append(
          el("span", t.id, "id"),
          el("span", `${t.type} · ${t.module}`, "etiqueta"),
          el("span", t.workflowStatus, "etiqueta"),
          el("span", `QA ${t.qaStatus}`, "etiqueta"),
          el("span", t.releaseStatus, "etiqueta"),
        );
        if (t.riskLevel !== "normal") {
          meta.append(el("span", `riesgo ${t.riskLevel}`, "etiqueta critico"));
        }
        if (t.criticalImpacts.length > 0) {
          meta.append(el("span", t.criticalImpacts.join(" · "), "etiqueta critico"));
        }
        if (t.invalid !== null) {
          meta.append(el("span", "inválido", "etiqueta roto"));
        }
        cabecera.append(meta, el("div", t.path, "ruta"));
        cont.append(cabecera);

        if (t.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El ticket no valida. "), el("span", t.invalid));
          cont.append(nota);
        }

        // ── Gates ──
        cont.append(el("h2", "Gates"));

        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las decisiones");
        etiquetaResponsable.htmlFor = "responsable";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () => guardarResponsable(entradaResponsable.value));
        const ayudaResponsable = el(
          "span",
          "Se registra en el recibo junto a la decisión: aprobar sin nombre no es auditable.",
          "resultado",
        );
        barraResponsable.append(etiquetaResponsable, entradaResponsable, ayudaResponsable);
        cont.append(barraResponsable);

        const zonaGates = el("div");
        cont.append(zonaGates);

        const zonaCorrecciones = el("div");
        cont.append(zonaCorrecciones);

        const pintarCorrecciones = (correcciones) => {
          zonaCorrecciones.textContent = "";
          for (const c of correcciones) {
            const caja = el("div", undefined, "correccion");
            caja.append(
              el(
                "div",
                c.retryExhausted
                  ? `Segundo rechazo del gate ${c.gate}: no queda reintento automático`
                  : `Corrección pendiente del gate ${c.gate}`,
                "correccion-titulo",
              ),
            );
            const quien = el("div", undefined, "resultado");
            quien.append(
              el("span", `Rechazado por ${c.actor} · ${c.decidedAt.slice(0, 10)}`),
              c.retryExhausted
                ? el(
                    "span",
                    " — el autor ya corrigió una vez y volvió a rechazarse. Decide tú: aprobar, o cambiar el plan a mano.",
                  )
                : el("span", " — el motivo está en el historial del ticket, listo para corregir."),
            );
            caja.append(quien);
            if (c.reason) caja.append(el("div", c.reason, "correccion-motivo"));
            zonaCorrecciones.append(caja);
          }
        };

        const cargarGates = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaGates.textContent = "";
          pintarCorrecciones(datos.corrections ?? []);
          for (const gate of datos.gates) {
            zonaGates.append(
              tarjetaGate(
                { ...gate, ticketId: id },
                datos.decisions,
                async () => {
                  guardarResponsable(entradaResponsable.value);
                  await cargarGates();
                },
              ),
            );
          }
        };
        await cargarGates();

        // ── Contenido del ticket ──
        cont.append(el("h2", "Contenido"));

        const partes = [
          ["Solicitud", t.request],
          ["Descripción funcional", t.sections["Descripción funcional"]],
          ["Diagnóstico", t.sections["Diagnóstico"]],
          ["Plan", t.sections["Plan"]],
          ["Criterios de aceptación", t.sections["Criterios de aceptación"]],
          ["Implementación", t.sections["Implementación"]],
          ["Pruebas", t.sections["Pruebas"]],
          ["Release", t.sections["Release"]],
        ];
        const bloques = [
          [`Puntos (${t.points.length})`, t.points],
          [`QA (${t.qa.length})`, t.qa],
          [`Evidencia (${t.evidence.length})`, t.evidence],
          [`Retests (${t.retests.length})`, t.retests],
          [`Cierre (${t.closures.length})`, t.closures],
          [`Eventos (${t.events.length})`, t.events],
          [`Consumo de IA (${t.usage.length})`, t.usage],
        ];

        const barraSecciones = el("div", undefined, "secciones");
        const cuerpo = el("pre");
        const mostrar = (etiqueta, valor, boton) => {
          for (const otro of barraSecciones.querySelectorAll("button")) {
            otro.setAttribute("aria-pressed", String(otro === boton));
          }
          cuerpo.textContent =
            typeof valor === "string"
              ? valor.trim() === ""
                ? "(vacío)"
                : valor
              : JSON.stringify(valor, null, 2);
        };

        for (const [etiqueta, valor] of [...partes, ...bloques]) {
          const boton = el("button", etiqueta);
          boton.setAttribute("aria-pressed", "false");
          boton.addEventListener("click", () => mostrar(etiqueta, valor, boton));
          barraSecciones.append(boton);
        }

        cont.append(barraSecciones, cuerpo);
        mostrar(partes[0][0], partes[0][1], barraSecciones.querySelector("button"));
      }

      // ── Vista: configurar por chat ────────────────────────────────────────

      /**
       * El chat de configuración.
       *
       * El modelo propone y el humano dispone: nada se escribe hasta que el
       * usuario pulsa «Aplicar», y un cambio sensible exige además escribir una
       * frase exacta. La frase no es ceremonia: un `confirm: true` es un clic, y
       * un clic no es una decisión deliberada.
       */
      async function vistaConfigurar() {
        const cont = $("contenido");
        cont.textContent = "";

        const conversacion = el("div", undefined, "conversacion");
        const entrada = document.createElement("textarea");
        entrada.placeholder = "Describe el cambio: «que los tickets de tipo DOCS no pidan aprobación de plan»…";
        entrada.setAttribute("aria-label", "Qué quieres configurar");

        const enviar = el("button", "Proponer cambios", "principal");
        const salida = el("div", undefined, "resultado");
        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "10px";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "El modelo propone; tú dispones. "),
          el("span", "Nada se escribe hasta que lo apruebas. El diff lo calcula el código comparando textos, la validez la decide el parser real, y los cambios que amplían la autoridad automática del sistema piden una confirmación escrita aparte."),
        );
        cont.append(nota, el("h2", "Configurar por chat"), conversacion);

        // Tres ejemplos reales: un chat vacío no dice qué se puede pedir.
        const ejemplos = el("div", undefined, "ejemplos");
        for (const ejemplo of [
          "Declara el gate de plan para este proyecto.",
          "Pasa el routing a económico, pero deja el arquitecto en un modelo fuerte.",
          "Añade un comentario al principio de la configuración explicando qué es esto.",
        ]) {
          const boton = el("button", ejemplo);
          boton.addEventListener("click", () => {
            entrada.value = ejemplo;
            entrada.focus();
          });
          ejemplos.append(boton);
        }

        acciones.append(salida, enviar);
        cont.append(entrada, acciones, ejemplos);

        const burbuja = (quien, texto, clase) => {
          const turno = el("div", undefined, `turno ${clase}`);
          turno.append(el("div", quien, "quien"), el("div", texto, "texto"));
          conversacion.append(turno);
          return turno;
        };

        /** Aplica los cambios aprobados y recarga la vista. */
        const aplicar = async (cambios, boton) => {
          boton.disabled = true;
          try {
            const r = await api("POST", "/api/chat/config/apply", { changes: cambios });
            if (r.ok) {
              await navegar();
              return;
            }
            salida.className = "resultado error";
            salida.textContent = r.error || "No se aplicó nada.";
            boton.disabled = false;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            boton.disabled = false;
          }
        };

        enviar.addEventListener("click", async () => {
          const mensaje = entrada.value.trim();
          if (mensaje === "") {
            salida.className = "resultado error";
            salida.textContent = "Escribe qué quieres cambiar.";
            return;
          }

          burbuja("Tú", mensaje, "tuyo");
          entrada.value = "";
          enviar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "pensando…";

          try {
            const propuesta = await api("POST", "/api/chat/config", { message: mensaje });
            salida.textContent = "";

            if (!propuesta.ok) {
              burbuja("Configurador", propuesta.error, "");
              return;
            }

            const turno = burbuja(
              "Configurador",
              `${propuesta.summary}\n\n${propuesta.changes.length === 0 ? "No hace falta cambiar ningún archivo." : `${propuesta.changes.length} archivo(s) cambiarían.`} · ${propuesta.model} · $${(propuesta.usage?.costUsd ?? 0).toFixed(6)} · ${propuesta.latencyMs} ms`,
              "",
            );

            const pendientes = [];
            for (const cambio of propuesta.changes) {
              const caja = el("div", undefined, `propuesta ${cambio.ok ? "" : "invalida"} ${cambio.sensitive ? "sensible" : ""}`);
              caja.append(el("h4", cambio.label), el("div", cambio.reason, "motivo"));

              if (!cambio.ok) {
                caja.append(el("div", cambio.error, "error-parser"));
              } else if (cambio.unchanged) {
                caja.append(el("div", "Sin cambios respecto de lo guardado.", "resultado"));
              } else {
                const diff = el("div", undefined, "diff");
                for (const linea of cambio.diff) {
                  diff.append(
                    el(
                      "div",
                      `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                      linea.kind,
                    ),
                  );
                }
                caja.append(diff);
              }

              const filaAcciones = el("div", undefined, "acciones");
              filaAcciones.style.justifyContent = "flex-start";
              filaAcciones.style.marginTop = "10px";

              const entradaConfirmacion = document.createElement("input");
              if (cambio.sensitive && cambio.ok && !cambio.unchanged) {
                const aviso = el("div", undefined, "confirmacion");
                aviso.append(
                  el("div", `⚠ Requiere confirmación: ${cambio.sensitiveReason}`, "resultado error"),
                  el("div", undefined, "resultado"),
                );
                aviso.lastChild.append(
                  el("span", "Escribe "),
                  el("code", cambio.confirmation),
                  el("span", " para confirmarlo."),
                );
                entradaConfirmacion.type = "text";
                entradaConfirmacion.placeholder = "Frase de confirmación";
                aviso.append(entradaConfirmacion);
                caja.append(aviso);
              }

              const aplicarEste = el("button", cambio.sensitive ? "Confirmar y aplicar" : "Aplicar", "principal");
              aplicarEste.disabled = !cambio.ok || cambio.unchanged;
              aplicarEste.addEventListener("click", () => {
                const peticion = { file: cambio.file, text: cambio.text };
                if (cambio.sensitive) peticion.confirm = entradaConfirmacion.value.trim();
                void aplicar([peticion], aplicarEste);
              });
              filaAcciones.append(aplicarEste);
              caja.append(filaAcciones);

              if (cambio.ok && !cambio.unchanged) {
                pendientes.push({
                  file: cambio.file,
                  text: cambio.text,
                  ...(cambio.sensitive
                    ? { confirm: cambio.confirmation }
                    : {}),
                });
              }
              turno.append(caja);
            }

            // Aplicar todo respeta las confirmaciones: las sensibles solo entran
            // si el usuario escribió su frase, y el servidor lo vuelve a exigir.
            if (pendientes.length > 1) {
              const todo = el("button", "Aplicar todo");
              todo.style.marginTop = "10px";
              todo.addEventListener("click", () => {
                const confirmadas = [];
                for (const pendiente of pendientes) {
                  if (pendiente.confirm === undefined) {
                    confirmadas.push({ file: pendiente.file, text: pendiente.text });
                    continue;
                  }
                  const caja = [...turno.querySelectorAll(".propuesta")].find((nodo) =>
                    nodo.querySelector("h4")?.textContent ===
                    (pendiente.file === "config" ? ".valmen/config.yaml" : ".valmen/routing.yaml"),
                  );
                  const escrita = caja?.querySelector("input")?.value.trim();
                  if (escrita === pendiente.confirm) {
                    confirmadas.push({
                      file: pendiente.file,
                      text: pendiente.text,
                      confirm: escrita,
                    });
                  }
                }
                void aplicar(confirmadas, todo);
              });
              turno.append(todo);
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            enviar.disabled = false;
          }
        });

        entrada.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) void enviar.click();
        });
      }

      // ── Vista: modelos (routing por rol) ──────────────────────────────────

      /**
       * Qué modelo usa cada rol, y de dónde salió.
       *
       * La columna "origen" es la que hace útil la pantalla: sin ella, cambiar
       * el preset y no ver efecto es indistinguible de un override olvidado en
       * `.valmen/routing.yaml`. Y los roles que el harness todavía no ejecuta se
       * marcan como declarados: prometer que un modelo se usa para algo que no
       * existe sería una mentira cómoda.
       */
      async function vistaModelos() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/routing");
        const guardado = datos.routing;

        // El modelo de cada rol tal como está ahora: se compara con lo que el
        // usuario elija para saber si hay algo que guardar.
        const eleccion = {};
        for (const rol of guardado.roles) {
          eleccion[rol.role] = { model: rol.model, effort: rol.effort, source: rol.source };
        }
        let preset = guardado.preset === "" ? "balanced" : guardado.preset;
        let textoPrevio = guardado.text;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "El modelo por rol decide dónde se gasta el dinero. "),
          el("span", "Los roles de razonamiento son caros y poco frecuentes; los de ejecución son baratos y se repiten. Cambiar el preset cambia las trece decisiones de una vez."),
        );
        cont.append(nota, el("h2", "Preset"));

        const presets = el("div", undefined, "presets");
        const explicacion = el("div", undefined, "resultado");
        const botonesPreset = new Map();
        for (const p of guardado.presets) {
          const boton = el("button", p.id);
          boton.addEventListener("click", () => {
            preset = p.id;
            // Elegir un preset no reescribe lo que el proyecto ya decidió: los
            // overrides se quedan, y la columna de origen lo dirá.
            for (const boton of botonesPreset.values()) boton.setAttribute("aria-pressed", "false");
            boton.setAttribute("aria-pressed", "true");
            explicacion.textContent = p.description;
            void refrescar();
          });
          botonesPreset.set(p.id, boton);
          presets.append(boton);
        }
        for (const [id, boton] of botonesPreset) {
          boton.setAttribute("aria-pressed", String(id === preset));
          if (id === preset) {
            explicacion.textContent =
              guardado.presets.find((p) => p.id === id)?.description ?? "";
          }
        }
        cont.append(presets, explicacion);

        // El catálogo: de dónde salen los modelos que se pueden elegir.
        const origenCatalogo = el(
          "div",
          datos.catalog.source === "openrouter"
            ? `Catálogo de OpenRouter: ${datos.catalog.detail}. Jev se añade aparte porque vive en el endpoint de Decisions, no en el de chat.`
            : `Se usa la lista de los presets: ${datos.catalog.detail}. Los identificadores están verificados contra el catálogo real de OpenRouter.`,
          "resultado",
        );
        cont.append(origenCatalogo);

        cont.append(el("h2", "Modelo por rol"));

        const tabla = el("table", undefined, "roles");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Rol", "Modelo", "Esfuerzo", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        const modeloSelect = (rol) => {
          const sel = document.createElement("select");
          const actual = eleccion[rol.role].model;
          // El valor actual primero: si el proyecto declaró un modelo que no
          // está en el catálogo, tiene que seguir siendo visible.
          const vistos = new Set();
          if (actual !== "") {
            sel.append(new Option(actual, actual));
            vistos.add(actual);
          }
          for (const modelo of datos.catalog.models) {
            if (vistos.has(modelo.id)) continue;
            vistos.add(modelo.id);
            const precio =
              modelo.promptUsd === null
                ? ""
                : ` · $${(modelo.promptUsd * 1_000_000).toFixed(2)}/M entrada`;
            sel.append(new Option(`${modelo.name}${precio}`, modelo.id));
          }
          sel.value = actual;
          sel.addEventListener("change", () => {
            eleccion[rol.role].model = sel.value;
            explicitos.add(rol.role);
            void refrescar();
          });
          return sel;
        };

        const esfuerzoSelect = (rol) => {
          const sel = document.createElement("select");
          for (const valor of ["auto", "low", "medium", "high"]) {
            sel.append(new Option(valor, valor));
          }
          sel.value = eleccion[rol.role].effort;
          sel.addEventListener("change", () => {
            eleccion[rol.role].effort = sel.value;
            explicitos.add(rol.role);
            void refrescar();
          });
          return sel;
        };

        for (const rol of guardado.roles) {
          const tr = el("tr");

          const celdaRol = el("td");
          celdaRol.append(
            el("div", rol.role, "rol"),
            el("div", rol.description, "descripcion"),
          );
          if (rol.consumer === null) {
            celdaRol.append(el("div", "declarado: todavía no lo ejecuta nada", "sin-consumidor"));
          }
          tr.append(celdaRol);

          const celdaModelo = el("td");
          celdaModelo.append(modeloSelect(rol));
          tr.append(celdaModelo);

          const celdaEsfuerzo = el("td");
          celdaEsfuerzo.append(esfuerzoSelect(rol));
          tr.append(celdaEsfuerzo);

          const ORIGEN = {
            proyecto: "definido en este proyecto",
            preset: `del preset ${preset}`,
            sistema: "valor del sistema",
            "sin-asignar": "sin asignar",
          };
          const celdaOrigen = el("td");
          celdaOrigen.append(el("span", ORIGEN[rol.source] ?? rol.source, "resultado"));
          if (rol.consumer !== null) {
            celdaOrigen.append(el("div", rol.consumer, "sin-consumidor"));
          }
          tr.append(celdaOrigen);

          tr.append(el("td"));
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);

        // El aviso que evita perder la reproducibilidad sin enterarse.
        const avisoJev = el("div", undefined, "aviso-jev");
        cont.append(avisoJev);

        cont.append(el("h2", "Diferencias antes de guardar"));
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;
        const salida = el("div", undefined, "resultado");
        const guardar = el("button", "Guardar el routing", "principal");
        guardar.disabled = true;
        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "14px";
        acciones.append(salida, guardar);
        cont.append(diff, error, acciones);

        /**
         * Los roles que se escriben en el archivo.
         *
         * Solo los explícitos: los que ya estaban definidos en el proyecto y los
         * que el usuario acaba de tocar. Escribir los trece haría creer que el
         * proyecto decidió sobre los trece, y cambiar el preset dejaría de tener
         * efecto sin que nadie entendiera por qué.
         */
        const explicitos = new Set(
          guardado.roles.filter((rol) => rol.source === "proyecto").map((rol) => rol.role),
        );
        const rolesDelFormulario = () => {
          const roles = {};
          for (const rol of guardado.roles) {
            if (!explicitos.has(rol.role)) continue;
            roles[rol.role] = {
              model: eleccion[rol.role].model,
              effort: eleccion[rol.role].effort,
            };
          }
          return roles;
        };

        const refrescar = async () => {
          try {
            const previsualizacion = await api("POST", "/api/routing/preview", {
              preset,
              roles: rolesDelFormulario(),
            });
            const estado = previsualizacion.routing;

            error.hidden = estado.ok;
            error.textContent = estado.ok ? "" : estado.error;

            diff.textContent = "";
            const cambios = estado.diff.filter((linea) => linea.kind !== "same");
            if (cambios.length === 0) {
              diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
            } else {
              for (const linea of estado.diff) {
                diff.append(
                  el(
                    "div",
                    `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                    linea.kind,
                  ),
                );
              }
            }

            const evaluador = estado.roles.find((r) => r.role === "gate-evaluator");
            // El aviso lleva números medidos, no adjetivos: en el mismo gate de
            // 14 proposiciones, Jev tarda 0,8 s y cuesta $0,000158; un modelo de
            // chat con razonamiento por defecto **no termina** en 90 s.
            avisoJev.textContent =
              evaluador !== undefined && evaluador.probabilistic
                ? "El evaluador de gates usa Jev: emite probabilidades calibradas y el código compara contra umbrales. Medido en un gate de 14 proposiciones: 0,8 s y $0,000158."
                : "⚠ El evaluador de gates está configurado con un modelo de chat. El gate sigue funcionando, pero pasa a ser un juez que interpreta texto: pierde la calibración y dos ejecuciones del mismo ticket pueden no coincidir. Medido: 36 s y $0,00073 con esfuerzo bajo, y más de 90 s —el límite— con el razonamiento por defecto. Si eliges esta vía, pon el esfuerzo en «low».";

            guardar.disabled = !estado.ok || cambios.length === 0;
            guardar.textContent = cambios.length === 0 ? "Sin cambios" : "Guardar el routing";
            textoPrevio = previsualizacion.text;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          try {
            const r = await api("PUT", "/api/routing", { text: textoPrevio });
            if (r.routing.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
              guardado.text = r.text;
              // Se recarga la vista: los orígenes cambian de "preset" a
              // "proyecto", y esa es justamente la información que importa.
              await vistaModelos();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.routing.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        });

        await refrescar();
      }

      // ── Vista: configuración ──────────────────────────────────────────────

      /**
       * El editor de `.valmen/config.yaml`.
       *
       * El texto es la fuente y se edita en crudo, así que los comentarios
       * sobreviven. Antes de guardar se muestra qué entendió el harness y qué
       * archivos generados quedan desactualizados: sin eso, el usuario tendría
       * que saber que `AGENTS.md` se genera, que es justo el conocimiento que la
       * app debe evitar exigir.
       */
      async function vistaConfiguracion() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/config");
        const estadoInicial = datos.config;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Se guarda solo si el harness puede leerlo. "),
          el("span", "El formato admite un subconjunto de YAML: escalares, listas de bloque y mapas por indentación. Si algo no encaja, se dice aquí y el archivo no se toca."),
        );
        cont.append(nota, el("h2", "Configuración del proyecto"));
        cont.append(el("div", estadoInicial.path, "ruta"));

        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.spellcheck = false;
        editor.value = estadoInicial.text;
        editor.setAttribute("aria-label", "Contenido de .valmen/config.yaml");

        // El panel de interpretación: lo que el harness entendió del texto.
        const interpretacion = el("div", undefined, "interpretacion");
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;

        const guardar = el("button", "Guardar los cambios", "principal");
        guardar.disabled = true;
        const regenerar = el("button", "Regenerar");
        regenerar.hidden = true;
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        let ultimo = null;

        const campo = (rotulo, valor) => {
          const caja = el("div", undefined, "campo");
          caja.append(el("div", rotulo, "rotulo"), el("div", valor, "valor"));
          return caja;
        };

        const pintar = (respuesta) => {
          const { config, impact } = respuesta;

          error.hidden = config.ok;
          error.textContent = config.ok ? "" : config.error;
          editor.classList.toggle("mal", !config.ok);

          interpretacion.textContent = "";
          if (config.summary !== null) {
            const s = config.summary;
            interpretacion.append(
              campo("nombre", s.name),
              campo("registro de tickets", s.ticketsDir === "" ? "(por defecto)" : s.ticketsDir),
              campo("gates declarados", s.gates.length === 0 ? "ninguno" : s.gates.join(", ")),
              campo("claves", s.keys.join(", ")),
            );
            if (!s.adopted) {
              interpretacion.append(
                campo("adopción", "el archivo todavía no existe"),
              );
            }
          }

          diff.textContent = "";
          const cambios = config.diff.filter((linea) => linea.kind !== "same");
          if (cambios.length === 0) {
            diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
          } else {
            for (const linea of config.diff) {
              diff.append(
                el(
                  "div",
                  `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                  linea.kind,
                ),
              );
            }
          }

          // El aviso que evita la trampa de editar el archivo generado: se dice
          // aquí, antes de guardar, y no en un documento aparte.
          if (config.ok && impact !== null && impact.stale > 0) {
            const aviso = el("div", undefined, "same");
            aviso.append(
              el(
                "div",
                impact.stale === 1
                  ? `Quedará 1 archivo generado desactualizado: ${impact.files.filter((f) => f.stale).map((f) => f.path).join(", ")}.`
                  : `Quedarán ${impact.stale} archivos generados desactualizados: ${impact.files.filter((f) => f.stale).map((f) => f.path).join(", ")}.`,
              ),
              el(
                "div",
                impact.files.every((f) => f.path === "AGENTS.md")
                  ? "Es un archivo generado: editarlo a mano se pierde en la siguiente sincronización."
                  : "Son archivos generados: editarlos a mano se pierde en la siguiente sincronización.",
              ),
            );
            diff.append(aviso);
            regenerar.hidden = false;
            regenerar.textContent =
              impact.stale === 1
                ? "Regenerar 1 archivo"
                : `Regenerar ${impact.stale} archivos`;
          } else {
            regenerar.hidden = true;
          }

          ultimo = config;
          guardar.disabled = !config.ok || cambios.length === 0;
          guardar.textContent =
            cambios.length === 0 ? "Sin cambios" : "Guardar los cambios";
        };

        let temporizador;
        const analizar = () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(async () => {
            try {
              pintar(await api("POST", "/api/config/check", { text: editor.value }));
            } catch (fallo) {
              salida.className = "resultado error";
              salida.textContent = fallo.message;
            }
          }, 250);
        };
        editor.addEventListener("input", analizar);

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "guardando…";
          try {
            const r = await api("PUT", "/api/config", { text: editor.value });
            pintar(r);
            if (r.config.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
            } else {
              salida.className = "resultado error";
              salida.textContent = "No se guardó: el texto no es válido.";
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            // La petición falló, así que el botón vuelve a estar disponible
            // según lo que se sepa del texto; no se deja deshabilitado.
            guardar.disabled = ultimo?.ok !== true;
          }
        });

        // Regenerar existe para que nadie tenga que saber que `AGENTS.md` es un
        // archivo derivado. Se hace con la misma proyección que `valmen sync`.
        regenerar.addEventListener("click", async () => {
          regenerar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "regenerando…";
          try {
            const r = await api("POST", "/api/config/sync");
            // Se repinta con el estado que devuelve el servidor: el aviso de
            // archivos pendientes desaparece porque ya no queda ninguno.
            pintar(await api("GET", "/api/config"));
            if (r.ok) {
              salida.className = "resultado ok";
              salida.textContent =
                r.written.length === 0
                  ? "Ya estaba al día."
                  : `Regenerados: ${r.written.join(", ")}.`;
            } else {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            regenerar.disabled = false;
          }
        });

        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "14px";
        acciones.append(salida, regenerar, guardar);

        cont.append(editor, error, el("h2", "Lo que el harness entiende"), interpretacion);
        cont.append(el("h2", "Diferencias antes de guardar"), diff, acciones);
        pintar(datos);
      }

      // ── Vista: proveedores ────────────────────────────────────────────────

      let proveedores = [];
      let proveedorActual = null;

      const origen = (p) =>
        p.source === "environment" ? "variable de entorno"
        : p.source === "credentials-file" ? "archivo de credenciales"
        : p.source === "cli" ? "token del CLI"
        : p.source === "none" && p.configured ? "no requiere"
        : "—";

      async function vistaProveedores() {
        const cont = $("contenido");
        cont.textContent = "";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Las claves se prueban antes de guardarse. "),
          el("span", "Si la conexión falla no se escribe nada, así que una clave mal pegada falla aquí y no en la mitad de un gate. Después de guardarla no se vuelve a mostrar: solo se puede reemplazar."),
        );
        cont.append(nota, el("h2", "Proveedores"));

        const datos = await api("GET", "/api/providers");
        proveedores = datos.providers;

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Proveedor", "Autenticación", "Estado", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const p of proveedores) {
          const tr = el("tr");

          const celdaNombre = el("td");
          const punto = el("span", undefined, `punto ${p.configured ? "ok" : "no"}`);
          celdaNombre.append(punto, el("span", p.name, "nombre"), el("div", p.id, "id"));
          tr.append(celdaNombre);

          tr.append(el("td", p.auth === "api-key" ? "API key" : p.auth === "subscription" ? "suscripción" : "ninguna"));

          const celdaEstado = el("td");
          celdaEstado.append(
            el("div", p.configured ? (p.source === "none" ? "local" : `configurada${p.keyLength === null ? "" : ` · ${p.keyLength} caracteres`}`) : "sin configurar"),
          );
          if (p.legacyFieldName) {
            celdaEstado.append(el("div", "campo con el nombre anterior; se normaliza al reescribir", "resultado"));
          }
          const salida = el("div", undefined, "resultado");
          salida.dataset.id = p.id;
          celdaEstado.append(salida);
          tr.append(celdaEstado);

          const celdaOrigen = el("td");
          celdaOrigen.append(el("div", origen(p), "resultado"));
          if (p.probeable && p.probeHost) {
            celdaOrigen.append(el("div", `se prueba contra ${p.probeHost}`, "resultado"));
          }
          tr.append(celdaOrigen);

          const celdaAcciones = el("td");
          const acciones = el("div", undefined, "acciones");

          // Un proveedor de suscripción no tiene endpoint: su credencial es el
          // token que ya vive en el CLI. Un botón que siempre falla parece un
          // error del usuario, así que en su lugar se dice qué usa.
          if (p.probeable) {
            const probar = el("button", "Probar");
            probar.title = `Se prueba contra ${p.probeHost}`;
            probar.addEventListener("click", () => void probarConexion(p, salida, probar));
            acciones.append(probar);
          } else if (p.tokenSource) {
            salida.className = "resultado";
            salida.textContent = `Se usa el token de ${p.tokenSource}; no hay endpoint que probar.`;
          }

          if (p.auth === "api-key") {
            const configurar = el("button", p.configured ? "Reemplazar" : "Configurar", p.configured ? "" : "principal");
            configurar.addEventListener("click", () => abrirDialogo(p));
            acciones.append(configurar);
          }
          if (p.configured && p.auth === "api-key" && p.source === "credentials-file") {
            const borrar = el("button", "Borrar", "peligro");
            borrar.addEventListener("click", () => void borrarClave(p, borrar));
            acciones.append(borrar);
          }

          celdaAcciones.append(acciones);
          tr.append(celdaAcciones);
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      async function probarConexion(p, salida, boton) {
        boton.disabled = true;
        salida.className = "resultado";
        salida.textContent = "probando…";
        try {
          const r = await api("POST", `/api/providers/${p.id}/probe`);
          salida.className = `resultado ${r.ok ? "ok" : "error"}`;
          salida.textContent = `${r.detail} · ${r.latencyMs} ms`;
        } catch (error) {
          salida.className = "resultado error";
          salida.textContent = error.message;
        } finally {
          boton.disabled = false;
        }
      }

      function abrirDialogo(p) {
        proveedorActual = p;
        $("titulo").textContent = `Configurar ${p.name}`;
        $("ayuda").textContent = "La clave se prueba contra el endpoint del proveedor antes de guardarse.";
        $("clave").value = "";
        $("aviso").textContent =
          p.source === "environment"
            ? `Ahora mismo se usa la variable de entorno ${p.envVar}, que tiene prioridad sobre el archivo.`
            : "";
        $("dialogo").showModal();
        $("clave").focus();
      }

      async function guardar() {
        const clave = $("clave").value.trim();
        if (clave === "") {
          $("aviso").textContent = "Escribe la clave antes de guardar.";
          return;
        }
        const boton = $("guardar");
        boton.disabled = true;
        boton.textContent = "Probando…";
        try {
          const r = await api("PUT", `/api/providers/${proveedorActual.id}/credential`, { apiKey: clave });
          const id = proveedorActual.id;
          $("dialogo").close();
          await vistaProveedores();
          const salida = document.querySelector(`.resultado[data-id="${id}"]`);
          if (salida) {
            salida.className = "resultado ok";
            salida.textContent = `${r.probe.detail} · ${r.probe.latencyMs} ms`;
          }
        } catch (error) {
          $("aviso").textContent = error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Probar y guardar";
        }
      }

      async function borrarClave(p, boton) {
        if (!confirm(`¿Borrar la clave de ${p.name}? Dejará de estar disponible para los gates.`)) return;
        boton.disabled = true;
        try {
          await api("DELETE", `/api/providers/${p.id}/credential`);
          await vistaProveedores();
        } catch (error) {
          alert(error.message);
          boton.disabled = false;
        }
      }

      // ── Enrutado ──────────────────────────────────────────────────────────

      async function navegar() {
        const ruta = location.hash.replace(/^#\//, "") || "tickets";
        const [nombre, parametro] = ruta.split("/");

        for (const enlace of document.querySelectorAll("nav a")) {
          // Un ticket pertenece a la vista de tickets: la pestaña sigue marcada
          // para que la navegación no parezca perderse al abrir uno.
          const activa = enlace.dataset.vista === nombre || (nombre === "ticket" && enlace.dataset.vista === "tickets");
          if (activa) enlace.setAttribute("aria-current", "page");
          else enlace.removeAttribute("aria-current");
        }

        try {
          if (nombre === "ticket" && parametro !== undefined) await vistaTicket(parametro);
          else if (nombre === "configurar") await vistaConfigurar();
          else if (nombre === "modelos") await vistaModelos();
          else if (nombre === "configuracion") await vistaConfiguracion();
          else if (nombre === "proveedores") await vistaProveedores();
          else await vistaTickets();
        } catch (error) {
          const cont = $("contenido");
          cont.textContent = "";
          cont.append(el("div", `No se pudo cargar la vista: ${error.message}`, "vacio"));
        }
      }

      $("cancelar").addEventListener("click", () => $("dialogo").close());
      $("guardar").addEventListener("click", () => void guardar());
      $("clave").addEventListener("keydown", (e) => {
        if (e.key === "Enter") void guardar();
      });
      window.addEventListener("hashchange", () => void navegar());

      void api("GET", "/api/health").then((salud) => {
        $("raiz").textContent = salud.root;
      });
      void navegar();
    </script>
  </body>
</html>
