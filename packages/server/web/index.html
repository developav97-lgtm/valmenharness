            // Sin la frase el motor rechaza la decisión: el botón no se habilita antes.
            autorizar.disabled = true;
            frase.addEventListener("input", () => {
              autorizar.disabled = frase.value.trim() === "";
            });
            autorizar.addEventListener("click", async () => {
              if (responsable.trim() === "") {
                alert(
                  "Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.",
                );
                return;
              }
              autorizar.disabled = true;
              try {
                await api(
                  "POST",
                  `/api/tickets/${ticketId}/gates/${recibo.receiptId}/decision`,
                  { decision: "approve", actor: responsable, reason: frase.value },
                );
                await alDecidir();
              } catch (error) {
                alert(error.message);
                autorizar.disabled = false;
              }
            });

            acciones.append(frase, autorizar);
            humana.append(acciones);
          }
          cont.append(humana);
        }

        const detalles = el("details");
        detalles.append(el("summary", "Ver el informe del CLI, tal cual"));
        const pre = el(
          "pre",
          recibo.report || "(el informe solo se guarda al evaluar desde la interfaz)",
        );
        detalles.append(pre);
        cont.append(detalles);

        return cont;
      }

      /** Una tarjeta de gate: lo que ya sabe el código y lo que se puede hacer. */
      function tarjetaGate(gate, decisiones, recargar) {
        const cont = el("section", undefined, "gate");

        const cabecera = el("div", undefined, "gate-cabecera");
        cabecera.append(
          el("h3", `${gate.id} — ${gate.title}`),
          el("span", MODALIDAD[gate.mode], "etiqueta"),
          el("span", gate.transition, "etiqueta"),
          gate.applies
            ? el("span", "aplica", "etiqueta aprueba")
            : el(
                "span",
                `no aplica en ${gate.workflowStatus || "un ticket ilegible"}`,
                "etiqueta",
              ),
        );
        cont.append(cabecera);

        cont.append(
          el(
            "div",
            `Umbrales: aprueba ≥ ${gate.policy.approveAt} · bloquea ≤ ${gate.policy.blockAt} · ` +
              `${gate.propositionCount} proposición(es)` +
              (gate.blockedByCode ? " · el código ya sabe que va a bloquear" : ""),
            "gate-meta",
          ),
        );

        const vigente = decisiones.find((d) => d.gate === gate.id);
        // Los checks se muestran antes de evaluar; después van dentro del
        // recibo, donde son parte de la auditoría y no un duplicado.
        if (vigente === undefined) cont.append(listaChecks(gate.mechanicalChecks));

        const acciones = el("div", undefined, "acciones");
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        // Solo se ofrecen los evaluadores que pueden decidir **este** gate. Un
        // desplegable con una opción que siempre falla es una trampa.
        const evaluador = document.createElement("select");
        const opciones = [
          [
            "auto",
            gate.hasCommandChecks
              ? "evaluador automático (código primero)"
              : "evaluador automático",
          ],
          ["jev", "Jev (probabilidades)"],
          ["llm-judge", "modelo de chat"],
        ];
        // La cascada solo se ofrece donde queda algo que un verificador pueda
        // comprobar: un gate que se resuelve entero en código no gasta llamadas
        // aunque se la pida, y un desplegable que ofrece una opción que no hace
        // nada enseña a no creerle al desplegable.
        if (gate.needsModel)
          opciones.push(["cascade", "cascada verificada (barato, verifica, escala)"]);
        if (gate.hasCommandChecks) opciones.push(["command", "solo checks deterministas"]);
        for (const [valor, etiqueta] of opciones) {
          evaluador.append(new Option(etiqueta, valor));
        }

        const evaluar = el(
          "button",
          "Evaluar",
          gate.applies && !gate.blockedByCode ? "principal" : "",
        );
        evaluar.disabled = !gate.applies || gate.blockedByCode;
        evaluar.addEventListener("click", async () => {
          evaluar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "evaluando…";
          try {
            const r = await api(
              "POST",
              `/api/tickets/${gate.ticketId}/gates/${gate.id}/run`,
              {
                evaluator: evaluador.value,
              },
            );
            if (!r.ok) {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
            await recargar();
          } catch (error) {
            salida.className = "resultado error";
            salida.textContent = error.message;
          } finally {
            evaluar.disabled = false;
          }
        });

        acciones.append(salida, evaluador, evaluar);
        cont.append(acciones);

        if (vigente !== undefined) {
          cont.append(bloqueDecision(vigente, gate, gate.ticketId, recargar));
          const anteriores = decisiones.filter((d) => d.gate === gate.id).length - 1;
          if (anteriores > 0) {
            cont.append(
              el(
                "div",
                `${anteriores} recibo(s) anterior(es) en el registro append-only`,
                "historial",
              ),
            );
          }
        } else {
          cont.append(el("div", "Sin evaluar todavía.", "resultado"));
        }

        return cont;
      }

      /** Solo la banda de la vista vigente puede recibir el refresco parcial. */
      let bandaDeFasesActual = null;

      /** La API de fases es complementaria: no frena el resto de la vista. */
      function pintarBandaDeFases(cont, ticket, id) {
        const banda = el("section", undefined, "banda-fases");
        banda.setAttribute("aria-label", "Fases del ticket");
        banda.append(el("h3", "Fases del ticket"));
        const tramos = el("div", undefined, "banda-fases-tramos");
        tramos.setAttribute("aria-live", "polite");
        tramos.append(el("div", "Leyendo las fases…", "resultado"));
        banda.append(tramos);
        cont.append(banda);

        const rotulos = {
          intake: "Alta",
          analyzed: "Analizado",
          planned: "Plan",
          approved: "Aprobado",
          in_progress: "En curso",
          awaiting_user_tests: "Pruebas",
          in_qa: "QA",
          qa_approved: "QA aprobado",
          closed: "Cerrado",
          blocked: "Bloqueado",
          changes_requested: "Cambios solicitados",
        };
        const duracion = (ms) => {
          if (ms === null || !Number.isFinite(ms)) return "Sin duración registrada";
          const segundos = Math.floor(Math.max(0, ms) / 1000);
          const dias = Math.floor(segundos / 86400);
          const horas = Math.floor((segundos % 86400) / 3600);
          const minutos = Math.floor((segundos % 3600) / 60);
          return `${dias ? `${dias} d ` : ""}${horas} h ${minutos} min ${segundos % 60} s`;
        };
        const fecha = (valor) => {
          if (valor === null || !Number.isFinite(Date.parse(valor))) {
            return "Sin hora registrada";
          }
          return new Date(valor).toLocaleString("es-CO");
        };

        async function refrescar(inicial = false) {
          try {
            const datos = await api(
              "GET",
              `/api/ticket/fases?ticket=${encodeURIComponent(ticket.id)}`,
            );
            // Una respuesta tardía no modifica una vista abandonada ni una pantalla
            // que quedó ocupada mientras se consultaban las fases.
            if (
              !inicial &&
              (bandaDeFasesActual?.refrescar !== refrescar || !puedeRefrescar())
            ) {
              if (bandaDeFasesActual?.refrescar === refrescar) avisarQueHayCambios();
              return;
            }
            const nuevos = [];
            if (datos.fases.length === 0) {
              nuevos.push(el("div", "Sin línea de fases", "resultado"));
            }
            for (const fase of datos.fases) {
              const conMotivo =
                ["blocked", "changes_requested"].includes(fase.estado) && fase.motivo;
              const tramo = el("div", undefined, "banda-fase");
              if (fase.enCurso) tramo.className += " actual";
              if (conMotivo) tramo.className += " motivo-de-bloqueo";
              tramo.append(
                el("strong", rotulos[fase.estado] ?? fase.estado),
                el("div", `Inicio: ${fecha(fase.inicio)}`, "banda-fase-tiempo"),
              );
              if (fase.enCurso) {
                const ms = fase.inicio === null ? null : Date.now() - Date.parse(fase.inicio);
                tramo.append(el("div", `En curso · Tiempo llevado: ${duracion(ms)}`, "banda-fase-tiempo"));
              } else {
                tramo.append(
                  el("div", `Fin: ${fecha(fase.fin)}`, "banda-fase-tiempo"),
                  el("div", `Duración: ${duracion(fase.ms)}`, "banda-fase-tiempo"),
                );
              }
              if (conMotivo) {
                tramo.append(el("div", `Motivo del bloqueo: ${fase.motivo}`, "banda-fase-motivo"));
              }
              nuevos.push(tramo);
            }
            tramos.textContent = "";
            tramos.replaceChildren(...nuevos);
          } catch {
            // Solo la carga inicial muestra la fila vacía: un fallo transitorio
            // del refresco conserva el último historial que la persona vio.
            if (inicial) {
              tramos.textContent = "";
              tramos.append(el("div", "Sin línea de fases", "resultado"));
            }
          }
        }
        bandaDeFasesActual = { id, refrescar };
        void refrescar(true);
        return refrescar;
      }

      // ── Detalle: ciclo de ocho pasos, «Te toca» y pestañas (FEATURE-WEB-TRABAJO-TICKETS-20261014) ──

      /** La pestaña que la persona tenía abierta en este ticket: un refresco no la cambia. */
      let pestanaDelTicket = { id: "", nombre: "Resumen" };

      /** Los ocho pasos del ciclo con quién decide cada uno (boceto `assets/ticket.html`). */
      function cicloDelTicket(turno) {
        const PASOS = [
          ["Pedido", "persona"],
          ["Análisis", "modelo"],
          ["Plan", "modelo"],
          ["Aprobación", turno.motivo === "aprobar-plan" ? "persona" : "política"],
          ["Desarrollo", "modelo"],
          ["Tus pruebas", "persona"],
          ["QA", "persona"],
          ["Cierre", "código"],
        ];
        const ciclo = el("ol", undefined, "ciclo-ticket");
        ciclo.setAttribute("aria-label", "Ciclo del ticket");
        PASOS.forEach(([nombre, quien], i) => {
          const n = i + 1;
          const hecho = n < turno.paso;
          const actual = n === turno.paso;
          const clase = hecho
            ? " hecho"
            : actual
              ? ` actual ${turno.quien === "persona" ? "persona" : "agente"}`
              : " pendiente";
          const paso = el("li", undefined, `paso-ciclo${clase}`);
          if (actual) paso.setAttribute("aria-current", "step");
          const claseQuien = { persona: "q-persona", modelo: "q-modelo", "política": "q-politica", "código": "q-codigo" }[quien];
          paso.append(
            el("span", hecho ? `${n} · ✓` : actual ? `${n} · ahora` : String(n), "paso-n"),
            el("span", nombre, "paso-nombre"),
            el("span", quien, `paso-quien ${claseQuien}`),
          );
          ciclo.append(paso);
        });
        return ciclo;
      }

      /**
       * El formulario de una acción de la persona: su nombre y su frase literal, y nada sale sin
       * los dos. La ruta anota el resultado y mueve el ticket a `in_qa`; no aprueba nada.
       */
      function formularioDeResultado(ticketId, resultado, alTerminar) {
        const TEXTOS = {
          pasaron: ["Pasaron las pruebas", "Tu frase literal: qué probaste y qué viste"],
          fallo: ["Algo falló", "Qué falló, con tus palabras"],
          omitir: ["Omitir con motivo", "Por qué se omiten las pruebas, con tus palabras"],
        };
        const [titulo, ayuda] = TEXTOS[resultado];
        const caja = el("div", undefined, "formulario-resultado");
        caja.append(el("div", titulo, "formulario-titulo"));
        const etiquetaActor = el("label", undefined, "formulario-campo");
        const actor = document.createElement("input");
        actor.type = "text";
        actor.className = "campo-actor";
        actor.value = responsable;
        actor.setAttribute("aria-label", "Tu nombre");
        etiquetaActor.append(el("span", "Tu nombre"), actor);
        const etiquetaFrase = el("label", undefined, "formulario-campo");
        const frase = document.createElement("textarea");
        frase.className = "campo-frase";
        frase.rows = 2;
        frase.setAttribute("aria-label", ayuda);
        etiquetaFrase.append(el("span", ayuda), frase);
        const salida = el("div", undefined, "resultado");
        salida.setAttribute("role", "status");
        const confirmar = el("button", "Confirmar", "boton-confirmar");
        confirmar.type = "button";
        const cancelar = el("button", "Cancelar", "enlace");
        cancelar.type = "button";
        cancelar.addEventListener("click", () => caja.remove?.() ?? (caja.hidden = true));
        confirmar.addEventListener("click", async () => {
          const quien = String(actor.value ?? "").trim();
          const palabras = String(frase.value ?? "").trim();
          if (quien === "" || palabras === "") {
            salida.className = "resultado error";
            salida.textContent = "Escribe tu nombre y tu frase literal: sin ellos el resultado no se registra.";
            return;
          }
          confirmar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "Registrando…";
          try {
            const r = await api("POST", `/api/tickets/${encodeURIComponent(ticketId)}/pruebas-del-responsable`, {
              resultado,
              actor: quien,
              frase: palabras,
            });
            guardarResponsable(quien);
            salida.className = "resultado ok";
            salida.textContent = r.details ?? "Resultado registrado.";
            await alTerminar();
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            confirmar.disabled = false;
          }
        });
        const acciones = el("div", undefined, "formulario-acciones");
        acciones.append(confirmar, cancelar);
        caja.append(etiquetaActor, etiquetaFrase, acciones, salida);
        return caja;
      }

      /** «Te toca»: solo si el turno es de la persona, con la acción concreta de su motivo. */
      function bloqueTeToca(t, turno, irA) {
        if (turno.quien !== "persona") return null;
        const bloque = el("section", undefined, "te-toca");
        bloque.setAttribute("aria-label", "Te toca");
        const cabeza = el("div", undefined, "te-toca-cabeza");
        const titulo = (texto, bajada) => {
          cabeza.append(el("h2", texto, "te-toca-titulo"));
          if (bajada) cabeza.append(el("span", bajada, "te-toca-bajada"));
          bloque.append(cabeza);
        };
        const irAPestana = (nombre, rotulo = `Ir a ${nombre}`) => {
          const boton = el("button", rotulo, "boton-neutro");
          boton.type = "button";
          boton.addEventListener("click", () => irA(nombre));
          return boton;
        };
        const lista = el("div", undefined, "te-toca-lista");

        if (turno.motivo === "pruebas") {
          const contrato = t.contratoDePruebas ?? { comandos: [], manuales: [] };
          titulo(
            "Te toca: prueba la entrega",
            [contrato.directorio, contrato.ambiente].filter((v) => v).join(" · "),
          );
          (contrato.comandos ?? []).forEach((c, i) => {
            const fila = comandoCopiable(c.comando, i + 1);
            if (c.esperado) fila.title = `Resultado esperado: ${c.esperado}`;
            lista.append(fila);
          });
          (contrato.manuales ?? []).forEach((m, i) => {
            const fila = el("div", undefined, "comando-manual");
            fila.append(
              el("span", String((contrato.comandos ?? []).length + i + 1), "comando-n"),
              el("span", m, "comando-manual-texto"),
              el("span", "manual", "comando-marca"),
            );
            lista.append(fila);
          });
          if (lista.children.length === 0) {
            lista.append(el("div", "El ticket no trae un contrato de pruebas legible: léelo en Plan › Pruebas.", "resultado"));
          }
          bloque.append(lista);
          const zonaFormulario = el("div");
          const acciones = el("div", undefined, "te-toca-acciones");
          for (const [resultado, rotulo, clase] of [
            ["pasaron", "Pasaron las pruebas", "boton-ok"],
            ["fallo", "Algo falló", "boton-no"],
            ["omitir", "Omitir con motivo", "boton-neutro"],
          ]) {
            const boton = el("button", rotulo, clase);
            boton.type = "button";
            boton.addEventListener("click", () => {
              zonaFormulario.textContent = "";
              zonaFormulario.append(formularioDeResultado(t.id, resultado, () => navegar()));
            });
            acciones.append(boton);
          }
          bloque.append(acciones, zonaFormulario);
          return bloque;
        }

        const acciones = el("div", undefined, "te-toca-acciones");
        if (turno.motivo === "ratificar") {
          titulo("Te toca: ratifica lo que decidió el agente", "antes de cerrar");
          for (const resumen of t.porRatificar ?? []) lista.append(el("div", resumen, "te-toca-item"));
          lista.append(comandoCopiable(`valmen ratify --id ${t.id} --actor <tú> --quote "<tus palabras>"`));
          acciones.append(irAPestana("Decisiones del agente", "Ver las decisiones"));
        } else if (turno.motivo === "qa") {
          titulo("Te toca: haz la QA", "la QA es de una persona");
          lista.append(
            comandoCopiable(`valmen qa-start --id ${t.id} --environment <entorno> --build-reference <referencia>`, 1),
            comandoCopiable(`valmen qa-close --id ${t.id} --result <resultado> --all-covered`, 2),
          );
        } else if (turno.motivo === "bloqueado") {
          titulo("Te toca: desbloquea el ticket", "decide por dónde sigue");
          lista.append(el("div", "El motivo está en la línea de fases de Resumen; el movimiento, en «Avanzar el estado».", "te-toca-item"));
          acciones.append(irAPestana("Compuertas"));
        } else if (turno.motivo === "cambios") {
          titulo("Te toca: la QA pidió cambios", "decide cuándo vuelve al agente");
          lista.append(el("div", "Los puntos abiertos están en Evidencia; muévelo a in_progress en «Avanzar el estado».", "te-toca-item"));
          acciones.append(irAPestana("Compuertas"));
        } else if (turno.motivo === "aprobar-plan") {
          titulo("Te toca: aprueba el plan", "ninguna autorización vigente lo aprueba");
          acciones.append(irAPestana("Compuertas"));
        } else {
          titulo(`Te toca: decide la compuerta ${turno.compuerta ?? ""}`.trim(), "el evaluador no pudo decidir");
          acciones.append(irAPestana("Compuertas"));
        }
        if (lista.children.length > 0) bloque.append(lista);
        if (acciones.children.length > 0) bloque.append(acciones);
        return bloque;
      }

      /** Los criterios con su marca ✓/○ y cómo se verifican (test, manual o dev). */
      function tarjetaCriterios(texto) {
        const tarjeta = el("section", undefined, "tarjeta-ticket");
        tarjeta.append(el("h2", "Criterios de aceptación", "tarjeta-ticket-titulo"));
        const lineas = String(texto ?? "").split("\n");
        const lista = el("ul", undefined, "criterios-resumen");
        lineas.forEach((linea, i) => {
          const m = /^\s*[-*]\s+\[([ xX])\]\s*(.*)$/.exec(linea);
          if (m === null || (m[2] ?? "").trim() === "") return;
          const siguiente = lineas[i + 1] ?? "";
          // `\x3c` es «<»: un «<» seguido de «!--» literal dentro del <script> cambia cómo el
          // navegador busca su cierre, y el módulo entero deja de ejecutarse.
          const via = /\x3c!--\s*test:/.test(siguiente)
            ? "test"
            : /\x3c!--\s*verify:\s*dev/.test(siguiente)
              ? "dev"
              : /\x3c!--\s*verify:/.test(siguiente)
                ? "manual"
                : "";
          const hecho = m[1] !== " ";
          const item = el("li", undefined, `criterio-resumen${hecho ? " hecho" : ""}`);
          const marca = el("span", hecho ? "✓" : "○", "criterio-marca");
          marca.setAttribute("aria-label", hecho ? "verificado" : "pendiente");
          item.append(marca, el("span", m[2].trim(), "criterio-texto"), el("span", via, `criterio-via ${via}`));
          lista.append(item);
        });
        if (lista.children.length === 0) {
          tarjeta.append(el("div", "El ticket no declara criterios de aceptación.", "vacio"));
        } else {
          tarjeta.append(lista);
        }
        return tarjeta;
      }

      /** Las decisiones del agente: lo que falta ratificar y cada decisión con su criterio y su fuente. */
      function listaDeDecisionesDelAgente(t) {
        const zona = el("div", undefined, "decisiones-agente");
        const pendientes = t.porRatificar ?? [];
        zona.append(el("h3", pendientes.length === 0 ? "Nada por ratificar" : `Por ratificar (${pendientes.length})`));
        for (const resumen of pendientes) zona.append(el("div", resumen, "te-toca-item"));
        if (pendientes.length > 0) {
          zona.append(comandoCopiable(`valmen ratify --id ${t.id} --actor <tú> --quote "<tus palabras>"`));
        }
        const decisiones = (t.events ?? []).filter((e) => e.action === "agent-decision");
        zona.append(el("h3", `Decisiones registradas (${decisiones.length})`));
        if (decisiones.length === 0) zona.append(el("div", "El agente no registró decisiones en este ticket.", "vacio"));
        for (const evento of decisiones) {
          let d = {};
          try {
            d = JSON.parse(String(evento.details ?? "{}"));
          } catch {
            d = {};
          }
          const caja = el("div", undefined, "tarjeta-dato");
          const cabecera = el("div", undefined, "tarjeta-dato-cabecera");
          cabecera.append(el("span", String(d.id ?? evento.id ?? ""), "id"), el("span", String(evento.date ?? ""), "cifra"));
          caja.append(cabecera, el("div", String(d.pregunta ?? ""), "nombre"), el("div", `Elección: ${d.eleccion ?? ""}`, "tarjeta-dato-nota"));
          if (d.criterio) caja.append(el("div", `Criterio: ${d.criterio}`, "resultado"));
          if (d.fuente) caja.append(el("div", `Fuente: ${d.fuente}`, "ruta"));
          if (d.reversion) caja.append(el("div", `Cómo se revierte: ${d.reversion}`, "resultado"));
          zona.append(caja);
        }
        return zona;
      }

      /** El detalle de un ticket: ciclo, «Te toca» y siete pestañas con todo lo de antes. */
      async function vistaTicket(id) {
        const cont = $("contenido");
        cont.textContent = "";

        const t = await api("GET", `/api/tickets/${id}`);
        const turno = turnoDe(t);
        if (pestanaDelTicket.id !== id) pestanaDelTicket = { id, nombre: "Resumen" };

        const pagina = el("div", undefined, "vista-ticket");
        cont.append(pagina);

        const migas = el("nav", undefined, "ticket-migas");
        migas.setAttribute("aria-label", "Ruta");
        const volver = el("a", "Tickets", "ticket-migas-enlace");
        volver.href = "#/tickets";
        migas.append(volver, el("span", " › ", "ticket-migas-sep"), el("span", t.id));
        pagina.append(migas);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h1", t.title, "ticket-titulo-detalle"));
        const marcas = el("div", undefined, "ticket-marcas-detalle");
        marcas.append(
          el("span", t.type, "marca-ticket tipo"),
          el("span", t.module, "marca-ticket"),
          el("span", t.workflowStatus, `marca-ticket estado${turno.quien === "persona" ? " persona" : ""}`),
        );
        if (t.invalid !== null && t.invalid !== undefined) marcas.append(el("span", "inválido", "etiqueta roto"));
        cabecera.append(marcas);
        pagina.append(cabecera);

        pagina.append(cicloDelTicket(turno));

        // ── Pestañas: todas se pintan; las no elegidas quedan ocultas ──
        const NOMBRES = ["Resumen", "Análisis", "Plan", "Compuertas", "Decisiones del agente", "Evidencia", "Consumo de IA"];
        const listaPestanas = el("div", undefined, "pestanas-ticket");
        listaPestanas.setAttribute("role", "tablist");
        listaPestanas.setAttribute("aria-label", "Secciones del ticket");
        const botones = new Map();
        const paneles = new Map();
        const cuentas = new Map();
        /** Lo que vive fuera del panel Resumen pero se ve con él (tira de estado y banda de fases). */
        const delResumen = [];
        const elegir = (nombre) => {
          pestanaDelTicket = { id, nombre };
          for (const [clave, boton] of botones) {
            boton.setAttribute("aria-selected", String(clave === nombre));
            boton.className = `pestana-ticket${clave === nombre ? " elegida" : ""}`;
            paneles.get(clave).hidden = clave !== nombre;
          }
          for (const nodo of delResumen) nodo.hidden = nombre !== "Resumen";
        };
        for (const nombre of NOMBRES) {
          const boton = el("button", undefined, "pestana-ticket");
          boton.type = "button";
          boton.setAttribute("role", "tab");
          const cuenta = el("span", "", "pestana-cuenta");
          boton.append(el("span", nombre, "pestana-nombre"), cuenta);
          boton.addEventListener("click", () => elegir(nombre));
          botones.set(nombre, boton);
          cuentas.set(nombre, cuenta);
          listaPestanas.append(boton);
          const panel = el("div", undefined, "panel-ticket");
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("data-pestana", nombre);
          panel.setAttribute("aria-label", nombre);
          paneles.set(nombre, panel);
        }

        const teToca = bloqueTeToca(t, turno, elegir);
        if (teToca !== null) pagina.append(teToca);
        pagina.append(listaPestanas, ...paneles.values());
        elegir(NOMBRES.includes(pestanaDelTicket.nombre) ? pestanaDelTicket.nombre : "Resumen");

        const PUNTOS_ABIERTOS = ["open", "analyzed", "in_progress", "awaiting_retest"];
        const abiertos = t.points.filter((p) => PUNTOS_ABIERTOS.includes(String(p.status))).length;

        // ── Resumen: criterios, compuertas y lo que decidió el agente; debajo, el estado de siempre ──
        const resumen = paneles.get("Resumen");
        const rejilla = el("div", undefined, "resumen-rejilla");
        rejilla.append(tarjetaCriterios(t.sections["Criterios de aceptación"]));
        const lateral = el("aside", undefined, "resumen-lateral");
        const tarjetaCompuertas = el("section", undefined, "tarjeta-ticket");
        tarjetaCompuertas.append(el("h2", "Compuertas", "tarjeta-ticket-titulo"));
        const filasCompuertas = el("div", undefined, "compuertas-resumen");
        filasCompuertas.append(el("div", "Leyendo las compuertas…", "resultado"));
        const verRecibos = el("button", "Ver recibos →", "enlace");
        verRecibos.type = "button";
        verRecibos.addEventListener("click", () => elegir("Compuertas"));
        tarjetaCompuertas.append(filasCompuertas, verRecibos);
        const decisionesAgente = (t.events ?? []).filter((e) => e.action === "agent-decision").length;
        const porRatificar = (t.porRatificar ?? []).length;
        const tarjetaAgente = el("section", undefined, "tarjeta-ticket");
        tarjetaAgente.append(
          el("h2", "Decidió el agente", "tarjeta-ticket-titulo"),
          el(
            "div",
            `${decisionesAgente} ${decisionesAgente === 1 ? "decisión" : "decisiones"}; ${porRatificar} por ratificar.` +
              (porRatificar > 0 ? " Las ratificas antes de cerrar." : ""),
            "resultado",
          ),
        );
        if (porRatificar > 0) {
          tarjetaAgente.append(comandoCopiable(`valmen ratify --id ${t.id} --actor <tú> --quote "<tus palabras>"`));
        }
        lateral.append(tarjetaCompuertas, tarjetaAgente);
        rejilla.append(lateral);
        resumen.append(rejilla);
        if (porRatificar > 0) cuentas.get("Decisiones del agente").textContent = String(porRatificar);
        cuentas.get("Decisiones del agente").className = "pestana-cuenta persona";

        // La tira de estado y la banda de fases van directas en el contenido, una tras otra, como
        // antes del rediseño: la banda se refresca sola y lo demás no debe moverse con ella. Se
        // ven con la pestaña Resumen.
        const tira = tiraDeEstado(t, abiertos);
        cont.append(tira);
        pintarBandaDeFases(cont, t, id);
        const banda = cont.children[cont.children.length - 1];
        delResumen.push(tira, banda);
        elegir(pestanaDelTicket.nombre);
        if (t.invalid !== null && t.invalid !== undefined) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El ticket no valida. "), el("span", t.invalid));
          resumen.append(nota);
        }
        const meta = el("div", undefined, "meta");
        meta.append(el("span", t.id, "id"), el("span", `creado ${t.created}`, "etiqueta"));
        resumen.append(meta, el("div", t.path, "ruta"));

        // ── Compuertas: responsable, compuertas, avanzar el estado e historial ──
        const panelCompuertas = paneles.get("Compuertas");
        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las decisiones");
        etiquetaResponsable.htmlFor = "responsable";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () => guardarResponsable(entradaResponsable.value));
        barraResponsable.append(
          etiquetaResponsable,
          entradaResponsable,
          el("span", "Se registra en el recibo junto a la decisión: aprobar sin nombre no es auditable.", "resultado"),
        );
        panelCompuertas.append(barraResponsable);

        const acordeonGates = acordeon("Compuertas", undefined, true);
        const zonaGates = el("div");
        acordeonGates.cuerpo.append(zonaGates);
        const zonaCorrecciones = el("div");
        acordeonGates.cuerpo.append(zonaCorrecciones);
        const acordeonHistorial = acordeon("Historial de decisiones");

        const pintarCorrecciones = (correcciones) => {
          zonaCorrecciones.textContent = "";
          for (const c of correcciones) {
            const caja = el("div", undefined, "correccion");
            caja.append(
              el(
                "div",
                c.retryExhausted
                  ? `Segundo rechazo del gate ${c.gate}: no queda reintento automático`
                  : `Corrección pendiente del gate ${c.gate}`,
                "correccion-titulo",
              ),
            );
            const quien = el("div", undefined, "resultado");
            quien.append(
              el("span", `Rechazado por ${c.actor} · ${c.decidedAt.slice(0, 10)}`),
              c.retryExhausted
                ? el("span", " — el autor ya corrigió una vez y volvió a rechazarse. Decide tú: aprobar, o cambiar el plan a mano.")
                : el("span", " — el motivo está en el historial del ticket, listo para corregir."),
            );
            caja.append(quien);
            if (c.reason) caja.append(el("div", c.reason, "correccion-motivo"));
            zonaCorrecciones.append(caja);
          }
        };

        /** El último resultado de cada compuerta, para la tarjeta de Resumen. */
        const pintarResumenDeCompuertas = (decisiones) => {
          filasCompuertas.textContent = "";
          const ultimo = new Map();
          for (const d of decisiones) {
            const previo = ultimo.get(d.gate);
            if (previo === undefined || String(d.decidedAt ?? "") >= String(previo.decidedAt ?? "")) ultimo.set(d.gate, d);
          }
          if (ultimo.size === 0) {
            filasCompuertas.append(el("div", "Sin compuertas evaluadas todavía.", "resultado"));
            return;
          }
          for (const d of ultimo.values()) {
            filasCompuertas.append(el("span", d.gate, "compuerta-nombre"), el("span", d.outcome, `compuerta-resultado ${d.outcome}`));
          }
          cuentas.get("Compuertas").textContent = String(ultimo.size);
        };

        const cargarGates = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaGates.textContent = "";
          acordeonHistorial.cuerpo.textContent = "";
          acordeonHistorial.cuerpo.append(tiraDeDecisiones(datos.decisions ?? []));
          pintarCorrecciones(datos.corrections ?? []);
          pintarResumenDeCompuertas(datos.decisions ?? []);
          for (const gate of datos.gates ?? []) {
            zonaGates.append(
              tarjetaGate({ ...gate, ticketId: id }, datos.decisions, async () => {
                guardarResponsable(entradaResponsable.value);
                await cargarGates();
              }),
            );
          }
        };
        await cargarGates();

        // Los estados los calcula el servidor desde la tabla del contrato: aquí solo se pintan.
        const acordeonTransiciones = acordeon("Avanzar el estado", undefined, true);
        const zonaTransiciones = el("div");
        acordeonTransiciones.cuerpo.append(zonaTransiciones);
        const cargarTransiciones = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaTransiciones.textContent = "";
          const tr = datos.transitions;
          if (tr === null || tr === undefined) {
            zonaTransiciones.append(el("div", "Todos los movimientos de este ticket están hechos.", "resultado"));
            return;
          }
          const caja = el("div", undefined, "transiciones");
          const salidaTransicion = el("div", undefined, "resultado");
          const fila = (etiqueta, desde, destinos, entidad, pointId) => {
            const linea = el("div", undefined, "transicion");
            linea.append(el("span", `${etiqueta}: ${desde}`, "resultado"));
            if (destinos.length === 0) linea.append(el("span", "sin salidas", "resultado"));
            for (const destino of destinos) {
              const boton = el("button", destino);
              boton.addEventListener("click", async () => {
                boton.disabled = true;
                salidaTransicion.className = "resultado";
                salidaTransicion.textContent = "moviendo…";
                try {
                  const r = await api("POST", `/api/tickets/${id}/transition`, {
                    entity: entidad,
                    to: destino,
                    ...(pointId === undefined ? {} : { pointId }),
                  });
                  salidaTransicion.className = "resultado ok";
                  salidaTransicion.textContent = r.details;
                  await navegar();
                } catch (fallo) {
                  // Un rechazo del motor se muestra tal cual: es la explicación.
                  salidaTransicion.className = "resultado error";
                  salidaTransicion.textContent = fallo.message;
                  boton.disabled = false;
                }
              });
              linea.append(boton);
            }
            return linea;
          };
          caja.append(fila("Ticket", "→", tr.ticket ?? [], "ticket"));
          caja.append(fila("Release", "→", tr.release ?? [], "release"));
          for (const punto of tr.points ?? []) {
            if (punto.to.length === 0) continue;
            caja.append(fila(punto.id, "→", punto.to, "point", punto.id));
          }
          caja.append(salidaTransicion);
          zonaTransiciones.append(caja);
        };
        await cargarTransiciones();
        panelCompuertas.append(acordeonGates.caja, acordeonTransiciones.caja, acordeonHistorial.caja);

        // ── Análisis y Plan: las secciones del ticket, con la del turno abierta ──
        const seccion = (titulo, vacia, resumenAcordeon) => {
          const caja = acordeonDeSeccion(titulo, resumenAcordeon, t.workflowStatus);
          const texto = t.sections[titulo] ?? "";
          caja.cuerpo.append(texto.trim() === "" ? el("div", vacia, "vacio") : seccionDeTicket(texto));
          return caja.caja;
        };
        const solicitud = acordeonDeSeccion("Solicitud original", undefined, t.workflowStatus);
        solicitud.cuerpo.append(t.request.trim() === "" ? el("div", "(vacía)", "vacio") : seccionDeTicket(t.request));
        paneles.get("Análisis").append(
          solicitud.caja,
          seccion("Descripción funcional", "(vacía)"),
          seccion("Diagnóstico", "(vacío)", t.sections["Diagnóstico"] ? "" : "vacío"),
        );

        // Los criterios se cuentan y se pintan como lista: son la lista contra la que se mide el plan.
        const criterios = (t.sections["Criterios de aceptación"] ?? "")
          .split("\n")
          .map((linea) => /^\s*[-*]\s+\[[ xX]\]\s*(.*)$/.exec(linea))
          .filter((m) => m !== null && (m[1] ?? "").trim() !== "")
          .map((m) => m[1].trim());
        const acordeonCriterios = acordeonDeSeccion("Criterios de aceptación", `${criterios.length}`, t.workflowStatus);
        if (criterios.length === 0) {
          acordeonCriterios.cuerpo.append(el("div", "El ticket no declara criterios de aceptación.", "vacio"));
        } else {
          const lista = el("ul", undefined, "lista-criterios");
          for (const criterio of criterios) lista.append(el("li", criterio));
          acordeonCriterios.cuerpo.append(lista);
        }
        paneles.get("Plan").append(
          seccion("Plan", "(vacío)", t.sections["Plan"] ? "" : "vacío"),
          acordeonCriterios.caja,
          seccion("Implementación", "(vacía)"),
          seccion("Pruebas", "(vacía)"),
        );

        // ── Decisiones del agente ──
        paneles.get("Decisiones del agente").append(listaDeDecisionesDelAgente(t));

        // ── Evidencia: puntos, QA, evidencia, retests, cierre, release, eventos y ejecutor ──
        const evidencia = paneles.get("Evidencia");
        const bloques = [
          ["Puntos", t.points],
          ["QA", t.qa],
          ["Evidencia", t.evidence],
          ["Retests", t.retests],
          ["Cierre", t.closures],
        ];
        for (const [titulo, items] of bloques) {
          const caja = acordeon(titulo, `${items.length}`);
          const construir =
            titulo === "QA" ? (registro) => tarjetaCicloQa(registro, items.indexOf(registro)) : tarjetaDato;
          caja.cuerpo.append(tarjetasDe(items, construir, `Sin registros en ${titulo.toLowerCase()}.`));
          evidencia.append(caja.caja);
        }
        const release = acordeon("Release");
        release.cuerpo.append(
          (t.sections["Release"] ?? "").trim() === "" ? el("div", "(vacía)", "vacio") : seccionDeTicket(t.sections["Release"]),
        );
        const acordeonEventos = acordeon("Eventos", `${t.events.length}`);
        acordeonEventos.cuerpo.append(tarjetasDe(t.events.slice().reverse(), tarjetaEvento, "Sin eventos registrados."));
        const acordeonEjecucion = acordeon("Actividad del ejecutor");
        const zonaEjecucion = el("div", "Leyendo ejecuciones declaradas…", "vacio");
        acordeonEjecucion.cuerpo.append(zonaEjecucion);
        evidencia.append(release.caja, acordeonEventos.caja, acordeonEjecucion.caja);
        void pintarActividadDelEjecutor(id)
          .then((nodo) => {
            zonaEjecucion.textContent = "";
            zonaEjecucion.append(nodo);
          })
          .catch((fallo) => {
            zonaEjecucion.textContent = "";
            zonaEjecucion.append(el("div", fallo.message, "resultado"));
          });

        // ── Consumo de IA: línea de tiempo y coste, y lo registrado ──
        const consumo = paneles.get("Consumo de IA");
        const acordeonLinea = acordeon("Línea de tiempo y coste", undefined, true);
        const zonaLinea = el("div");
        zonaLinea.append(el("div", "Leyendo la contabilidad del cliente…", "vacio"));
        acordeonLinea.cuerpo.append(zonaLinea);
        void pintarLineaDeTiempo(id).then((nodo) => {
          if (nodo === null) return;
          zonaLinea.textContent = "";
          zonaLinea.append(nodo);
        });
        // Guardar el consumo vive con los datos que describe.
        const pieConsumo = el("div", undefined, "responsable");
        const guardarConsumo = el("button", "Guardar el consumo en el ticket");
        const avisoConsumo = el("div", undefined, "resultado");
        pieConsumo.append(guardarConsumo, avisoConsumo);
        acordeonLinea.cuerpo.append(pieConsumo);
        guardarConsumo.addEventListener("click", async () => {
          guardarConsumo.disabled = true;
          avisoConsumo.className = "resultado";
          avisoConsumo.textContent = "Guardando…";
          try {
            const r = await api("POST", `/api/tickets/${encodeURIComponent(id)}/consumo`);
            avisoConsumo.className = "resultado ok";
            avisoConsumo.textContent = `${r.entradas.join(", ")} — ${r.detalle}`;
          } catch (fallo) {
            avisoConsumo.className = "resultado error";
            avisoConsumo.textContent = fallo.message;
          } finally {
            guardarConsumo.disabled = false;
          }
        });
        const acordeonConsumo = acordeon("Consumo de IA", `${t.usage.length}`);
        acordeonConsumo.cuerpo.append(tarjetasDe(t.usage, tarjetaConsumo, "El consumo no se ha registrado todavía."));
        consumo.append(acordeonLinea.caja, acordeonConsumo.caja);
      }

      /** La foto no abre conversaciones: cada sesión pide su propia página al pulsar. */
      async function pintarActividadDelEjecutor(ticketId) {
        const datos = await api("GET", `/api/tickets/${encodeURIComponent(ticketId)}/executions`);
        const zona = el("div");
        if ((datos.executions ?? []).length === 0) {
          zona.append(el("div", "No hay ejecuciones declaradas para este ticket.", "vacio"));
          return zona;
        }
        for (const ejecucion of datos.executions) {
          const caja = el("div", undefined, "seccion-ticket");
          caja.append(el("strong", `Ejecución ${ejecucion.identity.executionId}`));
          caja.append(el("div", `Workflow: ${ejecucion.status.validatedStatus ?? "desconocido"} · actividad: ${ejecucion.status.liveness}`, "resultado"));
          for (const intento of ejecucion.attempts) {
            const intentoNodo = el("div", undefined, "resultado");
            intentoNodo.append(el("strong", `Intento ${intento.attemptId}`));
            for (const actividad of intento.activity) intentoNodo.append(el("div", `${actividad.state} · ${actividad.source} · ${actividad.occurredAt}`));
            for (const modelo of intento.configuredModels) intentoNodo.append(el("div", `Modelo configurado: ${modelo.model.provider}/${modelo.model.model}`));
            for (const modelo of intento.effectiveModels) intentoNodo.append(el("div", `Modelo efectivo: ${modelo.model.provider}/${modelo.model.model}`));
            for (const sesion of intento.sessions) {
              const sesionNodo = el("div", undefined, "nota");
              sesionNodo.append(el("div", `Sesión ejecutora: ${sesion.executor.adapter}/${sesion.executor.scope}/${sesion.executor.sessionId}`));
              if (sesion.capabilities !== null) sesionNodo.append(el("div", sesion.capabilities.capabilities.map((c) => `${c.capability}: ${c.available ? "disponible" : c.limitation}`).join(" · "), "resultado"));
              if (!sesion.messages.available) {
                sesionNodo.append(el("div", sesion.messages.reason, "resultado"));
              } else {
                const mensajes = el("div");
                const cargar = el("button", "Cargar mensajes visibles");
                let cursor = 0;
                cargar.addEventListener("click", async () => {
                  cargar.disabled = true;
                  try {
                    const ruta = `/api/tickets/${encodeURIComponent(ticketId)}/executions/${encodeURIComponent(ejecucion.identity.executionId)}/messages?attempt=${encodeURIComponent(intento.attemptId)}&session=${encodeURIComponent(sesion.executor.sessionId)}&after=${cursor}&limit=100`;
                    const pagina = await api("GET", ruta);
                    for (const mensaje of pagina.messages) mensajes.append(el("div", `${mensaje.role}: ${mensaje.content}`, "resultado"));
                    cursor = pagina.nextCursor;
                    cargar.textContent = pagina.messages.length === 0 ? "No hay más mensajes" : "Cargar más mensajes";
                    cargar.disabled = pagina.messages.length === 0;
                  } catch (fallo) {
                    mensajes.append(el("div", fallo.message, "error"));
                    cargar.disabled = false;
                  }
                });
                sesionNodo.append(cargar, mensajes);
              }
              intentoNodo.append(sesionNodo);
            }
            caja.append(intentoNodo);
          }
          zona.append(caja);
        }
        return zona;
      }

      // ── Línea de tiempo del ticket ────────────────────────────────────────
      //
      // Responde a una pregunta que el registro no contestaba: quién intervino,
      // con qué modelo y a qué coste. Los recibos de compuerta traen el coste
      // porque el harness evaluó y lo sabe de primera mano; el trabajo del agente
      // —explorar, escribir, corregir— no estaba en ninguna parte.
      //
      // El dato se **lee** de la contabilidad que el cliente ya escribe, no se le
      // pregunta al modelo: un agente que reporta su propio gasto puede reportar
      // de menos y no habría forma de notarlo.
      //
      // El desglose importa más de lo que parece: en el primer ticket medido, dos
      // tercios del gasto se fueron en explorar el código y no en el harness. Sin
      // esta vista, ese dinero era invisible.
      async function pintarLineaDeTiempo(id) {
        let datos;
        try {
          datos = await api("GET", `/api/timeline?ticket=${encodeURIComponent(id)}`);
        } catch {
          return null;
        }
        // Las compuertas se pintan con sesiones o sin ellas: el harness las pagó y
        // las conoce de primera mano, y que ninguna sesión se haya podido leer no
        // las borra. Esta vista las escondía cuando no había sesiones, y un ticket
        // trabajado desde un agente que el harness aún no lee quedaba sin ningún
        // dato aunque sus recibos existieran.
        const compuertas = datos.compuertas ?? [];
        const costeCompuertas = compuertas.reduce((suma, c) => suma + (c.costUsd ?? 0), 0);
        const tablaDeCompuertas = () => {
          const tablaCompuertas = el("table", undefined, "tabla-intervenciones");
          const cabCompuertas = el("tr");
          for (const titulo of ["compuerta", "resultado", "actor", "modelo", "tokens", "coste"]) {
            cabCompuertas.append(el("th", titulo));
          }
          tablaCompuertas.append(cabCompuertas);
          for (const c of compuertas) {
            const fila = el("tr");
            fila.append(
              el("td", c.gate, "id"),
              el("td", c.outcome),
              el("td", c.actor),
              el("td", c.model ?? "mecánico (sin modelo)", "id"),
              el("td", `${((c.inputTokens + c.outputTokens) / 1e3).toFixed(1)}K`, "id"),
              el("td", `$${(c.costUsd ?? 0).toFixed(6)}`, "cifra"),
            );
            tablaCompuertas.append(fila);
          }
          return tablaCompuertas;
        };

        if (datos.available !== true) {
          const aviso = el(
            "div",
            `Sin datos de consumo: ${datos.reason ?? "no se encontró la contabilidad del cliente."}`,
            "nota",
          );
          if (compuertas.length === 0) return aviso;
          const zonaSinDatos = el("div");
          zonaSinDatos.append(
            aviso,
            el(
              "div",
              `Las compuertas sí constan: ${compuertas.length} ($${costeCompuertas.toFixed(6)}).`,
              "resultado",
            ),
            tablaDeCompuertas(),
          );
          return zonaSinDatos;
        }

        const zona = el("div");
        const sesiones = datos.sessions ?? [];

        // Sin sesiones que hayan trabajado **este** ticket, se dice. Antes esta
        // vista mostraba el gasto de todas las sesiones del proyecto como si
        // fueran del ticket: un número con aspecto de dato y sin relación con lo
        // que se estaba mirando.
        if (sesiones.length === 0) {
          zona.append(
            el(
              "div",
              "Ninguna sesión trabajó este ticket: ni de opencode, ni de codex, ni de " +
                "Claude Code, ni de Hermes. El consumo se registra buscando el identificador " +
                "en lo que hizo cada sesión, así que un ticket que se trabajó a mano no " +
                "tiene nada que mostrar.",
              "vacio",
            ),
          );
          if (compuertas.length > 0) {
            zona.append(
              el(
                "div",
                `El harness sí evaluó ${compuertas.length} compuerta(s) ($${costeCompuertas.toFixed(6)}):`,
                "resultado",
              ),
              tablaDeCompuertas(),
            );
          }
          return zona;
        }

        const conCoste = sesiones.filter((s) => s.costUsd !== null);
        const coste = conCoste.reduce((suma, s) => suma + s.costUsd, 0);
        const tokens = sesiones.reduce(
          (suma, s) =>
            suma + s.inputTokens + s.outputTokens + s.reasoningTokens + s.cacheReadTokens,
          0,
        );

        // Las llamadas al registro de las sesiones de Claude Code, que no entran en
        // `datos.intervenciones` (esa lista es por llamada y con coste, y Claude
        // Code no guarda el coste de cada mensaje). Una compartida no se suma: su
        // trabajo es de varios tickets.
        const llamadasDeClaude = sesiones
          .filter((s) => s.source === "claude" && s.reparto === undefined)
          .reduce((suma, s) => suma + s.intervenciones, 0);

        const resumen = el("div", undefined, "meta");
        resumen.append(
          el("span", `coste $${coste.toFixed(6)}`, "etiqueta"),
          el("span", `${(tokens / 1e6).toFixed(1)}M tokens`, "etiqueta"),
          el("span", `${sesiones.length} sesión(es)`, "etiqueta"),
          el(
            "span",
            `${datos.intervenciones.length + llamadasDeClaude} intervención(es) sobre el registro`,
            "etiqueta",
          ),
        );
        // El costo de decidir también es costo del ticket: las compuertas que el
        // harness pagó van al total, separadas para que se lea qué fue decisión
        // y qué fue trabajo.
        if (compuertas.length > 0) {
          resumen.append(
            el(
              "span",
              `${compuertas.length} compuerta(s) ($${costeCompuertas.toFixed(6)})`,
              "etiqueta",
            ),
          );
        }
        if (datos.sesionesSinCoste > 0) {
          // Un proveedor por suscripción no tiene precio por token: se dice, en
          // vez de sumar un cero que se leería como «gratis».
          resumen.append(
            el("span", `${datos.sesionesSinCoste} sin coste por token (suscripción)`, "etiqueta"),
          );
        }
        if (datos.sesionesCompartidas > 0) {
          // Una sesión que sirvió a varios tickets tiene un solo gasto y ningún
          // modo de repartirlo: se muestra marcada y **no** entra en el total, en
          // vez de adjudicarle a este ticket lo que costaron los otros.
          resumen.append(
            el(
              "span",
              `${datos.sesionesCompartidas} compartida(s) entre varios tickets ` +
                // Un coste cero que no existe —suscripción— se leería como «gratis».
                ((datos.costeCompartidoUsd ?? 0) > 0
                  ? `($${datos.costeCompartidoUsd.toFixed(4)} sin sumar)`
                  : "(sin sumar)"),
              "etiqueta",
            ),
          );
        }
        zona.append(
          el(
            "div",
            "Harness es lo que costó llamar a las herramientas del registro; " +
              "exploración es leer, buscar y editar. El desglose solo cuenta las sesiones " +
              "con coste por token, y deja fuera las compartidas: su gasto es de todos los " +
              "tickets que atendieron.",
            "resultado",
          ),
          resumen,
        );

        // Las sesiones, con su origen: una de codex o de Hermes se entiende sabiendo
        // de dónde viene, porque su coste puede no existir y sus tokens sí.
        const tablaSesiones = el("table", undefined, "tabla-intervenciones");
        const cabSesiones = el("tr");
        for (const titulo of ["origen", "agente", "modelo", "tokens", "coste", "intervenciones"]) {
          cabSesiones.append(el("th", titulo));
        }
        tablaSesiones.append(cabSesiones);
        for (const sesion of sesiones) {
          const fila = el("tr");
          const suyos = sesion.inputTokens + sesion.outputTokens + sesion.reasoningTokens;
          const cuantos = (sesion.reparto ?? []).length;
          fila.append(
            el("td", sesion.source, "id"),
            el(
              "td",
              cuantos === 0
                ? sesion.agent || "—"
                : `${sesion.agent || "—"} · compartida entre ${cuantos} tickets`,
            ),
            el(
              "td",
              sesion.model === ""
                ? "—"
                : // Una sesión con subagentes o con un cambio de modelo trae varios:
                  // `model` es el que más produjo y el resto se cuenta.
                  (sesion.modelos ?? []).length > 1
                  ? `${sesion.model} (+${sesion.modelos.length - 1})`
                  : sesion.model,
              "id",
            ),
            el("td", `${(suyos / 1e6).toFixed(2)}M`, "id"),
            el(
              "td",
              sesion.costUsd === null
                ? "suscripción"
                : `$${sesion.costUsd.toFixed(4)}${cuantos === 0 ? "" : " · no se suma"}`,
              "id",
            ),
            el("td", String(sesion.intervenciones), "id"),
          );
          tablaSesiones.append(fila);
        }
        zona.append(tablaSesiones);

        // El desglose de compuertas del ticket: qué evaluó el harness, con qué
        // modelo, qué costó decidir. Va antes del corte de intervenciones porque
        // un ticket sin llamadas al registro —el caso del cron— igual pagó sus
        // compuertas, y ocultarlas sería mostrar un costo de menos.
        if (compuertas.length > 0) {
          zona.append(tablaDeCompuertas());
        }

        if (datos.intervenciones.length === 0) {
          // Claude Code cuenta sus llamadas al registro una por una, pero no guarda
          // el coste de cada mensaje: sus llamadas están en la fila de la sesión y
          // no en esta lista. Decir que «ninguna llamó» sería falso.
          zona.append(
            el(
              "div",
              llamadasDeClaude > 0
                ? `Las sesiones de Claude Code hicieron ${llamadasDeClaude} llamada(s) al ` +
                    "registro; no guardan el coste por llamada, así que se cuentan por sesión."
                : "Ninguna de esas sesiones llamó a una herramienta del registro desde acá: " +
                    "el trabajo se hizo por el CLI o desde otro agente.",
              "resultado",
            ),
          );
          return zona;
        }

        const tabla = el("table", undefined, "tabla-intervenciones");
        const cab = el("tr");
        for (const titulo of ["hora", "herramienta", "resultado", "agente", "modelo", "coste"]) {
          cab.append(el("th", titulo));
        }
        tabla.append(cab);

        for (const i of datos.intervenciones) {
          const hora = new Date(i.at);
          const fila = el("tr");
          if (i.failed) fila.className = "fallo";

          fila.append(
            el(
              "td",
              `${String(hora.getHours()).padStart(2, "0")}:${String(hora.getMinutes()).padStart(2, "0")}:${String(hora.getSeconds()).padStart(2, "0")}`,
              "cifra",
            ),
            el("td", i.tool, "id"),
            el("td", i.failed ? "falló" : i.status),
            el("td", i.agent),
            el("td", `${i.provider}/${i.model}`, "ruta"),
            el("td", `$${i.costUsd.toFixed(6)}`, "cifra"),
          );
          tabla.append(fila);
        }

        zona.append(tabla);

        // Un fallo seguido de un reintento es una corrección, y contarlas es lo que
        // convierte la tabla en información: dice cuánto costó entenderse con el
        // agente, que es un número que nadie tiene.
        const fallos = datos.intervenciones.filter((i) => i.failed).length;
        if (fallos > 0) {
          zona.append(
            el(
              "div",
              fallos === 1
                ? "1 intervención falló y se reintentó."
                : `${fallos} intervenciones fallaron y se reintentaron.`,
              "resultado",
            ),
          );
        }

        zona.append(
          el(
            "div",
            `Leído de ${datos.source}. Corresponde a las sesiones de este proyecto: si el ticket ` +
              "se trabajó en más de una, el total de arriba las suma.",
            "ruta",
          ),
        );

        return zona;
      }

      // ── Piezas de la vista de ticket ──────────────────────────────────────
      //
      // Un acordeón por artefacto. El problema que resuelve: con el diagnóstico,
      // el plan y la línea de tiempo desplegados, para leer el ticket había que
      // bajar media pantalla cada vez. Plegado, el ticket se lee de un vistazo y
      // cada cosa se abre cuando se necesita.
      function acordeon(titulo, resumen, abierto = false, deTurno = false) {
        const caja = el("details", undefined, deTurno ? "acordeon de-turno" : "acordeon");
        // El título es la identidad del acordeón: es lo que permite reabrir, tras
        // un refresco, exactamente los que la persona había abierto. Sin clave no
        // se conserva nada, que es el comportamiento seguro.
        caja.dataset.acordeon = titulo;
        if (abierto) caja.open = true;
        const cabecera = el("summary");
        cabecera.append(el("span", titulo, "acordeon-titulo"));
        if (deTurno) {
          // La marca dice por qué esa sección está abierta: sin ella, «abierto» y
          // «es lo que toca ahora» se confunden, y el que llega nuevo cree que el
          // resto está cerrado por casualidad.
          cabecera.append(el("span", "lo que toca ahora", "marca-turno"));
        }
        if (resumen !== undefined && resumen !== "") {
          cabecera.append(el("span", resumen, "acordeon-resumen"));
        }
        const cuerpo = el("div", undefined, "acordeon-cuerpo");
        caja.append(cabecera, cuerpo);
        return { caja, cuerpo };
      }

      /**
       * Qué sección se mira primero en cada estado.
       *
       * El ticket avanza por artefactos —se describe, se diagnostica, se planifica,
       * se implementa, se prueba— y quien lo abre viene a mirar **el del estado en
       * que está**. Antes el diagnóstico era el único abierto por defecto, así que
       * un ticket recién creado abría una sección vacía y uno en pruebas abría la
       * que ya nadie toca.
       *
       * El título es el de la sección, y por eso el mapa se escribe con los mismos
       * textos: si una sección cambia de nombre, esta entrada deja de encontrarla y
       * la marca desaparece —que es un fallo visible, no una sección marcada mal—.
       */
      const SECCION_DE_TURNO = {
        intake: "Descripción funcional",
        analyzed: "Diagnóstico",
        planned: "Plan",
        approved: "Implementación",
        in_progress: "Implementación",
        blocked: "Diagnóstico",
        awaiting_user_tests: "Pruebas",
        in_qa: "Pruebas",
        changes_requested: "Pruebas",
        qa_approved: "Pruebas",
        closed: "Pruebas",
      };

      /** El acordeón de una sección, abierto y marcado si le toca el turno. */
      function acordeonDeSeccion(titulo, resumen, estado) {
        const deTurno = SECCION_DE_TURNO[estado] === titulo;
        return acordeon(titulo, resumen, deTurno, deTurno);
      }

      /**
       * El nombre corto de un impacto.
       *
       * El contrato los llama `sync_impact`, `migration_impact` y `docker_impact`:
       * el sufijo dice que el campo es booleano, y en una lista no aporta nada. Lo
       * que hay que leer es a qué afecta el cambio.
       */
      const NOMBRE_DE_IMPACTO = {
        sync_impact: "sync",
        migration_impact: "migración",
        docker_impact: "docker",
      };

      /** Un chip de estado, con su color por significado. */
      function chip(rotulo, valor, tono = "") {
        const nodo = el("span", undefined, `chip${tono === "" ? "" : ` ${tono}`}`);
        nodo.append(el("span", rotulo, "chip-rotulo"), el("span", valor, "chip-valor"));
        return nodo;
      }

      /**
       * Lleva a la lista filtrada por un estado.
       *
       * El filtro de la lista es estado del módulo, y la navegación por hash no
       * recarga la página: se toca el filtro y se navega, así que la lista aparece
       * ya filtrada en vez de mostrar todo y dejar que el usuario lo ponga.
       */
      function irAListaConEstado(estado) {
        filtros.workflow = estado;
        // Los otros filtros de conjunto se apagan: «en curso» y «cerrados» a la vez
        // no devuelven nada, y una tabla vacía se lee como un fallo.
        filtros.open = false;
        filtros.critical = false;
        filtros.conPuntos = false;
        filtros.empezados = false;
        // La pestaña de turno no puede esconder el estado pedido: lo cerrado vive en «Cerrados».
        filtros.turno = estado === "closed" ? "cerrados" : "activos";
        location.hash = "#/tickets";
        void vistaTickets();
      }

      /**
       * El estado del ticket, en una tira.
       *
       * Antes el estado aparecía en la cabecera entre otros cuatro datos, todos
       * iguales: para saber si un ticket está esperando pruebas había que leer una
       * línea de metadatos. Aquí el avance se ve de un golpe, y lo que está
       * bloqueado se marca.
       */
      function tiraDeEstado(t, puntosAbiertos) {
        const CADENA = [
          ["intake", "Alta"],
          ["analyzed", "Analizado"],
          ["planned", "Plan"],
          ["approved", "Aprobado"],
          ["in_progress", "En curso"],
          ["awaiting_user_tests", "Pruebas"],
          ["in_qa", "QA"],
          ["qa_approved", "QA ok"],
          ["closed", "Cerrado"],
        ];
        const actual = CADENA.findIndex(([estado]) => estado === t.workflowStatus);
        const bloqueado = t.workflowStatus === "blocked";

        const tira = el("div", undefined, "estado-tira");
        CADENA.forEach(([estado], indice) => {
          const rotulo = CADENA[indice]?.[1] ?? "";
          // Cada paso lleva a la lista filtrada por ese estado. Es lo que convierte
          // el estado de un dato en una navegación: «¿qué hay en pruebas?» deja de
          // ser una pregunta que se responde a mano.
          const paso = el("button", undefined, "estado-paso");
          paso.type = "button";
          paso.title = `Ver los tickets en ${rotulo.toLowerCase()}`;
          if (bloqueado) paso.className += " bloqueado";
          else if (indice < actual) paso.className += " hecho";
          else if (indice === actual) paso.className += " actual";
          paso.append(
            el("div", String(indice + 1), "estado-numero"),
            el("div", rotulo, "estado-rotulo"),
          );
          paso.addEventListener("click", () => {
            irAListaConEstado(estado);
          });
          tira.append(paso);
        });

        const chips = el("div", undefined, "estado-chips");
        chips.append(
          chip("workflow", bloqueado ? "bloqueado" : t.workflowStatus, bloqueado ? "malo" : "activo"),
          chip(
            "estado público",
            t.publicState?.label ?? "—",
            t.publicState?.state === "needs-decision" ? "malo" : t.publicState?.state === "done" ? "bueno" : "",
          ),
          chip("QA", t.qaStatus, t.qaStatus === "approved" ? "bueno" : ""),
          chip("release", t.releaseStatus, t.releaseStatus === "released" ? "bueno" : ""),
          chip("riesgo", t.riskLevel, t.riskLevel === "normal" ? "" : "malo"),
          chip("puntos abiertos", String(puntosAbiertos), puntosAbiertos > 0 ? "malo" : "bueno"),
        );
        if (t.criticalImpacts.length > 0) {
          chips.append(chip("impacto", t.criticalImpacts.join(", "), "malo"));
        }

        const caja = el("div", undefined, "estado-ticket");
        caja.append(tira, chips);
        if (bloqueado) {
          caja.append(
            el(
              "div",
              "El ticket está bloqueado: revise el motivo en el historial antes de moverlo.",
              "resultado error",
            ),
          );
        }
        return caja;
      }

      /** El historial de decisiones de las compuertas, en una tira. */
      function tiraDeDecisiones(decisions) {
        if (decisions.length === 0) {
          return el("div", "Sin compuertas evaluadas todavía.", "resultado");
        }
        const tira = el("div", undefined, "historial-gates");
        for (const d of decisions) {
          const nodo = el("span", undefined, `chip-gate ${d.outcome}${d.stale ? " obsoleto" : ""}`);
          nodo.append(
            el("span", `${d.gate}: `, "chip-rotulo"),
            el("span", d.outcome, "chip-valor"),
          );
          if (d.stale) nodo.append(el("span", " (obsoleto)", "chip-rotulo"));
          nodo.title =
            `${d.receiptId} · ${d.actor} · ${d.decidedAt.slice(0, 16).replace("T", " ")}` +
            (d.usage === null || d.usage === undefined
              ? " · mecánico, sin modelo"
              : ` · ${(d.usage.inputTokens + d.usage.outputTokens).toLocaleString("es-CO")} tokens · $${d.usage.costUsd.toFixed(6)}`) +
            (d.humanDecision === null || d.humanDecision === undefined
              ? ""
              : ` · decidido por ${d.humanDecision.actor}`);
          tira.append(nodo);
        }
        return tira;
      }

      /** Un `## Consumo de IA` como tarjeta, no como JSON. */
      function tarjetaConsumo(u) {
        const caja = el("div", undefined, "tarjeta-dato");
        const cabecera = el("div", undefined, "tarjeta-dato-cabecera");
        cabecera.append(
          el("span", String(u.id ?? ""), "id"),
          el("span", String(u.model ?? "(sin modelo)"), "etiqueta"),
          el("span", `$${Number(u.estimated_cost_usd ?? 0).toFixed(6)}`, "cifra"),
        );
        // La confianza no es un detalle: dice si el dato es un registro o una
        // estimación de quien lo escribió.
        const tono = u.confidence === "high" ? "bueno" : u.confidence === "low" ? "malo" : "";
        cabecera.append(el("span", `confianza ${u.confidence ?? "?"}`, `etiqueta ${tono}`));
        caja.append(cabecera);
        if (u.notes !== null && u.notes !== undefined && String(u.notes) !== "") {
          caja.append(el("div", String(u.notes), "tarjeta-dato-nota"));
        }
        const cifras = el("div", undefined, "meta");
        for (const [rotulo, valor] of [
          ["entrada", u.input_tokens],
          ["salida", u.output_tokens],
          ["total", u.total_tokens],
        ]) {
          if (valor === null || valor === undefined) continue;
          cifras.append(el("span", `${rotulo} ${Number(valor).toLocaleString("es-CO")}`, "etiqueta"));
        }
        caja.append(cifras);
        if (u.session_reference) {
          caja.append(el("div", `sesión ${u.session_reference}`, "ruta"));
        }
        return caja;
      }

      /** Un evento como tarjeta, no como JSON. */
      function tarjetaEvento(e) {
        const caja = el("div", undefined, "tarjeta-dato");
        const cabecera = el("div", undefined, "tarjeta-dato-cabecera");
        cabecera.append(
          el("span", String(e.date ?? ""), "cifra"),
          el("span", String(e.action ?? ""), "etiqueta"),
          el("span", String(e.actor ?? ""), "resultado"),
          el("span", String(e.id ?? ""), "ruta"),
        );
        caja.append(cabecera, el("div", String(e.details ?? ""), "tarjeta-dato-nota"));
        return caja;
      }

      /**
       * El texto de una sección, como documento y no como muro.
       *
       * El plan de un ticket es un documento: títulos, pasos numerados, viñetas
       * anidadas y código en línea. En un `<pre>` se lee como una pared de texto y
       * hay que recorrerla entera para encontrar un paso. Esto lo interpreta.
       *
       * Lo que entiende es lo que los tickets usan de verdad —se contó sobre los 62
       * del registro: títulos, viñetas, listas numeradas, bloques y código en
       * línea, y negrita—, no un subconjunto de Markdown por si acaso. Tablas y
       * citas no aparecen en ninguna sección, así que no se inventan.
       *
       * **Se construyen nodos, no se inyecta HTML.** El texto viene de un archivo
       * del repositorio, y renderizar Markdown como HTML crudo es la vía clásica
       * de inyección: un ticket con `<script>` en el plan se ejecutaría al abrirlo.
       * Con nodos, el contenido es texto y nunca código.
       */
      function renderMarkdown(texto) {
        const SECCIONES = new Set([
          "Solicitud original",
          "Descripción funcional",
          "Diagnóstico",
          "Plan",
          "Criterios de aceptación",
          "Puntos",
          "Implementación",
          "Pruebas",
          "QA",
          "Evidencia",
          "Retests",
          "Cierre",
          "Consumo de IA",
          "Release",
          "Eventos",
        ]);

        /** El formato dentro de una línea: negrita, código y enlaces. */
        const enLinea = (destino, linea) => {
          // El orden importa: primero el código, para que un `**` dentro de un
          // fragmento de código no se interprete como negrita.
          const PARTES = /(`[^`]+`)|(\*\*[^*]+\*\*)|(\[([^\]]+)\]\(([^)]+)\))/g;
          let ultimo = 0;
          let coincidencia;
          while ((coincidencia = PARTES.exec(linea)) !== null) {
            if (coincidencia.index > ultimo) {
              destino.append(document.createTextNode(linea.slice(ultimo, coincidencia.index)));
            }
            const [todo, codigo, negrita, , textoEnlace, url] = coincidencia;
            if (codigo !== undefined) {
              destino.append(el("code", codigo.slice(1, -1), "md-codigo"));
            } else if (negrita !== undefined) {
              destino.append(el("strong", negrita.slice(2, -2)));
            } else if (textoEnlace !== undefined) {
              // Solo se enlaza lo que es navegable. Un `javascript:` en un ticket
              // ejecutaría código al hacer clic, y un ticket no es de fiar por
              // estar en el repositorio.
              if (/^https?:\/\//.test(url ?? "")) {
                const enlace = el("a", textoEnlace);
                enlace.href = url;
                enlace.rel = "noreferrer noopener";
                enlace.target = "_blank";
                destino.append(enlace);
              } else {
                destino.append(document.createTextNode(textoEnlace));
              }
            }
            ultimo = coincidencia.index + todo.length;
          }
          if (ultimo < linea.length) {
            destino.append(document.createTextNode(linea.slice(ultimo)));
          }
          return destino;
        };

        const contenedor = el("div", undefined, "md");
        const lineas = String(texto ?? "").split("\n");
        let i = 0;
        let lista = null;
        let profundidad = 0;
        /**
         * La lista de cada nivel, del 0 al actual.
         *
         * Subir de nivel caminando por `parentNode` parecía más simple y era un
         * error: basta con que un nodo no tenga el padre enlazado —como en un DOM
         * de prueba— para que el bucle no termine y la pestaña se quede sin
         * memoria. Con la pila, subir es quitar elementos, y no depende de nada.
         */
        const pila = [];
        /**
         * El último elemento de lista pintado, sea del tipo que sea.
         *
         * Hace falta porque el tipo de lista cambia dentro del mismo nivel: el plan
         * es una lista de viñetas y su tercer punto es una lista **numerada** de
         * pasos. Sin esto, esa lista numerada se creaba en el contenedor y los siete
         * pasos aparecían como hermanos del alcance y del gate, no como su contenido.
         */
        let ultimoItem = null;

        const cerrarLista = () => {
          lista = null;
          profundidad = 0;
          pila.length = 0;
          ultimoItem = null;
        };

        // Cada vuelta tiene que consumir al menos una línea. Este contador lo
        // comprueba: un bucle que no avanza cuelga la pestaña con «sin memoria»,
        // que no dice nada, en vez de fallar donde está el problema. Costó
        // encontrarlo una vez —faltaba un `i += 1` en la rama de los títulos— y no
        // vuelve a costar lo mismo.
        let vueltas = 0;
        while (i < lineas.length) {
          vueltas += 1;
          if (vueltas > lineas.length * 4 + 16) {
            throw new Error(
              `El intérprete de Markdown no avanza en la línea ${i}: ${JSON.stringify(lineas[i])}`,
            );
          }
          const linea = lineas[i];
          const limpia = linea.trim();

          if (limpia === "") {
            cerrarLista();
            i += 1;
            continue;
          }

          // Bloque de código: se copia tal cual, sin interpretar nada dentro.
          if (limpia.startsWith("```")) {
            cerrarLista();
            const cuerpo = [];
            i += 1;
            while (i < lineas.length && !lineas[i].trim().startsWith("```")) {
              cuerpo.push(lineas[i]);
              i += 1;
            }
            i += 1;
            contenedor.append(el("pre", cuerpo.join("\n"), "md-bloque"));
            continue;
          }

          const titulo = /^(#{1,6})\s+(.*)$/.exec(limpia);
          if (titulo !== null) {
            cerrarLista();
            const nivel = (titulo[1] ?? "").length;
            // Un título de sección dentro de una sección se sube un nivel: el
            // documento empieza en `## Plan`, y sus propios `##` son subsecciones.
            const etiqueta = SECCIONES.has((titulo[2] ?? "").trim())
              ? "h4"
              : `h${Math.min(nivel + 2, 6)}`;
            contenedor.append(enLinea(el(etiqueta, undefined, "md-titulo"), titulo[2] ?? ""));
            i += 1;
            continue;
          }

          const vinetas = /^(\s*)[-*+]\s+(.*)$/.exec(linea);
          const numeradas = /^(\s*)(\d+)[.)]\s+(.*)$/.exec(linea);
          if (vinetas !== null || numeradas !== null) {
            const sangria = Math.floor(((vinetas ?? numeradas)[1] ?? "").length / 2);
            const textoItem = vinetas !== null ? vinetas[2] : (numeradas[3] ?? "");
            const ordenada = numeradas !== null;

            const anidada = sangria > profundidad && ultimoItem !== null;

            if (lista === null || anidada || ordenada !== lista.ordenada) {
              const nueva = el(ordenada ? "ol" : "ul", undefined, "md-lista");

              if (anidada) {
                // Un nivel más: la lista va **dentro** del último elemento, que es
                // lo que hace que el paso 3 con sus subpasos se lea como un paso
                // con subpasos y no como una lista plana.
                ultimoItem.append(nueva);
                pila.push(nueva);
              } else {
                // Nivel de raíz, o vuelta a un nivel anterior: se descartan los
                // niveles de más y la lista cuelga de donde toque.
                while (pila.length > sangria + 1) pila.pop();
                const destino = pila[pila.length - 1];
                if (destino === undefined) contenedor.append(nueva);
                else destino.append(nueva);
                pila.length = sangria + 1;
                pila[sangria] = nueva;
              }
              lista = { nodo: nueva, ordenada };
            }
            profundidad = sangria;

            const item = enLinea(el("li"), textoItem);
            lista.nodo.append(item);
            ultimoItem = item;
            i += 1;
            continue;
          }

          // Párrafo: se juntan las líneas seguidas, porque en Markdown un salto
          // simple no separa párrafos y tratarlas sueltas partiría las frases.
          cerrarLista();
          const parrafo = [limpia];
          i += 1;
          while (i < lineas.length) {
            const siguiente = lineas[i].trim();
            if (
              siguiente === "" ||
              siguiente.startsWith("```") ||
              /^#{1,6}\s/.test(siguiente) ||
              /^\s*[-*+]\s+/.test(lineas[i]) ||
              /^\s*\d+[.)]\s+/.test(lineas[i])
            ) {
              break;
            }
            parrafo.push(siguiente);
            i += 1;
          }
          contenedor.append(enLinea(el("p"), parrafo.join(" ")));
        }

        return contenedor;
      }

      /**
       * Una sección del ticket: documento interpretado, con su texto original a un
       * clic.
       *
       * El original no es un adorno: es lo que hizo el agente, y cuando algo se lee
       * raro hay que poder comprobarlo sin abrir el archivo.
       */
      function seccionDeTicket(texto) {
        const caja = el("div", undefined, "seccion-ticket");
        const cuerpo = el("div");
        cuerpo.append(renderMarkdown(texto));
        caja.append(cuerpo);

        const pie = el("div", undefined, "seccion-pie");
        const alternar = el("button", "Ver el texto original");
        const crudo = el("pre", texto, "md-bloque");
