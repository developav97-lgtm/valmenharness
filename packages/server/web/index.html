            ? Promise.resolve([])
            : api("GET", "/api/corrida/agentes")
                .then((r) => agentesVivos(Array.isArray(r) ? r : r?.agentes))
                .catch(() => []),
        ]);
        cont.textContent = "";
        const pendientes = Array.isArray(inicio?.pendientes) ? inicio.pendientes : [];
        const hechos = Array.isArray(inicio?.hechoHoy) ? inicio.hechoHoy : [];
        const cifras = inicio?.cifras ?? {};
        const n = pendientes.length;
        ponerCuenta("inicio", n);

        const pagina = el("div", undefined, "inicio");

        const cabecera = el("div", undefined, "inicio-cabecera");
        const fecha = el("div", undefined, "inicio-fecha");
        const dia = typeof inicio?.fecha === "string" ? new Date(`${inicio.fecha}T12:00:00`) : new Date();
        const texto = dia
          .toLocaleDateString("es", { weekday: "long", day: "numeric", month: "long" })
          .replace(",", "");
        fecha.append(el("span", texto.charAt(0).toUpperCase() + texto.slice(1)));
        const proyecto = $("raiz")?.textContent ?? "";
        if (proyecto !== "" && proyecto !== "…") fecha.append(el("span", ` · ${proyecto}`, "inicio-proyecto"));
        cabecera.append(
          fecha,
          el("h1", n === 0 ? "No hay nada parado por ti" : `${n} ${n === 1 ? "cosa espera" : "cosas esperan"} tu decisión`),
          el(
            "p",
            n === 0
              ? "Lo demás lo está haciendo el agente: cuando algo necesite tu decisión, aparece aquí."
              : "Lo demás lo está haciendo el agente. Cuando termines esta lista, no queda nada parado por ti.",
            "inicio-bajada",
          ),
        );

        const fila = el("div", undefined, "inicio-cifras");
        const cifra = (valor, rotulo, tono) => {
          const caja = el("div", undefined, `inicio-cifra ${tono}`);
          caja.append(el("div", String(valor), "inicio-cifra-valor"), el("div", rotulo, "inicio-cifra-rotulo"));
          return caja;
        };
        const intake = cifras.intake ?? 0;
        fila.append(
          cifra(n, n === 1 ? "espera tu decisión" : "esperan tu decisión", "persona"),
          cifra(agentes.length, agentes.length === 1 ? "agente trabajando" : "agentes trabajando", "modelo"),
          cifra(intake, intake === 1 ? "ticket en intake, sin empezar" : "tickets en intake, sin empezar", "codigo"),
          cifra(cifras.cerradosAnio ?? 0, `tickets cerrados en ${cifras.anio ?? dia.getFullYear()}`, "hecho"),
        );

        const columnas = el("div", undefined, "inicio-columnas");
        if (n > 0) {
          const decision = el("section", undefined, "inicio-decision");
          decision.setAttribute("aria-label", "Espera tu decisión");
          decision.append(el("h2", "Espera tu decisión"));
          for (const p of pendientes) decision.append(tarjetaDeInicio(p));
          columnas.append(decision);
        }

        const lado = el("aside", undefined, "inicio-lado");
        const ahora = el("section", undefined, "inicio-caja inicio-ahora");
        const cabezaAhora = el("div", undefined, "inicio-caja-cabeza");
        const verAgentes = el("a", "Ver agentes →");
        verAgentes.setAttribute("href", "#/agentes");
        cabezaAhora.append(el("h2", "Ahora mismo"), verAgentes);
        ahora.append(cabezaAhora);
        if (agentes.length === 0) ahora.append(el("div", "Ningún agente trabajando ahora.", "inicio-nada"));
        for (const agente of agentes) ahora.append(agenteDeInicio(agente));

        const hoy = el("section", undefined, "inicio-caja inicio-hoy");
        hoy.append(el("h2", "Hecho hoy"));
        if (hechos.length === 0) hoy.append(el("div", "Todavía nada hoy.", "inicio-nada"));
        else {
          const lista = el("div", undefined, "inicio-hecho");
          // Los cinco primeros, como el boceto: una lista larga empuja «Ahora mismo» fuera de la vista.
          for (const h of hechos.slice(0, 5)) {
            const marca = el("span", h.tipo === "cerrado" ? "✓" : "○", `inicio-hecho-marca ${h.tipo}`);
            marca.setAttribute("aria-hidden", "true");
            const cuerpo = el("div");
            cuerpo.append(
              el("div", h.tipo === "cerrado" ? `Cerrado: ${h.titulo}` : `Registrado: ${h.titulo}`),
              el("div", h.ticket, "inicio-hecho-id"),
            );
            lista.append(marca, cuerpo);
          }
          hoy.append(lista);
          if (hechos.length > 5) hoy.append(el("div", `y ${hechos.length - 5} más hoy`, "inicio-nada"));
        }
        lado.append(ahora, hoy);
        columnas.append(lado);

        pagina.append(cabecera, fila, columnas);
        cont.append(pagina);
      }

      // ── Vista: tickets ────────────────────────────────────────────────────

      // La vista inicial responde «¿qué hay que hacer?», así que arranca filtrando
      // los que están en curso. Ver los 62 —cerrados incluidos— obligaba a filtrar
      // a mano cada vez para llegar a lo que de verdad se está trabajando.
      /**
       * El orden canónico de los estados, para agrupar la lista.
       *
       * Es el del contrato (`WORKFLOW_STATES`); acá no se puede importar porque
       * este archivo corre en el navegador. Un estado que no esté en la lista
       * —uno nuevo del contrato, o uno que el registro tenga de antes— cae al
       * final en vez de desaparecer de la pantalla.
       */
      const ORDEN_DE_ESTADOS = [
        "in_progress",
        "blocked",
        "awaiting_user_tests",
        "in_qa",
        "changes_requested",
        "qa_approved",
        "approved",
        "planned",
        "analyzed",
        "intake",
        "closed",
      ];

      const filtros = {
        q: "",
        workflow: "",
        type: "",
        // La pestaña de turno: Activos por defecto, con lo que espera a la persona
        // primero (D-002 de FEATURE-WEB-TRABAJO-TICKETS-20261014). Antes la lista
        // abría en «solo lo empezado» para no enterrar lo que estaba en curso; ese
        // fin lo cumple ahora el orden, y la casilla sigue en «Más filtros».
        turno: "activos",
        empezados: false,
        open: false,
        invalid: false,
        critical: false,
        conPuntos: false,
        desde: "",
        hasta: "",
        /*
         * `closedOn` por defecto, y costó un fallo aprenderlo.
         *
         * Arrancaba en `updated` —«lo que se tocó en el rango»— con el argumento de
         * que es lo que se espera de una lista de trabajo. En este registro eso da
         * un resultado que parece roto: la migración al esquema 2 reescribió el
         * frontmatter de los **63** tickets el mismo día, así que pulsar «Ayer»
         * mostraba los 63 en vez de los tres que se cerraron.
         *
         * El botón dice «Ayer» y quien lo pulsa piensa en lo que pasó ayer, que en
         * este flujo es lo que se cerró: el reporte semanal cuenta cierres y el
         * botón de exportar también. El campo se puede cambiar —está ahí al lado—,
         * pero el valor por defecto tiene que ser el que no sorprende.
         */
        fecha: "closedOn",
        // Lo que se tocó hace menos va primero, que es lo que se espera de una
        // lista de trabajo.
        orden: "updated",
        sentido: "desc",
      };

      // ── Tickets: turno y avance (FEATURE-WEB-TRABAJO-TICKETS-20261014) ────
      //
      // El boceto `assets/tickets.html` responde «¿qué me toca?» antes que «¿qué hay?»: las
      // pestañas filtran por turno, cada fila dice quién la tiene y en qué paso de los ocho va,
      // y lo de hoy —cifras, estado, tipo, fechas, orden y reporte— sigue en «Más filtros».

      /** El turno de una fila; sin el campo del servidor se deduce del estado (respuestas viejas). */
      function turnoDe(t) {
        if (t.turno) return t.turno;
        const cerrado = t.workflowStatus === "closed";
        return {
          quien: cerrado ? "nadie" : t.publicState?.state === "needs-decision" ? "persona" : "agente",
          paso: cerrado ? 9 : (PASO_DE_INICIO[t.workflowStatus] ?? 2),
          rotulo: t.workflowStatus,
          motivo: null,
          compuerta: null,
        };
      }

      /** La barra de ocho segmentos: hechos, el actual por quién lo tiene, o todos cerrados. */
      function barraDeAvance(turno) {
        const barra = el("div", undefined, "barra-avance");
        barra.setAttribute("role", "img");
        barra.setAttribute(
          "aria-label",
          turno.paso >= 9 ? "Ciclo completo" : `Paso ${turno.paso} de 8, lo tiene ${turno.quien === "persona" ? "la persona" : "el agente"}`,
        );
        for (let i = 1; i <= 8; i += 1) {
          const estado =
            turno.paso >= 9
              ? " cerrado"
              : i < turno.paso
                ? " hecho"
                : i === turno.paso
                  ? ` actual ${turno.quien === "persona" ? "persona" : "agente"}`
                  : "";
          barra.append(el("span", undefined, `segmento${estado}`));
        }
        return barra;
      }

      /** «Tú» en ámbar, «Agente» en lila; debajo, la etiqueta del estado público de siempre. */
      function celdaDeTurno(turno, publicState) {
        const celda = el("td", undefined, "celda-turno");
        const quien = el("span", undefined, `turno-quien ${turno.quien}`);
        quien.append(
          el("span", undefined, "turno-punto"),
          el("span", turno.quien === "persona" ? "Tú" : turno.quien === "agente" ? "Agente" : "Cerrado"),
        );
        celda.append(quien, etiquetaDeEstadoPublico(publicState));
        return celda;
      }

      /** «hoy» o «N d» desde la fecha de alta, en hora local. */
      function edadDe(fecha) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(fecha ?? ""));
        if (m === null) return "—";
        const alta = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        const hoy = new Date();
        hoy.setHours(0, 0, 0, 0);
        const dias = Math.max(0, Math.round((hoy.getTime() - alta.getTime()) / 86400000));
        return dias === 0 ? "hoy" : `${dias} d`;
      }

      /** Un comando con su número y «copiar»: el portapapeles puede no existir, y no rompe nada. */
      function comandoCopiable(texto, numero) {
        const fila = el("div", undefined, "comando-copiable");
        if (numero !== undefined) fila.append(el("span", String(numero), "comando-n"));
        fila.append(el("span", texto, "comando-texto"));
        const copiar = el("button", "copiar", "comando-copiar");
        copiar.type = "button";
        copiar.setAttribute("aria-label", "Copiar comando");
        copiar.addEventListener("click", async () => {
          try {
            await globalThis.navigator?.clipboard?.writeText(texto);
            copiar.textContent = "copiado";
          } catch {
            copiar.textContent = "no se pudo copiar";
          }
          setTimeout(() => {
            copiar.textContent = "copiar";
          }, 1500);
        });
        fila.append(copiar);
        return fila;
      }

      /** «Nuevo ticket»: la web no da de alta tickets; el comando del CLI, listo para copiar (D-004). */
      function panelNuevoTicket() {
        const panel = el("div", undefined, "panel-nuevo-ticket");
        panel.append(
          el("div", "Un ticket se registra desde la terminal del proyecto, y lo decide una persona:", "panel-nuevo-texto"),
          comandoCopiable(
            'valmen create --id <ID> --title "<título>" --type <TIPO> --module <MÓDULO> --request "<pedido>"',
          ),
        );
        return panel;
      }

      /** Una opción de un desplegable como elemento: se pinta y se recorre como cualquier nodo. */
      function opcionDeLista(etiqueta, valor) {
        const opcion = el("option", etiqueta);
        opcion.value = valor;
        return opcion;
      }

      async function vistaTickets() {
        const cont = $("contenido");

        const params = new URLSearchParams();
        params.set("turno", filtros.turno);
        if (filtros.q !== "") params.set("q", filtros.q);
        if (filtros.workflow !== "") params.set("workflow", filtros.workflow);
        if (filtros.type !== "") params.set("type", filtros.type);
        if (filtros.empezados) params.set("empezados", "1");
        if (filtros.open) params.set("open", "1");
        if (filtros.invalid) params.set("invalid", "1");
        if (filtros.critical) params.set("critical", "1");
        if (filtros.conPuntos) params.set("con-puntos", "1");
        if (filtros.desde !== "") params.set("desde", filtros.desde);
        if (filtros.hasta !== "") params.set("hasta", filtros.hasta);
        if (filtros.desde !== "" || filtros.hasta !== "") params.set("fecha", filtros.fecha);
        if (filtros.orden !== "updated") params.set("orden", filtros.orden);
        if (filtros.sentido !== "desc") params.set("sentido", filtros.sentido);

        const datos = await api("GET", `/api/tickets?${params.toString()}`);
        cont.textContent = "";
        const r = datos.summary ?? {};
        const porWorkflow = r.byWorkflow ?? {};
        const porTurno = r.porTurno ?? {};
        const tickets = Array.isArray(datos.tickets) ? datos.tickets : [];

        const pagina = el("div", undefined, "vista-tickets");
        cont.append(pagina);

        // ── Cabecera: rótulo, título y «Nuevo ticket» ──
        const cabecera = el("div", undefined, "tickets-cabecera");
        const titulos = el("div", undefined, "tickets-titulos");
        const migas = el("div", undefined, "tickets-migas");
        migas.append(el("span", "Trabajo"), el("span", " · ", "tickets-migas-sep"), el("span", "Tickets", "tickets-migas-actual"));
        titulos.append(migas, el("h1", "Tickets", "tickets-titulo"));
        const nuevo = el("button", undefined, "boton-nuevo-ticket");
        nuevo.type = "button";
        nuevo.setAttribute("aria-expanded", "false");
        nuevo.append(el("span", "+", "boton-nuevo-mas"), el("span", "Nuevo ticket"));
        const panelNuevo = panelNuevoTicket();
        panelNuevo.hidden = true;
        nuevo.addEventListener("click", () => {
          panelNuevo.hidden = !panelNuevo.hidden;
          nuevo.setAttribute("aria-expanded", String(!panelNuevo.hidden));
        });
        cabecera.append(titulos, nuevo);
        pagina.append(cabecera, panelNuevo);

        // ── Pestañas por turno y buscador ──
        const barraTurno = el("div", undefined, "tickets-barra");
        const pestanas = el("div", undefined, "tickets-pestanas");
        pestanas.setAttribute("role", "tablist");
        pestanas.setAttribute("aria-label", "A quién le toca");
        for (const [clave, nombre] of [
          ["activos", "Activos"],
          ["persona", "Esperan por mí"],
          ["agente", "Con el agente"],
          ["cerrados", "Cerrados"],
        ]) {
          const elegida = filtros.turno === clave;
          const pestana = el("button", undefined, `tickets-pestana${elegida ? " elegida" : ""}${clave === "persona" ? " persona" : ""}`);
          pestana.type = "button";
          pestana.setAttribute("role", "tab");
          pestana.setAttribute("aria-selected", String(elegida));
          pestana.append(el("span", nombre), el("span", String(porTurno[clave] ?? 0), "tickets-cuenta"));
          pestana.addEventListener("click", () => {
            filtros.turno = clave;
            void vistaTickets();
          });
          pestanas.append(pestana);
        }
        const buscador = el("label", undefined, "tickets-buscador");
        const busqueda = document.createElement("input");
        busqueda.type = "search";
        busqueda.placeholder = "Buscar por id, título o módulo";
        busqueda.setAttribute("aria-label", "Buscar por id, título o módulo");
        busqueda.value = filtros.q;
        let temporizador;
        busqueda.addEventListener("input", () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            filtros.q = busqueda.value;
            void vistaTickets();
          }, 250);
        });
        buscador.append(el("span", undefined, "icono-buscar"), busqueda);
        barraTurno.append(pestanas, buscador);
        pagina.append(barraTurno);

        // ── Más filtros: lo que la lista hacía antes, plegado (D-005) ──
        const mas = el("details", undefined, "mas-filtros");
        mas.dataset.acordeon = "Más filtros";
        mas.append(el("summary", "Más filtros"));
        const cuerpoMas = el("div", undefined, "mas-filtros-cuerpo");
        mas.append(cuerpoMas);

        // Tarjetas de cifras: filtran, y volver a pulsar la aplicada la quita.
        const tarjetas = el("div", undefined, "tarjetas");
        const alternar = (clave) => {
          const estaba = filtros[clave];
          filtros.workflow = "";
          filtros.empezados = false;
          filtros.open = false;
          filtros.critical = false;
          filtros.conPuntos = false;
          filtros[clave] = !estaba;
          void vistaTickets();
        };
        const metricas = [
          { rotulo: "Tickets", valor: r.total ?? 0, filtro: null },
          {
            rotulo: "En curso",
            valor: (r.total ?? 0) - (porWorkflow.closed ?? 0) - (porWorkflow.intake ?? 0),
            filtro: "empezados",
          },
          { rotulo: "Cerrados", valor: porWorkflow.closed ?? 0, filtro: "workflow:closed" },
          { rotulo: "Con puntos abiertos", valor: r.withOpenPoints ?? 0, filtro: "conPuntos" },
          { rotulo: "Impacto crítico", valor: r.criticalImpacts ?? 0, filtro: "critical" },
        ];
        if ((r.invalid ?? 0) > 0) metricas.push({ rotulo: "Inválidos", valor: r.invalid, filtro: "invalid" });
        for (const metrica of metricas) {
          const aplicada =
            metrica.filtro === null
              ? false
              : metrica.filtro.startsWith("workflow:")
                ? filtros.workflow === metrica.filtro.slice("workflow:".length)
                : filtros[metrica.filtro] === true;
          const tarjeta = el(metrica.filtro === null ? "div" : "button", undefined, `tarjeta${aplicada ? " aplicada" : ""}`);
          tarjeta.append(el("div", String(metrica.valor), "valor"), el("div", metrica.rotulo, "rotulo"));
          if (metrica.filtro !== null) {
            tarjeta.type = "button";
            tarjeta.setAttribute("aria-pressed", String(aplicada));
            tarjeta.title = aplicada ? "Quitar este filtro" : "Filtrar por esto";
            if (metrica.filtro.startsWith("workflow:")) {
              const estado = metrica.filtro.slice("workflow:".length);
              tarjeta.addEventListener("click", () => {
                filtros.workflow = filtros.workflow === estado ? "" : estado;
                filtros.open = false;
                filtros.critical = false;
                filtros.conPuntos = false;
                void vistaTickets();
              });
            } else {
              tarjeta.addEventListener("click", () => alternar(metrica.filtro));
            }
          }
          tarjetas.append(tarjeta);
        }
        cuerpoMas.append(tarjetas);

        const barra = el("div", undefined, "filtros");
        const selector = (etiqueta, clave, valores, actual) => {
          const sel = document.createElement("select");
          sel.append(opcionDeLista(etiqueta, ""));
          for (const v of valores) sel.append(opcionDeLista(v, v));
          sel.value = actual;
          sel.setAttribute("aria-label", etiqueta);
          sel.addEventListener("change", () => {
            filtros[clave] = sel.value;
            void vistaTickets();
          });
          return sel;
        };
        barra.append(
          selector("Todos los estados", "workflow", Object.keys(porWorkflow).sort(), filtros.workflow),
          selector("Todos los tipos", "type", Object.keys(r.byType ?? {}).sort(), filtros.type),
        );

        const casilla = (texto, clave) => {
          const label = el("label", undefined, "casilla-filtro");
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = filtros[clave];
          input.addEventListener("change", () => {
            filtros[clave] = input.checked;
            void vistaTickets();
          });
          label.append(input, el("span", texto));
          return label;
        };

        // Rango de fechas con sus atajos: el reporte semanal es el caso que lo pide.
        const rango = el("div", undefined, "rango-fechas");
        const campoFecha = document.createElement("select");
        for (const [valor, etiqueta] of [
          ["updated", "Última edición"],
          ["created", "Fecha de alta"],
          ["closedOn", "Fecha de cierre"],
        ]) {
          campoFecha.append(opcionDeLista(etiqueta, valor));
        }
        campoFecha.value = filtros.fecha;
        campoFecha.setAttribute("aria-label", "Fecha que compara el rango");
        campoFecha.title =
          "Con qué fecha se compara el rango. «Última edición» incluye lo que se " +
          "tocó en el rango aunque se cerrara antes; «fecha de cierre» cuenta lo " +
          "que se cerró, que es lo que va al reporte.";
        campoFecha.addEventListener("change", () => {
          filtros.fecha = campoFecha.value;
          void vistaTickets();
        });
        const entradaFecha = (clave, etiqueta) => {
          const caja = el("label", undefined, "campo-fecha");
          caja.append(el("span", etiqueta, "chip-rotulo"));
          const entrada = document.createElement("input");
          entrada.type = "date";
          entrada.value = filtros[clave];
          entrada.addEventListener("change", () => {
            filtros[clave] = entrada.value;
            void vistaTickets();
          });
          caja.append(entrada);
          return caja;
        };
        const ATAJOS = [
          ["Hoy", 0, 0],
          ["Ayer", 1, 1],
          // La semana empieza el lunes: un reporte que empieza en domingo parte el fin de semana.
          ["Esta semana", "lunes", 0],
          ["Últimos 7 días", 6, 0],
          ["Este mes", "mes", 0],
        ];
        const enTexto = (fecha) => {
          const y = fecha.getFullYear();
          const m = String(fecha.getMonth() + 1).padStart(2, "0");
          const d = String(fecha.getDate()).padStart(2, "0");
          return `${y}-${m}-${d}`;
        };
        const atajos = el("div", undefined, "atajos-fecha");
        for (const [etiqueta, desde, hasta] of ATAJOS) {
          const boton = el("button", etiqueta);
          boton.type = "button";
          boton.addEventListener("click", () => {
            const hoy = new Date();
            let inicio = new Date(hoy);
            const fin = new Date(hoy);
            if (desde === "lunes") {
              const dia = hoy.getDay() === 0 ? 7 : hoy.getDay();
              inicio.setDate(hoy.getDate() - (dia - 1));
            } else if (desde === "mes") {
              inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            } else {
              inicio.setDate(hoy.getDate() - Number(desde));
              fin.setDate(hoy.getDate() + Number(hasta));
            }
            filtros.desde = enTexto(inicio);
            filtros.hasta = enTexto(fin);
            void vistaTickets();
          });
          atajos.append(boton);
        }
        const limpiarFechas = el("button", "Sin rango");
        limpiarFechas.type = "button";
        limpiarFechas.addEventListener("click", () => {
          filtros.desde = "";
          filtros.hasta = "";
          void vistaTickets();
        });
        atajos.append(limpiarFechas);
        rango.append(campoFecha, entradaFecha("desde", "desde"), entradaFecha("hasta", "hasta"), atajos);
        barra.append(rango);

        barra.append(
          casilla("Solo lo empezado", "empezados"),
          casilla("Solo abiertos", "open"),
          casilla("Solo inválidos", "invalid"),
        );

        // El orden de la tabla: antes se pulsaba la cabecera; ahora la cabecera es la del boceto.
        const orden = el("label", undefined, "campo-orden");
        orden.append(el("span", "Ordenar por", "chip-rotulo"));
        const campoOrden = document.createElement("select");
        for (const [valor, etiqueta] of [
          ["updated", "Última edición"],
          ["created", "Fecha de alta"],
          ["closedOn", "Fecha de cierre"],
          ["id", "Identificador"],
          ["workflowStatus", "Estado"],
          ["openPoints", "Puntos abiertos"],
        ]) {
          campoOrden.append(opcionDeLista(etiqueta, valor));
        }
        campoOrden.value = filtros.orden;
        campoOrden.addEventListener("change", () => {
          filtros.orden = campoOrden.value;
          void vistaTickets();
        });
        const sentido = document.createElement("select");
        sentido.setAttribute("aria-label", "Sentido del orden");
        sentido.append(opcionDeLista("Descendente", "desc"), opcionDeLista("Ascendente", "asc"));
        sentido.value = filtros.sentido;
        sentido.addEventListener("change", () => {
          filtros.sentido = sentido.value;
          void vistaTickets();
        });
        orden.append(campoOrden, sentido);
        barra.append(orden);

        // El reporte lo compone el servidor: el botón y `valmen report` dan el mismo documento.
        const botonReporte = el("button", "Reporte de cierres");
        botonReporte.type = "button";
        botonReporte.title =
          "Markdown de los tickets cerrados en el rango que tengas filtrado, listo " +
          "para pegar. Sin rango, los últimos 30 días.";
        botonReporte.addEventListener("click", () => void descargarReporte());
        barra.append(botonReporte);
        cuerpoMas.append(barra);
        pagina.append(mas);

        // Se dice qué se está viendo: con filtros, una tabla corta se lee como que no hay nada.
        const aplicados = [];
        if (filtros.empezados) aplicados.push("lo empezado");
        if (filtros.open) aplicados.push("en curso");
        if (filtros.workflow !== "") aplicados.push(filtros.workflow);
        if (filtros.critical) aplicados.push("con impacto crítico");
        if (filtros.conPuntos) aplicados.push("con puntos abiertos");
        if (filtros.invalid) aplicados.push("inválidos");
        if (filtros.type !== "") aplicados.push(filtros.type);
        if (filtros.desde !== "" || filtros.hasta !== "") {
          const campo = { updated: "edición", created: "alta", closedOn: "cierre" }[filtros.fecha];
          aplicados.push(`${campo} ${filtros.desde === "" ? "siempre" : filtros.desde} → ${filtros.hasta === "" ? "hoy" : filtros.hasta}`);
        }
        if (aplicados.length > 0) {
          const linea = el("div", undefined, "filtros-aplicados");
          linea.append(el("span", `Mostrando: ${aplicados.join(" · ")}`, "resultado"));
          const limpiar = el("button", "Ver todos");
          limpiar.type = "button";
          limpiar.addEventListener("click", () => {
            filtros.q = "";
            filtros.workflow = "";
            filtros.type = "";
            filtros.empezados = false;
            filtros.open = false;
            filtros.invalid = false;
            filtros.critical = false;
            filtros.conPuntos = false;
            filtros.desde = "";
            filtros.hasta = "";
            void vistaTickets();
          });
          linea.append(limpiar);
          pagina.append(linea);
        }

        if (tickets.length === 0) {
          pagina.append(el("div", "Ningún ticket coincide con los filtros.", "vacio"));
          return;
        }

        // En Activos, lo que espera a la persona va primero, sin cambiar el orden de lo demás (D-002).
        const filas =
          filtros.turno === "activos"
            ? [
                ...tickets.filter((t) => turnoDe(t).quien === "persona"),
                ...tickets.filter((t) => turnoDe(t).quien !== "persona"),
              ]
            : tickets;

        // La tabla se desplaza dentro de su caja: a 390 px la página no (R-MARCO-006).
        const caja = el("div", undefined, "tabla-caja");
        const tabla = el("table", undefined, "tabla-tickets");
        const thead = el("thead");
        const cabeceraTabla = el("tr");
        for (const [titulo, clase] of [
          ["Ticket", "col-ticket"],
          ["Avance", "col-avance"],
          ["Ahora lo tiene", "col-turno"],
          ["Módulo", "col-modulo"],
          ["Edad", "col-edad"],
        ]) {
          cabeceraTabla.append(el("th", titulo, clase));
        }
        thead.append(cabeceraTabla);
        const tbody = el("tbody");
        for (const t of filas) {
          const turno = turnoDe(t);
          const tr = el("tr", undefined, "fila-ticket");
          tr.setAttribute("data-ticket", t.id);
          tr.setAttribute("tabindex", "0");
          const abrir = () => {
            location.hash = `#/ticket/${t.id}`;
          };
          tr.addEventListener("click", abrir);
          tr.addEventListener("keydown", (evento) => {
            if (evento.key === "Enter") abrir();
          });

          const celdaTicket = el("td", undefined, "celda-ticket");
          const enlace = el("a", t.title, "ticket-titulo");
          enlace.href = `#/ticket/${t.id}`;
          celdaTicket.append(enlace, el("div", t.id, "id"));
          // Lo que la fila de antes decía en columnas propias, solo si hay algo que decir.
          const marcas = el("div", undefined, "ticket-marcas");
          for (const impacto of t.criticalImpacts ?? []) {
            const marca = el("span", NOMBRE_DE_IMPACTO[impacto] ?? impacto, "impacto");
            marca.title = impacto;
            marcas.append(marca);
          }
          if ((t.openPoints ?? 0) > 0) marcas.append(el("span", `${t.openPoints} puntos abiertos`, "marca-puntos"));
          if (t.invalid !== null && t.invalid !== undefined) marcas.append(el("span", "inválido", "etiqueta roto"));
          if (marcas.children.length > 0) celdaTicket.append(marcas);
          tr.append(celdaTicket);

          const celdaAvance = el("td", undefined, "celda-avance");
          celdaAvance.append(barraDeAvance(turno), el("div", turno.rotulo, "avance-rotulo"));
          tr.append(celdaAvance);

          tr.append(celdaDeTurno(turno, t.publicState));
          tr.append(el("td", t.module, "celda-modulo"));
          tr.append(
            el(
              "td",
              filtros.turno === "cerrados" && t.closedOn ? `cerrado ${t.closedOn}` : edadDe(t.created),
              "celda-edad",
            ),
          );
          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        caja.append(tabla);
        pagina.append(caja);
      }

      // ── Vista: estándares ─────────────────────────────────────────────────
      //
      // Las reglas que el proyecto ya decidió y las que están por decidir. Las dos
      // cosas juntas a propósito: quien aprueba una propuesta necesita ver lo que
      // ya está en vigor, o aprueba algo que ya existía con otras palabras.
      async function vistaEstandares() {
        const cont = $("contenido");
        cont.textContent = "";
        const datos = await api("GET", "/api/standards");

        cont.append(el("h2", "Estándares del proyecto"));
        cont.append(
          el(
            "div",
            "Cómo se ve y cómo se escribe lo que se construye acá. Están en el AGENTS.md " +
              "que lee el agente, así que los tiene antes de escribir la primera línea.",
            "resultado",
          ),
        );

        const pendientes = datos.proposals.filter((p) => p.state === "propuesto");
        if (pendientes.length > 0) {
          const caja = el("div", undefined, "nota alerta");
          caja.append(
            el("strong", `${pendientes.length} propuesta(s) esperando tu decisión. `),
            el("span", "Una regla sin aprobar no está en vigor y el agente no la aplica."),
          );
          cont.append(caja);
        }

        // Lo decidido no se mezcla con lo que espera decisión. Una propuesta
        // aceptada que sigue en la lista de propuestas hace dudar de si se aplicó,
        // y la que se descartó parece pendiente para siempre: las dos se leen en
        // el historial, que es donde se busca «¿esto por qué no está?».
        const porDecidir = datos.proposals.filter((p) => p.state === "propuesto");
        const decididas = datos.proposals.filter((p) => p.state !== "propuesto");

        // ── Las propuestas: solo las que esperan ──
        if (porDecidir.length > 0) {
          cont.append(el("h3", `Propuestas (${porDecidir.length})`));
          for (const propuesta of porDecidir) {
            const tarjeta = el("div", undefined, "tarjeta-estandar");
            const cabecera = el("div", undefined, "meta");
            cabecera.append(
              el("span", propuesta.id, "id"),
              el("span", propuesta.area, "etiqueta"),
              el("span", propuesta.state, "etiqueta"),
              el("span", propuesta.date, "id"),
            );
            tarjeta.append(cabecera);
            tarjeta.append(el("div", propuesta.title, "nombre"));
            tarjeta.append(el("div", `Regla: ${propuesta.rule}`, "resultado"));
            if (propuesta.why !== "")
              tarjeta.append(el("div", `Por qué: ${propuesta.why}`, "resultado"));
            if (propuesta.tickets.length > 0) {
              tarjeta.append(el("div", `Visto en: ${propuesta.tickets.join(", ")}`, "ruta"));
            }

            const acciones = el("div", undefined, "responsable");
            const aceptar = el("button", "Aceptar y poner en vigor");
            const descartar = el("button", "Descartar", "enlace");
            const salida = el("div", undefined, "resultado");
            const decidir = async (decision, boton) => {
              boton.disabled = true;
              salida.className = "resultado";
              salida.textContent = "Registrando…";
              try {
                const r = await api(
                  "POST",
                  `/api/standards/${propuesta.id}/decision`,
                  { decision },
                );
                salida.className = "resultado ok";
                salida.textContent = r.details;
                await vistaEstandares();
              } catch (fallo) {
                salida.className = "resultado error";
                salida.textContent = fallo.message;
                boton.disabled = false;
              }
            };
            aceptar.addEventListener("click", () => void decidir("aceptado", aceptar));
            descartar.addEventListener("click", () => void decidir("descartado", descartar));
            // Las dos puertas, dichas donde se decide: los botones son una, y
            // pedírselo al agente es la otra. Quien no usa la pantalla tiene que
            // poder enterarse acá de que también se puede por la conversación.
            acciones.append(
              aceptar,
              descartar,
              el(
                "div",
                "También se decide hablando: pedile al agente «aceptá los estándares " +
                  "propuestos» y la decisión queda registrada con tus palabras.",
                "ruta",
              ),
              salida,
            );
            tarjeta.append(acciones);
            cont.append(tarjeta);
          }
        }

        // ── Los que están en vigor ──
        cont.append(el("h3", "En vigor"));
        if (datos.standards.length === 0) {
          cont.append(
            el(
              "div",
              "Todavía no hay estándares escritos. El agente los propone cuando el trabajo " +
                "le enseña una convención que no está en ninguna parte.",
              "vacio",
            ),
          );
          return;
        }

        for (const archivo of datos.standards) {
          const acordeonEstandar = acordeon(
            archivo.path.split("/").pop() ?? archivo.area,
            archivo.area,
            true,
          );
          acordeonEstandar.cuerpo.append(seccionDeTicket(archivo.content));
          cont.append(acordeonEstandar.caja);
        }

        // ── El historial: lo que ya se decidió ──
        //
        // Cerrado por defecto: no es lo que se viene a hacer acá, y abierto
        // empujaría hacia abajo lo único que pide una acción. Pero está, con su
        // fecha y sus palabras, porque «¿por qué no tenemos esta regla?» y «¿esto
        // quién lo aprobó?» son preguntas que se hacen meses después.
        if (decididas.length > 0) {
          const aceptadas = decididas.filter((p) => p.state === "aceptado").length;
          const historial = document.createElement("details");
          historial.className = "historial-estandares";
          historial.append(
            el(
              "summary",
              `Historial — ${decididas.length} decidido(s): ${aceptadas} en vigor, ` +
                `${decididas.length - aceptadas} descartado(s)`,
            ),
          );
          for (const propuesta of decididas) {
            const tarjeta = el("div", undefined, "tarjeta-estandar historial");
            const cabecera = el("div", undefined, "meta");
            cabecera.append(
              el("span", propuesta.id, "id"),
              el("span", propuesta.area, "etiqueta"),
              el(
                "span",
                propuesta.state,
                propuesta.state === "aceptado" ? "etiqueta aprueba" : "etiqueta",
              ),
              el("span", propuesta.date, "id"),
            );
            tarjeta.append(cabecera);
            tarjeta.append(el("div", propuesta.title, "nombre"));
            tarjeta.append(el("div", `Regla: ${propuesta.rule}`, "resultado"));
            tarjeta.append(
              el(
                "div",
                propuesta.decidedOn
                  ? `Decidido el ${propuesta.decidedOn}` +
                      (propuesta.instruction ? ` — «${propuesta.instruction}»` : "")
                  : "Decidido",
                "ruta",
              ),
            );
            tarjeta.append(el("div", `→ ${propuesta.source.path}`, "ruta"));
            historial.append(tarjeta);
          }
          cont.append(historial);
        }
      }

      // ── Vista: features ───────────────────────────────────────────────────
      //
      // Una feature es lo que no cabe en un ticket: un módulo con varias
      // pantallas, reportes y configuración. La vista responde tres preguntas y
      // en ese orden: ¿en qué punto está?, ¿qué requisitos quedan sin cubrir? y
      // ¿qué tickets la componen?

      /** Los cuatro artefactos con su marca, en el orden en que se escriben. */
      function marcasArtefactos(f) {
        const caja = el("div", undefined, "artefactos");
        const partes = [
          ["spec", f.hasSpec],
          ["diseño", f.hasDesign],
          ["tickets", f.hasDecomposition],
          ["verificar", f.hasVerify],
        ];
        for (const [nombre, hecho] of partes) {
          caja.append(el("span", `${hecho ? "✓" : "·"} ${nombre}`, hecho ? "hecho" : ""));
        }
        return caja;
      }

      async function vistaFeatures() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/features");
        const r = datos.summary;

        const tarjetas = el("div", undefined, "tarjetas");
        // El progreso del conjunto, sumando todas las features: es la primera
        // pregunta de una vista de conjunto y antes había que deducirla.
        const totalTickets = datos.features.reduce((suma, f) => suma + f.tickets, 0);
        const cerrados = datos.features.reduce((suma, f) => suma + f.closedTickets, 0);

        const metricas = [
          ["Features", r.total],
          ["Descompuestas", r.decomposed],
          ["Con huecos", r.withGaps],
          ["Tickets de features", totalTickets],
          ["De esos, cerrados", cerrados],
        ];
        if (r.invalid > 0) metricas.push(["Inválidas", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        if (datos.features.length === 0) {
          const vacio = el("div", undefined, "vacio");
          vacio.append(
            el("div", "No hay features en este proyecto."),
            el(
              "div",
              "Una feature es trabajo que excede un ticket: spec, diseño y varios tickets hijos.",
              "resultado",
            ),
            el("div", "Se crea con: valmen feature new <slug> --title <título>", "ruta"),
          );
          cont.append(vacio);
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of [
          "Feature",
          "Estado",
          "Artefactos",
          "Requisitos",
          "Progreso",
          "Huecos",
          "Actualizada",
          "",
        ]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);

        const tbody = el("tbody");
        for (const f of datos.features) {
          const tr = el("tr");

          const celdaNombre = el("td");
          celdaNombre.append(el("div", f.title, "nombre"), el("div", f.id, "id"));
          tr.append(celdaNombre);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", f.state));
          if (f.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválida", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          const celdaArtefactos = el("td");
          celdaArtefactos.append(marcasArtefactos(f));
          tr.append(celdaArtefactos);

          tr.append(el("td", f.requirements === 0 ? "—" : String(f.requirements), "id"));

          // El progreso es lo que convierte la lista en una vista de conjunto:
          // sin él se ve que una feature está «descompuesta» y la pregunta que se
          // hace de verdad —«¿por dónde va?»— obliga a abrir los tickets uno a uno.
          const celdaProgreso = el("td");
          if (!f.hasDecomposition || f.tickets === 0) {
            celdaProgreso.textContent = "—";
          } else {
            celdaProgreso.append(
              barraDeProgreso(f.closedTickets, f.tickets),
              el("div", `${f.closedTickets} de ${f.tickets} cerrados`, "resultado"),
            );
          }
          tr.append(celdaProgreso);

          // Los huecos van en rojo y no en «inválida»: una feature con la
          // cobertura incompleta no está rota, está a medio descomponer, y son
          // dos cosas distintas que hay que poder distinguir de un vistazo.
          const celdaHuecos = el("td");
          if (f.gaps > 0) {
            celdaHuecos.append(el("span", `${f.gaps} sin cubrir`, "etiqueta roto"));
          } else if (f.hasDecomposition) {
            celdaHuecos.append(el("span", "completa", "etiqueta aprueba"));
          } else {
            celdaHuecos.textContent = "—";
          }
          tr.append(celdaHuecos);

          tr.append(el("td", f.updated, "id"));

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/feature/${f.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: una feature, con su grafo y su cobertura ───────────────────

      /** Una sección colapsable con texto en crudo. */
      function bloqueCrudo(titulo, texto, abierto) {
        const detalle = document.createElement("details");
        if (abierto) detalle.open = true;
        detalle.append(el("summary", titulo));
        detalle.append(el("pre", texto));
        return detalle;
      }

      /** La tabla de requisitos, con quién lo cubre y en qué estado está. */
      function tablaRequisitos(requisitos, ticketsPorId) {
        const tabla = el("table");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Requisito", "Cubierto por", "Estado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const req of requisitos) {
          const tr = el("tr");

          const celda = el("td");
          celda.append(
            el("div", req.statement),
            el("div", `${req.id} · ${req.domain}`, "id"),
          );
          tr.append(celda);

          const celdaCubre = el("td");
          if (req.coveredBy.length === 0) {
            celdaCubre.append(el("span", "ninguno", "etiqueta roto"));
          } else {
            for (const id of req.coveredBy) {
              const linea = el("div");
              linea.append(el("span", id, "id"));
              if (!ticketsPorId.has(id)) {
                // Un `covered_by` que apunta a un ticket que no está en ningún
                // sprint cubre lo mismo que ninguno, y el motor lo trata así.
                linea.append(el("span", " fuera del grafo", "etiqueta roto"));
              }
              celdaCubre.append(linea);
            }
          }
          tr.append(celdaCubre);

          const celdaEstado = el("td");
          if (req.coveredBy.length === 0) {
            celdaEstado.append(el("span", "sin cubrir", "etiqueta roto"));
          } else {
            const estados = req.coveredBy
              .filter((id) => ticketsPorId.has(id))
              .map((id) => ticketsPorId.get(id));
            if (estados.length === 0) {
              celdaEstado.append(el("span", "no escrito", "etiqueta"));
            } else if (estados.every((e) => e === "closed")) {
              celdaEstado.append(el("span", "cerrado", "etiqueta aprueba"));
            } else {
              celdaEstado.append(el("span", "en curso", "etiqueta"));
            }
          }
          tr.append(celdaEstado);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        return tabla;
      }

      /** Los estados a los que una feature puede ir hoy, según el contrato. */
      async function transicionesDeFeature(slug) {
        const f = await api("GET", `/api/features/${slug}`);
        return f;
      }

      /**
       * Mueve el estado de una feature.
       *
       * Los destinos vienen del servidor, que los saca de la tabla del contrato:
       * si la interfaz los dedujera, un cambio en la máquina de estados dejaría a
       * la pantalla ofreciendo movimientos ilegales.
       */
      async function moverFeature(slug, to) {
        try {
          const r = await api("POST", `/api/features/${slug}/transition`, { to });
          await vistaFeature(slug);
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado ok resultado-feature";
            salida.textContent = r.details;
          }
        } catch (fallo) {
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = fallo.message;
          }
        }
      }

      /**
       * Descompone una feature y muestra el grafo.
       *
       * Es el paso que más valor tiene de esta vista y el único que obligaba a
       * abrir la terminal para completar el ciclo. Se avisa de lo que cuesta antes
       * de pulsar: una llamada al modelo del rol `architect`.
       */
      async function descomponerFeature(slug, boton, salida) {
        boton.disabled = true;
        boton.textContent = "Descomponiendo…";
        salida.className = "resultado resultado-feature";
        salida.textContent =
          "Consultando al modelo del rol architect. Puede tardar un minuto.";
        try {
          const r = await api("POST", `/api/features/${slug}/decompose`, {});
          if (!r.ok) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = r.error;
            return;
          }
          salida.className = "resultado ok resultado-feature";
          salida.textContent =
            `Descomposición escrita: ${r.document.decomposition.sprints.length} sprint(s), ` +
            `${r.document.decomposition.coverage.length} requisito(s) cubierto(s). ` +
            `Modelo: ${r.decomposer.provider}/${r.decomposer.model}`;
          await vistaFeature(slug);
        } catch (fallo) {
          salida.className = "resultado error resultado-feature";
          salida.textContent = fallo.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Descomponer";
        }
      }

      async function vistaFeature(slug) {
        const cont = $("contenido");
        cont.textContent = "";

        const f = await api("GET", `/api/features/${slug}`);

        const volver = el("a", "← Todas las features", "volver enlace");
        volver.href = "#/features";
        cont.append(volver);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", f.title));
        const meta = el("div", undefined, "meta");
        meta.append(el("span", f.id, "id"), el("span", f.state, "etiqueta"));
        if (f.invalid !== null) meta.append(el("span", "inválida", "etiqueta roto"));
        cabecera.append(meta, marcasArtefactos(f), el("div", f.path, "ruta"));
        cont.append(cabecera);

        if (f.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "La feature no valida. "), el("span", f.invalid));
          cont.append(nota);
        }

        // ── Huecos de cobertura ──
        //
        // Va antes que nada operativo a propósito: es lo que impide empezar a
        // trabajar, y enterrarlo bajo tres tablas obliga a buscarlo.
        const huecos = f.decomposition === null ? [] : f.decomposition.gaps;
        if (f.decompositionError !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(
            el("strong", "El tickets.yaml no se puede leer. "),
            el("span", f.decompositionError, "resultado error"),
          );
          cont.append(nota);
        }
        if (huecos.length > 0) {
          const caja = el("div", undefined, "nota alerta huecos");
          caja.append(
            el("strong", `${huecos.length} requisito(s) sin ticket que los cubra. `),
            el(
              "span",
              "La compuerta de descomposición no pasa con huecos: cada requisito necesita al menos un ticket en un sprint.",
            ),
          );
          for (const hueco of huecos) {
            const fila = el("div", undefined, "fila");
            fila.append(
              el("span", hueco.requirement || "declarado", "id"),
              el("span", hueco.statement),
            );
            caja.append(fila);
          }
          cont.append(caja);
        }
        if (f.cycles.length > 0) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El grafo de dependencias tiene ciclos. "));
          for (const ciclo of f.cycles) {
            nota.append(el("div", ciclo.join(" → "), "id"));
          }
          cont.append(nota);
        }

        // El estado de cada ticket del grafo, para saber qué está escrito ya.
        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        // ── Pestañas ──
        const barra = el("div", undefined, "secciones");
        const zona = el("div");
        const pestanas = [
          ["Resumen", () => panelResumen(f)],
          ["Requisitos", () => panelRequisitos(f)],
          ["Grafo", () => panelGrafo(f)],
          ["Brief", () => bloqueCrudo("feature.md", f.brief, true)],
        ];
        // El tablero va primero cuando hay grafo: es la respuesta a «¿por dónde
        // va?», que es la pregunta con la que se entra a una feature en curso.
        if (f.hasDecomposition) pestanas.unshift(["Tablero", () => panelTablero(f)]);
        if (f.design !== null)
          pestanas.push(["Diseño", () => bloqueCrudo("design.md", f.design)]);
        if (f.ticketsYaml !== null) {
          pestanas.push([
            "tickets.yaml",
            () => bloqueCrudo("tickets.yaml", f.ticketsYaml, true),
          ]);
        }
        for (const spec of f.specs) {
          pestanas.push([
            `spec · ${spec.domain}`,
            () => bloqueCrudo(spec.source, spec.text),
          ]);
        }

        const pintar = (indice) => {
          zona.textContent = "";
          zona.append(pestanas[indice][1]());
          for (const [i, boton] of [...barra.children].entries()) {
            boton.setAttribute("aria-pressed", String(i === indice));
          }
        };
        pestanas.forEach(([nombre], indice) => {
          const boton = el("button", nombre);
          boton.addEventListener("click", () => pintar(indice));
          barra.append(boton);
        });
        cont.append(barra, zona);
        pintar(0);
      }

      /** El resumen: qué hay, quién lo generó y en qué punto está. */
      function panelResumen(f) {
        const caja = el("div");

        const tabla = el("table");
        const tbody = el("tbody");
        const fila = (rotulo, valor) => {
          const tr = el("tr");
          tr.append(el("td", rotulo, "id"), el("td", valor));
          tbody.append(tr);
        };
        fila("Estado", f.state);
        fila("Creada", f.created);
        fila("Actualizada", f.updated);
        fila(
          "Requisitos",
          f.requirements === 0
            ? "La spec no declara requisitos todavía."
            : `${f.requirements} en ${f.specs.length} dominio(s)`,
        );
        fila(
          "Tickets",
          f.hasDecomposition
            ? `${f.tickets} en ${f.decomposition?.sprints.length ?? 0} sprint(s)`
            : "Sin descomponer",
        );
        if (f.decomposition?.origin) {
          fila(
            "Descompuesta por",
            `${f.decomposition.origin.provider}/${f.decomposition.origin.model}`,
          );
        }
        tabla.append(tbody);
        caja.append(tabla);

        // ── Acciones ──
        //
        // Mover el estado y descomponer, desde aquí. Es lo que cierra el ciclo sin
        // abrir la terminal, y descomponer es el paso que más valor tiene: es el
        // que convierte la spec en trabajo.
        const acciones = el("div", undefined, "acciones-feature");
        const salida = el("div", "resultado resultado-feature");

        if (!f.hasDecomposition && f.requirements > 0) {
          const boton = el("button", "Descomponer", "principal");
          boton.title =
            "Pide el grafo de tickets al modelo del rol architect. Cuesta una llamada.";
          boton.addEventListener(
            "click",
            () => void descomponerFeature(f.id, boton, salida),
          );
          acciones.append(boton);
        }
        if (f.requirements === 0) {
          acciones.append(
            el(
              "span",
              `Falta la spec: escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con ` +
                'requisitos en RFC 2119 — "### Requirement: R-XXX-001 — El sistema DEBE …".',
              "resultado",
            ),
          );
        }

        // Los movimientos legales, con el estado actual fuera: ofrecer el que ya
        // se tiene es ofrecer un botón que no hace nada.
        const destinos = (f.transitions ?? []).filter((estado) => estado !== f.state);
        if (destinos.length > 0) {
          const etiqueta = el("span", "Mover a:", "resultado");
          acciones.append(etiqueta);
          for (const destino of destinos) {
            const boton = el("button", destino);
            boton.addEventListener("click", () => void moverFeature(f.id, destino));
            acciones.append(boton);
          }
        }

        if (acciones.children.length > 0) {
          caja.append(acciones, salida);
        }
        if (f.requirements === 0) {
          const nota = el("div", undefined, "nota");
          nota.append(
            el("strong", "Falta la spec. "),
            el(
              "span",
              `Escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con requisitos en RFC 2119: "### Requirement: R-XXX-001 — El sistema DEBE …".`,
              "resultado",
            ),
          );
          caja.append(nota);
        }
        return caja;
      }

      /** Los requisitos, con la cobertura declarada y el estado real. */
      function panelRequisitos(f) {
        const caja = el("div");
        const requisitos = f.specs.flatMap((spec) => spec.requirements);

        if (requisitos.length === 0) {
          caja.append(el("div", "La spec no declara requisitos.", "vacio"));
          return caja;
        }

        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        caja.append(tablaRequisitos(requisitos, ticketsPorId));

        if (f.decomposition === null) {
          caja.append(
            el(
              "div",
              "Sin tickets.yaml no hay cobertura declarada: la columna «Cubierto por» está vacía por eso, no porque falte trabajo.",
              "nota",
            ),
          );
        }
        return caja;
      }

      /**
       * El tablero: los tickets de la feature, agrupados por dónde están.
       *
       * Es el grafo mirado al revés. La tabla de sprints responde «qué se planeó»,
       * que es lo que se pregunta antes de empezar; el tablero responde «por dónde
       * va», que es lo que se pregunta todos los días mientras se trabaja. Y
       * responde una tercera, que es la que hace falta para ponerse a trabajar:
       * **cuál se puede empezar ya** —el que no espera a nadie—, porque una
       * dependencia sin cerrar es una razón para no tocarlo todavía.
       *
       * Un ticket del grafo que todavía no está en el registro no se esconde ni se
       * disfraza: tiene su columna, «Sin crear», que es el estado en que queda una
       * feature descompuesta y todavía sin tickets escritos.
       */
      function panelTablero(f) {
        const caja = el("div");
        const tickets = [...(f.decomposition?.sprints ?? [])].flatMap((sprint) =>
          sprint.tickets.map((t) => ({ ...t, sprint: sprint.id })),
        );

        if (tickets.length === 0) {
          caja.append(
            el(
              "div",
              "El grafo no tiene tickets todavía. Descompone la feature o escribe el tickets.yaml.",
              "vacio",
            ),
          );
          return caja;
        }

        const porId = new Map(tickets.map((t) => [t.id, t]));
        /** Un ticket está terminado cuando su trabajo ya no bloquea a nadie. */
        const terminado = (id) => {
          const otro = porId.get(id);
          return (
            otro !== undefined &&
            (otro.state === "closed" || otro.state === "qa_approved")
          );
        };
        const espera = (t) => t.dependsOn.filter((id) => !terminado(id));

        const etapas = [
          ["Sin crear", (t) => !t.exists],
          ["Por analizar", (t) => t.exists && t.state === "intake"],
          ["Planeado", (t) => ["analyzed", "planned"].includes(t.state)],
          ["Aprobado", (t) => t.state === "approved"],
          [
            "En curso",
            (t) => ["in_progress", "changes_requested"].includes(t.state),
          ],
          ["Por probar", (t) => ["awaiting_user_tests", "in_qa"].includes(t.state)],
          ["Cerrado", (t) => ["qa_approved", "closed"].includes(t.state)],
          ["Bloqueado", (t) => t.state === "blocked"],
        ];

        const tablero = el("div", undefined, "tablero");
        const vacias = [];
        for (const [nombre, coincide] of etapas) {
          const suyos = tickets.filter(coincide);
          // Una columna sin tarjetas no se pinta: ocho etapas con seis vacías
          // obligaban a desplazarse para ver las dos que tienen trabajo. La forma
          // del tablero no se pierde —las vacías se nombran al pie— y lo que se
          // gana es que el trabajo entre en la pantalla.
          if (suyos.length === 0) {
            vacias.push(nombre);
            continue;
          }

          const columna = el("div", undefined, "columna-tablero");
          columna.append(el("div", `${nombre} · ${suyos.length}`, "titulo"));
          for (const t of suyos) {
            const tarjeta = el("div", undefined, "tarjeta-ticket");
            const identificador = el("div", t.id, "id");
            // El identificador lleva al ticket cuando existe: es lo que se hace
            // después de mirar el tablero.
            if (t.exists) {
              const enlace = el("a", t.id, "enlace");
              enlace.href = `#/ticket/${t.id}`;
              identificador.textContent = "";
              identificador.append(enlace);
            }
            tarjeta.append(identificador);
            const titulo = el("div", t.title || "(sin título)", "titulo-ticket");
            // El texto completo, para cuando el recorte de tres renglones lo corta.
            titulo.title = t.title || "(sin título)";
            tarjeta.append(titulo);
            const meta = el("div", undefined, "meta");
            meta.append(
              el("span", t.exists ? t.state : "sin crear", "etiqueta"),
              el("span", t.sprint, "id"),
            );
            tarjeta.append(meta);

            const pendientes = espera(t);
            if (pendientes.length > 0) {
              tarjeta.append(
                el("div", `espera a ${pendientes.join(", ")}`, "espera resultado"),
              );
            } else if (t.exists && !["closed", "qa_approved"].includes(t.state)) {
              tarjeta.append(el("div", "listo para empezar", "listo resultado"));
            }
            columna.append(tarjeta);
          }
          tablero.append(columna);
        }

        caja.append(tablero);
        if (vacias.length > 0) {
          caja.append(el("div", `Sin tarjetas: ${vacias.join(", ")}.`, "vacio-tablero"));
        }

        const sinCrear = tickets.filter((t) => !t.exists).length;
        // El paso que convierte el plan en trabajo. Está acá, junto al dato que lo
        // justifica —cuántos faltan— y no en el grafo: es lo que se quiere hacer
        // después de ver qué no está escrito.
        if (sinCrear > 0) {
          const pie = el("div", undefined, "responsable");
          const escribir = el("button", `Escribir los ${sinCrear} que faltan en el registro`);
          const salida = el("div", undefined, "resultado");
          escribir.addEventListener("click", async () => {
            escribir.disabled = true;
            salida.className = "resultado";
            salida.textContent = "Creando…";
            try {
              const r = await api("POST", `/api/features/${f.id}/materialize`, {});
              if (!r.ok) throw new Error(r.error);
              salida.className = "resultado ok";
              salida.textContent = r.details;
              await vistaFeature(f.id);
            } catch (fallo) {
              salida.className = "resultado error";
              salida.textContent = fallo.message;
              escribir.disabled = false;
            }
          });
          pie.append(escribir, salida);
          caja.append(pie);
        }
        caja.append(
          el(
            "div",
            sinCrear === 0
              ? `${tickets.length} ticket(s) del grafo están escritos en el registro.`
              : `${sinCrear} de ${tickets.length} ticket(s) del grafo todavía no están ` +
                  "escritos en el registro: el grafo es el plan, y cada uno se crea para " +
                  "poder trabajarlo. Los que esperan a otro conviene no empezarlos antes.",
            "nota",
          ),
        );
        return caja;
      }

      /** El grafo: sprints, tickets, dependencias y quién existe ya. */
      function panelGrafo(f) {
        const caja = el("div");

        if (f.decomposition === null) {
          caja.append(
            el("div", f.decompositionError ?? "Todavía no hay descomposición.", "vacio"),
          );
          return caja;
        }

        for (const sprint of f.decomposition.sprints) {
          const cajaSprint = el("div", undefined, "sprint");
          const cabecera = el("header");
          cabecera.append(el("span", sprint.id, "id"), el("h3", sprint.goal));
          cajaSprint.append(cabecera);

          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Ticket", "Estado", "Depende de"])
            fila.append(el("th", columna));
          thead.append(fila);

          const tbody = el("tbody");
          for (const t of sprint.tickets) {
            // Un ticket del grafo que aún no está en el registro se atenúa: la
            // diferencia entre «planeado» y «escrito» es lo que se mira aquí.
            const tr = el("tr", undefined, t.exists ? "" : "planeado");

            const celda = el("td");
            celda.append(el("div", t.title || "(sin título)"), el("div", t.id, "id"));
            tr.append(celda);

            const celdaEstado = el("td");
            celdaEstado.append(
              t.exists
                ? el("span", t.state, "etiqueta")
                : el("span", "por crear", "etiqueta"),
            );
            tr.append(celdaEstado);

            const celdaDeps = el("td");
            celdaDeps.append(
              el(
                "span",
                t.dependsOn.length === 0 ? "—" : t.dependsOn.join(", "),
                "depende",
              ),
            );
            tr.append(celdaDeps);

            tbody.append(tr);
          }

          tabla.append(thead, tbody);
          cajaSprint.append(tabla);
          caja.append(cajaSprint);
        }

        const creados = [...(f.decomposition?.sprints ?? [])]
          .flatMap((s) => s.tickets)
          .filter((t) => t.exists).length;
        const total = [...(f.decomposition?.sprints ?? [])].flatMap(
          (s) => s.tickets,
        ).length;
        caja.append(
          el(
            "div",
            `${creados} de ${total} ticket(s) del grafo existen ya en el registro. Los atenuados están planeados y todavía no escritos.`,
            "nota",
          ),
        );
        return caja;
      }

      /**
       * La barra de progreso de una feature: cuántos de sus tickets cerraron.
       *
       * Faltaba, y la vista la llamaba desde que se escribió la columna de
       * progreso: en un proyecto sin features descompuestas nadie pasaba por esa
       * rama, y en cuanto hubo una, la pantalla entera respondió «Can't find
       * variable: barraDeProgreso». Un `undefined` a la vista no aparece hasta
       * que el dato existe.
       */
      function barraDeProgreso(cerrados, total) {
        const caja = el("div", undefined, "barra-progreso");
        const lleno = el("div", undefined, "barra-progreso-lleno");
        const proporcion = total === 0 ? 0 : Math.round((cerrados / total) * 100);
        lleno.style.width = `${proporcion}%`;
        caja.append(lleno);
        caja.title = `${cerrados} de ${total} cerrados`;
        return caja;
      }

      /**
       * Descarga el reporte Markdown.
       *
       * Se pide el texto a la API y se arma el archivo en el navegador con un
       * `Blob`: un enlace directo a `/api/report` abriría el Markdown en una
       * pestaña, que es lo contrario de lo que se quiere —pegarlo en un correo—.
       */
      async function descargarReporte() {
        // El rango sale de los filtros de la lista: el reporte semanal es sobre lo
        // que se cerró esa semana, así que el botón tiene que exportar **lo que se
        // está viendo** y no un rango fijo. El reporte siempre cuenta por fecha de
        // cierre, que es la del bloque `## Cierre`.
        const params = new URLSearchParams();
        if (filtros.desde !== "") params.set("desde", filtros.desde);
        if (filtros.hasta !== "") params.set("hasta", filtros.hasta);

        const datos = await api("GET", `/api/report?${params.toString()}`);
        const blob = new Blob([datos.markdown], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = datos.filename;
        enlace.click();
        URL.revokeObjectURL(url);
      }

      // ── Vista: un ticket, con sus gates ───────────────────────────────────

      /** Los colores y el nombre legible de cada tipo de proposición. */
      const MODALIDAD = { human: "humano", auto: "automático", hybrid: "híbrido" };
      const MARCA = { pass: "✓", fail: "✗", warn: "!", skip: "·" };

      /** Una barra con el valor y los dos umbrales: hace visible la decisión. */
      function barraValor(valor, mark, policy) {
        const barra = el("div", undefined, "barra");
        const relleno = el("div", undefined, `relleno ${mark}`);
        relleno.style.width = `${Math.max(0, Math.min(1, valor)) * 100}%`;
        barra.append(relleno);
        for (const corte of [policy.blockAt, policy.approveAt]) {
          const marca = el("div", undefined, "corte");
          marca.style.left = `${corte * 100}%`;
          barra.append(marca);
        }
        return barra;
      }

      /** Los checks que decide el código, sin coste y antes de evaluar. */
      function listaChecks(checks) {
        const lista = el("div", undefined, "checks");
        for (const check of checks) {
          const fila = el("div", undefined, "check");
          fila.append(
            el("span", MARCA[check.result] ?? "·", `marca ${check.result}`),
            el("span", check.id),
            el("span", check.detail ?? "", "detalle"),
          );
          lista.append(fila);
        }
        return lista;
      }

      /** Las proposiciones evaluadas, con la probabilidad que se comparó. */
      function tablaProposiciones(recibo, policy) {
        const tabla = el("table", undefined, "proposiciones");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proposición", "Valor", "", "Umbral", "Resultado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const p of recibo.propositions) {
          const tr = el("tr");

          // Lo que se juzgó va primero y en su texto: `criterio_03` en banda de
          // revisión no dice nada, y el criterio que representa sí. Debajo queda
          // el identificador con su valor, que es lo que hace falta para
          // rastrearlo en el recibo.
          const celdaProposicion = el("td");
          if (p.description) {
            celdaProposicion.append(
              el("div", p.description, "criterio-texto"),
              el("div", p.label || p.id, "etiqueta-proposicion"),
            );
          } else {
            celdaProposicion.append(el("div", p.label || p.id, "etiqueta-proposicion"));
          }
          tr.append(celdaProposicion);
          tr.append(el("td", p.value.toFixed(3), "cifra"));

          const celdaBarra = el("td");
          celdaBarra.append(barraValor(p.value, p.mark, policy));
          tr.append(celdaBarra);

          tr.append(
            el(
              "td",
              p.verdict ? `${policy.approveAt} / ${policy.blockAt}` : "no veta",
              "cifra",
            ),
          );

          const celdaResultado = el("td");
          const texto = {
            approve: "aprueba",
            block: "bloquea",
            review: "en banda media",
            descriptive: "descriptiva",
          }[p.mark];
          celdaResultado.append(
            el("span", texto, p.mark === "descriptive" ? "descriptiva" : "etiqueta"),
          );
          if (p.reason) celdaResultado.append(el("div", p.reason, "resultado"));
          tr.append(celdaResultado);

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        return tabla;
      }

      /** La decisión vigente de un gate, con todo lo que la hace auditable. */
      function bloqueDecision(recibo, gate, ticketId, alDecidir) {
        const cont = el("div");

        const veredicto = el("div", undefined, "veredicto");
        veredicto.append(
          el("span", recibo.outcome.toUpperCase(), `salida ${recibo.outcome}`),
          el("span", recibo.reason, "motivo"),
          el("span", recibo.actor, "etiqueta"),
        );
        cont.append(veredicto);

        // Una aprobación de un estado que ya no existe no es una aprobación.
        if (recibo.stale) {
          cont.append(
            el(
              "div",
              "El ticket cambió desde que se emitió este recibo. La decisión es sobre el " +
                "estado congelado, no sobre el ticket actual: hay que volver a evaluar.",
              "obsoleto",
            ),
          );
        }

        // Un renglón que explique la banda antes de la tabla: sin él, «en banda
        // media» es una palabra que hay que interpretar.
        if (recibo.propositions.some((p) => p.mark === "review")) {
          cont.append(
            el(
              "div",
              `Ninguna proposición llegó a los umbrales: por debajo de ${gate.policy.blockAt} bloquea, ` +
                `a partir de ${gate.policy.approveAt} aprueba, y lo que cae en medio es lo que tienes que decidir tú. ` +
                "Las que aparecen como «descriptiva» se registran pero no vetan.",
              "resultado",
            ),
          );
        }
        cont.append(
          tablaProposiciones(recibo, gate.policy),
          listaChecks(recibo.mechanicalChecks),
        );

        const pie = el("div", undefined, "pie-recibo");
        pie.append(
          el("span", undefined, `media ponderada ${recibo.weightedMean.toFixed(3)}`),
          el(
            "span",
            undefined,
            `evaluador ${recibo.model?.resolvedVersion ?? "— (decisión en código)"}`,
          ),
          el("span", undefined, `coste $${(recibo.usage?.costUsd ?? 0).toFixed(6)}`),
          el("span", undefined, `${recibo.latencyMs ?? 0} ms`),
          el("span", undefined, `congelado ${recibo.stateHash.slice(0, 23)}…`),
        );
        cont.append(pie);

        // La decisión humana.
        if (recibo.humanDecision !== null) {
          const humana = el("div", undefined, "decision-humana");
          const quien = el("div", undefined, "quien");
          quien.append(
            el("strong", recibo.humanDecision.actor),
            el(
              "span",
              ` ${recibo.humanDecision.decision === "approve" ? "aprobó" : "rechazó"} · ${recibo.humanDecision.decidedAt}`,
            ),
          );
          humana.append(quien);
          if (recibo.humanDecision.reason) {
            humana.append(el("div", recibo.humanDecision.reason, "resultado"));
          }
          cont.append(humana);
        } else if (recibo.escalatedTo === "human") {
          const humana = el("div", undefined, "decision-humana");
          humana.append(
            el(
              "div",
              "El evaluador no alcanzó ninguno de los dos umbrales: la decisión es de una persona.",
              "resultado",
            ),
          );

          const acciones = el("div", undefined, "acciones");
          acciones.style.justifyContent = "flex-start";
          acciones.style.marginTop = "10px";

          const motivo = document.createElement("input");
          motivo.type = "text";
          motivo.placeholder = "Motivo de la decisión";
          motivo.style.flex = "1 1 260px";

          const aprobar = el("button", "Aprobar", "principal");
          const rechazar = el("button", "Rechazar", "peligro");
          const decidir = async (decision, boton) => {
            if (responsable.trim() === "") {
              alert(
                "Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.",
              );
              return;
            }
            boton.disabled = true;
            try {
              await api(
                "POST",
                `/api/tickets/${ticketId}/gates/${recibo.receiptId}/decision`,
                {
                  decision,
                  actor: responsable,
                  reason: motivo.value,
                },
              );
              await alDecidir();
            } catch (error) {
              alert(error.message);
              boton.disabled = false;
            }
          };
          aprobar.addEventListener("click", () => void decidir("approve", aprobar));
          rechazar.addEventListener("click", () => void decidir("reject", rechazar));

          acciones.append(motivo, aprobar, rechazar);
          humana.append(acciones);
          cont.append(humana);
        } else if (recibo.outcome === "block") {
          // Un bloqueo también admite la firma de una persona (R-CDEF-004): tras dos
          // bloqueos del mismo motivo, lo normal es un artefacto ya corregido que se autoriza
          // sin una tercera corrida. Solo se ofrece «Autorizar», con la frase literal
          // obligatoria; «Rechazar» un bloqueo no cambia nada, y el de la compuerta mecánica
          // es un comando que falló: un hecho, no una opinión.
          const humana = el("div", undefined, "decision-humana");
          if (recibo.gate === "qa-mechanical") {
            humana.append(
              el(
                "div",
                "La compuerta mecánica bloqueó porque un comando falló, y eso es un hecho y no " +
                  "una opinión: no admite una decisión humana. Corrige lo que falla y vuelve a correrla.",
                "resultado",
              ),
            );
          } else {
            humana.append(
              el(
                "div",
                "El evaluador bloqueó. Si decides seguir de todos modos —por ejemplo tras dos " +
                  "bloqueos por el mismo motivo, con el artefacto ya corregido—, tu autorización " +
                  "queda en el registro con tu frase literal. Autorizar no avanza el ticket: la " +
                  "transición es otro paso. También se puede autorizar un bloqueo obsoleto.",
                "resultado",
              ),
            );

            const acciones = el("div", undefined, "acciones");
            acciones.style.justifyContent = "flex-start";
            acciones.style.marginTop = "10px";

            const frase = document.createElement("input");
            frase.type = "text";
            frase.placeholder = "Frase literal de quien autoriza (obligatoria)";
            frase.style.flex = "1 1 320px";

            const autorizar = el("button", "Autorizar seguir pese al bloqueo", "principal");
