        crudo.hidden = true;
        alternar.addEventListener("click", () => {
          crudo.hidden = !crudo.hidden;
          cuerpo.hidden = !crudo.hidden;
          alternar.textContent = crudo.hidden ? "Ver el texto original" : "Ver el documento";
        });
        pie.append(alternar);
        caja.append(crudo, pie);
        return caja;
      }

      /**
       * Un registro cualquiera como tarjeta.
       *
       * Los bloques del ticket —puntos, QA, evidencia, retests, cierre— tienen
       * forma propia y cambiante, así que en vez de inventar una tarjeta por
       * bloque se pinta la forma del dato: los campos cortos como etiquetas y los
       * largos como texto. Lo que **no** se hace es volcar el JSON: un arreglo
       * crudo en pantalla obliga a leerlo como lo lee una máquina.
       */
      function tarjetaDato(registro) {
        const caja = el("div", undefined, "tarjeta-dato");
        const cabecera = el("div", undefined, "tarjeta-dato-cabecera");

        // Los campos que identifican van arriba y en orden fijo.
        const IDENTIDAD = ["id", "date", "status", "severity", "result", "action", "actor"];
        const usados = new Set();
        for (const clave of IDENTIDAD) {
          const valor = registro[clave];
          if (valor === undefined || valor === null || valor === "") continue;
          usados.add(clave);
          const tono =
            clave === "status" || clave === "result"
              ? ["closed", "verified", "approved", "passed", "ok"].includes(String(valor))
                ? "bueno"
                : ["open", "blocked", "failed", "rejected"].includes(String(valor))
                  ? "malo"
                  : ""
              : clave === "severity" && String(valor) !== "normal"
                ? "malo"
                : "";
          cabecera.append(
            el(
              "span",
              clave === "id" ? String(valor) : `${clave} ${String(valor)}`,
              clave === "id" ? "id" : `etiqueta ${tono}`.trim(),
            ),
          );
        }
        caja.append(cabecera);

        // El resto del registro, campo por campo.
        for (const [clave, valor] of Object.entries(registro)) {
          if (usados.has(clave) || clave === "kind") continue;
          if (valor === null || valor === undefined || valor === "") continue;

          if (Array.isArray(valor)) {
            if (valor.length === 0) continue;
            // Un arreglo de objetos anidados se resume con su conteo: el detalle
            // completo de un bloque dentro de otro no se lee, se busca.
            caja.append(
              el("div", `${clave}: ${valor.length} elemento(s)`, "tarjeta-dato-nota"),
            );
            continue;
          }
          if (typeof valor === "object") {
            caja.append(el("div", `${clave}: ${JSON.stringify(valor)}`, "tarjeta-dato-nota"));
            continue;
          }
          caja.append(el("div", `${clave}: ${String(valor)}`, "tarjeta-dato-nota"));
        }
        return caja;
      }

      /**
       * La tarjeta de una entrada de QA. La entrada impar cierra el ciclo y es la única
       * que puede declarar `not_covered`: se lista cada elemento, «Todo cubierto» si la
       * lista es vacía y «Sin cubrir: sin declarar» si el cierre no trae el campo.
       */
      function tarjetaCicloQa(registro, indice) {
        const { not_covered: noCubierto, ...resto } = registro;
        const caja = tarjetaDato(resto);
        if (indice % 2 === 0) return caja;
        const cobertura = el("div", undefined, "tarjeta-dato-nota tarjeta-dato-cobertura");
        if (!Array.isArray(noCubierto)) {
          cobertura.append(el("strong", "Sin cubrir: sin declarar"));
        } else if (noCubierto.length === 0) {
          cobertura.append(el("strong", "Todo cubierto"));
        } else {
          cobertura.append(el("strong", "Sin cubrir"));
          const lista = el("ul");
          for (const elemento of noCubierto) lista.append(el("li", String(elemento)));
          cobertura.append(lista);
        }
        caja.append(cobertura);
        return caja;
      }

      /** Una lista de tarjetas, con su estado vacío dicho. */
      function tarjetasDe(items, construir, vacio) {
        if (items.length === 0) return el("div", vacio, "vacio");
        const caja = el("div", undefined, "tarjetas-datos");
        for (const item of items) caja.append(construir(item));
        return caja;
      }

      // ── Vista: procesos ───────────────────────────────────────────────────
      //
      // Responde a la pregunta que un proceso detenido deja abierta: «¿hay algo
      // que hacer?». Las corridas esperando van primero, y el gate se aprueba
      // desde aquí —que es lo que obligaba a abrir la terminal—.

      /** El responsable de aprobar un gate: se recuerda entre visitas. */
      function responsableDeAprobacion() {
        return responsable;
      }

      async function aprobarGate(gate, boton, salida) {
        const actor = responsableDeAprobacion();
        if (actor.trim() === "") {
          salida.className = "resultado error";
          salida.textContent =
            "Falta el responsable. Escríbelo en el campo de arriba: aprobar sin nombre no es auditable.";
          return;
        }
        boton.disabled = true;
        boton.textContent = "Aprobando…";
        try {
          const r = await api("POST", `/api/processes/gates/${gate}/approve`, { actor });
          salida.className = "resultado ok";
          // Se dice que aprobar no retoma: es la confusión natural, y mejor
          // deshacerla aquí que dejar a alguien esperando a que el proceso siga.
          salida.textContent =
            `${r.details} El proceso **no** continúa solo: retómalo con ` +
            "`valmen process resume` (o desde la terminal) cuando quieras seguir.";
          await vistaProcesos();
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Aprobar";
        }
      }

      async function vistaPortafolio() {
        const cont = $("contenido");
        cont.textContent = "Cargando portafolio…";
        const datos = await api("GET", "/api/portafolio");
        cont.textContent = "";
        const r = datos.summary;
        cont.append(el("p", `Solo lectura · Consumo de compuertas del ${datos.range.desde} al ${datos.range.hasta}.`, "descripcion"));
        if (!datos.available) {
          cont.append(el("div", datos.reason, "vacio"));
          return;
        }
        const tarjetas = el("div", undefined, "tarjetas");
        for (const [rotulo, valor] of [
          ["Proyectos disponibles", `${r.available} de ${r.projects}`],
          ["Compuertas pendientes", r.gatesPending],
          ["Corridas detenidas", r.waiting],
          ["Consumo del rango (USD)", r.costUsd.toFixed(6)],
        ]) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);
        if (r.unavailable > 0) cont.append(el("p", "Totales parciales: hay proyectos no disponibles.", "resultado"));
        if (datos.projects.length === 0) {
          cont.append(el("div", "No hay proyectos declarados en el catálogo local.", "vacio"));
          return;
        }
        const tabla = el("table");
        const cabecera = el("thead");
        const titulos = el("tr");
        for (const texto of ["Proyecto", "Disponibilidad", "Compuertas pendientes", "Corridas detenidas", "Consumo (USD)"]) titulos.append(el("th", texto));
        cabecera.append(titulos);
        const cuerpo = el("tbody");
        for (const proyecto of datos.projects) {
          const fila = el("tr");
          const nombre = el("td");
          nombre.append(el("div", proyecto.name, "nombre"), el("div", proyecto.projectId, "id"), el("div", proyecto.root, "ruta"));
          if (proyecto.current) nombre.append(el("span", "Instancia actual", "etiqueta"));
          fila.append(nombre);
          const estado = el("td");
          const fuentes = proyecto.sources ?? {
            machine: { label: "Máquina", available: proyecto.available, reason: proyecto.reason },
            registry: { label: "Registro local", available: proyecto.available, reason: proyecto.reason },
          };
          for (const [tipo, fuente] of Object.entries(fuentes)) {
            const etiqueta = tipo === "machine" ? "Máquina" : "Fuente";
            estado.append(el("div", `${etiqueta}: ${fuente.label} · ${fuente.available ? "Disponible" : "No disponible"}`, "etiqueta"));
            if (fuente.reason) estado.append(el("div", fuente.reason, "descripcion"));
          }
          if (proyecto.reason) estado.append(el("div", proyecto.reason, "descripcion"));
          fila.append(estado);
          const compuertas = el("td", proyecto.available ? `${proyecto.gatesPending} compuertas pendientes` : "—");
          if (proyecto.available) compuertas.append(el("div", `${proyecto.correctionsPending} correcciones pendientes`, "descripcion"));
          fila.append(compuertas, el("td", proyecto.available ? `${proyecto.waiting} corridas detenidas` : "—"));
          const consumo = el("td", proyecto.usage ? `USD ${proyecto.usage.costUsd.toFixed(6)}` : "—");
          if (proyecto.usage) {
            consumo.append(el("div", `${proyecto.usage.evaluations} evaluaciones`, "descripcion"));
            if (proyecto.usage.unreadable > 0) consumo.append(el("div", `${proyecto.usage.unreadable} recibos ilegibles no contados`, "resultado"));
          }
          fila.append(consumo);
          cuerpo.append(fila);
        }
        tabla.append(cabecera, cuerpo);
        cont.append(tabla);
      }

      // Una respuesta de jornadas puede llegar después de que la persona cambió
      // de proyecto o de vista. La revisión no representa datos del servidor:
      // solo identifica la última solicitud que todavía tiene derecho a pintar.
      let revisionVistaJornadas = 0;
      const frescuraPorProyecto = new Map();

      async function leerFrescuraDeFuentes(projectId) {
        try {
          const frescura = await api("GET", "/api/execution-freshness");
          if (projectId === proyectoSeleccionado) frescuraPorProyecto.set(projectId, frescura);
          return frescura;
        } catch (error) {
          if (error === RESPUESTA_DE_PROYECTO_OBSOLETA) throw error;
          return frescuraPorProyecto.get(projectId) ?? {
            sources: [],
            error: "No se pudo actualizar la frescura de las fuentes.",
          };
        }
      }

      function descripcionDeFrescura(fuente) {
        const estado = fuente.state === "fresh"
          ? "actualizada"
          : fuente.state === "stale"
            ? "desactualizada"
            : "no disponible";
        const ultimo = fuente.lastReceivedAt === null || fuente.lastReceivedAt === undefined
          ? "sin dato previo"
          : `último dato ${fuente.lastReceivedAt}`;
        return `${fuente.source}: ${estado} · ${ultimo}${fuente.reason ? ` · ${fuente.reason}` : ""}`;
      }

      const FASES_DE_TICKET = {
        waiting: "En espera",
        preparing: "En preparación",
        "plan-ready": "Plan listo para aprobar",
        implementing: "Implementando",
        verifying: "Verificando",
        delivered: "Entregado",
        stopped: "Detenido",
      };

      function celdaDeFase(ticket) {
        const celda = el("td", FASES_DE_TICKET[ticket.phase] ?? "—");
        if (ticket.phase === "stopped" && ticket.stopReason) celda.append(el("div", ticket.stopReason, "nota"));
        return celda;
      }

      /**
       * Detalle de la jornada (pasadas, frescura de fuentes y la tabla de su hoja
       * de ruta). Vive al pie de la vista Corrida, plegado: es el dato del despacho
       * de la jornada, y cuando el trabajo lo hace una sesión dice poco.
       */
      function pintarDetalleDeJornadas(destino, datos, frescura) {
        const panel = $("actualizado")?.textContent ?? "sin conexión";
        destino.append(el("div", `Panel: ${panel}`, "nota"));
        if (frescura.error) destino.append(el("div", frescura.error, "resultado"));
        for (const fuente of frescura.sources ?? []) {
          destino.append(el("div", `Fuente ${descripcionDeFrescura(fuente)}`, "nota"));
        }
        if ((datos.journeys ?? []).length === 0) {
          destino.append(el("div", "No hay jornadas registradas para este proyecto.", "vacio"));
          return;
        }
        const fuentesObservadas = datos.authorization?.observationSources ?? [];
        const despachoDeclarado = (datos.authorization?.dispatchExecutors ?? []).join(", ") || "ninguno";
        destino.append(el("div", fuentesObservadas.length === 0
          ? `Observación externa: ninguna fuente declarada; la actividad mostrada la registra el propio despacho de la jornada · Despacho declarado: ${despachoDeclarado}.`
          : `Observación: ${fuentesObservadas.join(", ")} · Despacho declarado: ${despachoDeclarado}.`, "nota"));
        for (const jornada of datos.journeys) {
          destino.append(el("h3", `Jornada ${jornada.journeyId}`), el("div", `Revisión ${jornada.revisionId} · recibida ${jornada.receivedAt}`, "ruta"));
          const ultimaPasada = jornada.passes?.last ?? null;
          destino.append(el("div", ultimaPasada === null
            ? "Sin pasadas registradas"
            : `Última pasada: ${ultimaPasada.at} · ${ultimaPasada.estado} — ${ultimaPasada.detalle}`, "nota"));
          const tabla = el("table");
          const encabezado = el("thead");
          const fila = el("tr");
          for (const titulo of ["Orden", "Ticket", "Inicio", "Fase", "Actividad", "Duración", "Espera / dependencia", "Ventana", "Último dato"])
            fila.append(el("th", titulo));
          encabezado.append(fila);
          const cuerpo = el("tbody");
          for (const ticket of jornada.tickets) {
            const tr = el("tr");
            const inicio = ticket.actualAt ?? ticket.scheduledAt ?? ticket.condition;
            const espera = ticket.waitingFor.length > 0 ? `espera ${ticket.waitingFor.join(", ")}` : ticket.dependsOn.join(", ") || "—";
            const ventana = ticket.window === null ? "—" : `${ticket.window.windowId}: ${ticket.window.status.state}`;
            const duracion = ticket.durationMs === null ? "—" : `${Math.floor(ticket.durationMs / 60000)} min`;
            tr.append(
              el("td", String(ticket.order), "cifra"),
              el("td", ticket.ticketId, "id"),
              el("td", inicio),
              celdaDeFase(ticket),
              el("td", ticket.activity),
              el("td", duracion),
              el("td", espera),
              el("td", ventana),
              el("td", ticket.lastReceivedAt ?? "—"),
            );
            cuerpo.append(tr);
          }
          tabla.append(encabezado, cuerpo);
          // La tabla del despacho tiene nueve columnas: en un celular se
          // desplaza dentro de su caja, no arrastra la página.
          const desplazable = el("div", undefined, "corrida-desplazable");
          desplazable.append(tabla);
          destino.append(desplazable);
        }
      }

      // ── Vista Corrida ────────────────────────────────────────────────────
      // La sesión de Claude Code es el orquestador y reparte tickets en
      // subagentes. La vista solo lee: agentes vivos, cola y lo entregado.
      const CLAVE_SIMULTANEOS = "valmen.corrida.simultaneos";
      const SIMULTANEOS_POR_DEFECTO = 3;
      const REFRESCO_DE_CORRIDA_MS = 5000;
      const ESTADOS_ENTREGADOS = ["awaiting_user_tests", "in_qa", "qa_approved", "closed"];
      const ESTADOS_CERRADOS = ["qa_approved", "closed"];
      let refrescoDeCorrida = null;

      /** Los agentes con trabajo en curso: trabajando, o esperando un permiso. La sesión principal no cuenta. */
      function agentesVivos(agentes) {
        return (agentes ?? []).filter(
          (a) => a.principal !== true && (a.estado === "trabajando" || a.estado === "esperando"),
        );
      }

      /**
       * Ola de cada ticket de la cola: 1 si no depende de nada pendiente, o 1 más la
       * mayor ola de lo que espera. Una dependencia que no está en la cola y no está
       * hecha (por ejemplo, la que corre un agente) cuenta como ola 1.
       * `hechos` son los tickets ya entregados, que no hacen esperar.
       */
      function olasDeCola(tickets, hechos = new Set()) {
        const porId = new Map(tickets.map((t) => [t.ticketId, t]));
        const memo = new Map();
        const ola = (id, visitando) => {
          if (memo.has(id)) return memo.get(id);
          const ticket = porId.get(id);
          if (ticket === undefined) return 1; // pendiente fuera de la cola
          if (visitando.has(id)) return 1; // ciclo: no se cuelga
          visitando.add(id);
          const pendientes = (ticket.dependsOn ?? []).filter((d) => !hechos.has(d));
          const valor = pendientes.length === 0 ? 1 : 1 + Math.max(...pendientes.map((d) => ola(d, visitando)));
          visitando.delete(id);
          memo.set(id, valor);
          return valor;
        };
        return tickets
          .map((t) => ({
            ticketId: t.ticketId,
            ola: ola(t.ticketId, new Set()),
            esperaA: (t.dependsOn ?? []).filter((d) => !hechos.has(d)),
          }))
          .sort((a, b) => a.ola - b.ola);
      }

      /** La fase de un agente: la confirmada tal cual, o la inferida con su rótulo. */
      function fraseDeFase(agente) {
        if (agente.faseConfirmada) return { texto: agente.faseConfirmada, inferida: false };
        if (agente.faseInferida) return { texto: agente.faseInferida, inferida: true };
        return { texto: "—", inferida: false };
      }

      /** Los tickets de la corrida: los de la jornada y los que algún agente trabaja. */
      function idsDeLaCorrida(agentes, filas) {
        const ids = [];
        for (const fila of filas ?? []) if (!ids.includes(fila.ticketId)) ids.push(fila.ticketId);
        for (const agente of agentes ?? []) if (agente.ticket && !ids.includes(agente.ticket)) ids.push(agente.ticket);
        return ids;
      }

      function estadoDeRegistro(ticketId, tickets) {
        return (tickets ?? []).find((t) => t.id === ticketId)?.workflowStatus ?? null;
      }

      /** El estado público (R-EPU-002) que el servidor calculó para el ticket, o `null`. */
      function estadoPublicoDeRegistro(ticketId, tickets) {
        return (tickets ?? []).find((t) => t.id === ticketId)?.publicState ?? null;
      }

      /** Cada ticket de la corrida con su estado del registro: lo que el lienzo reparte por estación. */
      function ticketsDeLaEscena(agentes, filas, tickets) {
        return idsDeLaCorrida(agentes, filas).map((id) => ({ id, estado: estadoDeRegistro(id, tickets) }));
      }

      /** Los seis KPI de la corrida, derivados de agentes, jornada y registro. */
      function kpisDeCorrida({ agentes, tickets, filas }) {
        const vivos = agentesVivos(agentes);
        const ids = idsDeLaCorrida(agentes, filas);
        const estados = new Map(ids.map((id) => [id, estadoDeRegistro(id, tickets)]));
        const conAgente = new Set(vivos.map((a) => a.ticket).filter(Boolean));
        const entregados = ids.filter((id) => ESTADOS_ENTREGADOS.includes(estados.get(id)));
        const cerrados = ids.filter((id) => ESTADOS_CERRADOS.includes(estados.get(id)));
        const esperan = new Set(ids.filter((id) => estadoPublicoDeRegistro(id, tickets)?.state === "needs-decision"));
        for (const agente of vivos) {
          if (agente.estado === "esperando") esperan.add(agente.ticket ?? agente.agente);
        }
        const aprobaciones = ids.filter((id) => estados.get(id) === "planned");
        const cola = (filas ?? []).filter((fila) => {
          const estado = estados.get(fila.ticketId);
          return !conAgente.has(fila.ticketId) && !ESTADOS_ENTREGADOS.includes(estado) && fila.phase !== "delivered";
        });
        return {
          entregados: entregados.length,
          cerrados: cerrados.length,
          esperanAlPO: esperan.size,
          trabajando: vivos.filter((a) => a.estado === "trabajando").length,
          enCola: cola.length,
          aprobacionesPendientes: aprobaciones.length,
          cola,
          entregadosIds: entregados,
        };
      }

      function haceCuanto(iso, ahora = Date.now()) {
        const t = Date.parse(iso ?? "");
        if (Number.isNaN(t)) return "—";
        const s = Math.max(0, Math.round((ahora - t) / 1000));
        if (s < 60) return `hace ${s} s`;
        if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
        return `hace ${Math.floor(s / 3600)} h`;
      }

      function horaDe(iso) {
        const t = new Date(iso ?? "");
        if (Number.isNaN(t.getTime())) return "";
        return t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      }

      function leerSimultaneos() {
        try {
          const guardado = Number.parseInt(localStorage.getItem(CLAVE_SIMULTANEOS) ?? "", 10);
          if (Number.isInteger(guardado) && guardado >= 1 && guardado <= 8) return guardado;
        } catch {
          // Sin almacenamiento, se usa el valor por defecto.
        }
        return SIMULTANEOS_POR_DEFECTO;
      }

      function guardarSimultaneos(valor) {
        try {
          localStorage.setItem(CLAVE_SIMULTANEOS, String(valor));
        } catch {
          // Es solo una preferencia de este navegador.
        }
      }

      function etiquetaDeEstadoRegistro(estado) {
        const clase = ESTADOS_CERRADOS.includes(estado)
          ? "corrida-estado ok"
          : estado === "blocked" || estado === "changes_requested"
            ? "corrida-estado error"
            : "corrida-estado";
        return el("span", estado ?? "sin registro", clase);
      }

      /** La etiqueta del estado público: la del servidor, sin reagrupar estados en el navegador. */
      function etiquetaDeEstadoPublico(publicState) {
        const clase =
          publicState?.state === "needs-decision"
            ? "corrida-estado error"
            : publicState?.state === "done"
              ? "corrida-estado ok"
              : "corrida-estado";
        const nodo = el("span", publicState?.label ?? "—", clase);
        if (publicState?.reason) nodo.title = publicState.reason;
        return nodo;
      }

      function celdaConRotulo(rotulo, contenido) {
        const celda = el("td");
        celda.setAttribute("data-rotulo", rotulo);
        if (typeof contenido === "string") celda.textContent = contenido;
        else celda.append(contenido);
        return celda;
      }

      // ── Agentes: marco (FEATURE-WEB-VIVO-AGENTES-20261014) ──────────────
      // Titular con las cuentas, aviso de pregunta, «A la vez», escena enmarcada
      // y tabla de quién trabaja. El motor de escena y los mundos no se tocan.

      /** Las pestañas de mundo en el orden y con los nombres de la spec (D-005). */
      const agentesMarcoMundos = [
        ["control", "Sala de control"],
        ["pasteleria", "Pastelería"],
        ["invernadero", "Invernadero"],
      ];
      const agentesMarcoIndicacion =
        "La pregunta espera en la sesión de Claude Code que orquesta la corrida: contéstala ahí. Esta pantalla solo la muestra.";
      const agentesMarcoEstados = { trabajando: "Trabajando", esperando: "Esperando", termino: "Terminó" };
      /** Las indicaciones desplegadas: el refresco cada 5 s repinta la vista y no debe plegarlas. */
      const agentesMarcoIndicacionesAbiertas = new Set();

      /** La sesión principal primero y luego los agentes vivos, sin depender del módulo de escena. */
      function agentesMarcoFilas(agentes) {
        const lista = agentes ?? [];
        return [...lista.filter((a) => a.principal === true), ...agentesVivos(lista)];
      }

      /** Una pregunta abierta: la hay y nadie la respondió todavía. */
      function agentesMarcoPreguntaAbierta(agente) {
        const p = agente?.pregunta;
        return p !== null && p !== undefined && (p.respondidaEn === null || p.respondidaEn === undefined);
      }

      /** El valor si es un texto con algún carácter no blanco; `null` en otro caso. */
      function agentesMarcoTextoVisible(valor) {
        return typeof valor === "string" && valor.trim() !== "" ? valor : null;
      }

      /** «S» para la sesión principal y «A1…An» para los subagentes, en el orden de la tabla. */
      function agentesMarcoSiglas(filas) {
        const siglas = new Map();
        let n = 0;
        for (const fila of filas) siglas.set(fila.agente, fila.principal === true ? "S" : `A${(n += 1)}`);
        return siglas;
      }

      function agentesMarcoTitular(vivos, preguntas, fallo) {
        if (fallo) return "Agentes";
        if (vivos === 0) return "Ningún agente trabajando";
        const base = `${vivos} ${vivos === 1 ? "agente trabajando" : "agentes trabajando"}`;
        if (preguntas === 0) return base;
        return `${base}, ${preguntas} ${preguntas === 1 ? "te pregunta algo" : "te preguntan algo"}`;
      }

      function agentesMarcoAvatar(sigla, agente) {
        const clases = ["agm-avatar", agente.principal === true ? "agm-avatar-principal" : "agm-avatar-agente"];
        if (agentesMarcoPreguntaAbierta(agente)) clases.push("agm-avatar-con-pregunta");
        const avatar = el("span", sigla, clases.join(" "));
        avatar.title = agentesMarcoEstados[agente.estado] ?? agente.estado ?? "";
        return avatar;
      }

      /** Quién pregunta y en qué fase, para la línea mono del aviso. */
      function agentesMarcoQuien(agente) {
        if (agente.principal === true) return "Sesión principal";
        const fase = fraseDeFase(agente).texto;
        const quien = agente.ticket ?? agente.agente;
        return fase === "—" ? quien : `${quien} · ${fase}`;
      }

      /** El aviso ámbar de una pregunta abierta. El texto es dato ajeno: solo `textContent`. */
      function agentesMarcoAviso(agente) {
        const caja = el("div", undefined, "agm-aviso");
        caja.setAttribute("role", "alert");
        const signo = el("span", "?", "agm-avatar agm-avatar-signo");
        signo.setAttribute("aria-hidden", "true");
        const cuerpo = el("div", undefined, "agm-aviso-cuerpo");
        cuerpo.append(el("div", agentesMarcoQuien(agente), "agm-aviso-id"));
        const texto = agentesMarcoTextoVisible(agente.pregunta?.texto);
        cuerpo.append(el("div", texto ?? "Te hizo una pregunta y espera tu respuesta.", "agm-aviso-texto"));
        const indicacion = el("div", agentesMarcoIndicacion, "agm-aviso-indicacion");
        indicacion.id = `agm-indicacion-${String(agente.agente).replace(/[^A-Za-z0-9_-]/g, "")}`;
        const clave = `${agente.agente}|${agente.pregunta?.desde ?? ""}`;
        indicacion.hidden = !agentesMarcoIndicacionesAbiertas.has(clave);
        cuerpo.append(indicacion);
        const boton = el("button", "Responder en la sesión", "agm-boton-alerta");
        boton.type = "button";
        boton.setAttribute("aria-expanded", String(!indicacion.hidden));
        boton.setAttribute("aria-controls", indicacion.id);
        boton.addEventListener("click", () => {
          const abrir = indicacion.hidden === true;
          indicacion.hidden = !abrir;
          boton.setAttribute("aria-expanded", String(abrir));
          if (abrir) agentesMarcoIndicacionesAbiertas.add(clave);
          else agentesMarcoIndicacionesAbiertas.delete(clave);
        });
        caja.append(signo, cuerpo, boton);
        return caja;
      }

      /** «A la vez»: −, la cuenta viva sobre la deseada y +. Solo en este navegador. */
      function agentesMarcoALaVez(vivos) {
        const control = el("div", undefined, "agm-alavez");
        const rotulo = el("label", "A la vez", "agm-alavez-rotulo");
        rotulo.htmlFor = "corrida-simultaneos";
        const selector = document.createElement("select");
        selector.id = "corrida-simultaneos";
        selector.className = "agm-alavez-deseada";
        selector.setAttribute("aria-label", "Agentes simultáneos deseados");
        selector.title = "Se recuerda solo en este navegador.";
        for (let n = 1; n <= 8; n += 1) {
          const opcion = el("option", String(n));
          opcion.value = String(n);
          selector.append(opcion);
        }
        selector.value = String(leerSimultaneos());
        // Para lector de pantalla: «2 / 3» solo se entiende mirándolo.
        const estado = el("span", undefined, "corrida-cuenta agm-solo-lector");
        estado.setAttribute("role", "status");
        const pintar = () => {
          estado.textContent = `${vivos} de ${selector.value} agentes`;
        };
        const fijar = (valor) => {
          if (!Number.isInteger(valor) || valor < 1 || valor > 8) return;
          selector.value = String(valor);
          guardarSimultaneos(valor);
          pintar();
        };
        const boton = (signo, nombre, paso) => {
          const b = el("button", signo, "agm-alavez-boton");
          b.type = "button";
          b.setAttribute("aria-label", nombre);
          b.addEventListener("click", () => fijar(Number.parseInt(selector.value, 10) + paso));
          return b;
        };
        selector.addEventListener("change", () => fijar(Number.parseInt(selector.value, 10)));
        const cifra = el("span", undefined, "agm-alavez-cifra");
        const sep = el("span", "/", "agm-alavez-sep");
        sep.setAttribute("aria-hidden", "true");
        const vivosNodo = el("span", String(vivos), "agm-alavez-vivos");
        vivosNodo.setAttribute("aria-hidden", "true");
        cifra.append(vivosNodo, sep, selector);
        pintar();
        control.append(rotulo, boton("−", "Uno menos", -1), cifra, boton("+", "Uno más", 1), estado);
        return control;
      }

      /** Ceja «En vivo · Agentes» (el `h2` que la vista siempre tuvo, D-007), titular y «A la vez». */
      function agentesMarcoCabecera(titular, vivos) {
        const cabecera = el("div", undefined, "agm-cabecera");
        const titulos = el("div", undefined, "agm-titulos");
        const ceja = el("div", undefined, "agm-ceja");
        ceja.append(el("span", "En vivo", "agm-ceja-grupo"), el("span", " · ", "agm-ceja-sep"), el("h2", "Agentes", "agm-ceja-vista"));
        titulos.append(ceja, el("h1", titular, "agm-titular"));
        cabecera.append(titulos, agentesMarcoALaVez(vivos));
        return cabecera;
      }

      /** La celda Ticket: título del registro (o la descripción) en negrita y el id en mono. */
      function agentesMarcoCeldaTicket(agente, tickets, orquesta) {
        const celda = el("div", undefined, "agm-fila-ticket");
        if (agente.principal === true) {
          celda.append(el("span", "Sesión principal", "agm-fila-titulo"));
          const detalle = [`orquesta ${orquesta} ${orquesta === 1 ? "ticket" : "tickets"}`, agente.rama].filter(Boolean).join(" · ");
          celda.append(el("div", detalle, "agm-fila-id"));
          return celda;
        }
        const registro = agente.ticket ? (tickets ?? []).find((t) => t.id === agente.ticket) : undefined;
        const titulo =
          agentesMarcoTextoVisible(registro?.title) !== null && registro.title !== agente.ticket
            ? registro.title
            : (agentesMarcoTextoVisible(agente.descripcion) ?? agente.ticket ?? agente.agente);
        celda.append(el("span", titulo, "agm-fila-titulo"));
        const linea = el("div", undefined, "agm-fila-id");
        linea.append(el("span", agente.ticket ?? agente.agente, "id"));
        if (registro !== undefined) linea.append(etiquetaDeEstadoPublico(estadoPublicoDeRegistro(agente.ticket, tickets)));
        celda.append(linea);
        if (agentesMarcoTextoVisible(agente.descripcion) !== null && agente.descripcion !== titulo) {
          celda.append(el("div", agente.descripcion, "nota-agente"));
        }
        return celda;
      }

      function tablaDeAgentes(filas, ahora, tickets) {
        const tabla = el("table", undefined, "corrida-agente");
        const siglas = agentesMarcoSiglas(filas);
        const orquesta = new Set(filas.filter((a) => a.principal !== true && a.ticket).map((a) => a.ticket)).size;
        const encabezado = el("thead");
        const fila = el("tr");
        const primera = el("th");
        primera.append(el("span", "Agente", "agm-solo-lector"));
        fila.append(primera);
        for (const titulo of ["Ticket", "Fase", "Modelo", "Tiempo"]) fila.append(el("th", titulo));
        encabezado.append(fila);
        const cuerpo = el("tbody");
        for (const agente of filas) {
          const tr = el("tr");
          const clasesDeFila = [];
          if (agente.principal === true) clasesDeFila.push("agm-fila-principal");
          if (agentesMarcoPreguntaAbierta(agente)) clasesDeFila.push("agm-con-pregunta");
          if (clasesDeFila.length > 0) tr.className = clasesDeFila.join(" ");
          const celdaFase = el("div");
          if (agente.principal === true) {
            // La fila principal trae las fases en null: se muestra su estado (D-002).
            celdaFase.append(el("span", agentesMarcoEstados[agente.estado] ?? agente.estado ?? "—", "corrida-fase"));
          } else {
            const fase = fraseDeFase(agente);
            celdaFase.append(el("span", fase.texto, "corrida-fase"));
            if (fase.inferida) celdaFase.append(el("span", "inferida", "corrida-inferida"));
          }
          if (agentesMarcoPreguntaAbierta(agente)) celdaFase.append(el("span", "pregunta", "agm-fase-pregunta"));
          if (agente.ultimaHerramienta) {
            const hora = horaDe(agente.ultimaHerramientaEn);
            celdaFase.append(el("div", `${agente.ultimaHerramienta}${hora === "" ? "" : ` · ${hora}`}`, "agm-fila-herramienta"));
          }
          const modelo = [agente.modelo, agente.esfuerzo].filter(Boolean).join(" · ") || "—";
          tr.append(
            celdaConRotulo("Agente", agentesMarcoAvatar(siglas.get(agente.agente) ?? "A", agente)),
            celdaConRotulo("Ticket", agentesMarcoCeldaTicket(agente, tickets, orquesta)),
            celdaConRotulo("Fase", celdaFase),
            celdaConRotulo("Modelo", el("span", modelo, "agm-modelo")),
            celdaConRotulo("Tiempo", agente.ultimaHerramientaEn ? haceCuanto(agente.ultimaHerramientaEn, ahora) : "—"),
          );
          cuerpo.append(tr);
        }
        tabla.append(encabezado, cuerpo);
        return tabla;
      }

      // El lienzo se carga bajo demanda y sin `import` estático: si el archivo no
      // está (o el módulo corre fuera de un navegador), la vista pinta solo los
      // paneles. La promesa se memoriza y nunca rechaza.
      let escenaPromesa = null;
      let montajeDeAgentes = null;
      let proyectoDelMontaje = null;
      let lienzoDeAgentes = null;
      function cargarEscena() {
        if (escenaPromesa === null) {
          // Sin cuadro de animación (el arnés de la interfaz, un entorno sin
          // navegador) no hay escena que montar: ni se pide el archivo.
          if (typeof requestAnimationFrame !== "function") {
            escenaPromesa = Promise.resolve(null);
            return escenaPromesa;
          }
          escenaPromesa = import("/agentes/montaje.js")
            .then((modulo) => {
              let almacen = null;
              try {
                almacen = localStorage;
              } catch {
                // Sin almacenamiento, el mundo elegido no se recuerda.
              }
              const consulta =
                typeof matchMedia === "function" ? matchMedia("(prefers-reduced-motion: reduce)") : null;
              montajeDeAgentes = modulo.crearMontaje({
                almacen,
                reducirMovimiento: () => consulta?.matches === true,
                pedirCuadro: (f) => requestAnimationFrame(f),
                cancelarCuadro: (id) => cancelAnimationFrame(id),
                visible: () => document.visibilityState === "visible",
              });
              return modulo;
            })
            .catch(() => null);
        }
        return escenaPromesa;
      }

      const TITULOS_DE_PANEL = { agentes: "Agentes vivos", cola: "Cola", entregados: "Entregados" };

      /** Marca los paneles con el mundo actual y toma sus títulos de `mundo.paneles` si los tiene. */
      function aplicarMundoAPaneles(paneles, mundo) {
        if (!paneles || !mundo) return;
        paneles.dataset.mundo = mundo.id;
        for (const titulo of paneles.querySelectorAll?.("h3[data-panel]") ?? []) {
          titulo.textContent = mundo.paneles?.[titulo.dataset.panel] ?? TITULOS_DE_PANEL[titulo.dataset.panel];
        }
      }

      /**
       * La escena enmarcada (R-VIVO-002): título, pestañas de mundo, la nota del mundo,
       * el lienzo único de siempre y la línea de la sesión principal. Elegir una pestaña
       * cambia el mundo del montaje sin repintar la vista ni pedir nada.
       */
      function agentesMarcoEscena(cont, agentes, ahora, datos, conPrincipal) {
        const montaje = montajeDeAgentes;
        if (lienzoDeAgentes === null) {
          lienzoDeAgentes = document.createElement("canvas");
          lienzoDeAgentes.width = 960;
          lienzoDeAgentes.height = 480;
          lienzoDeAgentes.className = "corrida-lienzo agm-lienzo";
          lienzoDeAgentes.setAttribute("aria-label", "Escena animada de los agentes");
        }
        const seccion = el("section", undefined, "agm-escena");
        seccion.setAttribute("aria-label", "Escena de la ejecución");
        const cabeza = el("div", undefined, "agm-escena-cabeza");
        const pestanas = el("div", undefined, "agm-mundos");
        pestanas.setAttribute("role", "tablist");
        pestanas.setAttribute("aria-label", "Mundo de la escena");
        const marco = el("div", undefined, "agm-escena-marco");
        marco.id = "agm-escena-marco";
        marco.setAttribute("role", "tabpanel");
        const nota = el("div", montaje.mundoActual().lema, "agm-escena-nota");

        const disponibles = montaje.mundos();
        const conocidos = agentesMarcoMundos.map(([id]) => id);
        const orden = [
          ...conocidos.filter((id) => disponibles.some((m) => m.id === id)),
          ...disponibles.map((m) => m.id).filter((id) => !conocidos.includes(id)),
        ];
        const botones = [];
        const marcar = () => {
          const actual = montaje.mundoActual().id;
          for (const boton of botones) {
            const elegido = boton.dataset.mundo === actual;
            boton.setAttribute("aria-selected", String(elegido));
            boton.tabIndex = elegido ? 0 : -1;
            if (elegido) marco.setAttribute("aria-labelledby", boton.id);
          }
        };
        const elegir = (id) => {
          if (!montaje.elegirMundo(id)) return;
          marcar();
          nota.textContent = montaje.mundoActual().lema;
          aplicarMundoAPaneles(cont.querySelector?.(".corrida-paneles"), montaje.mundoActual());
        };
        for (const id of orden) {
          const mundo = disponibles.find((m) => m.id === id);
          const etiqueta = agentesMarcoMundos.find(([clave]) => clave === id)?.[1] ?? mundo.nombre;
          const boton = el("button", etiqueta, "agm-mundo");
          boton.type = "button";
          boton.id = `agm-mundo-${id}`;
          boton.dataset.mundo = id;
          boton.setAttribute("role", "tab");
          boton.setAttribute("aria-controls", marco.id);
          boton.addEventListener("click", () => elegir(id));
          // Flechas entre pestañas, como pide el patrón de pestañas.
          boton.addEventListener("keydown", (evento) => {
            const paso = evento.key === "ArrowRight" ? 1 : evento.key === "ArrowLeft" ? -1 : 0;
            if (paso === 0) return;
            evento.preventDefault?.();
            const siguiente = (orden.indexOf(id) + paso + orden.length) % orden.length;
            elegir(orden[siguiente]);
            botones[siguiente].focus();
          });
          botones.push(boton);
          pestanas.append(boton);
        }
        marcar();
        cabeza.append(el("h3", "Escena", "agm-escena-titulo"), pestanas);
        marco.append(nota, lienzoDeAgentes);
        if (conPrincipal) {
          const linea = el("div", undefined, "agm-escena-principal");
          const sigla = el("span", "S", "agm-avatar agm-avatar-principal");
          sigla.setAttribute("aria-hidden", "true");
          linea.append(sigla, el("span", "Sesión principal: reparte e integra · solo ella toca main"));
          marco.append(linea);
        }
        seccion.append(cabeza, marco);
        montaje.montar(lienzoDeAgentes, agentes, ahora, datos);
        return seccion;
      }

      async function vistaCorrida() {
        const revision = ++revisionVistaJornadas;
        const proyectoDeLaSolicitud = proyectoSeleccionado;
        const cont = $("contenido");
        const sigueVigente = () =>
          revision === revisionVistaJornadas &&
          proyectoDeLaSolicitud === proyectoSeleccionado &&
          esRutaDeAgentes(location.hash.replace(/^#\//, "").split("/")[0]);
        if (proyectoDeLaSolicitud === "") {
          cont.textContent = "";
          cont.append(el("div", "Selecciona un proyecto disponible para consultar su corrida.", "vacio"));
          return;
        }
        let avisoDeAgentes = null;
        const [agentesRespuesta, jornadas, registro, frescura] = await Promise.all([
          api("GET", "/api/corrida/agentes").catch((error) => {
            if (error === RESPUESTA_DE_PROYECTO_OBSOLETA) throw error;
            avisoDeAgentes = `No se pudo leer la actividad de los agentes: ${error.message}`;
            return null;
          }),
          api("GET", "/api/journeys"),
          api("GET", "/api/tickets"),
          leerFrescuraDeFuentes(proyectoDeLaSolicitud),
        ]);
        const moduloDeEscena = await cargarEscena();
        // No se pinta una foto que ya no pertenece al proyecto o a la vista actual.
        if (!sigueVigente()) return;

        const lista = Array.isArray(agentesRespuesta) ? agentesRespuesta : agentesRespuesta?.agentes;
        const agentes = Array.isArray(lista) ? lista : [];
        const tickets = Array.isArray(registro?.tickets) ? registro.tickets : [];
        const filas = (jornadas?.journeys ?? []).flatMap((j) => j.tickets ?? []);
        const vivos = agentesVivos(agentes);
        // La vista ya leyó a los agentes: la cuenta del menú sale de aquí y no de
        // una segunda petición (`marcarPendientes` no la pide con Agentes abierta).
        ponerCuenta("agentes", vivos.length);
        const kpis = kpisDeCorrida({ agentes, tickets, filas });
        const ahora = Date.now();

        const filasDelMarco = agentesMarcoFilas(agentes);
        const preguntas = filasDelMarco.filter(agentesMarcoPreguntaAbierta);

        cont.textContent = "";
        // Ceja, titular con las cuentas y «A la vez» (R-VIVO-001). La deseada vive
        // solo en este navegador: no hay ninguna llamada de escritura.
        cont.append(
          agentesMarcoCabecera(agentesMarcoTitular(vivos.length, preguntas.length, avisoDeAgentes !== null), vivos.length),
        );

        if (avisoDeAgentes !== null) cont.append(el("div", avisoDeAgentes, "nota alerta"));

        // Las preguntas, arriba de la escena: las abiertas en el aviso ámbar del marco y,
        // con el módulo de escena, las recién respondidas en la caja verde de siempre.
        const avisos = el("div", undefined, "agm-avisos");
        for (const fila of filasDelMarco) if (agentesMarcoPreguntaAbierta(fila)) avisos.append(agentesMarcoAviso(fila));
        if (moduloDeEscena !== null && montajeDeAgentes !== null) {
          const modulo = moduloDeEscena;
          const respondidas = filasDelMarco.filter((fila) => fila.pregunta?.respondidaEn);
          for (const aviso of modulo.avisosDePregunta(respondidas, ahora, montajeDeAgentes.mundoActual())) {
            avisos.append(modulo.cajaDeAviso(document, aviso));
          }
        }
        if (avisos.children.length > 0) cont.append(avisos);

        const hayJornada = filas.length > 0;
        if (!hayJornada && agentes.length === 0) {
          montajeDeAgentes?.desmontar();
          cont.append(el("div", "No hay corrida en marcha: ninguna jornada programada y ningún agente activo. Cuando la sesión reparta tickets en subagentes aparecerán aquí.", "vacio"));
        } else {
          if (moduloDeEscena !== null && montajeDeAgentes !== null) {
            if (proyectoDelMontaje !== proyectoDeLaSolicitud) {
              montajeDeAgentes.desmontar();
              montajeDeAgentes.reiniciar();
              proyectoDelMontaje = proyectoDeLaSolicitud;
            }
            const datosDeEscena = {
              cola: kpis.cola.map((fila) => fila.ticketId),
              entregados: kpis.entregadosIds,
              tickets: ticketsDeLaEscena(agentes, filas, tickets),
            };
            const conPrincipal = agentes.some((a) => a.principal === true);
            cont.append(agentesMarcoEscena(cont, agentes, ahora, datosDeEscena, conPrincipal));
          }

          const paneles = el("div", undefined, "corrida-paneles");
          // El panel de quién trabaja ocupa el ancho completo, debajo de la escena (R-VIVO-002).
          const panelVivos = el("div", undefined, "corrida-panel agm-quien");
          const panelCola = el("div", undefined, "corrida-panel");
          const panelEntregados = el("div", undefined, "corrida-panel");
          paneles.append(panelVivos, panelCola, panelEntregados);
          cont.append(paneles);

          const tituloDe = (clave) => {
            const titulo = el("h3", TITULOS_DE_PANEL[clave]);
            titulo.dataset.panel = clave;
            return titulo;
          };
          panelVivos.append(tituloDe("agentes"));
          if (filasDelMarco.length === 0) panelVivos.append(el("div", "Ningún agente trabajando ahora.", "vacio"));
          else panelVivos.append(tablaDeAgentes(filasDelMarco, ahora, tickets));

          panelCola.append(tituloDe("cola"));
          if (kpis.cola.length === 0) {
            panelCola.append(el("div", hayJornada ? "La cola está vacía." : "Sin jornada programada: no hay cola.", "vacio"));
          } else {
            const hechos = new Set(kpis.entregadosIds);
            const olas = olasDeCola(kpis.cola, hechos);
            const contenedor = el("div", undefined, "corrida-cola");
            for (const numero of [...new Set(olas.map((o) => o.ola))]) {
              const grupo = el("div", undefined, "corrida-ola");
              grupo.append(el("div", `Ola ${numero}`, "rotulo"));
              for (const item of olas.filter((o) => o.ola === numero)) {
                const linea = el("div", undefined, "corrida-item");
                linea.append(el("span", item.ticketId, "id"));
                linea.append(el("span", item.esperaA.length === 0 ? "sin espera" : `espera a ${item.esperaA.join(", ")}`, "resultado"));
                linea.append(etiquetaDeEstadoPublico(estadoPublicoDeRegistro(item.ticketId, tickets)));
                grupo.append(linea);
              }
              contenedor.append(grupo);
            }
            panelCola.append(contenedor);
          }

          panelEntregados.append(tituloDe("entregados"));
          if (kpis.entregadosIds.length === 0) panelEntregados.append(el("div", "Todavía no se entregó ningún ticket de la corrida.", "vacio"));
          else {
            const contenedor = el("div", undefined, "corrida-cola");
            for (const id of kpis.entregadosIds) {
              const linea = el("div", undefined, "corrida-item");
              linea.append(
                el("span", id, "id"),
                etiquetaDeEstadoRegistro(estadoDeRegistro(id, tickets)),
                etiquetaDeEstadoPublico(estadoPublicoDeRegistro(id, tickets)),
              );
              contenedor.append(linea);
            }
            panelEntregados.append(contenedor);
          }
          // Las seis cifras de la corrida, debajo de la tabla (D-004).
          const tarjetas = el("div", undefined, "tarjetas agm-cifras");
          for (const [rotulo, valor] of [
            ["entregados", kpis.entregados],
            ["cerrados", kpis.cerrados],
            ["esperan al PO", kpis.esperanAlPO],
            ["trabajando", kpis.trabajando],
            ["en cola", kpis.enCola],
            ["aprobaciones pendientes", kpis.aprobacionesPendientes],
          ]) {
            const tarjeta = el("div", undefined, "tarjeta");
            tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
            tarjetas.append(tarjeta);
          }
          cont.append(tarjetas);
          if (moduloDeEscena !== null && montajeDeAgentes !== null) aplicarMundoAPaneles(paneles, montajeDeAgentes.mundoActual());
        }

        // Al pie, plegado: lo que antes era la vista Jornadas.
        const detalle = el("details");
        detalle.append(el("summary", "Detalle de la jornada: pasadas y frescura de las fuentes"));
        pintarDetalleDeJornadas(detalle, jornadas ?? {}, frescura);
        cont.append(detalle);

        programarRefrescoDeCorrida();
      }

      /**
       * Mientras la vista está abierta, vuelve a pintar cada 5 s. Se
       * cancela en `navegar`; no se repinta bajo un diálogo ni con un campo en foco.
       */
      function programarRefrescoDeCorrida() {
        clearTimeout(refrescoDeCorrida);
        // Sin la API de visibilidad (un entorno sin navegador) no hay refresco.
        if (!("visibilityState" in document)) return;
        refrescoDeCorrida = setTimeout(() => {
          if (!esRutaDeAgentes(location.hash.replace(/^#\//, "").split("/")[0])) return;
          // Una pestaña oculta no consulta: espera a volver a verse.
          if (document.visibilityState !== "visible" || !puedeRefrescar()) {
            programarRefrescoDeCorrida();
            return;
          }
          void navegar({ conservarVista: true });
        }, REFRESCO_DE_CORRIDA_MS);
      }

      async function vistaProcesos() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/processes");
        const r = datos.summary;

        const tarjetas = el("div", undefined, "tarjetas");
        const metricas = [
          ["Procesos", r.processes],
          ["Detenidos", r.waiting],
          ["Gates sin aprobar", r.gatesPending],
          ["Corridas", r.runs],
        ];
        if (r.invalid > 0) metricas.push(["Inválidos", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        // El responsable, para poder aprobar. Mismo campo y misma memoria que en la
        // vista de un ticket: es la misma persona decidiendo.
        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las aprobaciones");
        etiquetaResponsable.htmlFor = "responsable-procesos";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable-procesos";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () =>
          guardarResponsable(entradaResponsable.value),
        );
        barraResponsable.append(
          etiquetaResponsable,
          entradaResponsable,
          el("span", "Queda registrado con cada aprobación.", "resultado"),
        );
        cont.append(barraResponsable);

        if (datos.processes.length === 0) {
          const vacio = el("div", undefined, "vacio");
          vacio.append(
            el("div", "No hay procesos declarados."),
            el(
              "div",
              "Un proceso es un paso a paso encadenable: desplegar, actualizar manuales, publicar.",
              "resultado",
            ),
            el("div", "Viven en .valmen/processes/<id>.yaml", "ruta"),
          );
          cont.append(vacio);
          return;
        }

        // ── Gates: lo que espera una decisión ──
        if (datos.gates.length > 0) {
          cont.append(el("h2", "Gates de proceso"));
          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Gate", "Proceso", "Estado", "Aprobado por", ""]) {
            fila.append(el("th", columna));
          }
          thead.append(fila);

          const tbody = el("tbody");
          for (const gate of datos.gates) {
            const tr = el("tr");

            const celda = el("td");
            celda.append(el("div", gate.gate, "nombre"));
            if (gate.reason) celda.append(el("div", gate.reason, "descripcion"));
            tr.append(celda);

            tr.append(el("td", gate.processId, "id"));

            const celdaEstado = el("td");
            if (gate.approvedBy === null) {
              celdaEstado.append(el("span", "sin aprobar", "etiqueta critico"));
            } else {
              celdaEstado.append(el("span", "aprobado", "etiqueta aprueba"));
            }
            tr.append(celdaEstado);

            tr.append(el("td", gate.approvedBy ?? "—", "descripcion"));

            const celdaAcciones = el("td");
            const salida = el("div", "resultado");
            if (gate.approvedBy === null) {
              const boton = el("button", "Aprobar");
              boton.addEventListener(
                "click",
                () => void aprobarGate(gate.gate, boton, salida),
              );
              celdaAcciones.append(boton, salida);
            }
            tr.append(celdaAcciones);

            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          cont.append(tabla);
        }

        // ── Corridas: las detenidas primero ──
        cont.append(el("h2", "Corridas"));
        if (datos.runs.length === 0) {
          cont.append(el("div", "Ninguna corrida registrada todavía.", "resultado"));
        } else {
          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Corrida", "Proceso", "Estado", "Pasos", "Actualizada"]) {
            fila.append(el("th", columna));
          }
          thead.append(fila);

          const tbody = el("tbody");
          for (const corrida of datos.runs) {
            const tr = el("tr", undefined, corrida.status === "waiting" ? "planeado" : "");

            const celda = el("td");
            celda.append(el("div", corrida.runId, "id"));
            if (corrida.pendingStep !== null) {
              celda.append(el("div", `esperando en ${corrida.pendingStep}`, "descripcion"));
            } else if (corrida.reason !== null) {
              celda.append(el("div", corrida.reason, "descripcion"));
            }
            tr.append(celda);

            tr.append(el("td", corrida.processId, "id"));

            const celdaEstado = el("td");
            const CLASE = {
              waiting: "critico",
              failed: "roto",
              completed: "aprueba",
              abandoned: "",
            };
            celdaEstado.append(
              el("span", corrida.status, `etiqueta ${CLASE[corrida.status] ?? ""}`),
            );
            tr.append(celdaEstado);

            const hechos = corrida.steps.filter((paso) => paso.status === "ok").length;
            tr.append(el("td", `${hechos}/${corrida.steps.length}`, "id"));
            tr.append(el("td", corrida.updatedAt.slice(0, 19).replace("T", " "), "id"));

            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          cont.append(tabla);
        }

        // ── Procesos declarados ──
        cont.append(el("h2", "Procesos"));
        const tabla = el("table");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proceso", "Pasos", "Parámetros", "Gates", "Archivo"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const proceso of datos.processes) {
          const tr = el("tr");

          const celda = el("td");
          celda.append(el("div", proceso.title, "nombre"), el("div", proceso.id, "id"));
          if (proceso.invalid !== null) {
            celda.append(el("div", proceso.invalid, "descripcion"));
          }
          tr.append(celda);

          tr.append(el("td", String(proceso.steps), "id"));
          tr.append(el("td", proceso.params.join(", ") || "—", "descripcion"));
          tr.append(el("td", proceso.gates.join(", ") || "—", "descripcion"));
          tr.append(el("td", proceso.path, "ruta"));

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── «Pedir un cambio»: el chat de configuración ───────────────────────

      /**
       * El chat de configuración, montado en `cont` (el cuerpo del panel «Pedir
       * un cambio»). Devuelve su campo de texto, para enfocarlo al abrir.
       *
       * El modelo propone y el humano dispone: nada se escribe hasta que el
       * usuario pulsa «Aplicar», y un cambio sensible exige además escribir una
       * frase exacta. La frase no es ceremonia: un `confirm: true` es un clic, y
       * un clic no es una decisión deliberada.
       */
      function montarChatDeConfiguracion(cont) {
        cont.textContent = "";

        const conversacion = el("div", undefined, "conversacion");
        const entrada = document.createElement("textarea");
        entrada.placeholder =
          "Describe el cambio: «que los tickets de tipo DOCS no pidan aprobación de plan»…";
        entrada.setAttribute("aria-label", "Qué quieres configurar");

        const enviar = el("button", "Proponer cambios", "principal");
        const salida = el("div", undefined, "resultado");
        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "10px";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "El modelo propone; tú dispones. "),
          el(
            "span",
            "Nada se escribe hasta que lo apruebas. El diff lo calcula el código comparando textos, la validez la decide el parser real, y los cambios que amplían la autoridad automática del sistema piden una confirmación escrita aparte.",
          ),
        );
        // El título lo pone el panel («Pedir un cambio»).
        cont.append(nota, conversacion);

        // Tres ejemplos reales: un chat vacío no dice qué se puede pedir.
        const ejemplos = el("div", undefined, "ejemplos");
        for (const ejemplo of [
          "Declara el gate de plan para este proyecto.",
          "Pasa el routing a económico, pero deja el arquitecto en un modelo fuerte.",
          "Añade un comentario al principio de la configuración explicando qué es esto.",
        ]) {
          const boton = el("button", ejemplo);
          boton.addEventListener("click", () => {
            entrada.value = ejemplo;
            entrada.focus();
          });
          ejemplos.append(boton);
        }

        acciones.append(salida, enviar);
        cont.append(entrada, acciones, ejemplos);

        const burbuja = (quien, texto, clase) => {
          const turno = el("div", undefined, `turno ${clase}`);
          turno.append(el("div", quien, "quien"), el("div", texto, "texto"));
          conversacion.append(turno);
          return turno;
        };

        /** Aplica los cambios aprobados y recarga la vista. */
        const aplicar = async (cambios, boton) => {
          boton.disabled = true;
          try {
            const r = await api("POST", "/api/chat/config/apply", { changes: cambios });
            if (r.ok) {
              // Como antes, el chat vuelve a empezar tras aplicar; la pantalla de
              // debajo se refresca sin moverse para mostrar lo que cambió.
              montarChatDeConfiguracion(cont).focus();
              void navegar({ conservarVista: true });
              return;
            }
            salida.className = "resultado error";
            salida.textContent = r.error || "No se aplicó nada.";
            boton.disabled = false;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            boton.disabled = false;
          }
        };

        enviar.addEventListener("click", async () => {
          const mensaje = entrada.value.trim();
          if (mensaje === "") {
            salida.className = "resultado error";
            salida.textContent = "Escribe qué quieres cambiar.";
            return;
          }

          burbuja("Tú", mensaje, "tuyo");
          entrada.value = "";
          enviar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "pensando…";

          try {
            const propuesta = await api("POST", "/api/chat/config", { message: mensaje });
            salida.textContent = "";

            if (!propuesta.ok) {
              burbuja("Configurador", propuesta.error, "");
              return;
            }

            const turno = burbuja(
              "Configurador",
              `${propuesta.summary}\n\n${propuesta.changes.length === 0 ? "No hace falta cambiar ningún archivo." : `${propuesta.changes.length} archivo(s) cambiarían.`} · ${propuesta.model} · $${(propuesta.usage?.costUsd ?? 0).toFixed(6)} · ${propuesta.latencyMs} ms`,
              "",
            );

            const pendientes = [];
            for (const cambio of propuesta.changes) {
              const caja = el(
                "div",
                undefined,
                `propuesta ${cambio.ok ? "" : "invalida"} ${cambio.sensitive ? "sensible" : ""}`,
              );
              caja.append(el("h4", cambio.label), el("div", cambio.reason, "motivo"));

              if (!cambio.ok) {
                caja.append(el("div", cambio.error, "error-parser"));
              } else if (cambio.unchanged) {
                caja.append(el("div", "Sin cambios respecto de lo guardado.", "resultado"));
              } else {
                const diff = el("div", undefined, "diff");
                for (const linea of cambio.diff) {
                  diff.append(
                    el(
                      "div",
                      `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                      linea.kind,
                    ),
                  );
                }
                caja.append(diff);
              }

              const filaAcciones = el("div", undefined, "acciones");
              filaAcciones.style.justifyContent = "flex-start";
              filaAcciones.style.marginTop = "10px";

              const entradaConfirmacion = document.createElement("input");
              if (cambio.sensitive && cambio.ok && !cambio.unchanged) {
                const aviso = el("div", undefined, "confirmacion");
                aviso.append(
                  el(
                    "div",
                    `⚠ Requiere confirmación: ${cambio.sensitiveReason}`,
                    "resultado error",
                  ),
                  el("div", undefined, "resultado"),
                );
                aviso.lastChild.append(
                  el("span", "Escribe "),
                  el("code", cambio.confirmation),
                  el("span", " para confirmarlo."),
                );
                entradaConfirmacion.type = "text";
                entradaConfirmacion.placeholder = "Frase de confirmación";
                aviso.append(entradaConfirmacion);
                caja.append(aviso);
              }

              const aplicarEste = el(
                "button",
                cambio.sensitive ? "Confirmar y aplicar" : "Aplicar",
                "principal",
              );
              aplicarEste.disabled = !cambio.ok || cambio.unchanged;
              aplicarEste.addEventListener("click", () => {
                const peticion = { file: cambio.file, text: cambio.text };
                if (cambio.sensitive) peticion.confirm = entradaConfirmacion.value.trim();
                void aplicar([peticion], aplicarEste);
              });
              filaAcciones.append(aplicarEste);
              caja.append(filaAcciones);

              if (cambio.ok && !cambio.unchanged) {
                pendientes.push({
                  file: cambio.file,
                  text: cambio.text,
                  ...(cambio.sensitive ? { confirm: cambio.confirmation } : {}),
                });
              }
              turno.append(caja);
            }

            // Aplicar todo respeta las confirmaciones: las sensibles solo entran
            // si el usuario escribió su frase, y el servidor lo vuelve a exigir.
            if (pendientes.length > 1) {
              const todo = el("button", "Aplicar todo");
              todo.style.marginTop = "10px";
              todo.addEventListener("click", () => {
                const confirmadas = [];
                for (const pendiente of pendientes) {
                  if (pendiente.confirm === undefined) {
                    confirmadas.push({ file: pendiente.file, text: pendiente.text });
                    continue;
                  }
                  const caja = [...turno.querySelectorAll(".propuesta")].find(
                    (nodo) =>
                      nodo.querySelector("h4")?.textContent ===
                      (pendiente.file === "config"
                        ? ".valmen/config.yaml"
                        : ".valmen/routing.yaml"),
                  );
                  const escrita = caja?.querySelector("input")?.value.trim();
                  if (escrita === pendiente.confirm) {
                    confirmadas.push({
                      file: pendiente.file,
                      text: pendiente.text,
                      confirm: escrita,
                    });
                  }
                }
                void aplicar(confirmadas, todo);
              });
              turno.append(todo);
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            enviar.disabled = false;
          }
        });

        entrada.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) void enviar.click();
        });
        return entrada;
      }

      /** Abre el panel sobre la pantalla actual, con el foco en el campo del chat. */
      function abrirPedirCambio() {
        const panel = $("pedir-cambio");
        const cuerpo = $("pedir-cambio-cuerpo");
        if (panel === null || cuerpo === null) return;
        if (panel.open) return;
        const entrada = montarChatDeConfiguracion(cuerpo);
        panel.showModal();
        entrada.focus();
      }

      /**
       * El botón del pie del menú y el atajo ⌘K (Ctrl+K fuera de macOS). El
       * atajo no se dispara escribiendo en un campo ni con otro diálogo abierto:
       * ahí la tecla es de quien escribe. Esc lo cierra el propio `<dialog>`.
       */
      function montarPedirCambio() {
        const panel = $("pedir-cambio");
        const boton = $("pedir-cambio-boton");
        if (panel === null || boton === null) return;
        const mac = /Mac|iPhone|iPad/.test(globalThis.navigator?.platform ?? "");
        const atajo = $("pedir-cambio-atajo");
        if (atajo !== null && !mac) atajo.textContent = "Ctrl K";

        boton.addEventListener("click", () => abrirPedirCambio());
        $("pedir-cambio-cerrar")?.addEventListener("click", () => panel.close());
        panel.addEventListener("close", () => {
          // Cerrado el panel, `#/configurar` ya no describe la pantalla: se
          // reemplaza sin navegar para que un refresco no lo vuelva a abrir.
          if (location.hash === "#/configurar") globalThis.history?.replaceState(null, "", "#/tickets");
          boton.focus();
        });

        window.addEventListener("keydown", (e) => {
          if (String(e.key).toLowerCase() !== "k") return;
          if (!(e.metaKey || e.ctrlKey) || e.altKey || e.shiftKey) return;
          const foco = document.activeElement;
          if (foco && (["INPUT", "TEXTAREA", "SELECT"].includes(foco.tagName) || foco.isContentEditable))
            return;
          if (document.querySelector("dialog[open]") !== null) return;
          e.preventDefault();
          abrirPedirCambio();
        });
      }

      // ── El catálogo de modelos por proveedor ─────────────────────────────
      //
      // Se pide una vez por sesión y se recuerda: los proveedores configurados no
      // cambian mientras se navega, y volver a pedir cientos de modelos cada vez
      // que se abre la vista haría que el selector tardara en aparecer.
      //
      // Se piden **todos los configurados**, no solo el elegido, para que el
      // desplegable de proveedor no tenga que ir a la red al cambiar: el coste es
      // el mismo y el cambio es instantáneo.
      let cacheModelos = null;

      async function catalogoDeModelos() {
        if (cacheModelos !== null) return cacheModelos;

        const { providers } = await api("GET", "/api/providers");
        // Solo los que se pueden usar. Un proveedor sin credencial en la lista es
        // una fila que no lleva a ninguna parte.
        const usables = providers.filter((p) => p.configured);

        const entradas = await Promise.all(
          usables.map(async (p) => {
            if (!p.listable) {
              // No publica su lista: se elige escribiendo el identificador, y eso
              // se dice en vez de ofrecer un desplegable vacío.
              return [p.id, { provider: p, models: null, error: null }];
            }
            try {
              const r = await api("GET", `/api/providers/${p.id}/models`);
              return [p.id, { provider: p, models: r.models, error: null }];
            } catch (fallo) {
              return [p.id, { provider: p, models: null, error: fallo.message }];
            }
          }),
        );

        cacheModelos = new Map(entradas);
        return cacheModelos;
      }

      /**
       * El selector de modelo: proveedor a la izquierda, modelo a la derecha.
       *
       * Devuelve el nodo y avisa por `alElegir`. El modelo se puede **escribir**
       * además de elegir: la lista de un proveedor tiene cientos de entradas, y un
       * `select` obliga a recorrerlas. Un identificador que no esté en la lista se
       * acepta igual —el catálogo de un proveedor no siempre incluye lo que su
       * endpoint acepta— y eso es del usuario.
       */
      function selectorDeModelo({ provider, model, onProvider, onModel, catalog }) {
        const caja = el("div", undefined, "par-modelo");

        const selProveedor = document.createElement("select");
        for (const [id, entrada] of catalog) {
          const punto = entrada.models === null ? " ·" : "";
          selProveedor.append(new Option(`${entrada.provider.name}${punto}`, id));
        }
        // El proveedor guardado puede no estar entre los configurados —una clave
        // retirada, un routing escrito a mano—. Se añade para que el valor actual
        // siga siendo visible en vez de cambiar solo al abrir la pantalla.
        if (provider !== "" && !catalog.has(provider)) {
          selProveedor.append(new Option(`${provider} (sin credencial)`, provider));
        }
        selProveedor.value = provider;

        const cajaModelo = el("div", undefined, "caja-modelo");
        const entradaModelo = document.createElement("input");
        entradaModelo.type = "text";
        entradaModelo.value = model;
        entradaModelo.placeholder = "identificador del modelo";
        entradaModelo.spellcheck = false;
        entryAutoComplete(entradaModelo, cajaModelo, () => catalog.get(selProveedor.value));
        cajaModelo.append(entradaModelo);

        // Probar el modelo antes de guardarlo. Un identificador mal escrito pasa
        // la configuración, se guarda, y falla en mitad de un gate con un error
        // del proveedor que no dice qué se escribió mal; esto lo dice antes.
        //
        // El botón no se ofrece donde no puede funcionar: `codex` no tiene
        // endpoint de chat —funciona por su CLI y su token no sirve contra la API
        // de OpenAI—, así que un botón ahí sería un botón que siempre falla.
        const entradaProveedor = catalog.get(provider);
        const sePuedeProbar = entradaProveedor?.provider.testable === true;
        const probar = el("button", "Probar");
        probar.title =
          "Pide una respuesta mínima al proveedor. Cuesta una fracción de céntimo.";
        const resultadoPrueba = el("span", "", "resultado");
        probar.addEventListener("click", async () => {
          const modelo = entradaModelo.value.trim();
          if (modelo === "") {
            resultadoPrueba.className = "resultado error";
            resultadoPrueba.textContent = "Escribe el modelo primero.";
            return;
          }
          probar.disabled = true;
          probar.textContent = "Probando…";
          resultadoPrueba.className = "resultado";
          resultadoPrueba.textContent = "";
          try {
            const r = await api(
              "POST",
              `/api/providers/${selProveedor.value}/models/test`,
              { model: modelo },
            );
            resultadoPrueba.className = r.ok
              ? "resultado ok"
              : r.credentialAccepted === true
                ? "resultado alerta"
                : "resultado error";
            resultadoPrueba.textContent = `${r.detail} · ${r.latencyMs} ms`;
          } catch (fallo) {
            resultadoPrueba.className = "resultado error";
            resultadoPrueba.textContent = fallo.message;
          } finally {
            probar.disabled = false;
            probar.textContent = "Probar";
          }
        });

        selProveedor.addEventListener("change", () => {
          // Al cambiar de proveedor, el modelo anterior casi nunca existe en el
          // nuevo. Se deja vacío en vez de arrastrar un identificador que el
          // proveedor va a rechazar.
          entradaModelo.value = "";
          onProvider(selProveedor.value);
          onModel("");
        });

        entradaModelo.addEventListener("input", () => onModel(entradaModelo.value));

        caja.append(selProveedor, cajaModelo);

        // El botón y su resultado, en su propia fila: el resultado de una prueba
        // puede ser largo —el mensaje del proveedor— y comprimirlo junto al
        // campo deja el identificador ilegible.
        const pie = el("div", undefined, "pie-modelo");
        if (sePuedeProbar) {
          pie.append(probar, resultadoPrueba);
        } else {
          // Y se dice por qué, en vez de dejar la duda de si falta algo.
          resultadoPrueba.textContent =
            "Sin prueba automática: este proveedor no expone un endpoint de chat. Comprueba el modelo usándolo.";
        }
        const contenedor = el("div", undefined, "selector-modelo");
        contenedor.append(caja, pie);
        return contenedor;
      }

      /**
       * El desplegable de sugerencias de un campo de texto.
       *
       * Se despliega al enfocar y filtra al escribir, por identificador y por
       * nombre. Se cierra al elegir, al salir del campo y con Escape; y **no** se
       * cierra al hacer clic dentro, que es el fallo clásico de un desplegable
       * hecho a mano.
       */
      function entryAutoComplete(entrada, contenedor, obtener) {
        const lista = el("div", undefined, "lista-modelos");
        lista.hidden = true;
        contenedor.append(lista);

        const pintar = () => {
          const entrada_ = obtener();
          lista.textContent = "";

          if (entrada_ === undefined) return;
          if (entrada_.models === null) {
            lista.append(
              el(
                "div",
                entrada_.error ??
                  `${entrada_.provider.name} no publica su lista: escribe el identificador.`,
                "vacio",
              ),
            );
            lista.hidden = false;
            return;
          }

          const consulta = entrada.value.trim().toLowerCase();
          const coincidencias = entrada_.models
            .filter(
              (m) =>
                consulta === "" ||
                m.id.toLowerCase().includes(consulta) ||
                m.name.toLowerCase().includes(consulta),
            )
            .slice(0, 60);

          if (coincidencias.length === 0) {
            lista.append(el("div", "Sin coincidencias en este proveedor.", "vacio"));
          } else {
            for (const m of coincidencias) {
              const fila = el("div");
              fila.append(
                el("span", m.id),
                el(
                  "span",
                  m.promptUsd === null
                    ? `  ${m.name}`
                    : `  ${m.name} · $${(m.promptUsd * 1_000_000).toFixed(2)}/M`,
                  "nombre",
                ),
              );
              // `mousedown` y no `click`: el `blur` del campo dispara antes que
              // el `click`, y el desplegable se cerraría sin elegir nada.
              fila.addEventListener("mousedown", (evento) => {
                evento.preventDefault();
                entrada.value = m.id;
                lista.hidden = true;
                entrada.dispatchEvent(new Event("input"));
              });
              lista.append(fila);
            }
          }
          lista.hidden = false;
        };

        entrada.addEventListener("focus", pintar);
        entrada.addEventListener("input", pintar);
        entrada.addEventListener("blur", () => {
          // Con retardo, para que el `mousedown` de una sugerencia alcance a
          // correr antes de que la lista desaparezca.
          setTimeout(() => {
            lista.hidden = true;
          }, 120);
        });
        entrada.addEventListener("keydown", (evento) => {
          if (evento.key === "Escape") lista.hidden = true;
        });
      }

      // ── Vista: modelos (routing por rol) ──────────────────────────────────

      /**
       * Qué modelo usa cada rol, y de dónde salió.
       *
       * La columna "origen" es la que hace útil la pantalla: sin ella, cambiar
       * el preset y no ver efecto es indistinguible de un override olvidado en
       * `.valmen/routing.yaml`. Y los roles que el harness todavía no ejecuta se
       * marcan como declarados: prometer que un modelo se usa para algo que no
       * existe sería una mentira cómoda.
       *
       * Arriba va lo que se mira (R-AJU-001..003): el perfil activo, el aviso de
       * cliente y los roles agrupados. Lo que se edita —perfiles, preset, modelo
