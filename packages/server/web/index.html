<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ValmenHarness · Mission Control</title>
    <style>
      /* Sin framework y sin paso de compilación: esta interfaz tiene que
         arrancar con el servidor, y su objetivo es mostrar el estado, no
         impresionar. Una hoja propia se lee entera en un minuto. */
      :root {
        --fondo: #0d1014;
        --panel: #14181f;
        --panel-alto: #1b202a;
        --panel-hover: #212733;
        --borde: #262c38;
        --borde-suave: #1e232d;
        --texto: #e8eaf0;
        --tenue: #8a92a6;
        --acento: #5b8dff;
        --acento-suave: rgba(91, 141, 255, 0.14);
        --acento-halo: rgba(91, 141, 255, 0.07);
        --acento-2: #8f6bff;
        --halo-ok: 0 0 0 3px rgba(70, 185, 90, 0.14);
        --alerta-suave: rgba(214, 160, 34, 0.16);
        --ok-suave: rgba(70, 185, 90, 0.16);
        --error-suave: rgba(242, 105, 92, 0.16);
        --barra: rgba(13, 16, 20, 0.86);
        --ok: #46b95a;
        --alerta: #d6a022;
        --error: #f2695c;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
        --lateral: 232px;
        --radio: 8px;
      }
      /* La preferencia de tema pertenece al sistema: no se guarda una segunda
         decisión local ni se cambia el contrato de la vista. Todos los controles
         consumen estas variables semánticas, por lo que el tema claro conserva
         la misma jerarquía y los mismos estados que el oscuro. */
      @media (prefers-color-scheme: light) {
        :root {
          --fondo: #f7f8fb;
          --panel: #ffffff;
          --panel-alto: #eef1f7;
          --panel-hover: #e6ebf5;
          --borde: #cfd6e4;
          --borde-suave: #e1e5ed;
          --texto: #172033;
          --tenue: #57627a;
          --acento: #2f63d9;
          --acento-suave: rgba(47, 99, 217, 0.14);
          --acento-halo: rgba(47, 99, 217, 0.08);
          --acento-2: #7050d7;
          --halo-ok: 0 0 0 3px rgba(22, 128, 58, 0.15);
          --alerta-suave: rgba(146, 95, 0, 0.14);
          --ok-suave: rgba(22, 128, 58, 0.14);
          --error-suave: rgba(200, 58, 49, 0.12);
          --barra: rgba(247, 248, 251, 0.88);
          --ok: #16803a;
          --alerta: #925f00;
          --error: #c83a31;
        }
      }
      * {
        box-sizing: border-box;
      }
      /* El foco por teclado debe ser igual de reconocible en enlaces, botones,
         resúmenes y campos. El texto y los roles siguen expresando los estados;
         el anillo solo señala dónde actuará el teclado. */
      a:focus-visible,
      button:focus-visible,
      summary:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--acento);
        outline-offset: 2px;
      }
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--texto);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      /* ── El armazón ──────────────────────────────────────────────────────
         Barra lateral fija y una columna de contenido. La navegación deja de
         competir con el contenido por el ancho de arriba: en una pantalla de
         registro hay ocho destinos y ninguno es «el principal», así que una
         barra horizontal obliga a leerlos todos en cada vista. */
      body.armazon {
        display: grid;
        grid-template-columns: var(--lateral) 1fr;
        min-height: 100vh;
      }
      body.armazon.lateral-oculta {
        grid-template-columns: 0 1fr;
      }
      .lateral {
        background: var(--panel);
        border-right: 1px solid var(--borde);
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 10px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
      }
      body.lateral-oculta .lateral {
        padding: 0;
        border: 0;
      }
      body.lateral-oculta .lateral > * {
        display: none;
      }
      .lateral .marca {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 8px 14px;
      }
      .lateral .marca .icono-marca {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: linear-gradient(140deg, var(--acento), var(--acento-2));
        display: grid;
        place-items: center;
        color: var(--texto);
        font-size: 13px;
        font-weight: 700;
        flex: none;
      }
      .lateral .marca .nombre {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .lateral .marca .nombre span {
        color: var(--tenue);
        font-weight: 500;
      }
      .lateral .grupo {
        color: var(--tenue);
        font-size: 10.5px;
        font-weight: 600;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        padding: 12px 9px 5px;
      }
      .lateral nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .lateral nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--tenue);
        text-decoration: none;
        font-size: 13.5px;
        padding: 7px 9px;
        border-radius: var(--radio);
        border: 0;
      }
      .lateral nav a svg {
        width: 15px;
        height: 15px;
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.85;
      }
      .lateral nav a:hover {
        background: var(--panel-hover);
        color: var(--texto);
      }
      .lateral nav a[aria-current="page"] {
        background: var(--acento-suave);
        color: var(--texto);
        font-weight: 550;
        box-shadow: inset 2px 0 0 var(--acento);
      }
      .lateral nav a[aria-current="page"] svg {
        color: var(--acento);
        opacity: 1;
      }
      .lateral nav a .cuenta {
        margin-left: auto;
        background: var(--acento-suave);
        color: var(--acento);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        padding: 1px 7px;
        line-height: 1.5;
      }
      .lateral nav a .cuenta.alerta {
        background: var(--alerta-suave);
        color: var(--alerta);
      }
      .lateral .pie {
        margin-top: auto;
        border-top: 1px solid var(--borde-suave);
        padding: 12px 9px 4px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .lateral .pie .rotulo {
        font-size: 10.5px;
        color: var(--tenue);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .visualmente-oculto {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .lateral .pie .ruta {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
        word-break: break-all;
        line-height: 1.4;
      }
      .lateral .pie .latido {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11.5px;
        color: var(--tenue);
      }
      .lateral .pie .punto {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: var(--halo-ok);
        flex: none;
      }
      .principal {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .barra-vista {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        border-bottom: 1px solid var(--borde);
        background: var(--barra);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .barra-vista .titulo {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .barra-vista .sello {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
        border: 1px solid var(--borde);
        border-radius: 999px;
        padding: 2px 9px;
      }
      .barra-vista .crecer {
        margin-left: auto;
      }
      .pliegue {
        background: transparent;
        border: 1px solid var(--borde);
        border-radius: 6px;
        color: var(--tenue);
        cursor: pointer;
        width: 28px;
        height: 26px;
        display: grid;
        place-items: center;
        padding: 0;
        flex: none;
      }
      .pliegue:hover {
        color: var(--texto);
        border-color: var(--acento);
      }
      .pliegue svg {
        width: 14px;
        height: 14px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
      }
      header.heredado {
        display: flex;
        align-items: baseline;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid var(--borde);
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        padding: 16px 0;
      }
      header.heredado .raiz {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 12px;
      }
      #actualizado {
        color: var(--ok);
      }
      /* El aviso de que hay cambios **sin** mover la pantalla. Aparece solo cuando
         el refresco se difirió —hay un diálogo abierto, o el foco está en un
         campo— y es la salida para no quedarse leyendo algo viejo sin saberlo. */
      .barra-vista .cambios {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--acento);
        background: transparent;
        color: var(--acento);
        cursor: pointer;
      }
      .barra-vista .cambios[hidden] {
        display: none;
      }
      /* El contenido usa **todo** el ancho disponible, como un `container-fluid`:
         una tabla de tickets con siete columnas y un tablero de feature no se
         leen mejor centrados con doscientos píxeles muertos a cada lado. Lo que
         necesita medida corta —un diálogo, un párrafo largo— la pide él mismo. */
      main {
        width: 100%;
        padding: 20px 28px 56px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--tenue);
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0;
      }
      /* El contenido vive en una columna con un halo suave arriba: da
         profundidad sin imágenes ni degradados que compitan con los datos. */
      .principal::before {
        content: "";
        position: fixed;
        inset: 0 0 auto var(--lateral);
        height: 220px;
        background: radial-gradient(
          900px 220px at 18% -40%,
          var(--acento-halo),
          transparent 70%
        );
        pointer-events: none;
      }
      body.lateral-oculta .principal::before {
        left: 0;
      }
      .nota {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-left: 3px solid var(--acento);
        border-radius: var(--radio);
        padding: 12px 16px;
        margin-bottom: 24px;
        color: var(--tenue);
        font-size: 13px;
      }
      .nota strong {
        color: var(--texto);
      }
      .nota.alerta {
        border-left-color: var(--alerta);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
        font-weight: 600;
        padding: 10px;
        border-bottom: 1px solid var(--borde);
        position: sticky;
        top: 51px;
        background: var(--fondo);
        white-space: nowrap;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--borde);
        vertical-align: middle;
      }
      tbody tr {
        transition: background 0.12s ease;
      }
      tbody tr:hover td {
        background: var(--panel);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      .nombre {
        font-weight: 500;
      }
      .id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .punto {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 7px;
      }
      .punto.ok {
        background: var(--ok);
      }
      .punto.no {
        background: var(--tenue);
        opacity: 0.4;
      }
      .punto.error {
        background: var(--error);
      }
      .punto.alerta {
        background: var(--alerta);
      }
      .acciones {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        background: var(--panel-alto);
        color: var(--texto);
        border: 1px solid var(--borde);
        transition:
          background 0.12s ease,
          border-color 0.12s ease,
          transform 0.06s ease;
      }
      button:hover:not(:disabled) {
        border-color: var(--acento);
        background: var(--panel-hover);
      }
      button:active:not(:disabled) {
        transform: translateY(1px);
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.principal {
        background: var(--acento);
        border-color: var(--acento);
        color: #fff;
      }
      button.peligro:hover:not(:disabled) {
        border-color: var(--error);
        color: var(--error);
      }
      button.enlace {
        background: none;
        border: none;
        color: var(--acento);
        padding: 0;
      }
      .resultado {
        font-size: 12px;
        color: var(--tenue);
      }
      .resultado.ok {
        color: var(--ok);
      }
      .resultado.error {
        color: var(--error);
      }
      /* La credencial fue aceptada pero la petición de prueba no: ni verde ni rojo. */
      .resultado.alerta {
        color: var(--alerta);
      }
      .etiqueta {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 10px;
        border: 1px solid var(--borde);
        color: var(--tenue);
        font-family: var(--mono);
      }
      .etiqueta.critico {
        border-color: var(--alerta);
        color: var(--alerta);
      }
      .tarjeta-estandar {
        border: 1px solid var(--borde);
        border-radius: 6px;
        margin-bottom: 12px;
        padding: 12px;
      }
      .tarjeta-estandar .nombre {
        font-size: 15px;
        font-weight: 600;
        margin: 6px 0;
      }

      .barra-progreso {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 999px;
        height: 6px;
        overflow: hidden;
        margin-bottom: 6px;
        max-width: 220px;
      }
      .barra-progreso-lleno {
        background: linear-gradient(90deg, var(--acento), var(--acento-2));
        height: 100%;
        border-radius: 999px;
        transition: width 0.2s ease;
      }

      /* El tablero de una feature: columnas por dónde está cada ticket.
         Se desplaza en horizontal en vez de encogerse: una columna de tarjetas
         ilegibles es peor que tener que desplazar. */
      .tablero {
        display: flex;
        gap: 12px;
        overflow-x: auto;
        padding-bottom: 10px;
        align-items: flex-start;
        width: 100%;
      }
      /* El título de una tarjeta se recorta a tres renglones: el del modelo puede
         tener doscientos caracteres y en una columna angosta se come la tarjeta.
         El texto completo queda en el `title`, que es donde se consulta. */
      .tarjeta-ticket .titulo-ticket {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .vacio-tablero {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 2px;
      }
      /* Las columnas se reparten el ancho disponible. Antes tenían un mínimo de
         210 px y con ocho etapas el tablero pedía mil setecientos: había que
         desplazarse para ver la mitad del trabajo. Ahora caben las que hay, y el
         desplazamiento queda solo como salida para una pantalla muy angosta. */
      .columna-tablero {
        flex: 1 1 0;
        min-width: 180px;
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 10px;
      }
      .columna-tablero .titulo {
        font-size: 13px;
        font-weight: 600;
        color: var(--tenue);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 10px;
      }
      .tarjeta-ticket {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 9px;
        margin-bottom: 8px;
      }
      .tarjeta-ticket .titulo-ticket {
        font-weight: 600;
        margin: 4px 0 6px;
      }
      .tarjeta-ticket .espera {
        color: var(--alerta);
      }
      .tarjeta-ticket .listo {
        color: var(--ok);
      }

      /* Lo ya decidido: se lee, pero no compite con lo que pide una acción. */
      .tarjeta-estandar.historial {
        border-left: 3px solid var(--borde);
        margin: 8px 0 8px 12px;
        opacity: 0.85;
      }
      /* El margen es del historial, no de todo desplegable: puesto como
         `details > summary` global engordaba los acordeones de un ticket —los
         dejaba en setenta píxeles de alto— y el usuario lo notó antes que yo. */
      .historial-estandares > summary {
        cursor: pointer;
        margin: 14px 0 8px;
      }

      /* La sección que toca mirar en el estado actual. */
      .acordeon.de-turno {
        border-left: 3px solid var(--acento);
        padding-left: 10px;
      }
      .marca-turno {
        background: var(--acento);
        border-radius: 3px;
        color: var(--fondo);
        font-size: 10px;
        letter-spacing: 0.03em;
        margin-left: 8px;
        padding: 1px 6px;
        text-transform: uppercase;
        vertical-align: middle;
      }

      /* Los impactos, en su columna y en un solo renglón. */
      th.columna-impactos,
      td.columna-impactos {
        white-space: nowrap;
        width: 1%;
      }
      .impactos {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .impacto {
        border: 1px solid var(--alerta);
        border-radius: 3px;
        color: var(--alerta);
        font-size: 10px;
        letter-spacing: 0.02em;
        padding: 0 5px;
        text-transform: uppercase;
      }
      .etiqueta.roto {
        border-color: var(--error);
        color: var(--error);
      }
      .etiqueta.aprueba {
        border-color: var(--ok);
        color: var(--ok);
      }
      .etiqueta.bloquea {
        border-color: var(--error);
        color: var(--error);
      }
      .etiqueta.revisa {
        border-color: var(--alerta);
        color: var(--alerta);
      }
      .filtros {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .filtros input,
      .filtros select,
      select,
      input[type="text"] {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .filtros input:focus,
      .filtros select:focus,
      select:focus,
      input:focus {
        outline: none;
        border-color: var(--acento);
      }
      .tarjetas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .tarjeta {
        background: linear-gradient(180deg, var(--panel-alto), var(--panel));
        border: 1px solid var(--borde);
        border-radius: var(--radio);
        padding: 14px 16px;
      }
      .tarjeta .valor {
        font-size: 25px;
        font-weight: 620;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }
      .tarjeta .rotulo {
        font-size: 11.5px;
        color: var(--tenue);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-top: 2px;
      }
      dialog {
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 10px;
        padding: 0;
        max-width: 520px;
        width: calc(100% - 32px);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.6);
      }
      .dialogo {
        padding: 20px 24px;
      }
      .dialogo h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .dialogo p {
        margin: 0 0 16px;
        color: var(--tenue);
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--tenue);
        margin-bottom: 6px;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        font: inherit;
        font-family: var(--mono);
        font-size: 13px;
        padding: 9px 11px;
        border-radius: 6px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .aviso {
        font-size: 12px;
        color: var(--tenue);
        margin-top: 8px;
      }
      .pie {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      pre {
        background: var(--fondo);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 12px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
        max-height: 60vh;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .secciones {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .secciones button {
        font-size: 12px;
      }
      .secciones button[aria-pressed="true"] {
        border-color: var(--acento);
        color: var(--acento);
      }
      .vacio {
        color: var(--tenue);
        text-align: center;
        padding: 40px;
      }

      /* ── Barra de guardado, fija mientras se edita ────────────────────── */
      /* El botón de guardar estaba al final de una tabla de trece roles, y no se
         encontraba. Una barra fija dice que hay cambios pendientes y los guarda
         sin obligar a recorrer la página. */
      .barra-guardado {
        position: sticky; bottom: 0; z-index: 30;
        display: flex; gap: 12px; align-items: center;
        padding: 12px 16px; margin-top: 18px;
        background: var(--panel-alto); border: 1px solid var(--borde);
        border-radius: 8px;
      }
      .barra-guardado .cuenta { font-size: 13px; color: var(--tenue); flex: 1; }
      .barra-guardado .cuenta.pendiente { color: var(--alerta); }
      .barra-guardado .resultado { flex: 1; }

      /* ── Selector de modelo en dos niveles ────────────────────────────── */
      /* Proveedor y modelo, con el modelo en un desplegable que se puede
         escribir: una lista de cientos de modelos sin búsqueda es una lista que
         nadie recorre, y un `select` no deja teclear. */
      .fila-perfil, .fila-rol-perfil, .elecciones-perfil {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 6px 0;
        border-bottom: 1px solid var(--borde-suave);
      }
      .origen-perfil, .marca-perfil { color: var(--tenue); font-size: 12px; }
      .marca-perfil { color: var(--acento); }
      .editor-perfil label { display: block; margin: 6px 0; }

      .par-modelo {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .par-modelo select {
        max-width: 150px;
      }
      .par-modelo .caja-modelo {
        position: relative;
        flex: 1;
        min-width: 220px;
      }
      .par-modelo input {
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      .lista-modelos {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 260px;
        overflow: auto;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        margin-top: 2px;
      }
      .lista-modelos div {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lista-modelos div:hover,
      .lista-modelos div.marcado {
        background: var(--panel);
      }
      .lista-modelos .nombre {
        font-family: inherit;
        color: var(--tenue);
      }
      .lista-modelos .vacio {
        cursor: default;
        color: var(--tenue);
        padding: 10px;
      }
      .cargando-modelos {
        font-size: 12px;
        color: var(--tenue);
      }
      .selector-modelo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pie-modelo {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .pie-modelo button {
        font-size: 12px;
      }
      .pie-modelo .resultado {
        flex: 1;
        word-break: break-word;
      }

      /* ── Features ─────────────────────────────────────────────────────── */
      .acciones-feature {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--borde);
      }
      .acciones-feature button {
        font-size: 12px;
      }
      a.enlace {
        color: var(--acento);
        text-decoration: none;
      }
      a.enlace:hover {
        text-decoration: underline;
      }
      /* Los cuatro artefactos de una feature, siempre visibles: la pregunta
         «¿en qué punto está?» se responde mirando, no abriendo. */
      .artefactos {
        display: flex;
        gap: 4px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .artefactos span {
        color: var(--borde);
      }
      .artefactos span.hecho {
        color: var(--ok);
      }
      .sprint {
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 14px;
      }
      .sprint > header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 12px 16px;
        border-bottom: 1px solid var(--borde);
        background: none;
      }
      .sprint > header .id {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--acento);
      }
      .sprint > header h3 {
        font-size: 14px;
        font-weight: 500;
      }
      .sprint table {
        border: none;
      }
      .sprint td {
        border-bottom: 1px solid var(--borde);
      }
      .sprint tr:last-child td {
        border-bottom: none;
      }
      /* Un ticket del grafo que todavía no existe en el registro. Se marca para
         que la diferencia entre «planeado» y «escrito» no se pierda. */
      tr.planeado td {
        opacity: 0.55;
      }
      .depende {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .huecos {
        border-left: 3px solid var(--error);
      }
      .huecos .fila {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        font-size: 13px;
      }
      .huecos .fila + .fila {
        border-top: 1px solid var(--borde);
      }

      /* ── Ticket: cabecera y gates ─────────────────────────────────────── */
      .volver {
        font-size: 13px;
        margin-bottom: 14px;
        display: inline-block;
      }
      .cabecera-ticket {
        margin-bottom: 22px;
      }
      .cabecera-ticket h2 {
        font-size: 20px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--texto);
        margin-bottom: 6px;
      }
      .cabecera-ticket .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      .ruta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
        margin-top: 8px;
      }
      .gate {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .gate-cabecera {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .gate-meta {
        font-size: 12px;
        color: var(--tenue);
        margin-bottom: 12px;
      }
      .checks {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
      }
      .check {
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .check .marca {
        font-family: var(--mono);
        width: 12px;
      }
      .check .marca.pass {
        color: var(--ok);
      }
      .check .marca.fail {
        color: var(--error);
      }
      .check .marca.warn {
        color: var(--alerta);
      }
      .check .marca.skip {
        color: var(--tenue);
      }
      .check .detalle {
        color: var(--tenue);
      }
      .gate .acciones {
        justify-content: flex-start;
      }
      .veredicto {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        margin-top: 14px;
      }
      .veredicto .salida {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
      }
      .veredicto .salida.approve {
        color: var(--ok);
      }
      .veredicto .salida.block {
        color: var(--error);
      }
      .veredicto .salida.review {
        color: var(--alerta);
      }
      .veredicto .motivo {
        font-size: 13px;
        color: var(--tenue);
        flex: 1 1 320px;
      }
      .obsoleto {
        background: rgba(210, 153, 34, 0.12);
        border: 1px solid var(--alerta);
        color: var(--alerta);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        margin-top: 12px;
      }
      .proposiciones {
        margin-top: 14px;
      }
      .proposiciones td {
        padding: 8px 10px;
        font-size: 13px;
      }
      .proposiciones .etiqueta-proposicion {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .proposiciones .criterio-texto {
        font-size: 13px;
        margin-bottom: 2px;
      }
      /* La barra hace visible lo que decide: el número y los dos umbrales. */
      .barra {
        position: relative;
        width: 150px;
        height: 8px;
        border-radius: 4px;
        background: var(--fondo);
        border: 1px solid var(--borde);
      }
      .barra .relleno {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: var(--tenue);
      }
      .barra .relleno.approve {
        background: var(--ok);
      }
      .barra .relleno.block {
        background: var(--error);
      }
      .barra .relleno.review {
        background: var(--alerta);
      }
      .barra .corte {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 1px;
        background: var(--tenue);
        opacity: 0.7;
      }
      .cifra {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
      }
      .descriptiva {
        color: var(--tenue);
        font-style: italic;
      }

      /* Resumen de la vista de tickets. Las tarjetas que filtran se distinguen de
         la que solo informa: si todas parecieran igual de pulsables, la mitad no
         haría nada al hacer clic. */
      .tarjeta {
        font: inherit;
        color: inherit;
        text-align: left;
      }
      button.tarjeta {
        cursor: pointer;
        transition: border-color 0.12s ease;
      }
      button.tarjeta:hover {
        border-color: var(--acento);
      }
      button.tarjeta.aplicada {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 14%, var(--panel));
      }
      button.tarjeta.aplicada .rotulo {
        color: var(--acento);
      }
      button.tarjeta.aplicada .rotulo::after {
        content: " ✕";
        font-size: 10px;
      }
      .filtros-aplicados {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 12px;
        flex-wrap: wrap;
      }
      .filtros-aplicados button {
        padding: 4px 10px;
        font-size: 12px;
      }

      /* Cabecera ordenable. El botón hereda el aspecto del `th` y solo se nota al
         pasar por encima: una cabecera llena de botones con borde compite con la
         tabla, que es lo que se viene a leer. */
      th button {
        font: inherit;
        color: inherit;
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: inherit;
        letter-spacing: inherit;
      }
      th button:hover {
        color: var(--texto);
      }
      th button.orden-activo {
        color: var(--acento);
      }
      .orden-flecha {
        font-size: 11px;
      }

      /* Progreso de una feature. La barra es estrecha a propósito: da el golpe de
         vista y la cifra de al lado da el dato. */
      .progreso {
        width: 90px;
        height: 6px;
        background: var(--borde);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 4px;
      }
      .progreso-relleno {
        height: 100%;
        background: var(--acento);
        border-radius: 999px;
      }
      .progreso-relleno.completo {
        background: var(--ok);
      }

      /* Rango de fechas. Va en su propia línea dentro de la barra de filtros: con
         los dos campos, el selector y los cinco atajos, compartir línea con la
         búsqueda dejaba todo apretado y sin jerarquía. */
      .rango-fechas {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        flex-basis: 100%;
        padding-top: 8px;
        border-top: 1px solid var(--borde);
      }
      .campo-fecha {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .campo-fecha input {
        font: inherit;
        font-size: 12px;
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 5px 8px;
      }
      .atajos-fecha {
        display: inline-flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .atajos-fecha button {
        font-size: 11px;
        padding: 5px 9px;
        background: var(--panel);
        color: var(--tenue);
        border: 1px solid var(--borde);
        border-radius: 999px;
        cursor: pointer;
      }
      .atajos-fecha button:hover {
        color: var(--texto);
        border-color: var(--acento);
      }

      /* ── Estado del ticket ──────────────────────────────────────────────
         La tira de avance responde "¿por dónde va?" de un golpe. Los pasos
         cumplidos se apagan para que el actual destaque sin competir. */
      .estado-ticket {
        border: 1px solid var(--borde);
        background: var(--panel);
        border-radius: 10px;
        padding: 14px 16px;
        margin: 4px 0 18px;
      }
      /* La banda conserva la historia temporal, separada de la navegación. */
      .banda-fases {
        margin: 4px 0 18px;
        color: var(--texto);
      }
      .banda-fases-tramos {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .banda-fase {
        flex: 1 1 180px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--panel);
        overflow-wrap: anywhere;
      }
      .banda-fase.actual {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 16%, var(--panel));
      }
      .banda-fase.motivo-de-bloqueo {
        border-color: var(--error);
      }
      .banda-fase-tiempo {
        color: var(--tenue);
        font-size: 12px;
        margin-top: 4px;
      }
      .banda-fase-motivo {
        margin-top: 6px;
        color: var(--texto);
        font-size: 12px;
      }
      .estado-tira {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .estado-paso {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        opacity: 0.55;
        font: inherit;
        color: inherit;
        background: none;
        cursor: pointer;
      }
      .estado-paso:hover {
        opacity: 1;
        border-color: var(--acento);
      }
      .estado-paso.hecho,
      .estado-paso.actual {
        opacity: 1;
      }
      .estado-paso.hecho {
        border-color: color-mix(in srgb, var(--ok) 45%, var(--borde));
      }
      .estado-paso.actual {
        border-color: var(--acento);
        background: color-mix(in srgb, var(--acento) 16%, transparent);
      }
      .estado-paso.bloqueado {
        opacity: 1;
        border-color: var(--error);
        background: color-mix(in srgb, var(--error) 12%, transparent);
      }
      .estado-numero {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--tenue);
      }
      .estado-rotulo {
        font-size: 12px;
      }
      .estado-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        font-size: 11px;
      }
      .chip-rotulo {
        color: var(--tenue);
      }
      .chip-valor {
        font-family: var(--mono);
      }
      .chip.activo {
        border-color: var(--acento);
      }
      .chip.bueno {
        border-color: color-mix(in srgb, var(--ok) 50%, var(--borde));
      }
      .chip.bueno .chip-valor {
        color: var(--ok);
      }
      .chip.malo {
        border-color: color-mix(in srgb, var(--error) 50%, var(--borde));
      }
      .chip.malo .chip-valor {
        color: var(--error);
      }

      /* Historial de compuertas: una tira de veredictos, con la fecha y el actor
         en el título para no llenar la pantalla de metadatos. */
      .historial-gates {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip-gate {
        display: inline-flex;
        gap: 5px;
        padding: 3px 9px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        font-size: 11px;
        cursor: help;
      }
      .chip-gate.approve {
        border-color: color-mix(in srgb, var(--ok) 50%, var(--borde));
        color: var(--ok);
      }
      .chip-gate.block {
        border-color: color-mix(in srgb, var(--error) 50%, var(--borde));
        color: var(--error);
      }
      .chip-gate.review {
        border-color: color-mix(in srgb, var(--alerta) 50%, var(--borde));
        color: var(--alerta);
      }
      .chip-gate.obsoleto {
        opacity: 0.5;
        text-decoration: line-through;
      }

      /* ── Acordeones ────────────────────────────────────────────────────── */
      .acordeon {
        border: 1px solid var(--borde);
        border-radius: 10px;
        background: var(--panel);
        margin-bottom: 8px;
        overflow: hidden;
      }
      .acordeon > summary {
        cursor: pointer;
        padding: 11px 14px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        list-style: none;
        user-select: none;
      }
      .acordeon > summary::-webkit-details-marker {
        display: none;
      }
      .acordeon > summary::before {
        content: "▸";
        color: var(--tenue);
        font-size: 11px;
      }
      .acordeon[open] > summary::before {
        content: "▾";
      }
      .acordeon > summary:hover {
        background: var(--panel-alto);
      }
      .acordeon-titulo {
        font-weight: 600;
        font-size: 13px;
      }
      .acordeon-resumen {
        color: var(--tenue);
        font-size: 12px;
        font-family: var(--mono);
      }
      .acordeon-cuerpo {
        padding: 0 14px 14px;
        border-top: 1px solid var(--borde);
        padding-top: 12px;
      }

      /* ── Tarjetas de registro ──────────────────────────────────────────── */
      .tarjetas-datos {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .tarjeta-dato {
        border: 1px solid var(--borde);
        border-left: 3px solid var(--borde);
        border-radius: 8px;
        background: var(--panel-alto);
        padding: 10px 12px;
      }
      .tarjeta-dato-cabecera {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 6px;
      }
      .tarjeta-dato-nota {
        font-size: 12px;
        color: var(--tenue);
        line-height: 1.5;
      }
      .lista-criterios {
        margin: 0;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: 13px;
        line-height: 1.5;
      }

      /* ── Un documento, no un muro ────────────────────────────────────────
         El plan de un ticket tiene títulos, pasos numerados con subpasos y código
         en línea. Como `<pre>` se lee como una pared; aquí se lee como documento.
         Ocupa todo el ancho de su contenedor: limitarlo a una medida de lectura
         dejaba media tarjeta vacía, y el documento ya vive dentro de un ancho
         acotado. */
      .md {
        font-size: 14px;
        line-height: 1.65;
      }
      .md > *:first-child {
        margin-top: 0;
      }
      .md > *:last-child {
        margin-bottom: 0;
      }
      .md p {
        margin: 0 0 12px;
      }
      .md-titulo {
        margin: 20px 0 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--texto);
      }
      h4.md-titulo {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .md-lista {
        margin: 0 0 12px;
        padding-left: 22px;
      }
      .md-lista li {
        margin-bottom: 8px;
      }
      .md-lista li::marker {
        color: var(--tenue);
      }
      /* Una lista anidada es el detalle de un paso: se separa un poco y se apaga,
         para que el paso siga leyéndose como la unidad. */
      .md-lista .md-lista {
        margin: 8px 0 4px;
      }
      .md-codigo {
        font-family: var(--mono);
        font-size: 12.5px;
        background: color-mix(in srgb, var(--acento) 12%, transparent);

    <script type="module">
      // La interfaz no sabe nada del harness: llama a la API y muestra lo que
      // devuelve. Toda la lógica vive en el motor, así que un botón y un comando
      // de terminal no pueden divergir.
      const $ = (id) => document.getElementById(id);

      /** Llama a la API y devuelve el cuerpo, o lanza con el mensaje del servidor. */
      async function api(method, ruta, cuerpo) {
        if (method !== "GET") ocupado = true;
        try {
          return await enviar(method, ruta, cuerpo);
        } finally {
          if (method !== "GET") ocupado = false;
        }
      }

      /**
       * El token de escritura (R-CTRL-003): solo lo pide un servidor abierto a la red.
       * Se recuerda en este navegador y se envía en toda escritura.
       */
      function tokenDeEscritura() {
        try {
          return localStorage.getItem("valmen.token") ?? "";
        } catch {
          return "";
        }
      }

      async function enviar(method, ruta, cuerpo, yaPidioToken = false) {
        const url = new URL(ruta, "http://127.0.0.1");
        const vistaConjunta = url.pathname === "/api/portafolio";
        const seleccionDeLaPeticion = proyectoSeleccionado;
        const token = method === "GET" ? "" : tokenDeEscritura();
        const respuesta = await fetch(ruta, {
          method,
          headers: {
            ...(cuerpo === undefined ? {} : { "Content-Type": "application/json" }),
            ...(token === "" ? {} : { Authorization: `Bearer ${token}` }),
            ...(vistaConjunta || seleccionDeLaPeticion === ""
              ? {}
              : { "X-Valmen-Project": seleccionDeLaPeticion }),
          },
          body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
        });
        // Un servidor abierto a la red responde 401 a una escritura sin token: se pide
        // una vez y se repite. Si el token sigue sin valer, el error se muestra tal cual.
        if (respuesta.status === 401 && method !== "GET" && !yaPidioToken && typeof prompt === "function") {
          const dado = prompt(
            "Este servidor escucha en la red y las escrituras exigen un token. Pégalo aquí (lo imprimió `valmen serve` al arrancar):",
          );
          if (dado !== null && dado.trim() !== "") {
            try {
              localStorage.setItem("valmen.token", dado.trim());
            } catch {
              // Sin almacenamiento, el token sirve solo para esta petición.
            }
            return enviar(method, ruta, cuerpo, true);
          }
        }
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error ?? `HTTP ${respuesta.status}`);
        if (!vistaConjunta && seleccionDeLaPeticion !== proyectoSeleccionado) {
          throw RESPUESTA_DE_PROYECTO_OBSOLETA;
        }
        return datos;
      }

      /** Crea un elemento con texto. Nunca se usa innerHTML con datos del registro. */
      function el(tag, texto, clase) {
        const nodo = document.createElement(tag);
        if (texto !== undefined) nodo.textContent = texto;
        if (clase !== undefined) nodo.className = clase;
        return nodo;
      }

      /** El responsable de las decisiones humanas: se recuerda entre visitas. */
      let responsable = localStorage.getItem("valmen.actor") ?? "";
      let proyectoSeleccionado = localStorage.getItem("valmen.project") ?? "";
      const RESPUESTA_DE_PROYECTO_OBSOLETA = Symbol("respuesta de proyecto obsoleta");
      const guardarResponsable = (valor) => {
        responsable = valor;
        localStorage.setItem("valmen.actor", valor);
      };

      function mostrarProyecto(salud) {
        const raiz = $("raiz");
        if (raiz === null) return;
        const partes = String(salud.root).split("/").filter((parte) => parte !== "");
        raiz.textContent = partes[partes.length - 1] ?? salud.root;
        raiz.title = salud.root;
      }

      async function refrescarProyectoVisible() {
        try {
          mostrarProyecto(await api("GET", "/api/health"));
        } catch (error) {
          if (error !== RESPUESTA_DE_PROYECTO_OBSOLETA) throw error;
        }
      }

      function seleccionarProyecto(projectId) {
        proyectoSeleccionado = projectId;
        if (projectId === "") localStorage.removeItem("valmen.project");
        else localStorage.setItem("valmen.project", projectId);
        conectarEventos();
        void refrescarProyectoVisible();
        if (projectId === "") location.hash = "#/portafolio";
        void navegar();
      }

      async function cargarSelectorDeProyectos() {
        const selector = $("selector-proyectos");
        if (selector === null) return;
        const datos = await api("GET", "/api/portafolio");
        if (!Array.isArray(datos.projects)) return;
        selector.replaceChildren(new Option("Vista conjunta", ""));
        for (const proyecto of datos.projects) {
          if (proyecto.available) selector.append(new Option(proyecto.name, proyecto.projectId));
        }
        const existe = datos.projects.some(
          (proyecto) => proyecto.available && proyecto.projectId === proyectoSeleccionado,
        );
        if (proyectoSeleccionado !== "" && !existe) {
          proyectoSeleccionado = "";
          localStorage.removeItem("valmen.project");
        }
        selector.value = proyectoSeleccionado;
        selector.addEventListener("change", () => seleccionarProyecto(selector.value));
      }

      // ── Vista: tickets ────────────────────────────────────────────────────

      // La vista inicial responde «¿qué hay que hacer?», así que arranca filtrando
      // los que están en curso. Ver los 62 —cerrados incluidos— obligaba a filtrar
      // a mano cada vez para llegar a lo que de verdad se está trabajando.
      /**
       * El orden canónico de los estados, para agrupar la lista.
       *
       * Es el del contrato (`WORKFLOW_STATES`); acá no se puede importar porque
       * este archivo corre en el navegador. Un estado que no esté en la lista
       * —uno nuevo del contrato, o uno que el registro tenga de antes— cae al
       * final en vez de desaparecer de la pantalla.
       */
      const ORDEN_DE_ESTADOS = [
        "in_progress",
        "blocked",
        "awaiting_user_tests",
        "in_qa",
        "changes_requested",
        "qa_approved",
        "approved",
        "planned",
        "analyzed",
        "intake",
        "closed",
      ];

      const filtros = {
        q: "",
        workflow: "",
        type: "",
        // Por defecto, **lo que ya se empezó**: ni lo que nunca se analizó
        // (`intake`) ni lo cerrado. La lista de «solo abiertos» traía todos los
        // tickets creados y sin analizar, y con un proyecto con historia los dos
        // que están en curso quedaban enterrados. «Todos» sigue a un clic.
        empezados: true,
        open: false,
        invalid: false,
        critical: false,
        conPuntos: false,
        desde: "",
        hasta: "",
        /*
         * `closedOn` por defecto, y costó un fallo aprenderlo.
         *
         * Arrancaba en `updated` —«lo que se tocó en el rango»— con el argumento de
         * que es lo que se espera de una lista de trabajo. En este registro eso da
         * un resultado que parece roto: la migración al esquema 2 reescribió el
         * frontmatter de los **63** tickets el mismo día, así que pulsar «Ayer»
         * mostraba los 63 en vez de los tres que se cerraron.
         *
         * El botón dice «Ayer» y quien lo pulsa piensa en lo que pasó ayer, que en
         * este flujo es lo que se cerró: el reporte semanal cuenta cierres y el
         * botón de exportar también. El campo se puede cambiar —está ahí al lado—,
         * pero el valor por defecto tiene que ser el que no sorprende.
         */
        fecha: "closedOn",
        // Lo que se tocó hace menos va primero, que es lo que se espera de una
        // lista de trabajo.
        orden: "updated",
        sentido: "desc",
      };

      async function vistaTickets() {
        const cont = $("contenido");
        cont.textContent = "";

        const params = new URLSearchParams();
        if (filtros.q !== "") params.set("q", filtros.q);
        if (filtros.workflow !== "") params.set("workflow", filtros.workflow);
        if (filtros.type !== "") params.set("type", filtros.type);
        if (filtros.empezados) params.set("empezados", "1");
        if (filtros.open) params.set("open", "1");
        if (filtros.invalid) params.set("invalid", "1");
        if (filtros.critical) params.set("critical", "1");
        if (filtros.conPuntos) params.set("con-puntos", "1");
        if (filtros.desde !== "") params.set("desde", filtros.desde);
        if (filtros.hasta !== "") params.set("hasta", filtros.hasta);
        if (filtros.desde !== "" || filtros.hasta !== "") params.set("fecha", filtros.fecha);
        if (filtros.orden !== "updated") params.set("orden", filtros.orden);
        if (filtros.sentido !== "desc") params.set("sentido", filtros.sentido);

        const datos = await api("GET", `/api/tickets?${params.toString()}`);
        const r = datos.summary;

        // Tarjetas de resumen: es lo que responde "¿qué está pasando?" sin leer la
        // tabla. **Y filtran**: un número que obliga a buscar sus tickets a mano es
        // un número a medias. La que está aplicada se marca, y volver a pulsarla la
        // quita, para que nunca haya una tarjeta de la que no se pueda salir.
        const tarjetas = el("div", undefined, "tarjetas");

        /** Aplica un filtro y repinta. Volver a pulsar el activo lo quita. */
        const alternar = (clave) => {
          const estaba = filtros[clave];
          // Los filtros de conjunto son excluyentes entre sí: «en curso» y
          // «cerrados» a la vez no devuelven nada, y ese vacío se lee como un
          // fallo en vez de como dos filtros contradictorios.
          filtros.workflow = "";
          filtros.empezados = false;
          filtros.open = false;
          filtros.critical = false;
          filtros.conPuntos = false;
          filtros[clave] = !estaba;
          void vistaTickets();
        };

        const metricas = [
          { rotulo: "Tickets", valor: r.total, filtro: null },
          {
            // «En curso» es lo empezado y sin cerrar: el mismo conjunto que la
            // lista muestra por defecto, para que el número y las filas coincidan.
            rotulo: "En curso",
            valor: r.total - (r.byWorkflow.closed ?? 0) - (r.byWorkflow.intake ?? 0),
            filtro: "empezados",
          },
          {
            rotulo: "Cerrados",
            valor: r.byWorkflow.closed ?? 0,
            filtro: "workflow:closed",
          },
          {
            rotulo: "Con puntos abiertos",
            valor: r.withOpenPoints,
            filtro: "conPuntos",
          },
          {
            rotulo: "Impacto crítico",
            valor: r.criticalImpacts,
            filtro: "critical",
          },
        ];
        if (r.invalid > 0) {
          metricas.push({ rotulo: "Inválidos", valor: r.invalid, filtro: "invalid" });
        }

        for (const metrica of metricas) {
          const aplicada =
            metrica.filtro === null
              ? false
              : metrica.filtro.startsWith("workflow:")
                ? filtros.workflow === metrica.filtro.slice("workflow:".length)
                : filtros[metrica.filtro] === true;

          // Una tarjeta sin filtro es un dato, no un botón: no se puede pulsar
          // algo que no lleva a ninguna parte.
          const tarjeta = el(
            metrica.filtro === null ? "div" : "button",
            undefined,
            `tarjeta${aplicada ? " aplicada" : ""}`,
          );
          tarjeta.append(
            el("div", String(metrica.valor), "valor"),
            el("div", metrica.rotulo, "rotulo"),
          );
          if (metrica.filtro !== null) {
            tarjeta.type = "button";
            tarjeta.setAttribute("aria-pressed", String(aplicada));
            tarjeta.title = aplicada ? "Quitar este filtro" : "Filtrar por esto";
            if (metrica.filtro.startsWith("workflow:")) {
              const estado = metrica.filtro.slice("workflow:".length);
              tarjeta.addEventListener("click", () => {
                const estaba = filtros.workflow === estado;
                filtros.workflow = estaba ? "" : estado;
                filtros.open = false;
                filtros.critical = false;
                filtros.conPuntos = false;
                void vistaTickets();
              });
            } else {
              tarjeta.addEventListener("click", () => alternar(metrica.filtro));
            }
          }
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        // Se dice qué se está viendo. Con filtros aplicados, una tabla corta sin
        // explicación se lee como que no hay nada.
        const aplicados = [];
        if (filtros.open) aplicados.push("en curso");
        if (filtros.workflow !== "") aplicados.push(filtros.workflow);
        if (filtros.critical) aplicados.push("con impacto crítico");
        if (filtros.conPuntos) aplicados.push("con puntos abiertos");
        if (filtros.invalid) aplicados.push("inválidos");
        if (filtros.type !== "") aplicados.push(filtros.type);
        if (filtros.desde !== "" || filtros.hasta !== "") {
          const campo = { updated: "edición", created: "alta", closedOn: "cierre" }[
            filtros.fecha
          ];
          const rango = `${filtros.desde === "" ? "siempre" : filtros.desde} → ${
            filtros.hasta === "" ? "hoy" : filtros.hasta
          }`;
          aplicados.push(`${campo} ${rango}`);
        }
        if (aplicados.length > 0) {
          const linea = el("div", undefined, "filtros-aplicados");
          linea.append(el("span", `Mostrando: ${aplicados.join(" · ")}`, "resultado"));
          const limpiar = el("button", "Ver todos");
          limpiar.addEventListener("click", () => {
            filtros.q = "";
            filtros.workflow = "";
            filtros.type = "";
            filtros.open = false;
            filtros.invalid = false;
            filtros.critical = false;
            filtros.conPuntos = false;
            filtros.desde = "";
            filtros.hasta = "";
            void vistaTickets();
          });
          linea.append(limpiar);
          cont.append(linea);
        }

        // Filtros.
        const barra = el("div", undefined, "filtros");
        const busqueda = document.createElement("input");
        busqueda.type = "text";
        busqueda.placeholder = "Buscar por id, título o módulo…";
        busqueda.value = filtros.q;
        busqueda.style.minWidth = "280px";
        let temporizador;
        busqueda.addEventListener("input", () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            filtros.q = busqueda.value;
            void vistaTickets();
          }, 250);
        });
        barra.append(busqueda);

        const selector = (etiqueta, clave, valores, actual) => {
          const sel = document.createElement("select");
          sel.append(new Option(etiqueta, ""));
          for (const v of valores) sel.append(new Option(v, v));
          sel.value = actual;
          sel.addEventListener("change", () => {
            filtros[clave] = sel.value;
            void vistaTickets();
          });
          return sel;
        };
        barra.append(
          selector(
            "Todos los estados",
            "workflow",
            Object.keys(r.byWorkflow).sort(),
            filtros.workflow,
          ),
          selector("Todos los tipos", "type", Object.keys(r.byType).sort(), filtros.type),
        );

        const casilla = (texto, clave) => {
          const label = el("label");
          label.style.display = "flex";
          label.style.alignItems = "center";
          label.style.gap = "6px";
          label.style.margin = "0";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = filtros[clave];
          input.addEventListener("change", () => {
            filtros[clave] = input.checked;
            void vistaTickets();
          });
          label.append(input, el("span", texto));
          return label;
        };
        // ── Rango de fechas ──
        //
        // El caso que lo pide es semanal: «las incidencias que se montaron y se
        // cerraron en esta semana». Escribir dos fechas cada vez es trabajo
        // repetido, así que los atajos van al lado.
        const rango = el("div", undefined, "rango-fechas");

        const campoFecha = document.createElement("select");
        for (const [valor, etiqueta] of [
          ["updated", "Última edición"],
          ["created", "Fecha de alta"],
          ["closedOn", "Fecha de cierre"],
        ]) {
          campoFecha.append(new Option(etiqueta, valor));
        }
        campoFecha.value = filtros.fecha;
        campoFecha.title =
          "Con qué fecha se compara el rango. «Última edición» incluye lo que se " +
          "tocó en el rango aunque se cerrara antes; «fecha de cierre» cuenta lo " +
          "que se cerró, que es lo que va al reporte.";
        campoFecha.addEventListener("change", () => {
          filtros.fecha = campoFecha.value;
          void vistaTickets();
        });

        const entradaFecha = (clave, etiqueta) => {
          const caja = el("label", undefined, "campo-fecha");
          caja.append(el("span", etiqueta, "chip-rotulo"));
          const entrada = document.createElement("input");
          entrada.type = "date";
          entrada.value = filtros[clave];
          entrada.addEventListener("change", () => {
            filtros[clave] = entrada.value;
            void vistaTickets();
          });
          caja.append(entrada);
          return caja;
        };

        /** El rango de los atajos, en `YYYY-MM-DD` locales. */
        const ATAJOS = [
          ["Hoy", 0, 0],
          ["Ayer", 1, 1],
          // La semana empieza el lunes: un reporte semanal que empieza en domingo
          // parte el fin de semana, que es cuando más se despliega.
          ["Esta semana", "lunes", 0],
          ["Últimos 7 días", 6, 0],
          ["Este mes", "mes", 0],
        ];

        /** Una fecha local en `YYYY-MM-DD`, sin pasar por UTC. */
        const enTexto = (fecha) => {
          const y = fecha.getFullYear();
          const m = String(fecha.getMonth() + 1).padStart(2, "0");
          const d = String(fecha.getDate()).padStart(2, "0");
          return `${y}-${m}-${d}`;
        };

        const atajos = el("div", undefined, "atajos-fecha");
        for (const [etiqueta, desde, hasta] of ATAJOS) {
          const boton = el("button", etiqueta);
          boton.addEventListener("click", () => {
            const hoy = new Date();
            let inicio = new Date(hoy);
            let fin = new Date(hoy);

            if (desde === "lunes") {
              // `getDay()` pone el domingo en 0; para la semana que empieza el
              // lunes hay que convertirlo a 7.
              const dia = hoy.getDay() === 0 ? 7 : hoy.getDay();
              inicio.setDate(hoy.getDate() - (dia - 1));
            } else if (desde === "mes") {
              inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            } else {
              inicio.setDate(hoy.getDate() - Number(desde));
              fin.setDate(hoy.getDate() + Number(hasta));
            }

            filtros.desde = enTexto(inicio);
            filtros.hasta = enTexto(fin);
            void vistaTickets();
          });
          atajos.append(boton);
        }

        const limpiarFechas = el("button", "Sin rango");
        limpiarFechas.addEventListener("click", () => {
          filtros.desde = "";
          filtros.hasta = "";
          void vistaTickets();
        });
        atajos.append(limpiarFechas);

        rango.append(
          campoFecha,
          entradaFecha("desde", "desde"),
          entradaFecha("hasta", "hasta"),
          atajos,
        );
        barra.append(rango);

        barra.append(
          casilla("Solo lo empezado", "empezados"),
          casilla("Solo abiertos", "open"),
          casilla("Solo inválidos", "invalid"),
        );

        // El reporte es lo único del visor anterior que la pantalla no cubría, y
        // se descarga desde aquí en vez de componerse en el navegador: el texto y
        // el nombre del archivo los produce el servidor, así que el botón y
        // `valmen report` dan exactamente el mismo documento.
        const botonReporte = el("button", "Reporte de cierres");
        botonReporte.title =
          "Markdown de los tickets cerrados en el rango que tengas filtrado, listo " +
          "para pegar. Sin rango, los últimos 30 días.";
        botonReporte.addEventListener("click", () => void descargarReporte());
        barra.append(botonReporte);
        cont.append(barra);

        if (datos.tickets.length === 0) {
          cont.append(el("div", "Ningún ticket coincide con los filtros.", "vacio"));
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");

        /**
         * Una columna de la cabecera. Si tiene campo, ordena al pulsarla.
         *
         * Pulsar la columna que ya ordena **invierte** el sentido; pulsar otra
         * empieza por el sentido que se espera de ese campo —lo más reciente
         * primero en una fecha, alfabético en un texto—, porque empezar siempre
         * por ascendente obliga a pulsar dos veces para ver lo de hoy.
         */
        const columnaOrdenable = (titulo, campo, ayuda) => {
          const celda = el("th");
          if (campo === null) {
            celda.append(el("span", titulo));
            return celda;
          }

          const activa = filtros.orden === campo;
          const boton = el("button", undefined, activa ? "orden-activo" : "");
          boton.append(el("span", titulo));
          if (activa) {
            boton.append(el("span", filtros.sentido === "asc" ? "↑" : "↓", "orden-flecha"));
          }
          boton.title = ayuda;
          boton.addEventListener("click", () => {
            if (filtros.orden === campo) {
              filtros.sentido = filtros.sentido === "asc" ? "desc" : "asc";
            } else {
              filtros.orden = campo;
              filtros.sentido = ["updated", "created", "closedOn", "openPoints"].includes(
                campo,
              )
                ? "desc"
                : "asc";
            }
            void vistaTickets();
          });
          celda.append(boton);
          return celda;
        };

        filaCabecera.append(
          columnaOrdenable("Ticket", "id", "Ordenar por identificador"),
          columnaOrdenable("Tipo", "type", "Ordenar por tipo"),
          // Los impactos tienen su propia columna porque son una propiedad del
          // ticket, no del estado: colgados debajo del estado obligaban a la celda
          // a crecer tres renglones y la tabla dejaba de leerse de un barrido.
          el("th", "Impactos", "columna-impactos"),
          columnaOrdenable("Estado", "workflowStatus", "Ordenar por estado"),
          columnaOrdenable("QA", "qaStatus", "Ordenar por estado de QA"),
          columnaOrdenable("Release", "releaseStatus", "Ordenar por estado de release"),
          columnaOrdenable("Puntos", "openPoints", "Ordenar por puntos abiertos"),
          columnaOrdenable("Actualizado", "updated", "Ordenar por última edición"),
          // La fecha de cierre es la que filtra el reporte y los atajos, así que
          // tiene que verse: sin la columna, un filtro por cierre y un filtro por
          // edición son indistinguibles en pantalla, y esa confusión ya costó una
          // sesión de depuración.
          columnaOrdenable("Cerrado", "closedOn", "Ordenar por fecha de cierre"),
          el("th", ""),
        );
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const t of datos.tickets) {
          const tr = el("tr");

          const celdaId = el("td");
          celdaId.append(el("div", t.title, "nombre"), el("div", t.id, "id"));
          tr.append(celdaId);

          const celdaTipo = el("td");
          celdaTipo.append(el("span", `${t.type} · ${t.module}`, "etiqueta"));
          tr.append(celdaTipo);

          const celdaImpactos = el("td", undefined, "columna-impactos");
          if (t.criticalImpacts.length === 0) {
            celdaImpactos.append(el("span", "—", "id"));
          } else {
            const caja = el("div", undefined, "impactos");
            for (const impacto of t.criticalImpacts) {
              // La etiqueta corta es la del contrato sin el sufijo: `sync_impact`
              // es el nombre del campo, no lo que hay que leer en una lista. El
              // nombre completo queda en el `title`, para cuando haga falta.
              const corto = NOMBRE_DE_IMPACTO[impacto] ?? impacto;
              const marca = el("span", corto, "impacto");
              marca.title = impacto;
              caja.append(marca);
            }
            celdaImpactos.append(caja);
          }
          tr.append(celdaImpactos);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", t.workflowStatus));
          if (t.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválido", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          tr.append(el("td", t.qaStatus));
          tr.append(el("td", t.releaseStatus));

          const celdaPuntos = el("td");
          celdaPuntos.textContent =
            t.totalPoints === 0 ? "—" : `${t.totalPoints - t.openPoints}/${t.totalPoints}`;
          if (t.openPoints > 0) celdaPuntos.style.color = "var(--alerta)";
          tr.append(celdaPuntos);

          tr.append(el("td", t.updated, "id"));

          const celdaCierre = el("td");
          celdaCierre.append(el("span", t.closedOn ?? "—", "id"));
          tr.append(celdaCierre);

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/ticket/${t.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: estándares ─────────────────────────────────────────────────
      //
      // Las reglas que el proyecto ya decidió y las que están por decidir. Las dos
      // cosas juntas a propósito: quien aprueba una propuesta necesita ver lo que
      // ya está en vigor, o aprueba algo que ya existía con otras palabras.
      async function vistaEstandares() {
        const cont = $("contenido");
        cont.textContent = "";
        const datos = await api("GET", "/api/standards");

        cont.append(el("h2", "Estándares del proyecto"));
        cont.append(
          el(
            "div",
            "Cómo se ve y cómo se escribe lo que se construye acá. Están en el AGENTS.md " +
              "que lee el agente, así que los tiene antes de escribir la primera línea.",
            "resultado",
          ),
        );

        const pendientes = datos.proposals.filter((p) => p.state === "propuesto");
        if (pendientes.length > 0) {
          const caja = el("div", undefined, "nota alerta");
          caja.append(
            el("strong", `${pendientes.length} propuesta(s) esperando tu decisión. `),
            el("span", "Una regla sin aprobar no está en vigor y el agente no la aplica."),
          );
          cont.append(caja);
        }

        // Lo decidido no se mezcla con lo que espera decisión. Una propuesta
        // aceptada que sigue en la lista de propuestas hace dudar de si se aplicó,
        // y la que se descartó parece pendiente para siempre: las dos se leen en
        // el historial, que es donde se busca «¿esto por qué no está?».
        const porDecidir = datos.proposals.filter((p) => p.state === "propuesto");
        const decididas = datos.proposals.filter((p) => p.state !== "propuesto");

        // ── Las propuestas: solo las que esperan ──
        if (porDecidir.length > 0) {
          cont.append(el("h3", `Propuestas (${porDecidir.length})`));
          for (const propuesta of porDecidir) {
            const tarjeta = el("div", undefined, "tarjeta-estandar");
            const cabecera = el("div", undefined, "meta");
            cabecera.append(
              el("span", propuesta.id, "id"),
              el("span", propuesta.area, "etiqueta"),
              el("span", propuesta.state, "etiqueta"),
              el("span", propuesta.date, "id"),
            );
            tarjeta.append(cabecera);
            tarjeta.append(el("div", propuesta.title, "nombre"));
            tarjeta.append(el("div", `Regla: ${propuesta.rule}`, "resultado"));
            if (propuesta.why !== "")
              tarjeta.append(el("div", `Por qué: ${propuesta.why}`, "resultado"));
            if (propuesta.tickets.length > 0) {
              tarjeta.append(el("div", `Visto en: ${propuesta.tickets.join(", ")}`, "ruta"));
            }

            const acciones = el("div", undefined, "responsable");
            const aceptar = el("button", "Aceptar y poner en vigor");
            const descartar = el("button", "Descartar", "enlace");
            const salida = el("div", undefined, "resultado");
            const decidir = async (decision, boton) => {
              boton.disabled = true;
              salida.className = "resultado";
              salida.textContent = "Registrando…";
              try {
                const r = await api(
                  "POST",
                  `/api/standards/${propuesta.id}/decision`,
                  { decision },
                );
                salida.className = "resultado ok";
                salida.textContent = r.details;
                await vistaEstandares();
              } catch (fallo) {
                salida.className = "resultado error";
                salida.textContent = fallo.message;
                boton.disabled = false;
              }
            };
            aceptar.addEventListener("click", () => void decidir("aceptado", aceptar));
            descartar.addEventListener("click", () => void decidir("descartado", descartar));
            // Las dos puertas, dichas donde se decide: los botones son una, y
            // pedírselo al agente es la otra. Quien no usa la pantalla tiene que
            // poder enterarse acá de que también se puede por la conversación.
            acciones.append(
              aceptar,
              descartar,
              el(
                "div",
                "También se decide hablando: pedile al agente «aceptá los estándares " +
                  "propuestos» y la decisión queda registrada con tus palabras.",
                "ruta",
              ),
              salida,
            );
            tarjeta.append(acciones);
            cont.append(tarjeta);
          }
        }

        // ── Los que están en vigor ──
        cont.append(el("h3", "En vigor"));
        if (datos.standards.length === 0) {
          cont.append(
            el(
              "div",
              "Todavía no hay estándares escritos. El agente los propone cuando el trabajo " +
                "le enseña una convención que no está en ninguna parte.",
              "vacio",
            ),
          );
          return;
        }

        for (const archivo of datos.standards) {
          const acordeonEstandar = acordeon(
            archivo.path.split("/").pop() ?? archivo.area,
            archivo.area,
            true,
          );
          acordeonEstandar.cuerpo.append(seccionDeTicket(archivo.content));
          cont.append(acordeonEstandar.caja);
        }

        // ── El historial: lo que ya se decidió ──
        //
        // Cerrado por defecto: no es lo que se viene a hacer acá, y abierto
        // empujaría hacia abajo lo único que pide una acción. Pero está, con su
        // fecha y sus palabras, porque «¿por qué no tenemos esta regla?» y «¿esto
        // quién lo aprobó?» son preguntas que se hacen meses después.
        if (decididas.length > 0) {
          const aceptadas = decididas.filter((p) => p.state === "aceptado").length;
          const historial = document.createElement("details");
          historial.className = "historial-estandares";
          historial.append(
            el(
              "summary",
              `Historial — ${decididas.length} decidido(s): ${aceptadas} en vigor, ` +
                `${decididas.length - aceptadas} descartado(s)`,
            ),
          );
          for (const propuesta of decididas) {
            const tarjeta = el("div", undefined, "tarjeta-estandar historial");
            const cabecera = el("div", undefined, "meta");
            cabecera.append(
              el("span", propuesta.id, "id"),
              el("span", propuesta.area, "etiqueta"),
              el(
                "span",
                propuesta.state,
                propuesta.state === "aceptado" ? "etiqueta aprueba" : "etiqueta",
              ),
              el("span", propuesta.date, "id"),
            );
            tarjeta.append(cabecera);
            tarjeta.append(el("div", propuesta.title, "nombre"));
            tarjeta.append(el("div", `Regla: ${propuesta.rule}`, "resultado"));
            tarjeta.append(
              el(
                "div",
                propuesta.decidedOn
                  ? `Decidido el ${propuesta.decidedOn}` +
                      (propuesta.instruction ? ` — «${propuesta.instruction}»` : "")
                  : "Decidido",
                "ruta",
              ),
            );
            tarjeta.append(el("div", `→ ${propuesta.source.path}`, "ruta"));
            historial.append(tarjeta);
          }
          cont.append(historial);
        }
      }

      // ── Vista: features ───────────────────────────────────────────────────
      //
      // Una feature es lo que no cabe en un ticket: un módulo con varias
      // pantallas, reportes y configuración. La vista responde tres preguntas y
      // en ese orden: ¿en qué punto está?, ¿qué requisitos quedan sin cubrir? y
      // ¿qué tickets la componen?

      /** Los cuatro artefactos con su marca, en el orden en que se escriben. */
      function marcasArtefactos(f) {
        const caja = el("div", undefined, "artefactos");
        const partes = [
          ["spec", f.hasSpec],
          ["diseño", f.hasDesign],
          ["tickets", f.hasDecomposition],
          ["verificar", f.hasVerify],
        ];
        for (const [nombre, hecho] of partes) {
          caja.append(el("span", `${hecho ? "✓" : "·"} ${nombre}`, hecho ? "hecho" : ""));
        }
        return caja;
      }

      async function vistaFeatures() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/features");
        const r = datos.summary;

        const tarjetas = el("div", undefined, "tarjetas");
        // El progreso del conjunto, sumando todas las features: es la primera
        // pregunta de una vista de conjunto y antes había que deducirla.
