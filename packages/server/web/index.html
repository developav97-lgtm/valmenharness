              clave === "id" ? String(valor) : `${clave} ${String(valor)}`,
              clave === "id" ? "id" : `etiqueta ${tono}`.trim(),
            ),
          );
        }
        caja.append(cabecera);

        // El resto del registro, campo por campo.
        for (const [clave, valor] of Object.entries(registro)) {
          if (usados.has(clave) || clave === "kind") continue;
          if (valor === null || valor === undefined || valor === "") continue;

          if (Array.isArray(valor)) {
            if (valor.length === 0) continue;
            // Un arreglo de objetos anidados se resume con su conteo: el detalle
            // completo de un bloque dentro de otro no se lee, se busca.
            caja.append(
              el("div", `${clave}: ${valor.length} elemento(s)`, "tarjeta-dato-nota"),
            );
            continue;
          }
          if (typeof valor === "object") {
            caja.append(el("div", `${clave}: ${JSON.stringify(valor)}`, "tarjeta-dato-nota"));
            continue;
          }
          caja.append(el("div", `${clave}: ${String(valor)}`, "tarjeta-dato-nota"));
        }
        return caja;
      }

      /** Una lista de tarjetas, con su estado vacío dicho. */
      function tarjetasDe(items, construir, vacio) {
        if (items.length === 0) return el("div", vacio, "vacio");
        const caja = el("div", undefined, "tarjetas-datos");
        for (const item of items) caja.append(construir(item));
        return caja;
      }

      // ── Vista: procesos ───────────────────────────────────────────────────
      //
      // Responde a la pregunta que un proceso detenido deja abierta: «¿hay algo
      // que hacer?». Las corridas esperando van primero, y el gate se aprueba
      // desde aquí —que es lo que obligaba a abrir la terminal—.

      /** El responsable de aprobar un gate: se recuerda entre visitas. */
      function responsableDeAprobacion() {
        return responsable;
      }

      async function aprobarGate(gate, boton, salida) {
        const actor = responsableDeAprobacion();
        if (actor.trim() === "") {
          salida.className = "resultado error";
          salida.textContent =
            "Falta el responsable. Escríbelo en el campo de arriba: aprobar sin nombre no es auditable.";
          return;
        }
        boton.disabled = true;
        boton.textContent = "Aprobando…";
        try {
          const r = await api("POST", `/api/processes/gates/${gate}/approve`, { actor });
          salida.className = "resultado ok";
          // Se dice que aprobar no retoma: es la confusión natural, y mejor
          // deshacerla aquí que dejar a alguien esperando a que el proceso siga.
          salida.textContent =
            `${r.details} El proceso **no** continúa solo: retómalo con ` +
            "`valmen process resume` (o desde la terminal) cuando quieras seguir.";
          await vistaProcesos();
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Aprobar";
        }
      }

      async function vistaProcesos() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/processes");
        const r = datos.summary;

        const tarjetas = el("div", undefined, "tarjetas");
        const metricas = [
          ["Procesos", r.processes],
          ["Detenidos", r.waiting],
          ["Gates sin aprobar", r.gatesPending],
          ["Corridas", r.runs],
        ];
        if (r.invalid > 0) metricas.push(["Inválidos", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        // El responsable, para poder aprobar. Mismo campo y misma memoria que en la
        // vista de un ticket: es la misma persona decidiendo.
        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las aprobaciones");
        etiquetaResponsable.htmlFor = "responsable-procesos";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable-procesos";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () =>
          guardarResponsable(entradaResponsable.value),
        );
        barraResponsable.append(
          etiquetaResponsable,
          entradaResponsable,
          el("span", "Queda registrado con cada aprobación.", "resultado"),
        );
        cont.append(barraResponsable);

        if (datos.processes.length === 0) {
          const vacio = el("div", undefined, "vacio");
          vacio.append(
            el("div", "No hay procesos declarados."),
            el(
              "div",
              "Un proceso es un paso a paso encadenable: desplegar, actualizar manuales, publicar.",
              "resultado",
            ),
            el("div", "Viven en .valmen/processes/<id>.yaml", "ruta"),
          );
          cont.append(vacio);
          return;
        }

        // ── Gates: lo que espera una decisión ──
        if (datos.gates.length > 0) {
          cont.append(el("h2", "Gates de proceso"));
          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Gate", "Proceso", "Estado", "Aprobado por", ""]) {
            fila.append(el("th", columna));
          }
          thead.append(fila);

          const tbody = el("tbody");
          for (const gate of datos.gates) {
            const tr = el("tr");

            const celda = el("td");
            celda.append(el("div", gate.gate, "nombre"));
            if (gate.reason) celda.append(el("div", gate.reason, "descripcion"));
            tr.append(celda);

            tr.append(el("td", gate.processId, "id"));

            const celdaEstado = el("td");
            if (gate.approvedBy === null) {
              celdaEstado.append(el("span", "sin aprobar", "etiqueta critico"));
            } else {
              celdaEstado.append(el("span", "aprobado", "etiqueta aprueba"));
            }
            tr.append(celdaEstado);

            tr.append(el("td", gate.approvedBy ?? "—", "descripcion"));

            const celdaAcciones = el("td");
            const salida = el("div", "resultado");
            if (gate.approvedBy === null) {
              const boton = el("button", "Aprobar");
              boton.addEventListener(
                "click",
                () => void aprobarGate(gate.gate, boton, salida),
              );
              celdaAcciones.append(boton, salida);
            }
            tr.append(celdaAcciones);

            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          cont.append(tabla);
        }

        // ── Corridas: las detenidas primero ──
        cont.append(el("h2", "Corridas"));
        if (datos.runs.length === 0) {
          cont.append(el("div", "Ninguna corrida registrada todavía.", "resultado"));
        } else {
          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Corrida", "Proceso", "Estado", "Pasos", "Actualizada"]) {
            fila.append(el("th", columna));
          }
          thead.append(fila);

          const tbody = el("tbody");
          for (const corrida of datos.runs) {
            const tr = el("tr", undefined, corrida.status === "waiting" ? "planeado" : "");

            const celda = el("td");
            celda.append(el("div", corrida.runId, "id"));
            if (corrida.pendingStep !== null) {
              celda.append(el("div", `esperando en ${corrida.pendingStep}`, "descripcion"));
            } else if (corrida.reason !== null) {
              celda.append(el("div", corrida.reason, "descripcion"));
            }
            tr.append(celda);

            tr.append(el("td", corrida.processId, "id"));

            const celdaEstado = el("td");
            const CLASE = {
              waiting: "critico",
              failed: "roto",
              completed: "aprueba",
              abandoned: "",
            };
            celdaEstado.append(
              el("span", corrida.status, `etiqueta ${CLASE[corrida.status] ?? ""}`),
            );
            tr.append(celdaEstado);

            const hechos = corrida.steps.filter((paso) => paso.status === "ok").length;
            tr.append(el("td", `${hechos}/${corrida.steps.length}`, "id"));
            tr.append(el("td", corrida.updatedAt.slice(0, 19).replace("T", " "), "id"));

            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          cont.append(tabla);
        }

        // ── Procesos declarados ──
        cont.append(el("h2", "Procesos"));
        const tabla = el("table");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proceso", "Pasos", "Parámetros", "Gates", "Archivo"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const proceso of datos.processes) {
          const tr = el("tr");

          const celda = el("td");
          celda.append(el("div", proceso.title, "nombre"), el("div", proceso.id, "id"));
          if (proceso.invalid !== null) {
            celda.append(el("div", proceso.invalid, "descripcion"));
          }
          tr.append(celda);

          tr.append(el("td", String(proceso.steps), "id"));
          tr.append(el("td", proceso.params.join(", ") || "—", "descripcion"));
          tr.append(el("td", proceso.gates.join(", ") || "—", "descripcion"));
          tr.append(el("td", proceso.path, "ruta"));

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: configurar por chat ────────────────────────────────────────

      /**
       * El chat de configuración.
       *
       * El modelo propone y el humano dispone: nada se escribe hasta que el
       * usuario pulsa «Aplicar», y un cambio sensible exige además escribir una
       * frase exacta. La frase no es ceremonia: un `confirm: true` es un clic, y
       * un clic no es una decisión deliberada.
       */
      async function vistaConfigurar() {
        const cont = $("contenido");
        cont.textContent = "";

        const conversacion = el("div", undefined, "conversacion");
        const entrada = document.createElement("textarea");
        entrada.placeholder =
          "Describe el cambio: «que los tickets de tipo DOCS no pidan aprobación de plan»…";
        entrada.setAttribute("aria-label", "Qué quieres configurar");

        const enviar = el("button", "Proponer cambios", "principal");
        const salida = el("div", undefined, "resultado");
        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "10px";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "El modelo propone; tú dispones. "),
          el(
            "span",
            "Nada se escribe hasta que lo apruebas. El diff lo calcula el código comparando textos, la validez la decide el parser real, y los cambios que amplían la autoridad automática del sistema piden una confirmación escrita aparte.",
          ),
        );
        cont.append(nota, el("h2", "Configurar por chat"), conversacion);

        // Tres ejemplos reales: un chat vacío no dice qué se puede pedir.
        const ejemplos = el("div", undefined, "ejemplos");
        for (const ejemplo of [
          "Declara el gate de plan para este proyecto.",
          "Pasa el routing a económico, pero deja el arquitecto en un modelo fuerte.",
          "Añade un comentario al principio de la configuración explicando qué es esto.",
        ]) {
          const boton = el("button", ejemplo);
          boton.addEventListener("click", () => {
            entrada.value = ejemplo;
            entrada.focus();
          });
          ejemplos.append(boton);
        }

        acciones.append(salida, enviar);
        cont.append(entrada, acciones, ejemplos);

        const burbuja = (quien, texto, clase) => {
          const turno = el("div", undefined, `turno ${clase}`);
          turno.append(el("div", quien, "quien"), el("div", texto, "texto"));
          conversacion.append(turno);
          return turno;
        };

        /** Aplica los cambios aprobados y recarga la vista. */
        const aplicar = async (cambios, boton) => {
          boton.disabled = true;
          try {
            const r = await api("POST", "/api/chat/config/apply", { changes: cambios });
            if (r.ok) {
              await navegar();
              return;
            }
            salida.className = "resultado error";
            salida.textContent = r.error || "No se aplicó nada.";
            boton.disabled = false;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            boton.disabled = false;
          }
        };

        enviar.addEventListener("click", async () => {
          const mensaje = entrada.value.trim();
          if (mensaje === "") {
            salida.className = "resultado error";
            salida.textContent = "Escribe qué quieres cambiar.";
            return;
          }

          burbuja("Tú", mensaje, "tuyo");
          entrada.value = "";
          enviar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "pensando…";

          try {
            const propuesta = await api("POST", "/api/chat/config", { message: mensaje });
            salida.textContent = "";

            if (!propuesta.ok) {
              burbuja("Configurador", propuesta.error, "");
              return;
            }

            const turno = burbuja(
              "Configurador",
              `${propuesta.summary}\n\n${propuesta.changes.length === 0 ? "No hace falta cambiar ningún archivo." : `${propuesta.changes.length} archivo(s) cambiarían.`} · ${propuesta.model} · $${(propuesta.usage?.costUsd ?? 0).toFixed(6)} · ${propuesta.latencyMs} ms`,
              "",
            );

            const pendientes = [];
            for (const cambio of propuesta.changes) {
              const caja = el(
                "div",
                undefined,
                `propuesta ${cambio.ok ? "" : "invalida"} ${cambio.sensitive ? "sensible" : ""}`,
              );
              caja.append(el("h4", cambio.label), el("div", cambio.reason, "motivo"));

              if (!cambio.ok) {
                caja.append(el("div", cambio.error, "error-parser"));
              } else if (cambio.unchanged) {
                caja.append(el("div", "Sin cambios respecto de lo guardado.", "resultado"));
              } else {
                const diff = el("div", undefined, "diff");
                for (const linea of cambio.diff) {
                  diff.append(
                    el(
                      "div",
                      `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                      linea.kind,
                    ),
                  );
                }
                caja.append(diff);
              }

              const filaAcciones = el("div", undefined, "acciones");
              filaAcciones.style.justifyContent = "flex-start";
              filaAcciones.style.marginTop = "10px";

              const entradaConfirmacion = document.createElement("input");
              if (cambio.sensitive && cambio.ok && !cambio.unchanged) {
                const aviso = el("div", undefined, "confirmacion");
                aviso.append(
                  el(
                    "div",
                    `⚠ Requiere confirmación: ${cambio.sensitiveReason}`,
                    "resultado error",
                  ),
                  el("div", undefined, "resultado"),
                );
                aviso.lastChild.append(
                  el("span", "Escribe "),
                  el("code", cambio.confirmation),
                  el("span", " para confirmarlo."),
                );
                entradaConfirmacion.type = "text";
                entradaConfirmacion.placeholder = "Frase de confirmación";
                aviso.append(entradaConfirmacion);
                caja.append(aviso);
              }

              const aplicarEste = el(
                "button",
                cambio.sensitive ? "Confirmar y aplicar" : "Aplicar",
                "principal",
              );
              aplicarEste.disabled = !cambio.ok || cambio.unchanged;
              aplicarEste.addEventListener("click", () => {
                const peticion = { file: cambio.file, text: cambio.text };
                if (cambio.sensitive) peticion.confirm = entradaConfirmacion.value.trim();
                void aplicar([peticion], aplicarEste);
              });
              filaAcciones.append(aplicarEste);
              caja.append(filaAcciones);

              if (cambio.ok && !cambio.unchanged) {
                pendientes.push({
                  file: cambio.file,
                  text: cambio.text,
                  ...(cambio.sensitive ? { confirm: cambio.confirmation } : {}),
                });
              }
              turno.append(caja);
            }

            // Aplicar todo respeta las confirmaciones: las sensibles solo entran
            // si el usuario escribió su frase, y el servidor lo vuelve a exigir.
            if (pendientes.length > 1) {
              const todo = el("button", "Aplicar todo");
              todo.style.marginTop = "10px";
              todo.addEventListener("click", () => {
                const confirmadas = [];
                for (const pendiente of pendientes) {
                  if (pendiente.confirm === undefined) {
                    confirmadas.push({ file: pendiente.file, text: pendiente.text });
                    continue;
                  }
                  const caja = [...turno.querySelectorAll(".propuesta")].find(
                    (nodo) =>
                      nodo.querySelector("h4")?.textContent ===
                      (pendiente.file === "config"
                        ? ".valmen/config.yaml"
                        : ".valmen/routing.yaml"),
                  );
                  const escrita = caja?.querySelector("input")?.value.trim();
                  if (escrita === pendiente.confirm) {
                    confirmadas.push({
                      file: pendiente.file,
                      text: pendiente.text,
                      confirm: escrita,
                    });
                  }
                }
                void aplicar(confirmadas, todo);
              });
              turno.append(todo);
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            enviar.disabled = false;
          }
        });

        entrada.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) void enviar.click();
        });
      }

      // ── El catálogo de modelos por proveedor ─────────────────────────────
      //
      // Se pide una vez por sesión y se recuerda: los proveedores configurados no
      // cambian mientras se navega, y volver a pedir cientos de modelos cada vez
      // que se abre la vista haría que el selector tardara en aparecer.
      //
      // Se piden **todos los configurados**, no solo el elegido, para que el
      // desplegable de proveedor no tenga que ir a la red al cambiar: el coste es
      // el mismo y el cambio es instantáneo.
      let cacheModelos = null;

      async function catalogoDeModelos() {
        if (cacheModelos !== null) return cacheModelos;

        const { providers } = await api("GET", "/api/providers");
        // Solo los que se pueden usar. Un proveedor sin credencial en la lista es
        // una fila que no lleva a ninguna parte.
        const usables = providers.filter((p) => p.configured);

        const entradas = await Promise.all(
          usables.map(async (p) => {
            if (!p.listable) {
              // No publica su lista: se elige escribiendo el identificador, y eso
              // se dice en vez de ofrecer un desplegable vacío.
              return [p.id, { provider: p, models: null, error: null }];
            }
            try {
              const r = await api("GET", `/api/providers/${p.id}/models`);
              return [p.id, { provider: p, models: r.models, error: null }];
            } catch (fallo) {
              return [p.id, { provider: p, models: null, error: fallo.message }];
            }
          }),
        );

        cacheModelos = new Map(entradas);
        return cacheModelos;
      }

      /**
       * El selector de modelo: proveedor a la izquierda, modelo a la derecha.
       *
       * Devuelve el nodo y avisa por `alElegir`. El modelo se puede **escribir**
       * además de elegir: la lista de un proveedor tiene cientos de entradas, y un
       * `select` obliga a recorrerlas. Un identificador que no esté en la lista se
       * acepta igual —el catálogo de un proveedor no siempre incluye lo que su
       * endpoint acepta— y eso es del usuario.
       */
      function selectorDeModelo({ provider, model, onProvider, onModel, catalog }) {
        const caja = el("div", undefined, "par-modelo");

        const selProveedor = document.createElement("select");
        for (const [id, entrada] of catalog) {
          const punto = entrada.models === null ? " ·" : "";
          selProveedor.append(new Option(`${entrada.provider.name}${punto}`, id));
        }
        // El proveedor guardado puede no estar entre los configurados —una clave
        // retirada, un routing escrito a mano—. Se añade para que el valor actual
        // siga siendo visible en vez de cambiar solo al abrir la pantalla.
        if (provider !== "" && !catalog.has(provider)) {
          selProveedor.append(new Option(`${provider} (sin credencial)`, provider));
        }
        selProveedor.value = provider;

        const cajaModelo = el("div", undefined, "caja-modelo");
        const entradaModelo = document.createElement("input");
        entradaModelo.type = "text";
        entradaModelo.value = model;
        entradaModelo.placeholder = "identificador del modelo";
        entradaModelo.spellcheck = false;
        entryAutoComplete(entradaModelo, cajaModelo, () => catalog.get(selProveedor.value));
        cajaModelo.append(entradaModelo);

        // Probar el modelo antes de guardarlo. Un identificador mal escrito pasa
        // la configuración, se guarda, y falla en mitad de un gate con un error
        // del proveedor que no dice qué se escribió mal; esto lo dice antes.
        //
        // El botón no se ofrece donde no puede funcionar: `codex` no tiene
        // endpoint de chat —funciona por su CLI y su token no sirve contra la API
        // de OpenAI—, así que un botón ahí sería un botón que siempre falla.
        const entradaProveedor = catalog.get(provider);
        const sePuedeProbar = entradaProveedor?.provider.testable === true;
        const probar = el("button", "Probar");
        probar.title =
          "Pide una respuesta mínima al proveedor. Cuesta una fracción de céntimo.";
        const resultadoPrueba = el("span", "", "resultado");
        probar.addEventListener("click", async () => {
          const modelo = entradaModelo.value.trim();
          if (modelo === "") {
            resultadoPrueba.className = "resultado error";
            resultadoPrueba.textContent = "Escribe el modelo primero.";
            return;
          }
          probar.disabled = true;
          probar.textContent = "Probando…";
          resultadoPrueba.className = "resultado";
          resultadoPrueba.textContent = "";
          try {
            const r = await api(
              "POST",
              `/api/providers/${selProveedor.value}/models/test`,
              { model: modelo },
            );
            resultadoPrueba.className = r.ok ? "resultado ok" : "resultado error";
            resultadoPrueba.textContent = `${r.detail} · ${r.latencyMs} ms`;
          } catch (fallo) {
            resultadoPrueba.className = "resultado error";
            resultadoPrueba.textContent = fallo.message;
          } finally {
            probar.disabled = false;
            probar.textContent = "Probar";
          }
        });

        selProveedor.addEventListener("change", () => {
          // Al cambiar de proveedor, el modelo anterior casi nunca existe en el
          // nuevo. Se deja vacío en vez de arrastrar un identificador que el
          // proveedor va a rechazar.
          entradaModelo.value = "";
          onProvider(selProveedor.value);
          onModel("");
        });

        entradaModelo.addEventListener("input", () => onModel(entradaModelo.value));

        caja.append(selProveedor, cajaModelo);

        // El botón y su resultado, en su propia fila: el resultado de una prueba
        // puede ser largo —el mensaje del proveedor— y comprimirlo junto al
        // campo deja el identificador ilegible.
        const pie = el("div", undefined, "pie-modelo");
        if (sePuedeProbar) {
          pie.append(probar, resultadoPrueba);
        } else {
          // Y se dice por qué, en vez de dejar la duda de si falta algo.
          resultadoPrueba.textContent =
            "Sin prueba automática: este proveedor no expone un endpoint de chat. Comprueba el modelo usándolo.";
        }
        const contenedor = el("div", undefined, "selector-modelo");
        contenedor.append(caja, pie);
        return contenedor;
      }

      /**
       * El desplegable de sugerencias de un campo de texto.
       *
       * Se despliega al enfocar y filtra al escribir, por identificador y por
       * nombre. Se cierra al elegir, al salir del campo y con Escape; y **no** se
       * cierra al hacer clic dentro, que es el fallo clásico de un desplegable
       * hecho a mano.
       */
      function entryAutoComplete(entrada, contenedor, obtener) {
        const lista = el("div", undefined, "lista-modelos");
        lista.hidden = true;
        contenedor.append(lista);

        const pintar = () => {
          const entrada_ = obtener();
          lista.textContent = "";

          if (entrada_ === undefined) return;
          if (entrada_.models === null) {
            lista.append(
              el(
                "div",
                entrada_.error ??
                  `${entrada_.provider.name} no publica su lista: escribe el identificador.`,
                "vacio",
              ),
            );
            lista.hidden = false;
            return;
          }

          const consulta = entrada.value.trim().toLowerCase();
          const coincidencias = entrada_.models
            .filter(
              (m) =>
                consulta === "" ||
                m.id.toLowerCase().includes(consulta) ||
                m.name.toLowerCase().includes(consulta),
            )
            .slice(0, 60);

          if (coincidencias.length === 0) {
            lista.append(el("div", "Sin coincidencias en este proveedor.", "vacio"));
          } else {
            for (const m of coincidencias) {
              const fila = el("div");
              fila.append(
                el("span", m.id),
                el(
                  "span",
                  m.promptUsd === null
                    ? `  ${m.name}`
                    : `  ${m.name} · $${(m.promptUsd * 1_000_000).toFixed(2)}/M`,
                  "nombre",
                ),
              );
              // `mousedown` y no `click`: el `blur` del campo dispara antes que
              // el `click`, y el desplegable se cerraría sin elegir nada.
              fila.addEventListener("mousedown", (evento) => {
                evento.preventDefault();
                entrada.value = m.id;
                lista.hidden = true;
                entrada.dispatchEvent(new Event("input"));
              });
              lista.append(fila);
            }
          }
          lista.hidden = false;
        };

        entrada.addEventListener("focus", pintar);
        entrada.addEventListener("input", pintar);
        entrada.addEventListener("blur", () => {
          // Con retardo, para que el `mousedown` de una sugerencia alcance a
          // correr antes de que la lista desaparezca.
          setTimeout(() => {
            lista.hidden = true;
          }, 120);
        });
        entrada.addEventListener("keydown", (evento) => {
          if (evento.key === "Escape") lista.hidden = true;
        });
      }

      // ── Vista: modelos (routing por rol) ──────────────────────────────────

      /**
       * Qué modelo usa cada rol, y de dónde salió.
       *
       * La columna "origen" es la que hace útil la pantalla: sin ella, cambiar
       * el preset y no ver efecto es indistinguible de un override olvidado en
       * `.valmen/routing.yaml`. Y los roles que el harness todavía no ejecuta se
       * marcan como declarados: prometer que un modelo se usa para algo que no
       * existe sería una mentira cómoda.
       */
      async function vistaModelos() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/routing");
        const guardado = datos.routing;

        // El modelo de cada rol tal como está ahora: se compara con lo que el
        // usuario elija para saber si hay algo que guardar.
        const eleccion = {};
        for (const rol of guardado.roles) {
          eleccion[rol.role] = {
            provider: rol.provider,
            model: rol.model,
            effort: rol.effort,
            source: rol.source,
          };
        }

        // Los proveedores con su lista de modelos. Se pide aquí y no al cambiar de
        // proveedor para que el desplegable de la izquierda sea instantáneo.
        const catalogo = await catalogoDeModelos();
        let preset = guardado.preset === "" ? "balanced" : guardado.preset;
        let textoPrevio = guardado.text;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Aquí solo se configuran los modelos que el harness ejecuta. "),
          el(
            "span",
            "Son cuatro: el evaluador que responde las proposiciones del gate, el juez " +
              "al que se cae cuando el evaluador no puede decidir, el que propone " +
              "cambios de configuración en el chat, y el arquitecto que descompone una " +
              "feature en tickets. El modelo con el que trabaja el agente —explorar, " +
              "escribir, editar— lo elige opencode con su propia configuración: el " +
              "harness no es un runtime de agentes y no puede imponerle el suyo.",
          ),
        );
        cont.append(nota, el("h2", "Preset"));

        const presets = el("div", undefined, "presets");
        const explicacion = el("div", undefined, "resultado");
        const botonesPreset = new Map();
        for (const p of guardado.presets) {
          const boton = el("button", p.id);
          boton.addEventListener("click", () => {
            preset = p.id;
            // Elegir un preset no reescribe lo que el proyecto ya decidió: los
            // overrides se quedan, y la columna de origen lo dirá.
            for (const boton of botonesPreset.values())
              boton.setAttribute("aria-pressed", "false");
            boton.setAttribute("aria-pressed", "true");
            explicacion.textContent = p.description;
            void refrescar();
          });
          botonesPreset.set(p.id, boton);
          presets.append(boton);
        }
        for (const [id, boton] of botonesPreset) {
          boton.setAttribute("aria-pressed", String(id === preset));
          if (id === preset) {
            explicacion.textContent =
              guardado.presets.find((p) => p.id === id)?.description ?? "";
          }
        }
        cont.append(presets, explicacion);

        // De dónde sale cada lista. Se dice porque un desplegable corto sin
        // explicación parece un fallo, y lo que pasa es que ese proveedor no
        // publica sus modelos o no respondió.
        const sinLista = [...catalogo.values()].filter((e) => e.models === null);
        const conError = sinLista.filter((e) => e.error !== null);
        const origenCatalogo = el(
          "div",
          `${catalogo.size} proveedor(es) configurado(s). ` +
            (sinLista.length === 0
              ? "Todos publican su lista de modelos."
              : `Sin lista: ${sinLista.map((e) => e.provider.name).join(", ")}. En esos, el modelo se escribe.`) +
            (conError.length === 0
              ? ""
              : ` No respondieron: ${conError.map((e) => `${e.provider.name} (${e.error})`).join("; ")}.`),
          "resultado",
        );
        cont.append(origenCatalogo);

        cont.append(el("h2", "Modelo por rol"));

        const tabla = el("table", undefined, "roles");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Rol", "Modelo", "Esfuerzo", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        /**
         * El selector de un rol: proveedor y modelo.
         *
         * Antes era una sola lista con el catálogo de OpenRouter, así que elegir
         * un modelo de otro proveedor era imposible desde la pantalla: había que
         * editar el YAML. Y el proveedor viaja con el modelo porque los dos son la
         * decisión —el mismo identificador puede existir en dos y no ser el
         * mismo modelo—.
         */
        const modeloSelect = (rol) =>
          selectorDeModelo({
            provider: eleccion[rol.role].provider,
            model: eleccion[rol.role].model,
            catalog: catalogo,
            onProvider: (id) => {
              eleccion[rol.role].provider = id;
              explicitos.add(rol.role);
              void refrescar();
            },
            onModel: (id) => {
              eleccion[rol.role].model = id;
              explicitos.add(rol.role);
              void refrescar();
            },
          });

        const esfuerzoSelect = (rol) => {
          const sel = document.createElement("select");
          for (const valor of ["auto", "low", "medium", "high"]) {
            sel.append(new Option(valor, valor));
          }
          sel.value = eleccion[rol.role].effort;
          sel.addEventListener("change", () => {
            eleccion[rol.role].effort = sel.value;
            explicitos.add(rol.role);
            void refrescar();
          });
          return sel;
        };

        for (const rol of guardado.roles) {
          const tr = el("tr");

          const celdaRol = el("td");
          celdaRol.append(
            el("div", rol.role, "rol"),
            el("div", rol.description, "descripcion"),
          );
          if (rol.consumer === null) {
            celdaRol.append(
              el("div", "declarado: todavía no lo ejecuta nada", "sin-consumidor"),
            );
          }
          tr.append(celdaRol);

          const celdaModelo = el("td");
          celdaModelo.append(modeloSelect(rol));
          tr.append(celdaModelo);

          const celdaEsfuerzo = el("td");
          celdaEsfuerzo.append(esfuerzoSelect(rol));
          tr.append(celdaEsfuerzo);

          const ORIGEN = {
            proyecto: "definido en este proyecto",
            preset: `del preset ${preset}`,
            sistema: "valor del sistema",
            "sin-asignar": "sin asignar",
          };
          const celdaOrigen = el("td");
          celdaOrigen.append(el("span", ORIGEN[rol.source] ?? rol.source, "resultado"));
          if (rol.consumer !== null) {
            celdaOrigen.append(el("div", rol.consumer, "sin-consumidor"));
          }
          tr.append(celdaOrigen);

          tr.append(el("td"));
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);

        // El aviso que evita perder la reproducibilidad sin enterarse.
        const avisoJev = el("div", undefined, "aviso-jev");
        cont.append(avisoJev);

        cont.append(el("h2", "Diferencias antes de guardar"));
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;
        const salida = el("div", "resultado");
        // La barra va **fija** al pie de la vista: el botón estaba al final de la
        // tabla y no se encontraba. Dice cuántos cambios hay pendientes, que es lo
        // que hacía falta saber sin bajar.
        const cuenta = el("div", "", "cuenta");
        const guardar = el("button", "Guardar el routing", "principal");
        guardar.disabled = true;
        const acciones = el("div", undefined, "barra-guardado");
        acciones.append(cuenta, salida, guardar);
        cont.append(diff, error, acciones);

        /**
         * Los roles que se escriben en el archivo.
         *
         * Solo los explícitos: los que ya estaban definidos en el proyecto y los
         * que el usuario acaba de tocar. Escribir los trece haría creer que el
         * proyecto decidió sobre los trece, y cambiar el preset dejaría de tener
         * efecto sin que nadie entendiera por qué.
         */
        const explicitos = new Set(
          guardado.roles.filter((rol) => rol.source === "proyecto").map((rol) => rol.role),
        );
        const rolesDelFormulario = () => {
          const roles = {};
          for (const rol of guardado.roles) {
            if (!explicitos.has(rol.role)) continue;
            roles[rol.role] = {
              provider: eleccion[rol.role].provider,
              model: eleccion[rol.role].model,
              effort: eleccion[rol.role].effort,
            };
          }
          return roles;
        };

        const refrescar = async () => {
          try {
            const previsualizacion = await api("POST", "/api/routing/preview", {
              preset,
              roles: rolesDelFormulario(),
            });
            const estado = previsualizacion.routing;

            error.hidden = estado.ok;
            error.textContent = estado.ok ? "" : estado.error;

            diff.textContent = "";
            const cambios = estado.diff.filter((linea) => linea.kind !== "same");
            if (cambios.length === 0) {
              diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
            } else {
              for (const linea of estado.diff) {
                diff.append(
                  el(
                    "div",
                    `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                    linea.kind,
                  ),
                );
              }
            }

            const evaluador = estado.roles.find((r) => r.role === "gate-evaluator");
            // El aviso lleva números medidos, no adjetivos: en el mismo gate de
            // 14 proposiciones, Jev tarda 0,8 s y cuesta $0,000158; un modelo de
            // chat con razonamiento por defecto **no termina** en 90 s.
            avisoJev.textContent =
              evaluador !== undefined && evaluador.probabilistic
                ? "El evaluador de gates usa Jev: emite probabilidades calibradas y el código compara contra umbrales. Medido en un gate de 14 proposiciones: 0,8 s y $0,000158."
                : "⚠ El evaluador de gates está configurado con un modelo de chat. El gate sigue funcionando, pero pasa a ser un juez que interpreta texto: pierde la calibración y dos ejecuciones del mismo ticket pueden no coincidir. Medido: 36 s y $0,00073 con esfuerzo bajo, y más de 90 s —el límite— con el razonamiento por defecto. Si eliges esta vía, pon el esfuerzo en «low».";

            guardar.disabled = !estado.ok || cambios.length === 0;
            guardar.textContent =
              cambios.length === 0 ? "Sin cambios" : "Guardar el routing";
            // La cuenta de la barra fija: es lo que dice si hay algo pendiente sin
            // tener que bajar hasta el botón.
            cuenta.className = cambios.length === 0 ? "cuenta" : "cuenta pendiente";
            cuenta.textContent =
              cambios.length === 0
                ? "Todo guardado."
                : `${cambios.length} cambio(s) sin guardar.`;
            textoPrevio = previsualizacion.text;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          try {
            const r = await api("PUT", "/api/routing", { text: textoPrevio });
            if (r.routing.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
              guardado.text = r.text;
              // Se recarga la vista: los orígenes cambian de "preset" a
              // "proyecto", y esa es justamente la información que importa.
              await vistaModelos();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.routing.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        });

        await refrescar();
      }

      // ── Vista: configuración ──────────────────────────────────────────────

      /**
       * El editor de `.valmen/config.yaml`.
       *
       * El texto es la fuente y se edita en crudo, así que los comentarios
       * sobreviven. Antes de guardar se muestra qué entendió el harness y qué
       * archivos generados quedan desactualizados: sin eso, el usuario tendría
       * que saber que `AGENTS.md` se genera, que es justo el conocimiento que la
       * app debe evitar exigir.
       */
      async function vistaConfiguracion() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/config");
        const estadoInicial = datos.config;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Se guarda solo si el harness puede leerlo. "),
          el(
            "span",
            "El formato admite un subconjunto de YAML: escalares, listas de bloque y mapas por indentación. Si algo no encaja, se dice aquí y el archivo no se toca.",
          ),
        );
        cont.append(nota, el("h2", "Configuración del proyecto"));
        cont.append(el("div", estadoInicial.path, "ruta"));

        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.spellcheck = false;
        editor.value = estadoInicial.text;
        editor.setAttribute("aria-label", "Contenido de .valmen/config.yaml");

        // El panel de interpretación: lo que el harness entendió del texto.
        const interpretacion = el("div", undefined, "interpretacion");
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;

        const guardar = el("button", "Guardar los cambios", "principal");
        guardar.disabled = true;
        const regenerar = el("button", "Regenerar");
        regenerar.hidden = true;
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        let ultimo = null;

        const campo = (rotulo, valor) => {
          const caja = el("div", undefined, "campo");
          caja.append(el("div", rotulo, "rotulo"), el("div", valor, "valor"));
          return caja;
        };

        const pintar = (respuesta) => {
          const { config, impact } = respuesta;

          error.hidden = config.ok;
          error.textContent = config.ok ? "" : config.error;
          editor.classList.toggle("mal", !config.ok);

          interpretacion.textContent = "";
          if (config.summary !== null) {
            const s = config.summary;
            interpretacion.append(
              campo("nombre", s.name),
              campo(
                "registro de tickets",
                s.ticketsDir === "" ? "(por defecto)" : s.ticketsDir,
              ),
              campo(
                "gates declarados",
                s.gates.length === 0 ? "ninguno" : s.gates.join(", "),
              ),
              campo("claves", s.keys.join(", ")),
            );
            if (!s.adopted) {
              interpretacion.append(campo("adopción", "el archivo todavía no existe"));
            }
          }

          diff.textContent = "";
          const cambios = config.diff.filter((linea) => linea.kind !== "same");
          if (cambios.length === 0) {
            diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
          } else {
            for (const linea of config.diff) {
              diff.append(
                el(
                  "div",
                  `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                  linea.kind,
                ),
              );
            }
          }

          // El aviso que evita la trampa de editar el archivo generado: se dice
          // aquí, antes de guardar, y no en un documento aparte.
          if (config.ok && impact !== null && impact.stale > 0) {
            const aviso = el("div", undefined, "same");
            aviso.append(
              el(
                "div",
                impact.stale === 1
                  ? `Quedará 1 archivo generado desactualizado: ${impact.files
                      .filter((f) => f.stale)
                      .map((f) => f.path)
                      .join(", ")}.`
                  : `Quedarán ${impact.stale} archivos generados desactualizados: ${impact.files
                      .filter((f) => f.stale)
                      .map((f) => f.path)
                      .join(", ")}.`,
              ),
              el(
                "div",
                impact.files.every((f) => f.path === "AGENTS.md")
                  ? "Es un archivo generado: editarlo a mano se pierde en la siguiente sincronización."
                  : "Son archivos generados: editarlos a mano se pierde en la siguiente sincronización.",
              ),
            );
            diff.append(aviso);
            regenerar.hidden = false;
            regenerar.textContent =
              impact.stale === 1
                ? "Regenerar 1 archivo"
                : `Regenerar ${impact.stale} archivos`;
          } else {
            regenerar.hidden = true;
          }

          ultimo = config;
          guardar.disabled = !config.ok || cambios.length === 0;
          guardar.textContent =
            cambios.length === 0 ? "Sin cambios" : "Guardar los cambios";
        };

        let temporizador;
        const analizar = () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(async () => {
            try {
              pintar(await api("POST", "/api/config/check", { text: editor.value }));
            } catch (fallo) {
              salida.className = "resultado error";
              salida.textContent = fallo.message;
            }
          }, 250);
        };
        editor.addEventListener("input", analizar);

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "guardando…";
          try {
            const r = await api("PUT", "/api/config", { text: editor.value });
            pintar(r);
            if (r.config.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
            } else {
              salida.className = "resultado error";
              salida.textContent = "No se guardó: el texto no es válido.";
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            // La petición falló, así que el botón vuelve a estar disponible
            // según lo que se sepa del texto; no se deja deshabilitado.
            guardar.disabled = ultimo?.ok !== true;
          }
        });

        // Regenerar existe para que nadie tenga que saber que `AGENTS.md` es un
        // archivo derivado. Se hace con la misma proyección que `valmen sync`.
        regenerar.addEventListener("click", async () => {
          regenerar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "regenerando…";
          try {
            const r = await api("POST", "/api/config/sync");
            // Se repinta con el estado que devuelve el servidor: el aviso de
            // archivos pendientes desaparece porque ya no queda ninguno.
            pintar(await api("GET", "/api/config"));
            if (r.ok) {
              salida.className = "resultado ok";
              salida.textContent =
                r.written.length === 0
                  ? "Ya estaba al día."
                  : `Regenerados: ${r.written.join(", ")}.`;
            } else {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            regenerar.disabled = false;
          }
        });

        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "14px";
        acciones.append(salida, regenerar, guardar);

        cont.append(editor, error, el("h2", "Lo que el harness entiende"), interpretacion);
        cont.append(el("h2", "Diferencias antes de guardar"), diff, acciones);
        pintar(datos);
      }

      // ── Vista: proveedores ────────────────────────────────────────────────

      let proveedores = [];
      let proveedorActual = null;

      const origen = (p) =>
        p.source === "environment"
          ? "variable de entorno"
          : p.source === "credentials-file"
            ? "archivo de credenciales"
            : p.source === "cli"
              ? "token del CLI"
              : p.source === "none" && p.configured
                ? "no requiere"
                : "—";

      async function vistaProveedores() {
        const cont = $("contenido");
        cont.textContent = "";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Las claves se prueban antes de guardarse. "),
          el(
            "span",
            "Si la conexión falla no se escribe nada, así que una clave mal pegada falla aquí y no en la mitad de un gate. Después de guardarla no se vuelve a mostrar: solo se puede reemplazar.",
          ),
        );
        cont.append(nota, el("h2", "Proveedores"));

        const datos = await api("GET", "/api/providers");
        proveedores = datos.providers;

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Proveedor", "Autenticación", "Estado", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const p of proveedores) {
          const tr = el("tr");

          const celdaNombre = el("td");
          const punto = el("span", undefined, `punto ${p.configured ? "ok" : "no"}`);
          celdaNombre.append(punto, el("span", p.name, "nombre"), el("div", p.id, "id"));
          tr.append(celdaNombre);

          tr.append(
            el(
              "td",
              p.auth === "api-key"
                ? "API key"
                : p.auth === "subscription"
                  ? "suscripción"
                  : "ninguna",
            ),
          );

          const celdaEstado = el("td");
          // «Configurada» y «detectada» no son lo mismo, y confundirlas hace que
          // alguien crea que hizo algo que no hizo: Codex aparece en verde
          // porque su CLI ya tenía sesión, no porque nadie lo configurara aquí.
          const estado = !p.configured
            ? "sin configurar"
            : p.source === "none"
              ? "local"
              : p.source === "cli"
                ? "detectada en el CLI"
                : `configurada${p.keyLength === null ? "" : ` · ${p.keyLength} caracteres`}`;
          celdaEstado.append(el("div", estado));
          if (p.legacyFieldName) {
            celdaEstado.append(
              el(
                "div",
                "campo con el nombre anterior; se normaliza al reescribir",
                "resultado",
              ),
            );
          }
          const salida = el("div", undefined, "resultado");
          salida.dataset.id = p.id;
          celdaEstado.append(salida);
          tr.append(celdaEstado);

          const celdaOrigen = el("td");
          celdaOrigen.append(el("div", origen(p), "resultado"));
          if (p.probeable && p.probeHost) {
            celdaOrigen.append(el("div", `se prueba contra ${p.probeHost}`, "resultado"));
          }
          tr.append(celdaOrigen);

          const celdaAcciones = el("td");
          const acciones = el("div", undefined, "acciones");

          // Un proveedor de suscripción no tiene endpoint: su credencial es el
          // token que ya vive en el CLI. Un botón que siempre falla parece un
          // error del usuario, así que en su lugar se dice qué usa.
          if (p.probeable) {
            const probar = el("button", "Probar");
            probar.title = `Se prueba contra ${p.probeHost}`;
            probar.addEventListener("click", () => void probarConexion(p, salida, probar));
            acciones.append(probar);
          } else if (p.tokenSource) {
            salida.className = "resultado";
            salida.textContent = p.configured
              ? `Detectada en ${p.tokenSource}. No hay endpoint que probar.`
              : `No se encontró ${p.tokenSource}. Inicia sesión con el CLI de ${p.name} y vuelve a recargar.`;
          }

          if (p.auth === "api-key") {
            const configurar = el(
              "button",
              p.configured ? "Reemplazar" : "Configurar",
              p.configured ? "" : "principal",
            );
            configurar.addEventListener("click", () => abrirDialogo(p));
            acciones.append(configurar);
          }
          if (p.configured && p.auth === "api-key" && p.source === "credentials-file") {
            const borrar = el("button", "Borrar", "peligro");
            borrar.addEventListener("click", () => void borrarClave(p, borrar));
            acciones.append(borrar);
          }

          celdaAcciones.append(acciones);
          tr.append(celdaAcciones);
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      async function probarConexion(p, salida, boton) {
        boton.disabled = true;
        salida.className = "resultado";
        salida.textContent = "probando…";
        try {
          const r = await api("POST", `/api/providers/${p.id}/probe`);
          salida.className = `resultado ${r.ok ? "ok" : "error"}`;
          salida.textContent = `${r.detail} · ${r.latencyMs} ms`;
        } catch (error) {
          salida.className = "resultado error";
          salida.textContent = error.message;
        } finally {
          boton.disabled = false;
        }
      }

      function abrirDialogo(p) {
        proveedorActual = p;
        $("titulo").textContent = `Configurar ${p.name}`;
        $("ayuda").textContent =
          "La clave se prueba contra el endpoint del proveedor antes de guardarse.";
        $("clave").value = "";
        $("aviso").textContent =
          p.source === "environment"
            ? `Ahora mismo se usa la variable de entorno ${p.envVar}, que tiene prioridad sobre el archivo.`
            : "";
        $("dialogo").showModal();
        $("clave").focus();
      }

      async function guardar() {
        const clave = $("clave").value.trim();
        if (clave === "") {
          $("aviso").textContent = "Escribe la clave antes de guardar.";
          return;
        }
        const boton = $("guardar");
        boton.disabled = true;
        boton.textContent = "Probando…";
        try {
          const r = await api("PUT", `/api/providers/${proveedorActual.id}/credential`, {
            apiKey: clave,
          });
          const id = proveedorActual.id;
          // La lista de proveedores usables acaba de cambiar, así que el catálogo
          // de modelos cacheado ya no vale: un proveedor recién configurado tiene
          // que aparecer en el selector sin recargar la página.
          cacheModelos = null;
          $("dialogo").close();
          await vistaProveedores();
          const salida = document.querySelector(`.resultado[data-id="${id}"]`);
          if (salida) {
            salida.className = "resultado ok";
            salida.textContent = `${r.probe.detail} · ${r.probe.latencyMs} ms`;
          }
        } catch (error) {
          $("aviso").textContent = error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Probar y guardar";
        }
      }

      async function borrarClave(p, boton) {
        if (
          !confirm(
            `¿Borrar la clave de ${p.name}? Dejará de estar disponible para los gates.`,
          )
        )
          return;
        boton.disabled = true;
        try {
          await api("DELETE", `/api/providers/${p.id}/credential`);
          cacheModelos = null;
          await vistaProveedores();
        } catch (error) {
          alert(error.message);
          boton.disabled = false;
        }
      }

      // ── Estado en vivo ────────────────────────────────────────────────────

      /**
       * El servidor avisa cuando algo cambia en disco, y la vista se rehace.
       *
       * Dos cosas que **no** se hacen, y son deliberadas:
       *
       * 1. No se refresca mientras hay un diálogo abierto o alguien está
       *    escribiendo. Perder lo que se está a medio escribir es peor que ver
       *    un dato un segundo viejo.
       * 2. No se refresca mientras hay una petición en vuelo lanzada por el
       *    usuario: mover el estado y repintar a la vez daría una pantalla que
       *    parpadea justo cuando se acaba de pulsar un botón.
       */
      let refrescoPendiente = null;
      let ocupado = false;

      function puedeRefrescar() {
        if (ocupado) return false;
        if (document.querySelector("dialog[open]") !== null) return false;
        const foco = document.activeElement;
        if (foco === null) return true;
        return !["INPUT", "TEXTAREA", "SELECT"].includes(foco.tagName);
      }

      function conectarEventos() {
        const eventos = new EventSource("/api/events");
        // «conectando…» es cierto hasta que la conexión abre, y después es una
        // mentira tranquila: la pantalla se queda diciendo que está conectando
        // cuando ya está conectada y lo único que pasa es que nadie escribió.
        eventos.onopen = () => {
          const marca = $("actualizado");
          if (marca !== null) marca.textContent = "en vivo";
        };
        eventos.onerror = () => {
          const marca = $("actualizado");
          if (marca !== null) marca.textContent = "sin conexión";
        };
        eventos.onmessage = () => {
          if (!puedeRefrescar()) return;
          clearTimeout(refrescoPendiente);
          // Un margen corto: una mutación escribe el ticket, el índice y el
          // recibo en milisegundos, y sin él la vista se reharía tres veces.
          refrescoPendiente = setTimeout(() => {
            marcarActualizado();
            void navegar();
          }, 300);
        };
      }

      function marcarActualizado() {
        const marca = $("actualizado");
        if (marca === null) return;
        const ahora = new Date();
        marca.textContent =
          "actualizado " +
          String(ahora.getHours()).padStart(2, "0") +
          ":" +
          String(ahora.getMinutes()).padStart(2, "0") +
          ":" +
          String(ahora.getSeconds()).padStart(2, "0");
      }

      /**
       * El título de la barra, que dice en qué vista se está.
       *
       * La navegación dejó de marcar la vista con una línea debajo de cada
       * pestaña: en la barra lateral el destino se ve por dónde está el resalte,
       * y el título de arriba lo dice con palabras —también cuando la vista es
       * una que no está en la lista, como el detalle de un ticket—.
       */
      const TITULOS = {
        tickets: "Tickets",
        ticket: "Ticket",
        features: "Features",
        feature: "Feature",
        procesos: "Procesos",
        estandares: "Estándares",
        configurar: "Configurar",
        modelos: "Modelos",
        configuracion: "Configuración",
        proveedores: "Proveedores",
      };

      function marcarTitulo(nombre, parametro) {
        const titulo = $("titulo-vista");
        const sello = $("sello-vista");
        if (titulo === null) return;
        titulo.textContent = TITULOS[nombre] ?? "Tickets";
        if (sello === null) return;
        // El identificador del sujeto abierto, cuando lo hay: sin él, dos
        // pantallas distintas del mismo tipo se ven iguales en la barra.
        sello.textContent = parametro ?? "";
        sello.style.display = parametro === undefined ? "none" : "";
      }

      /**
       * Los números que piden atención, en la navegación.
       *
       * Un menú dice a dónde se puede ir; esto dice **a dónde conviene ir**: las
       * propuestas que esperan una decisión y los tickets que esperan una prueba
       * de la persona. Son las dos cosas que se quedan quietas si nadie mira, y
       * por eso están a la vista desde cualquier pantalla.
       */
      async function marcarPendientes() {
        const poner = (vista, cuantos, alerta) => {
          const enlace = document.querySelector(`nav a[data-vista="${vista}"]`);
          if (enlace === null) return;
          const previo = enlace.querySelector(".cuenta");
          if (previo !== null) previo.remove();
          if (cuantos === 0) return;
          enlace.append(el("span", String(cuantos), alerta ? "cuenta alerta" : "cuenta"));
        };

        try {
          const [estandares, tickets] = await Promise.all([
            api("GET", "/api/standards"),
            api("GET", "/api/tickets"),
          ]);
          poner(
            "estandares",
            estandares.proposals.filter((p) => p.state === "propuesto").length,
            true,
          );
          poner(
            "tickets",
            (tickets.tickets ?? []).filter((t) => t.workflowStatus === "awaiting_user_tests")
              .length,
            true,
          );
        } catch {
          // Sin números no se rompe nada: la navegación se queda sin contadores.
        }
      }

      /** El pliegue de la barra lateral, recordado entre visitas. */
      function montarPliegue() {
        const boton = $("pliegue");
        if (boton === null) return;
        const guardado = localStorage.getItem("valmen-lateral");
        if (guardado === "oculta") document.body.classList.add("lateral-oculta");
        boton.addEventListener("click", () => {
          const oculta = document.body.classList.toggle("lateral-oculta");
          localStorage.setItem("valmen-lateral", oculta ? "oculta" : "visible");
        });
      }

      // ── Enrutado ──────────────────────────────────────────────────────────

      async function navegar() {
        const ruta = location.hash.replace(/^#\//, "") || "tickets";
        const [nombre, parametro] = ruta.split("/");

        marcarTitulo(nombre, parametro);

        for (const enlace of document.querySelectorAll("nav a")) {
          // Un ticket pertenece a la vista de tickets: la pestaña sigue marcada
          // para que la navegación no parezca perderse al abrir uno.
          const activa =
            enlace.dataset.vista === nombre ||
            (nombre === "ticket" && enlace.dataset.vista === "tickets") ||
            (nombre === "feature" && enlace.dataset.vista === "features");
          if (activa) enlace.setAttribute("aria-current", "page");
          else enlace.removeAttribute("aria-current");
        }

        try {
          if (nombre === "ticket" && parametro !== undefined) await vistaTicket(parametro);
          else if (nombre === "feature" && parametro !== undefined)
            await vistaFeature(parametro);
          else if (nombre === "configurar") await vistaConfigurar();
          else if (nombre === "modelos") await vistaModelos();
          else if (nombre === "configuracion") await vistaConfiguracion();
          else if (nombre === "proveedores") await vistaProveedores();
          else if (nombre === "features") await vistaFeatures();
          else if (nombre === "procesos") await vistaProcesos();
          else if (nombre === "estandares") await vistaEstandares();
          else await vistaTickets();
        } catch (error) {
          const cont = $("contenido");
          cont.textContent = "";
          cont.append(el("div", `No se pudo cargar la vista: ${error.message}`, "vacio"));
        }
      }

      $("cancelar").addEventListener("click", () => $("dialogo").close());
      $("guardar").addEventListener("click", () => void guardar());
      $("clave").addEventListener("keydown", (e) => {
        if (e.key === "Enter") void guardar();
      });
      window.addEventListener("hashchange", () => void navegar());

      void api("GET", "/api/health").then((salud) => {
        const raiz = $("raiz");
        if (raiz === null) return;
        // El nombre del proyecto y no la ruta entera: en la barra lateral una
        // ruta larga se parte en tres renglones y desplaza lo que sí se mira. La
        // ruta completa queda en el `title`, que es donde se consulta.
        const partes = String(salud.root).split("/").filter((parte) => parte !== "");
        raiz.textContent = partes[partes.length - 1] ?? salud.root;
        raiz.title = salud.root;
      });
      montarPliegue();
      conectarEventos();
      void marcarPendientes();
      void navegar();
    </script>
  </body>
</html>
