<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ValmenHarness · Mission Control</title>
    <style>
      /* Sin framework y sin paso de compilación: esta interfaz tiene que
         arrancar con el servidor, y su objetivo es mostrar el estado, no
         impresionar. Una hoja propia se lee entera en un minuto. */
      :root {
        --fondo: #0f1115;
        --panel: #171a21;
        --panel-alto: #1e222b;
        --borde: #2a2f3a;
        --texto: #e6e8ee;
        --tenue: #8b93a7;
        --acento: #4f8cff;
        --ok: #3fb950;
        --alerta: #d29922;
        --error: #f85149;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--fondo);
        color: var(--texto);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 20px;
        padding: 0 24px;
        border-bottom: 1px solid var(--borde);
        background: var(--panel);
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        padding: 16px 0;
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav a {
        color: var(--tenue);
        text-decoration: none;
        font-size: 14px;
        padding: 16px 12px;
        border-bottom: 2px solid transparent;
      }
      nav a:hover {
        color: var(--texto);
      }
      nav a[aria-current="page"] {
        color: var(--texto);
        border-bottom-color: var(--acento);
      }
      header .raiz {
        color: var(--tenue);
        font-family: var(--mono);
        font-size: 12px;
      }
      header .raiz:first-of-type {
        margin-left: auto;
      }
      #actualizado {
        color: var(--ok);
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--tenue);
        margin: 0 0 12px;
      }
      h3 {
        font-size: 15px;
        margin: 0;
      }
      .nota {
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-left: 3px solid var(--acento);
        border-radius: 6px;
        padding: 12px 16px;
        margin-bottom: 24px;
        color: var(--tenue);
        font-size: 13px;
      }
      .nota strong {
        color: var(--texto);
      }
      .nota.alerta {
        border-left-color: var(--alerta);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
        font-weight: 600;
        padding: 8px 10px;
        border-bottom: 1px solid var(--borde);
        white-space: nowrap;
      }
      td {
        padding: 10px;
        border-bottom: 1px solid var(--borde);
        vertical-align: middle;
      }
      tbody tr:hover td {
        background: var(--panel);
      }
      .nombre {
        font-weight: 500;
      }
      .id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .punto {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 7px;
      }
      .punto.ok {
        background: var(--ok);
      }
      .punto.no {
        background: var(--tenue);
        opacity: 0.4;
      }
      .punto.error {
        background: var(--error);
      }
      .punto.alerta {
        background: var(--alerta);
      }
      .acciones {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        align-items: center;
      }
      button {
        font: inherit;
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 5px;
        cursor: pointer;
        background: var(--panel-alto);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      button:hover:not(:disabled) {
        border-color: var(--acento);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button.principal {
        background: var(--acento);
        border-color: var(--acento);
        color: #fff;
      }
      button.peligro:hover:not(:disabled) {
        border-color: var(--error);
        color: var(--error);
      }
      button.enlace {
        background: none;
        border: none;
        color: var(--acento);
        padding: 0;
      }
      .resultado {
        font-size: 12px;
        color: var(--tenue);
      }
      .resultado.ok {
        color: var(--ok);
      }
      .resultado.error {
        color: var(--error);
      }
      .etiqueta {
        display: inline-block;
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 10px;
        border: 1px solid var(--borde);
        color: var(--tenue);
        font-family: var(--mono);
      }
      .etiqueta.critico {
        border-color: var(--alerta);
        color: var(--alerta);
      }
      .etiqueta.roto {
        border-color: var(--error);
        color: var(--error);
      }
      .etiqueta.aprueba {
        border-color: var(--ok);
        color: var(--ok);
      }
      .etiqueta.bloquea {
        border-color: var(--error);
        color: var(--error);
      }
      .etiqueta.revisa {
        border-color: var(--alerta);
        color: var(--alerta);
      }
      .filtros {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .filtros input,
      .filtros select,
      select,
      input[type="text"] {
        font: inherit;
        font-size: 13px;
        padding: 6px 10px;
        border-radius: 6px;
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .filtros input:focus,
      .filtros select:focus,
      select:focus,
      input:focus {
        outline: none;
        border-color: var(--acento);
      }
      .tarjetas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .tarjeta {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 14px 16px;
      }
      .tarjeta .valor {
        font-size: 24px;
        font-weight: 600;
      }
      .tarjeta .rotulo {
        font-size: 12px;
        color: var(--tenue);
      }
      dialog {
        background: var(--panel);
        color: var(--texto);
        border: 1px solid var(--borde);
        border-radius: 10px;
        padding: 0;
        max-width: 520px;
        width: calc(100% - 32px);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.6);
      }
      .dialogo {
        padding: 20px 24px;
      }
      .dialogo h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .dialogo p {
        margin: 0 0 16px;
        color: var(--tenue);
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--tenue);
        margin-bottom: 6px;
      }
      input[type="password"],
      input[type="text"] {
        width: 100%;
        font: inherit;
        font-family: var(--mono);
        font-size: 13px;
        padding: 9px 11px;
        border-radius: 6px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .aviso {
        font-size: 12px;
        color: var(--tenue);
        margin-top: 8px;
      }
      .pie {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      pre {
        background: var(--fondo);
        border: 1px solid var(--borde);
        border-radius: 6px;
        padding: 12px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12px;
        max-height: 60vh;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .secciones {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .secciones button {
        font-size: 12px;
      }
      .secciones button[aria-pressed="true"] {
        border-color: var(--acento);
        color: var(--acento);
      }
      .vacio {
        color: var(--tenue);
        text-align: center;
        padding: 40px;
      }

      /* ── Barra de guardado, fija mientras se edita ────────────────────── */
      /* El botón de guardar estaba al final de una tabla de trece roles, y no se
         encontraba. Una barra fija dice que hay cambios pendientes y los guarda
         sin obligar a recorrer la página. */
      .barra-guardado {
        position: sticky; bottom: 0; z-index: 30;
        display: flex; gap: 12px; align-items: center;
        padding: 12px 16px; margin-top: 18px;
        background: var(--panel-alto); border: 1px solid var(--borde);
        border-radius: 8px;
      }
      .barra-guardado .cuenta { font-size: 13px; color: var(--tenue); flex: 1; }
      .barra-guardado .cuenta.pendiente { color: var(--alerta); }
      .barra-guardado .resultado { flex: 1; }

      /* ── Selector de modelo en dos niveles ────────────────────────────── */
      /* Proveedor y modelo, con el modelo en un desplegable que se puede
         escribir: una lista de cientos de modelos sin búsqueda es una lista que
         nadie recorre, y un `select` no deja teclear. */
      .par-modelo {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .par-modelo select {
        max-width: 150px;
      }
      .par-modelo .caja-modelo {
        position: relative;
        flex: 1;
        min-width: 220px;
      }
      .par-modelo input {
        width: 100%;
        font-family: var(--mono);
        font-size: 12px;
      }
      .lista-modelos {
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        top: 100%;
        max-height: 260px;
        overflow: auto;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        border-radius: 6px;
        margin-top: 2px;
      }
      .lista-modelos div {
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        font-family: var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lista-modelos div:hover,
      .lista-modelos div.marcado {
        background: var(--panel);
      }
      .lista-modelos .nombre {
        font-family: inherit;
        color: var(--tenue);
      }
      .lista-modelos .vacio {
        cursor: default;
        color: var(--tenue);
        padding: 10px;
      }
      .cargando-modelos {
        font-size: 12px;
        color: var(--tenue);
      }
      .selector-modelo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pie-modelo {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .pie-modelo button {
        font-size: 12px;
      }
      .pie-modelo .resultado {
        flex: 1;
        word-break: break-word;
      }

      /* ── Features ─────────────────────────────────────────────────────── */
      .acciones-feature {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--borde);
      }
      .acciones-feature button {
        font-size: 12px;
      }
      a.enlace {
        color: var(--acento);
        text-decoration: none;
      }
      a.enlace:hover {
        text-decoration: underline;
      }
      /* Los cuatro artefactos de una feature, siempre visibles: la pregunta
         «¿en qué punto está?» se responde mirando, no abriendo. */
      .artefactos {
        display: flex;
        gap: 4px;
        font-family: var(--mono);
        font-size: 11px;
      }
      .artefactos span {
        color: var(--borde);
      }
      .artefactos span.hecho {
        color: var(--ok);
      }
      .sprint {
        border: 1px solid var(--borde);
        border-radius: 8px;
        background: var(--panel);
        margin-bottom: 14px;
      }
      .sprint > header {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 12px 16px;
        border-bottom: 1px solid var(--borde);
        background: none;
      }
      .sprint > header .id {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--acento);
      }
      .sprint > header h3 {
        font-size: 14px;
        font-weight: 500;
      }
      .sprint table {
        border: none;
      }
      .sprint td {
        border-bottom: 1px solid var(--borde);
      }
      .sprint tr:last-child td {
        border-bottom: none;
      }
      /* Un ticket del grafo que todavía no existe en el registro. Se marca para
         que la diferencia entre «planeado» y «escrito» no se pierda. */
      tr.planeado td {
        opacity: 0.55;
      }
      .depende {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .huecos {
        border-left: 3px solid var(--error);
      }
      .huecos .fila {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 6px 0;
        font-size: 13px;
      }
      .huecos .fila + .fila {
        border-top: 1px solid var(--borde);
      }

      /* ── Ticket: cabecera y gates ─────────────────────────────────────── */
      .volver {
        font-size: 13px;
        margin-bottom: 14px;
        display: inline-block;
      }
      .cabecera-ticket {
        margin-bottom: 22px;
      }
      .cabecera-ticket h2 {
        font-size: 20px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--texto);
        margin-bottom: 6px;
      }
      .cabecera-ticket .meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 8px;
      }
      .ruta {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
        margin-top: 8px;
      }
      .gate {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .gate-cabecera {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 4px;
      }
      .gate-meta {
        font-size: 12px;
        color: var(--tenue);
        margin-bottom: 12px;
      }
      .checks {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 14px;
      }
      .check {
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .check .marca {
        font-family: var(--mono);
        width: 12px;
      }
      .check .marca.pass {
        color: var(--ok);
      }
      .check .marca.fail {
        color: var(--error);
      }
      .check .marca.warn {
        color: var(--alerta);
      }
      .check .marca.skip {
        color: var(--tenue);
      }
      .check .detalle {
        color: var(--tenue);
      }
      .gate .acciones {
        justify-content: flex-start;
      }
      .veredicto {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 14px;
        border-radius: 6px;
        background: var(--panel-alto);
        border: 1px solid var(--borde);
        margin-top: 14px;
      }
      .veredicto .salida {
        font-family: var(--mono);
        font-size: 13px;
        font-weight: 600;
      }
      .veredicto .salida.approve {
        color: var(--ok);
      }
      .veredicto .salida.block {
        color: var(--error);
      }
      .veredicto .salida.review {
        color: var(--alerta);
      }
      .veredicto .motivo {
        font-size: 13px;
        color: var(--tenue);
        flex: 1 1 320px;
      }
      .obsoleto {
        background: rgba(210, 153, 34, 0.12);
        border: 1px solid var(--alerta);
        color: var(--alerta);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        margin-top: 12px;
      }
      .proposiciones {
        margin-top: 14px;
      }
      .proposiciones td {
        padding: 8px 10px;
        font-size: 13px;
      }
      .proposiciones .etiqueta-proposicion {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--tenue);
      }
      .proposiciones .criterio-texto {
        font-size: 13px;
        margin-bottom: 2px;
      }
      /* La barra hace visible lo que decide: el número y los dos umbrales. */
      .barra {
        position: relative;
        width: 150px;
        height: 8px;
        border-radius: 4px;
        background: var(--fondo);
        border: 1px solid var(--borde);
      }
      .barra .relleno {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 3px;
        background: var(--tenue);
      }
      .barra .relleno.approve {
        background: var(--ok);
      }
      .barra .relleno.block {
        background: var(--error);
      }
      .barra .relleno.review {
        background: var(--alerta);
      }
      .barra .corte {
        position: absolute;
        top: -2px;
        bottom: -2px;
        width: 1px;
        background: var(--tenue);
        opacity: 0.7;
      }
      .cifra {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--tenue);
      }
      .descriptiva {
        color: var(--tenue);
        font-style: italic;
      }

      /* Línea de tiempo del ticket. El fallo se marca en la fila entera y no en una
         palabra: lo que hay que ver de un vistazo es dónde se corrigió, porque eso
         es trabajo que costó dinero. */
      .tabla-intervenciones td:first-child,
      .tabla-intervenciones th:first-child {
        width: 1%;
        white-space: nowrap;
      }
      .tabla-intervenciones tr.fallo td {
        background: color-mix(in srgb, var(--error) 12%, transparent);
      }
      .tabla-intervenciones tr.fallo td:nth-child(3) {
        color: var(--error);
        font-weight: 600;
      }
      .pie-recibo {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--tenue);
        margin-top: 12px;
      }
      .pie-recibo code {
        font-family: var(--mono);
        color: var(--texto);
      }
      .transiciones {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 24px;
      }
      .transicion {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .transicion .resultado {
        min-width: 150px;
      }
      .correccion {
        background: rgba(210, 153, 34, 0.12);
        border: 1px solid var(--alerta);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 16px;
      }
      .correccion-titulo {
        font-weight: 600;
        color: var(--alerta);
        margin-bottom: 4px;
      }
      .correccion-motivo {
        font-size: 13px;
        margin-top: 8px;
        padding-left: 12px;
        border-left: 2px solid var(--borde);
        white-space: pre-wrap;
      }
      .responsable {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 14px;
      }
      .responsable label {
        margin: 0;
        white-space: nowrap;
      }
      .decision-humana {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--borde);
      }
      .decision-humana .quien {
        font-size: 13px;
      }
      .decision-humana .quien strong {
        color: var(--texto);
      }
      .historial {
        font-size: 12px;
        color: var(--tenue);
        margin-top: 10px;
      }

      /* ── Configuración: editor y diferencias ──────────────────────────── */
      .editor {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        padding: 14px;
        border-radius: 8px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      .editor:focus {
        outline: none;
        border-color: var(--acento);
      }
      .editor.mal {
        border-color: var(--error);
      }
      .interpretacion {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin: 16px 0;
      }
      .interpretacion .campo {
        background: var(--panel);
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 12px 14px;
      }
      .interpretacion .rotulo {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
      }
      .interpretacion .valor {
        font-family: var(--mono);
        font-size: 13px;
        margin-top: 4px;
        word-break: break-word;
      }
      .diff {
        font-family: var(--mono);
        font-size: 12px;
        border: 1px solid var(--borde);
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      .diff div {
        padding: 2px 12px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .diff .add {
        background: rgba(63, 185, 80, 0.12);
        color: var(--ok);
      }
      .diff .remove {
        background: rgba(248, 81, 73, 0.12);
        color: var(--error);
      }
      .diff .same {
        color: var(--tenue);
      }
      /* ── Configurar por chat ──────────────────────────────────────────── */
      .conversacion {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-bottom: 18px;
      }
      .turno {
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 14px 16px;
        background: var(--panel);
      }
      .turno.tuyo {
        background: var(--panel-alto);
      }
      .turno .quien {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--tenue);
        margin-bottom: 6px;
      }
      .turno .texto {
        white-space: pre-wrap;
      }
      .propuesta {
        border: 1px solid var(--borde);
        border-radius: 8px;
        padding: 14px 16px;
        margin-top: 12px;
        background: var(--fondo);
      }
      .propuesta h4 {
        margin: 0 0 4px;
        font-size: 14px;
        font-family: var(--mono);
      }
      .propuesta .motivo {
        font-size: 13px;
        color: var(--tenue);
        margin-bottom: 10px;
      }
      .propuesta.invalida {
        border-color: var(--error);
      }
      .propuesta.sensible {
        border-color: var(--alerta);
      }
      .confirmacion {
        margin-top: 10px;
      }
      .confirmacion code {
        font-family: var(--mono);
        color: var(--alerta);
      }
      .confirmacion input {
        margin-top: 6px;
        font-family: var(--mono);
      }
      textarea {
        width: 100%;
        min-height: 76px;
        resize: vertical;
        font: inherit;
        font-size: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        background: var(--fondo);
        color: var(--texto);
        border: 1px solid var(--borde);
      }
      textarea:focus {
        outline: none;
        border-color: var(--acento);
      }
      .ejemplos {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .ejemplos button {
        font-size: 12px;
      }

      /* ── Modelos: routing por rol ─────────────────────────────────────── */
      .roles td {
        vertical-align: top;
      }
      .roles select,
      .roles input {
        min-width: 0;
        width: 100%;
      }
      .roles .rol {
        font-family: var(--mono);
        font-size: 12px;
      }
      .roles .descripcion {
        font-size: 12px;
        color: var(--tenue);
      }
      .presets {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .presets button[aria-pressed="true"] {
        border-color: var(--acento);
        color: var(--acento);
      }
      .presets + .resultado {
        margin-bottom: 18px;
      }
      .sin-consumidor {
        font-size: 11px;
        color: var(--tenue);
        font-style: italic;
      }
      .aviso-jev {
        background: rgba(79, 140, 255, 0.1);
        border: 1px solid var(--acento);
        border-radius: 6px;
        padding: 10px 12px;
        font-size: 13px;
        margin: 14px 0;
      }
      .error-parser {
        background: rgba(248, 81, 73, 0.12);
        border: 1px solid var(--error);
        color: var(--error);
        border-radius: 6px;
        padding: 10px 12px;
        font-family: var(--mono);
        font-size: 12px;
        white-space: pre-wrap;
        margin-bottom: 16px;
      }
      details {
        margin-top: 12px;
      }
      summary {
        font-size: 12px;
        color: var(--tenue);
        cursor: pointer;
      }
      summary:hover {
        color: var(--texto);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>ValmenHarness</h1>
      <nav>
        <a href="#/tickets" data-vista="tickets">Tickets</a>
        <a href="#/features" data-vista="features">Features</a>
        <a href="#/procesos" data-vista="procesos">Procesos</a>
        <a href="#/configurar" data-vista="configurar">Configurar</a>
        <a href="#/modelos" data-vista="modelos">Modelos</a>
        <a href="#/configuracion" data-vista="configuracion">Configuración</a>
        <a href="#/proveedores" data-vista="proveedores">Proveedores</a>
      </nav>
      <span class="raiz" id="actualizado"></span>
      <span class="raiz" id="raiz"></span>
    </header>

    <main id="contenido"></main>

    <dialog id="dialogo">
      <div class="dialogo">
        <h3 id="titulo"></h3>
        <p id="ayuda"></p>
        <label for="clave">Clave</label>
        <input
          id="clave"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="sk-…"
        />
        <div class="aviso" id="aviso"></div>
        <div class="pie">
          <button id="cancelar">Cancelar</button>
          <button id="guardar" class="principal">Probar y guardar</button>
        </div>
      </div>
    </dialog>

    <script type="module">
      // La interfaz no sabe nada del harness: llama a la API y muestra lo que
      // devuelve. Toda la lógica vive en el motor, así que un botón y un comando
      // de terminal no pueden divergir.
      const $ = (id) => document.getElementById(id);

      /** Llama a la API y devuelve el cuerpo, o lanza con el mensaje del servidor. */
      async function api(method, ruta, cuerpo) {
        if (method !== "GET") ocupado = true;
        try {
          return await enviar(method, ruta, cuerpo);
        } finally {
          if (method !== "GET") ocupado = false;
        }
      }

      async function enviar(method, ruta, cuerpo) {
        const respuesta = await fetch(ruta, {
          method,
          headers: cuerpo === undefined ? {} : { "Content-Type": "application/json" },
          body: cuerpo === undefined ? undefined : JSON.stringify(cuerpo),
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error ?? `HTTP ${respuesta.status}`);
        return datos;
      }

      /** Crea un elemento con texto. Nunca se usa innerHTML con datos del registro. */
      function el(tag, texto, clase) {
        const nodo = document.createElement(tag);
        if (texto !== undefined) nodo.textContent = texto;
        if (clase !== undefined) nodo.className = clase;
        return nodo;
      }

      /** El responsable de las decisiones humanas: se recuerda entre visitas. */
      let responsable = localStorage.getItem("valmen.actor") ?? "";
      const guardarResponsable = (valor) => {
        responsable = valor;
        localStorage.setItem("valmen.actor", valor);
      };

      // ── Vista: tickets ────────────────────────────────────────────────────

      const filtros = { q: "", workflow: "", type: "", open: false, invalid: false };

      async function vistaTickets() {
        const cont = $("contenido");
        cont.textContent = "";

        const params = new URLSearchParams();
        if (filtros.q !== "") params.set("q", filtros.q);
        if (filtros.workflow !== "") params.set("workflow", filtros.workflow);
        if (filtros.type !== "") params.set("type", filtros.type);
        if (filtros.open) params.set("open", "1");
        if (filtros.invalid) params.set("invalid", "1");

        const datos = await api("GET", `/api/tickets?${params.toString()}`);
        const r = datos.summary;

        // Tarjetas de resumen: es lo que responde "¿qué está pasando?" sin leer
        // la tabla.
        const tarjetas = el("div", undefined, "tarjetas");
        const metricas = [
          ["Tickets", r.total],
          ["En curso", r.total - (r.byWorkflow.closed ?? 0)],
          ["Cerrados", r.byWorkflow.closed ?? 0],
          ["Con puntos abiertos", r.withOpenPoints],
          ["Impacto crítico", r.criticalImpacts],
        ];
        if (r.invalid > 0) metricas.push(["Inválidos", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        // Filtros.
        const barra = el("div", undefined, "filtros");
        const busqueda = document.createElement("input");
        busqueda.type = "text";
        busqueda.placeholder = "Buscar por id, título o módulo…";
        busqueda.value = filtros.q;
        busqueda.style.minWidth = "280px";
        let temporizador;
        busqueda.addEventListener("input", () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            filtros.q = busqueda.value;
            void vistaTickets();
          }, 250);
        });
        barra.append(busqueda);

        const selector = (etiqueta, clave, valores, actual) => {
          const sel = document.createElement("select");
          sel.append(new Option(etiqueta, ""));
          for (const v of valores) sel.append(new Option(v, v));
          sel.value = actual;
          sel.addEventListener("change", () => {
            filtros[clave] = sel.value;
            void vistaTickets();
          });
          return sel;
        };
        barra.append(
          selector(
            "Todos los estados",
            "workflow",
            Object.keys(r.byWorkflow).sort(),
            filtros.workflow,
          ),
          selector("Todos los tipos", "type", Object.keys(r.byType).sort(), filtros.type),
        );

        const casilla = (texto, clave) => {
          const label = el("label");
          label.style.display = "flex";
          label.style.alignItems = "center";
          label.style.gap = "6px";
          label.style.margin = "0";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = filtros[clave];
          input.addEventListener("change", () => {
            filtros[clave] = input.checked;
            void vistaTickets();
          });
          label.append(input, el("span", texto));
          return label;
        };
        barra.append(
          casilla("Solo abiertos", "open"),
          casilla("Solo inválidos", "invalid"),
        );

        // El reporte es lo único del visor anterior que la pantalla no cubría, y
        // se descarga desde aquí en vez de componerse en el navegador: el texto y
        // el nombre del archivo los produce el servidor, así que el botón y
        // `valmen report` dan exactamente el mismo documento.
        const botonReporte = el("button", "Reporte de cierres");
        botonReporte.title =
          "Markdown de los tickets cerrados en los últimos 30 días, listo para pegar.";
        botonReporte.addEventListener("click", () => void descargarReporte());
        barra.append(botonReporte);
        cont.append(barra);

        if (datos.tickets.length === 0) {
          cont.append(el("div", "Ningún ticket coincide con los filtros.", "vacio"));
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of [
          "Ticket",
          "Tipo",
          "Estado",
          "QA",
          "Release",
          "Puntos",
          "Actualizado",
          "",
        ]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const t of datos.tickets) {
          const tr = el("tr");

          const celdaId = el("td");
          celdaId.append(el("div", t.title, "nombre"), el("div", t.id, "id"));
          tr.append(celdaId);

          const celdaTipo = el("td");
          celdaTipo.append(el("span", `${t.type} · ${t.module}`, "etiqueta"));
          tr.append(celdaTipo);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", t.workflowStatus));
          if (t.criticalImpacts.length > 0) {
            const critico = el("div");
            critico.append(el("span", t.criticalImpacts.join(" · "), "etiqueta critico"));
            celdaEstado.append(critico);
          }
          if (t.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválido", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          tr.append(el("td", t.qaStatus));
          tr.append(el("td", t.releaseStatus));

          const celdaPuntos = el("td");
          celdaPuntos.textContent =
            t.totalPoints === 0 ? "—" : `${t.totalPoints - t.openPoints}/${t.totalPoints}`;
          if (t.openPoints > 0) celdaPuntos.style.color = "var(--alerta)";
          tr.append(celdaPuntos);

          tr.append(el("td", t.updated, "id"));

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/ticket/${t.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: features ───────────────────────────────────────────────────
      //
      // Una feature es lo que no cabe en un ticket: un módulo con varias
      // pantallas, reportes y configuración. La vista responde tres preguntas y
      // en ese orden: ¿en qué punto está?, ¿qué requisitos quedan sin cubrir? y
      // ¿qué tickets la componen?

      /** Los cuatro artefactos con su marca, en el orden en que se escriben. */
      function marcasArtefactos(f) {
        const caja = el("div", undefined, "artefactos");
        const partes = [
          ["spec", f.hasSpec],
          ["diseño", f.hasDesign],
          ["tickets", f.hasDecomposition],
          ["verificar", f.hasVerify],
        ];
        for (const [nombre, hecho] of partes) {
          caja.append(el("span", `${hecho ? "✓" : "·"} ${nombre}`, hecho ? "hecho" : ""));
        }
        return caja;
      }

      async function vistaFeatures() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/features");
        const r = datos.summary;

        const tarjetas = el("div", undefined, "tarjetas");
        const metricas = [
          ["Features", r.total],
          ["Descompuestas", r.decomposed],
          ["Con huecos", r.withGaps],
        ];
        if (r.invalid > 0) metricas.push(["Inválidas", r.invalid]);
        for (const [rotulo, valor] of metricas) {
          const tarjeta = el("div", undefined, "tarjeta");
          tarjeta.append(el("div", String(valor), "valor"), el("div", rotulo, "rotulo"));
          tarjetas.append(tarjeta);
        }
        cont.append(tarjetas);

        if (datos.features.length === 0) {
          const vacio = el("div", undefined, "vacio");
          vacio.append(
            el("div", "No hay features en este proyecto."),
            el(
              "div",
              "Una feature es trabajo que excede un ticket: spec, diseño y varios tickets hijos.",
              "resultado",
            ),
            el("div", "Se crea con: valmen feature new <slug> --title <título>", "ruta"),
          );
          cont.append(vacio);
          return;
        }

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of [
          "Feature",
          "Estado",
          "Artefactos",
          "Requisitos",
          "Tickets",
          "Huecos",
          "Actualizada",
          "",
        ]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);

        const tbody = el("tbody");
        for (const f of datos.features) {
          const tr = el("tr");

          const celdaNombre = el("td");
          celdaNombre.append(el("div", f.title, "nombre"), el("div", f.id, "id"));
          tr.append(celdaNombre);

          const celdaEstado = el("td");
          celdaEstado.append(el("span", f.state));
          if (f.invalid !== null) {
            const roto = el("div");
            roto.append(el("span", "inválida", "etiqueta roto"));
            celdaEstado.append(roto);
          }
          tr.append(celdaEstado);

          const celdaArtefactos = el("td");
          celdaArtefactos.append(marcasArtefactos(f));
          tr.append(celdaArtefactos);

          tr.append(el("td", f.requirements === 0 ? "—" : String(f.requirements), "id"));

          const celdaTickets = el("td");
          celdaTickets.textContent = f.hasDecomposition ? String(f.tickets) : "—";
          celdaTickets.className = "id";
          tr.append(celdaTickets);

          // Los huecos van en rojo y no en «inválida»: una feature con la
          // cobertura incompleta no está rota, está a medio descomponer, y son
          // dos cosas distintas que hay que poder distinguir de un vistazo.
          const celdaHuecos = el("td");
          if (f.gaps > 0) {
            celdaHuecos.append(el("span", `${f.gaps} sin cubrir`, "etiqueta roto"));
          } else if (f.hasDecomposition) {
            celdaHuecos.append(el("span", "completa", "etiqueta aprueba"));
          } else {
            celdaHuecos.textContent = "—";
          }
          tr.append(celdaHuecos);

          tr.append(el("td", f.updated, "id"));

          const celdaAcciones = el("td");
          const ver = el("button", "Ver", "enlace");
          ver.addEventListener("click", () => {
            location.hash = `#/feature/${f.id}`;
          });
          celdaAcciones.append(ver);
          tr.append(celdaAcciones);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      // ── Vista: una feature, con su grafo y su cobertura ───────────────────

      /** Una sección colapsable con texto en crudo. */
      function bloqueCrudo(titulo, texto, abierto) {
        const detalle = document.createElement("details");
        if (abierto) detalle.open = true;
        detalle.append(el("summary", titulo));
        detalle.append(el("pre", texto));
        return detalle;
      }

      /** La tabla de requisitos, con quién lo cubre y en qué estado está. */
      function tablaRequisitos(requisitos, ticketsPorId) {
        const tabla = el("table");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Requisito", "Cubierto por", "Estado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const req of requisitos) {
          const tr = el("tr");

          const celda = el("td");
          celda.append(
            el("div", req.statement),
            el("div", `${req.id} · ${req.domain}`, "id"),
          );
          tr.append(celda);

          const celdaCubre = el("td");
          if (req.coveredBy.length === 0) {
            celdaCubre.append(el("span", "ninguno", "etiqueta roto"));
          } else {
            for (const id of req.coveredBy) {
              const linea = el("div");
              linea.append(el("span", id, "id"));
              if (!ticketsPorId.has(id)) {
                // Un `covered_by` que apunta a un ticket que no está en ningún
                // sprint cubre lo mismo que ninguno, y el motor lo trata así.
                linea.append(el("span", " fuera del grafo", "etiqueta roto"));
              }
              celdaCubre.append(linea);
            }
          }
          tr.append(celdaCubre);

          const celdaEstado = el("td");
          if (req.coveredBy.length === 0) {
            celdaEstado.append(el("span", "sin cubrir", "etiqueta roto"));
          } else {
            const estados = req.coveredBy
              .filter((id) => ticketsPorId.has(id))
              .map((id) => ticketsPorId.get(id));
            if (estados.length === 0) {
              celdaEstado.append(el("span", "no escrito", "etiqueta"));
            } else if (estados.every((e) => e === "closed")) {
              celdaEstado.append(el("span", "cerrado", "etiqueta aprueba"));
            } else {
              celdaEstado.append(el("span", "en curso", "etiqueta"));
            }
          }
          tr.append(celdaEstado);

          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        return tabla;
      }

      /** Los estados a los que una feature puede ir hoy, según el contrato. */
      async function transicionesDeFeature(slug) {
        const f = await api("GET", `/api/features/${slug}`);
        return f;
      }

      /**
       * Mueve el estado de una feature.
       *
       * Los destinos vienen del servidor, que los saca de la tabla del contrato:
       * si la interfaz los dedujera, un cambio en la máquina de estados dejaría a
       * la pantalla ofreciendo movimientos ilegales.
       */
      async function moverFeature(slug, to) {
        try {
          const r = await api("POST", `/api/features/${slug}/transition`, { to });
          await vistaFeature(slug);
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado ok resultado-feature";
            salida.textContent = r.details;
          }
        } catch (fallo) {
          const salida = document.querySelector(".resultado-feature");
          if (salida) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = fallo.message;
          }
        }
      }

      /**
       * Descompone una feature y muestra el grafo.
       *
       * Es el paso que más valor tiene de esta vista y el único que obligaba a
       * abrir la terminal para completar el ciclo. Se avisa de lo que cuesta antes
       * de pulsar: una llamada al modelo del rol `architect`.
       */
      async function descomponerFeature(slug, boton, salida) {
        boton.disabled = true;
        boton.textContent = "Descomponiendo…";
        salida.className = "resultado resultado-feature";
        salida.textContent =
          "Consultando al modelo del rol architect. Puede tardar un minuto.";
        try {
          const r = await api("POST", `/api/features/${slug}/decompose`, {});
          if (!r.ok) {
            salida.className = "resultado error resultado-feature";
            salida.textContent = r.error;
            return;
          }
          salida.className = "resultado ok resultado-feature";
          salida.textContent =
            `Descomposición escrita: ${r.document.decomposition.sprints.length} sprint(s), ` +
            `${r.document.decomposition.coverage.length} requisito(s) cubierto(s). ` +
            `Modelo: ${r.decomposer.provider}/${r.decomposer.model}`;
          await vistaFeature(slug);
        } catch (fallo) {
          salida.className = "resultado error resultado-feature";
          salida.textContent = fallo.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Descomponer";
        }
      }

      async function vistaFeature(slug) {
        const cont = $("contenido");
        cont.textContent = "";

        const f = await api("GET", `/api/features/${slug}`);

        const volver = el("a", "← Todas las features", "volver enlace");
        volver.href = "#/features";
        cont.append(volver);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", f.title));
        const meta = el("div", undefined, "meta");
        meta.append(el("span", f.id, "id"), el("span", f.state, "etiqueta"));
        if (f.invalid !== null) meta.append(el("span", "inválida", "etiqueta roto"));
        cabecera.append(meta, marcasArtefactos(f), el("div", f.path, "ruta"));
        cont.append(cabecera);

        if (f.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "La feature no valida. "), el("span", f.invalid));
          cont.append(nota);
        }

        // ── Huecos de cobertura ──
        //
        // Va antes que nada operativo a propósito: es lo que impide empezar a
        // trabajar, y enterrarlo bajo tres tablas obliga a buscarlo.
        const huecos = f.decomposition === null ? [] : f.decomposition.gaps;
        if (f.decompositionError !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(
            el("strong", "El tickets.yaml no se puede leer. "),
            el("span", f.decompositionError, "resultado error"),
          );
          cont.append(nota);
        }
        if (huecos.length > 0) {
          const caja = el("div", undefined, "nota alerta huecos");
          caja.append(
            el("strong", `${huecos.length} requisito(s) sin ticket que los cubra. `),
            el(
              "span",
              "La compuerta de descomposición no pasa con huecos: cada requisito necesita al menos un ticket en un sprint.",
            ),
          );
          for (const hueco of huecos) {
            const fila = el("div", undefined, "fila");
            fila.append(
              el("span", hueco.requirement || "declarado", "id"),
              el("span", hueco.statement),
            );
            caja.append(fila);
          }
          cont.append(caja);
        }
        if (f.cycles.length > 0) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El grafo de dependencias tiene ciclos. "));
          for (const ciclo of f.cycles) {
            nota.append(el("div", ciclo.join(" → "), "id"));
          }
          cont.append(nota);
        }

        // El estado de cada ticket del grafo, para saber qué está escrito ya.
        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        // ── Pestañas ──
        const barra = el("div", undefined, "secciones");
        const zona = el("div");
        const pestanas = [
          ["Resumen", () => panelResumen(f)],
          ["Requisitos", () => panelRequisitos(f)],
          ["Grafo", () => panelGrafo(f)],
          ["Brief", () => bloqueCrudo("feature.md", f.brief, true)],
        ];
        if (f.design !== null)
          pestanas.push(["Diseño", () => bloqueCrudo("design.md", f.design)]);
        if (f.ticketsYaml !== null) {
          pestanas.push([
            "tickets.yaml",
            () => bloqueCrudo("tickets.yaml", f.ticketsYaml, true),
          ]);
        }
        for (const spec of f.specs) {
          pestanas.push([
            `spec · ${spec.domain}`,
            () => bloqueCrudo(spec.source, spec.text),
          ]);
        }

        const pintar = (indice) => {
          zona.textContent = "";
          zona.append(pestanas[indice][1]());
          for (const [i, boton] of [...barra.children].entries()) {
            boton.setAttribute("aria-pressed", String(i === indice));
          }
        };
        pestanas.forEach(([nombre], indice) => {
          const boton = el("button", nombre);
          boton.addEventListener("click", () => pintar(indice));
          barra.append(boton);
        });
        cont.append(barra, zona);
        pintar(0);
      }

      /** El resumen: qué hay, quién lo generó y en qué punto está. */
      function panelResumen(f) {
        const caja = el("div");

        const tabla = el("table");
        const tbody = el("tbody");
        const fila = (rotulo, valor) => {
          const tr = el("tr");
          tr.append(el("td", rotulo, "id"), el("td", valor));
          tbody.append(tr);
        };
        fila("Estado", f.state);
        fila("Creada", f.created);
        fila("Actualizada", f.updated);
        fila(
          "Requisitos",
          f.requirements === 0
            ? "La spec no declara requisitos todavía."
            : `${f.requirements} en ${f.specs.length} dominio(s)`,
        );
        fila(
          "Tickets",
          f.hasDecomposition
            ? `${f.tickets} en ${f.decomposition?.sprints.length ?? 0} sprint(s)`
            : "Sin descomponer",
        );
        if (f.decomposition?.origin) {
          fila(
            "Descompuesta por",
            `${f.decomposition.origin.provider}/${f.decomposition.origin.model}`,
          );
        }
        tabla.append(tbody);
        caja.append(tabla);

        // ── Acciones ──
        //
        // Mover el estado y descomponer, desde aquí. Es lo que cierra el ciclo sin
        // abrir la terminal, y descomponer es el paso que más valor tiene: es el
        // que convierte la spec en trabajo.
        const acciones = el("div", undefined, "acciones-feature");
        const salida = el("div", "resultado resultado-feature");

        if (!f.hasDecomposition && f.requirements > 0) {
          const boton = el("button", "Descomponer", "principal");
          boton.title =
            "Pide el grafo de tickets al modelo del rol architect. Cuesta una llamada.";
          boton.addEventListener(
            "click",
            () => void descomponerFeature(f.id, boton, salida),
          );
          acciones.append(boton);
        }
        if (f.requirements === 0) {
          acciones.append(
            el(
              "span",
              `Falta la spec: escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con ` +
                'requisitos en RFC 2119 — "### Requirement: R-XXX-001 — El sistema DEBE …".',
              "resultado",
            ),
          );
        }

        // Los movimientos legales, con el estado actual fuera: ofrecer el que ya
        // se tiene es ofrecer un botón que no hace nada.
        const destinos = (f.transitions ?? []).filter((estado) => estado !== f.state);
        if (destinos.length > 0) {
          const etiqueta = el("span", "Mover a:", "resultado");
          acciones.append(etiqueta);
          for (const destino of destinos) {
            const boton = el("button", destino);
            boton.addEventListener("click", () => void moverFeature(f.id, destino));
            acciones.append(boton);
          }
        }

        if (acciones.children.length > 0) {
          caja.append(acciones, salida);
        }
        if (f.requirements === 0) {
          const nota = el("div", undefined, "nota");
          nota.append(
            el("strong", "Falta la spec. "),
            el(
              "span",
              `Escribe .valmen/features/${f.id}/spec/<dominio>/spec.md con requisitos en RFC 2119: "### Requirement: R-XXX-001 — El sistema DEBE …".`,
              "resultado",
            ),
          );
          caja.append(nota);
        }
        return caja;
      }

      /** Los requisitos, con la cobertura declarada y el estado real. */
      function panelRequisitos(f) {
        const caja = el("div");
        const requisitos = f.specs.flatMap((spec) => spec.requirements);

        if (requisitos.length === 0) {
          caja.append(el("div", "La spec no declara requisitos.", "vacio"));
          return caja;
        }

        const ticketsPorId = new Map();
        for (const sprint of f.decomposition?.sprints ?? []) {
          for (const t of sprint.tickets) ticketsPorId.set(t.id, t.state);
        }

        caja.append(tablaRequisitos(requisitos, ticketsPorId));

        if (f.decomposition === null) {
          caja.append(
            el(
              "div",
              "Sin tickets.yaml no hay cobertura declarada: la columna «Cubierto por» está vacía por eso, no porque falte trabajo.",
              "nota",
            ),
          );
        }
        return caja;
      }

      /** El grafo: sprints, tickets, dependencias y quién existe ya. */
      function panelGrafo(f) {
        const caja = el("div");

        if (f.decomposition === null) {
          caja.append(
            el("div", f.decompositionError ?? "Todavía no hay descomposición.", "vacio"),
          );
          return caja;
        }

        for (const sprint of f.decomposition.sprints) {
          const cajaSprint = el("div", undefined, "sprint");
          const cabecera = el("header");
          cabecera.append(el("span", sprint.id, "id"), el("h3", sprint.goal));
          cajaSprint.append(cabecera);

          const tabla = el("table");
          const thead = el("thead");
          const fila = el("tr");
          for (const columna of ["Ticket", "Estado", "Depende de"])
            fila.append(el("th", columna));
          thead.append(fila);

          const tbody = el("tbody");
          for (const t of sprint.tickets) {
            // Un ticket del grafo que aún no está en el registro se atenúa: la
            // diferencia entre «planeado» y «escrito» es lo que se mira aquí.
            const tr = el("tr", undefined, t.exists ? "" : "planeado");

            const celda = el("td");
            celda.append(el("div", t.title || "(sin título)"), el("div", t.id, "id"));
            tr.append(celda);

            const celdaEstado = el("td");
            celdaEstado.append(
              t.exists
                ? el("span", t.state, "etiqueta")
                : el("span", "por crear", "etiqueta"),
            );
            tr.append(celdaEstado);

            const celdaDeps = el("td");
            celdaDeps.append(
              el(
                "span",
                t.dependsOn.length === 0 ? "—" : t.dependsOn.join(", "),
                "depende",
              ),
            );
            tr.append(celdaDeps);

            tbody.append(tr);
          }

          tabla.append(thead, tbody);
          cajaSprint.append(tabla);
          caja.append(cajaSprint);
        }

        const creados = [...(f.decomposition?.sprints ?? [])]
          .flatMap((s) => s.tickets)
          .filter((t) => t.exists).length;
        const total = [...(f.decomposition?.sprints ?? [])].flatMap(
          (s) => s.tickets,
        ).length;
        caja.append(
          el(
            "div",
            `${creados} de ${total} ticket(s) del grafo existen ya en el registro. Los atenuados están planeados y todavía no escritos.`,
            "nota",
          ),
        );
        return caja;
      }

      /**
       * Descarga el reporte Markdown.
       *
       * Se pide el texto a la API y se arma el archivo en el navegador con un
       * `Blob`: un enlace directo a `/api/report` abriría el Markdown en una
       * pestaña, que es lo contrario de lo que se quiere —pegarlo en un correo—.
       */
      async function descargarReporte() {
        const datos = await api("GET", "/api/report");
        const blob = new Blob([datos.markdown], { type: "text/markdown;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement("a");
        enlace.href = url;
        enlace.download = datos.filename;
        enlace.click();
        URL.revokeObjectURL(url);
      }

      // ── Vista: un ticket, con sus gates ───────────────────────────────────

      /** Los colores y el nombre legible de cada tipo de proposición. */
      const MODALIDAD = { human: "humano", auto: "automático", hybrid: "híbrido" };
      const MARCA = { pass: "✓", fail: "✗", warn: "!", skip: "·" };

      /** Una barra con el valor y los dos umbrales: hace visible la decisión. */
      function barraValor(valor, mark, policy) {
        const barra = el("div", undefined, "barra");
        const relleno = el("div", undefined, `relleno ${mark}`);
        relleno.style.width = `${Math.max(0, Math.min(1, valor)) * 100}%`;
        barra.append(relleno);
        for (const corte of [policy.blockAt, policy.approveAt]) {
          const marca = el("div", undefined, "corte");
          marca.style.left = `${corte * 100}%`;
          barra.append(marca);
        }
        return barra;
      }

      /** Los checks que decide el código, sin coste y antes de evaluar. */
      function listaChecks(checks) {
        const lista = el("div", undefined, "checks");
        for (const check of checks) {
          const fila = el("div", undefined, "check");
          fila.append(
            el("span", MARCA[check.result] ?? "·", `marca ${check.result}`),
            el("span", check.id),
            el("span", check.detail ?? "", "detalle"),
          );
          lista.append(fila);
        }
        return lista;
      }

      /** Las proposiciones evaluadas, con la probabilidad que se comparó. */
      function tablaProposiciones(recibo, policy) {
        const tabla = el("table", undefined, "proposiciones");
        const thead = el("thead");
        const fila = el("tr");
        for (const columna of ["Proposición", "Valor", "", "Umbral", "Resultado"]) {
          fila.append(el("th", columna));
        }
        thead.append(fila);

        const tbody = el("tbody");
        for (const p of recibo.propositions) {
          const tr = el("tr");

          // Lo que se juzgó va primero y en su texto: `criterio_03` en banda de
          // revisión no dice nada, y el criterio que representa sí. Debajo queda
          // el identificador con su valor, que es lo que hace falta para
          // rastrearlo en el recibo.
          const celdaProposicion = el("td");
          if (p.description) {
            celdaProposicion.append(
              el("div", p.description, "criterio-texto"),
              el("div", p.label || p.id, "etiqueta-proposicion"),
            );
          } else {
            celdaProposicion.append(el("div", p.label || p.id, "etiqueta-proposicion"));
          }
          tr.append(celdaProposicion);
          tr.append(el("td", p.value.toFixed(3), "cifra"));

          const celdaBarra = el("td");
          celdaBarra.append(barraValor(p.value, p.mark, policy));
          tr.append(celdaBarra);

          tr.append(
            el(
              "td",
              p.verdict ? `${policy.approveAt} / ${policy.blockAt}` : "no veta",
              "cifra",
            ),
          );

          const celdaResultado = el("td");
          const texto = {
            approve: "aprueba",
            block: "bloquea",
            review: "en banda media",
            descriptive: "descriptiva",
          }[p.mark];
          celdaResultado.append(
            el("span", texto, p.mark === "descriptive" ? "descriptiva" : "etiqueta"),
          );
          if (p.reason) celdaResultado.append(el("div", p.reason, "resultado"));
          tr.append(celdaResultado);

          tbody.append(tr);
        }
        tabla.append(thead, tbody);
        return tabla;
      }

      /** La decisión vigente de un gate, con todo lo que la hace auditable. */
      function bloqueDecision(recibo, gate, ticketId, alDecidir) {
        const cont = el("div");

        const veredicto = el("div", undefined, "veredicto");
        veredicto.append(
          el("span", recibo.outcome.toUpperCase(), `salida ${recibo.outcome}`),
          el("span", recibo.reason, "motivo"),
          el("span", recibo.actor, "etiqueta"),
        );
        cont.append(veredicto);

        // Una aprobación de un estado que ya no existe no es una aprobación.
        if (recibo.stale) {
          cont.append(
            el(
              "div",
              "El ticket cambió desde que se emitió este recibo. La decisión es sobre el " +
                "estado congelado, no sobre el ticket actual: hay que volver a evaluar.",
              "obsoleto",
            ),
          );
        }

        // Un renglón que explique la banda antes de la tabla: sin él, «en banda
        // media» es una palabra que hay que interpretar.
        if (recibo.propositions.some((p) => p.mark === "review")) {
          cont.append(
            el(
              "div",
              `Ninguna proposición llegó a los umbrales: por debajo de ${gate.policy.blockAt} bloquea, ` +
                `a partir de ${gate.policy.approveAt} aprueba, y lo que cae en medio es lo que tienes que decidir tú. ` +
                "Las que aparecen como «descriptiva» se registran pero no vetan.",
              "resultado",
            ),
          );
        }
        cont.append(
          tablaProposiciones(recibo, gate.policy),
          listaChecks(recibo.mechanicalChecks),
        );

        const pie = el("div", undefined, "pie-recibo");
        pie.append(
          el("span", undefined, `media ponderada ${recibo.weightedMean.toFixed(3)}`),
          el(
            "span",
            undefined,
            `evaluador ${recibo.model?.resolvedVersion ?? "— (decisión en código)"}`,
          ),
          el("span", undefined, `coste $${(recibo.usage?.costUsd ?? 0).toFixed(6)}`),
          el("span", undefined, `${recibo.latencyMs ?? 0} ms`),
          el("span", undefined, `congelado ${recibo.stateHash.slice(0, 23)}…`),
        );
        cont.append(pie);

        // La decisión humana.
        if (recibo.humanDecision !== null) {
          const humana = el("div", undefined, "decision-humana");
          const quien = el("div", undefined, "quien");
          quien.append(
            el("strong", recibo.humanDecision.actor),
            el(
              "span",
              ` ${recibo.humanDecision.decision === "approve" ? "aprobó" : "rechazó"} · ${recibo.humanDecision.decidedAt}`,
            ),
          );
          humana.append(quien);
          if (recibo.humanDecision.reason) {
            humana.append(el("div", recibo.humanDecision.reason, "resultado"));
          }
          cont.append(humana);
        } else if (recibo.escalatedTo === "human") {
          const humana = el("div", undefined, "decision-humana");
          humana.append(
            el(
              "div",
              "El evaluador no alcanzó ninguno de los dos umbrales: la decisión es de una persona.",
              "resultado",
            ),
          );

          const acciones = el("div", undefined, "acciones");
          acciones.style.justifyContent = "flex-start";
          acciones.style.marginTop = "10px";

          const motivo = document.createElement("input");
          motivo.type = "text";
          motivo.placeholder = "Motivo de la decisión";
          motivo.style.flex = "1 1 260px";

          const aprobar = el("button", "Aprobar", "principal");
          const rechazar = el("button", "Rechazar", "peligro");
          const decidir = async (decision, boton) => {
            if (responsable.trim() === "") {
              alert(
                "Escribe el responsable antes de decidir: una decisión humana sin nombre no es auditable.",
              );
              return;
            }
            boton.disabled = true;
            try {
              await api(
                "POST",
                `/api/tickets/${ticketId}/gates/${recibo.gate}/${recibo.receiptId}/decision`,
                {
                  decision,
                  actor: responsable,
                  reason: motivo.value,
                },
              );
              await alDecidir();
            } catch (error) {
              alert(error.message);
              boton.disabled = false;
            }
          };
          aprobar.addEventListener("click", () => void decidir("approve", aprobar));
          rechazar.addEventListener("click", () => void decidir("reject", rechazar));

          acciones.append(motivo, aprobar, rechazar);
          humana.append(acciones);
          cont.append(humana);
        }

        const detalles = el("details");
        detalles.append(el("summary", "Ver el informe del CLI, tal cual"));
        const pre = el(
          "pre",
          recibo.report || "(el informe solo se guarda al evaluar desde la interfaz)",
        );
        detalles.append(pre);
        cont.append(detalles);

        return cont;
      }

      /** Una tarjeta de gate: lo que ya sabe el código y lo que se puede hacer. */
      function tarjetaGate(gate, decisiones, recargar) {
        const cont = el("section", undefined, "gate");

        const cabecera = el("div", undefined, "gate-cabecera");
        cabecera.append(
          el("h3", `${gate.id} — ${gate.title}`),
          el("span", MODALIDAD[gate.mode], "etiqueta"),
          el("span", gate.transition, "etiqueta"),
          gate.applies
            ? el("span", "aplica", "etiqueta aprueba")
            : el(
                "span",
                `no aplica en ${gate.workflowStatus || "un ticket ilegible"}`,
                "etiqueta",
              ),
        );
        cont.append(cabecera);

        cont.append(
          el(
            "div",
            `Umbrales: aprueba ≥ ${gate.policy.approveAt} · bloquea ≤ ${gate.policy.blockAt} · ` +
              `${gate.propositionCount} proposición(es)` +
              (gate.blockedByCode ? " · el código ya sabe que va a bloquear" : ""),
            "gate-meta",
          ),
        );

        const vigente = decisiones.find((d) => d.gate === gate.id);
        // Los checks se muestran antes de evaluar; después van dentro del
        // recibo, donde son parte de la auditoría y no un duplicado.
        if (vigente === undefined) cont.append(listaChecks(gate.mechanicalChecks));

        const acciones = el("div", undefined, "acciones");
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        // Solo se ofrecen los evaluadores que pueden decidir **este** gate. Un
        // desplegable con una opción que siempre falla es una trampa.
        const evaluador = document.createElement("select");
        const opciones = [
          [
            "auto",
            gate.hasCommandChecks
              ? "evaluador automático (código primero)"
              : "evaluador automático",
          ],
          ["jev", "Jev (probabilidades)"],
          ["llm-judge", "modelo de chat"],
        ];
        if (gate.hasCommandChecks) opciones.push(["command", "solo checks deterministas"]);
        for (const [valor, etiqueta] of opciones) {
          evaluador.append(new Option(etiqueta, valor));
        }

        const evaluar = el(
          "button",
          "Evaluar",
          gate.applies && !gate.blockedByCode ? "principal" : "",
        );
        evaluar.disabled = !gate.applies || gate.blockedByCode;
        evaluar.addEventListener("click", async () => {
          evaluar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "evaluando…";
          try {
            const r = await api(
              "POST",
              `/api/tickets/${gate.ticketId}/gates/${gate.id}/run`,
              {
                evaluator: evaluador.value,
              },
            );
            if (!r.ok) {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
            await recargar();
          } catch (error) {
            salida.className = "resultado error";
            salida.textContent = error.message;
          } finally {
            evaluar.disabled = false;
          }
        });

        acciones.append(salida, evaluador, evaluar);
        cont.append(acciones);

        if (vigente !== undefined) {
          cont.append(bloqueDecision(vigente, gate, gate.ticketId, recargar));
          const anteriores = decisiones.filter((d) => d.gate === gate.id).length - 1;
          if (anteriores > 0) {
            cont.append(
              el(
                "div",
                `${anteriores} recibo(s) anterior(es) en el registro append-only`,
                "historial",
              ),
            );
          }
        } else {
          cont.append(el("div", "Sin evaluar todavía.", "resultado"));
        }

        return cont;
      }

      /** El detalle de un ticket, con la pantalla de gates delante. */
      async function vistaTicket(id) {
        const cont = $("contenido");
        cont.textContent = "";

        const t = await api("GET", `/api/tickets/${id}`);

        const volver = el("a", "← Todos los tickets", "volver enlace");
        volver.href = "#/tickets";
        cont.append(volver);

        const cabecera = el("div", undefined, "cabecera-ticket");
        cabecera.append(el("h2", t.title));
        const meta = el("div", undefined, "meta");
        meta.append(
          el("span", t.id, "id"),
          el("span", `${t.type} · ${t.module}`, "etiqueta"),
          el("span", t.workflowStatus, "etiqueta"),
          el("span", `QA ${t.qaStatus}`, "etiqueta"),
          el("span", t.releaseStatus, "etiqueta"),
        );
        if (t.riskLevel !== "normal") {
          meta.append(el("span", `riesgo ${t.riskLevel}`, "etiqueta critico"));
        }
        if (t.criticalImpacts.length > 0) {
          meta.append(el("span", t.criticalImpacts.join(" · "), "etiqueta critico"));
        }
        if (t.invalid !== null) {
          meta.append(el("span", "inválido", "etiqueta roto"));
        }
        cabecera.append(meta, el("div", t.path, "ruta"));
        cont.append(cabecera);

        if (t.invalid !== null) {
          const nota = el("div", undefined, "nota alerta");
          nota.append(el("strong", "El ticket no valida. "), el("span", t.invalid));
          cont.append(nota);
        }

        // ── Gates ──
        cont.append(el("h2", "Gates"));

        const barraResponsable = el("div", undefined, "responsable");
        const etiquetaResponsable = el("label", "Responsable de las decisiones");
        etiquetaResponsable.htmlFor = "responsable";
        const entradaResponsable = document.createElement("input");
        entradaResponsable.type = "text";
        entradaResponsable.id = "responsable";
        entradaResponsable.placeholder = "Tu nombre";
        entradaResponsable.value = responsable;
        entradaResponsable.style.maxWidth = "260px";
        entradaResponsable.addEventListener("change", () =>
          guardarResponsable(entradaResponsable.value),
        );
        const ayudaResponsable = el(
          "span",
          "Se registra en el recibo junto a la decisión: aprobar sin nombre no es auditable.",
          "resultado",
        );
        barraResponsable.append(etiquetaResponsable, entradaResponsable, ayudaResponsable);
        cont.append(barraResponsable);

        const zonaGates = el("div");
        cont.append(zonaGates);

        const zonaCorrecciones = el("div");
        cont.append(zonaCorrecciones);

        const pintarCorrecciones = (correcciones) => {
          zonaCorrecciones.textContent = "";
          for (const c of correcciones) {
            const caja = el("div", undefined, "correccion");
            caja.append(
              el(
                "div",
                c.retryExhausted
                  ? `Segundo rechazo del gate ${c.gate}: no queda reintento automático`
                  : `Corrección pendiente del gate ${c.gate}`,
                "correccion-titulo",
              ),
            );
            const quien = el("div", undefined, "resultado");
            quien.append(
              el("span", `Rechazado por ${c.actor} · ${c.decidedAt.slice(0, 10)}`),
              c.retryExhausted
                ? el(
                    "span",
                    " — el autor ya corrigió una vez y volvió a rechazarse. Decide tú: aprobar, o cambiar el plan a mano.",
                  )
                : el(
                    "span",
                    " — el motivo está en el historial del ticket, listo para corregir.",
                  ),
            );
            caja.append(quien);
            if (c.reason) caja.append(el("div", c.reason, "correccion-motivo"));
            zonaCorrecciones.append(caja);
          }
        };

        const cargarGates = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaGates.textContent = "";
          pintarCorrecciones(datos.corrections ?? []);
          for (const gate of datos.gates) {
            zonaGates.append(
              tarjetaGate({ ...gate, ticketId: id }, datos.decisions, async () => {
                guardarResponsable(entradaResponsable.value);
                await cargarGates();
              }),
            );
          }
        };
        await cargarGates();

        // ── Avanzar el estado ──
        // Los estados los calcula el servidor desde la tabla del contrato. Aquí
        // solo se pintan: ofrecer un movimiento que la tabla no permite sería
        // ofrecer un botón que falla.
        const zonaTransiciones = el("div");
        cont.append(zonaTransiciones);

        const cargarTransiciones = async () => {
          const datos = await api("GET", `/api/tickets/${id}/gates`);
          zonaTransiciones.textContent = "";
          const t = datos.transitions;
          if (t === null) return;

          cont.append(el("h2", "Avanzar el estado"));
          const caja = el("div", undefined, "transiciones");

          const fila = (etiqueta, desde, destinos, entidad, pointId) => {
            const linea = el("div", undefined, "transicion");
            linea.append(el("span", `${etiqueta}: ${desde}`, "resultado"));
            if (destinos.length === 0) {
              linea.append(el("span", "sin salidas", "resultado"));
            }
            for (const destino of destinos) {
              const boton = el("button", destino);
              boton.addEventListener("click", async () => {
                boton.disabled = true;
                salidaTransicion.className = "resultado";
                salidaTransicion.textContent = "moviendo…";
                try {
                  const r = await api("POST", `/api/tickets/${id}/transition`, {
                    entity: entidad,
                    to: destino,
                    ...(pointId === undefined ? {} : { pointId }),
                  });
                  salidaTransicion.className = "resultado ok";
                  salidaTransicion.textContent = r.details;
                  await navegar();
                } catch (fallo) {
                  // Un rechazo del motor —precondición incumplida, transición
                  // ilegal— se muestra tal cual: es la explicación.
                  salidaTransicion.className = "resultado error";
                  salidaTransicion.textContent = fallo.message;
                  boton.disabled = false;
                }
              });
              linea.append(boton);
            }
            return linea;
          };

          const salidaTransicion = el("div", undefined, "resultado");
          caja.append(fila("Ticket", t ? "→" : "", t.ticket, "ticket"));
          caja.append(fila("Release", "→", t.release, "release"));
          for (const punto of t.points) {
            if (punto.to.length === 0) continue;
            caja.append(fila(punto.id, "→", punto.to, "point", punto.id));
          }
          caja.append(salidaTransicion);
          zonaTransiciones.append(caja);
        };
        await cargarTransiciones();

        // ── Contenido del ticket ──
        cont.append(el("h2", "Contenido"));

        const partes = [
          ["Solicitud", t.request],
          ["Descripción funcional", t.sections["Descripción funcional"]],
          ["Diagnóstico", t.sections["Diagnóstico"]],
          ["Plan", t.sections["Plan"]],
          ["Criterios de aceptación", t.sections["Criterios de aceptación"]],
          ["Implementación", t.sections["Implementación"]],
          ["Pruebas", t.sections["Pruebas"]],
          ["Release", t.sections["Release"]],
        ];
        const bloques = [
          [`Puntos (${t.points.length})`, t.points],
          [`QA (${t.qa.length})`, t.qa],
          [`Evidencia (${t.evidence.length})`, t.evidence],
          [`Retests (${t.retests.length})`, t.retests],
          [`Cierre (${t.closures.length})`, t.closures],
          [`Eventos (${t.events.length})`, t.events],
          [`Consumo de IA (${t.usage.length})`, t.usage],
        ];

        cont.append(el("h2", "Línea de tiempo y coste"));
        const zonaLinea = el("div");
        zonaLinea.append(el("div", "Leyendo la contabilidad del cliente…", "vacio"));
        cont.append(zonaLinea);
        void pintarLineaDeTiempo(id).then((nodo) => {
          if (nodo === null) return;
          zonaLinea.textContent = "";
          zonaLinea.append(nodo);
        });

        const barraSecciones = el("div", undefined, "secciones");
        const cuerpo = el("pre");
        const mostrar = (etiqueta, valor, boton) => {
          for (const otro of barraSecciones.querySelectorAll("button")) {
            otro.setAttribute("aria-pressed", String(otro === boton));
          }
          cuerpo.textContent =
            typeof valor === "string"
              ? valor.trim() === ""
                ? "(vacío)"
                : valor
              : JSON.stringify(valor, null, 2);
        };

        for (const [etiqueta, valor] of [...partes, ...bloques]) {
          const boton = el("button", etiqueta);
          boton.setAttribute("aria-pressed", "false");
          boton.addEventListener("click", () => mostrar(etiqueta, valor, boton));
          barraSecciones.append(boton);
        }

        cont.append(barraSecciones, cuerpo);
        mostrar(partes[0][0], partes[0][1], barraSecciones.querySelector("button"));
      }

      // ── Línea de tiempo del ticket ────────────────────────────────────────
      //
      // Responde a una pregunta que el registro no contestaba: quién intervino,
      // con qué modelo y a qué coste. Los recibos de compuerta traen el coste
      // porque el harness evaluó y lo sabe de primera mano; el trabajo del agente
