          eleccion[rol.role] = {
            provider: rol.provider,
            model: rol.model,
            effort: rol.effort,
            source: rol.source,
          };
        }

        // Los proveedores con su lista de modelos. Se pide aquí y no al cambiar de
        // proveedor para que el desplegable de la izquierda sea instantáneo.
        const catalogo = await catalogoDeModelos();
        let preset = guardado.preset === "" ? "balanced" : guardado.preset;
        let textoPrevio = guardado.text;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Aquí solo se configuran los modelos que el harness ejecuta. "),
          el(
            "span",
            "Son cuatro: el evaluador que responde las proposiciones del gate, el juez " +
              "al que se cae cuando el evaluador no puede decidir, el que propone " +
              "cambios de configuración en el chat, y el arquitecto que descompone una " +
              "feature en tickets. El modelo con el que trabaja el agente —explorar, " +
              "escribir, editar— lo elige opencode con su propia configuración: el " +
              "harness no es un runtime de agentes y no puede imponerle el suyo.",
          ),
        );
        cont.append(nota);
        await seccionPerfiles(cont, catalogo);
        await seccionModeloPorFase(cont);
        cont.append(el("h2", "Preset"));

        const presets = el("div", undefined, "presets");
        const explicacion = el("div", undefined, "resultado");
        const botonesPreset = new Map();
        for (const p of guardado.presets) {
          const boton = el("button", p.id);
          boton.addEventListener("click", () => {
            preset = p.id;
            // Elegir un preset no reescribe lo que el proyecto ya decidió: los
            // overrides se quedan, y la columna de origen lo dirá.
            for (const boton of botonesPreset.values())
              boton.setAttribute("aria-pressed", "false");
            boton.setAttribute("aria-pressed", "true");
            explicacion.textContent = p.description;
            void refrescar();
          });
          botonesPreset.set(p.id, boton);
          presets.append(boton);
        }
        for (const [id, boton] of botonesPreset) {
          boton.setAttribute("aria-pressed", String(id === preset));
          if (id === preset) {
            explicacion.textContent =
              guardado.presets.find((p) => p.id === id)?.description ?? "";
          }
        }
        cont.append(presets, explicacion);

        // De dónde sale cada lista. Se dice porque un desplegable corto sin
        // explicación parece un fallo, y lo que pasa es que ese proveedor no
        // publica sus modelos o no respondió.
        const sinLista = [...catalogo.values()].filter((e) => e.models === null);
        const conError = sinLista.filter((e) => e.error !== null);
        const origenCatalogo = el(
          "div",
          `${catalogo.size} proveedor(es) configurado(s). ` +
            (sinLista.length === 0
              ? "Todos publican su lista de modelos."
              : `Sin lista: ${sinLista.map((e) => e.provider.name).join(", ")}. En esos, el modelo se escribe.`) +
            (conError.length === 0
              ? ""
              : ` No respondieron: ${conError.map((e) => `${e.provider.name} (${e.error})`).join("; ")}.`),
          "resultado",
        );
        cont.append(origenCatalogo);

        cont.append(el("h2", "Modelo por rol"));

        const tabla = el("table", undefined, "roles");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Rol", "Modelo", "Esfuerzo", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        /**
         * El selector de un rol: proveedor y modelo.
         *
         * Antes era una sola lista con el catálogo de OpenRouter, así que elegir
         * un modelo de otro proveedor era imposible desde la pantalla: había que
         * editar el YAML. Y el proveedor viaja con el modelo porque los dos son la
         * decisión —el mismo identificador puede existir en dos y no ser el
         * mismo modelo—.
         */
        const modeloSelect = (rol) =>
          selectorDeModelo({
            provider: eleccion[rol.role].provider,
            model: eleccion[rol.role].model,
            catalog: catalogo,
            onProvider: (id) => {
              eleccion[rol.role].provider = id;
              explicitos.add(rol.role);
              void refrescar();
            },
            onModel: (id) => {
              eleccion[rol.role].model = id;
              explicitos.add(rol.role);
              void refrescar();
            },
          });

        const esfuerzoSelect = (rol) => {
          const sel = document.createElement("select");
          for (const valor of ["auto", "low", "medium", "high"]) {
            sel.append(new Option(valor, valor));
          }
          sel.value = eleccion[rol.role].effort;
          sel.addEventListener("change", () => {
            eleccion[rol.role].effort = sel.value;
            explicitos.add(rol.role);
            void refrescar();
          });
          return sel;
        };

        for (const rol of guardado.roles) {
          const tr = el("tr");

          const celdaRol = el("td");
          celdaRol.append(
            el("div", rol.role, "rol"),
            el("div", rol.description, "descripcion"),
          );
          if (rol.consumer === null) {
            celdaRol.append(
              el("div", "declarado: todavía no lo ejecuta nada", "sin-consumidor"),
            );
          }
          tr.append(celdaRol);

          const celdaModelo = el("td");
          celdaModelo.append(modeloSelect(rol));
          tr.append(celdaModelo);

          const celdaEsfuerzo = el("td");
          celdaEsfuerzo.append(esfuerzoSelect(rol));
          tr.append(celdaEsfuerzo);

          const ORIGEN = {
            proyecto: "definido en este proyecto",
            perfil: rol.perfil ? `perfil ${rol.perfil.id} (${rol.perfil.alcance})` : "perfil",
            preset: `del preset ${preset}`,
            sistema: "valor del sistema",
            "sin-asignar": "sin asignar",
          };
          const celdaOrigen = el("td");
          celdaOrigen.append(el("span", ORIGEN[rol.source] ?? rol.source, "resultado"));
          if (rol.consumer !== null) {
            celdaOrigen.append(el("div", rol.consumer, "sin-consumidor"));
          }
          tr.append(celdaOrigen);

          tr.append(el("td"));
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);

        // El aviso que evita perder la reproducibilidad sin enterarse.
        const avisoJev = el("div", undefined, "aviso-jev");
        cont.append(avisoJev);

        cont.append(el("h2", "Diferencias antes de guardar"));
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;
        const salida = el("div", "resultado");
        // La barra va **fija** al pie de la vista: el botón estaba al final de la
        // tabla y no se encontraba. Dice cuántos cambios hay pendientes, que es lo
        // que hacía falta saber sin bajar.
        const cuenta = el("div", "", "cuenta");
        const guardar = el("button", "Guardar el routing", "principal");
        guardar.disabled = true;
        const acciones = el("div", undefined, "barra-guardado");
        acciones.append(cuenta, salida, guardar);
        cont.append(diff, error, acciones);

        /**
         * Los roles que se escriben en el archivo.
         *
         * Solo los explícitos: los que ya estaban definidos en el proyecto y los
         * que el usuario acaba de tocar. Escribir los trece haría creer que el
         * proyecto decidió sobre los trece, y cambiar el preset dejaría de tener
         * efecto sin que nadie entendiera por qué.
         */
        const explicitos = new Set(
          guardado.roles.filter((rol) => rol.source === "proyecto").map((rol) => rol.role),
        );
        const rolesDelFormulario = () => {
          const roles = {};
          for (const rol of guardado.roles) {
            if (!explicitos.has(rol.role)) continue;
            roles[rol.role] = {
              provider: eleccion[rol.role].provider,
              model: eleccion[rol.role].model,
              effort: eleccion[rol.role].effort,
            };
          }
          return roles;
        };

        const refrescar = async () => {
          try {
            const previsualizacion = await api("POST", "/api/routing/preview", {
              preset,
              roles: rolesDelFormulario(),
            });
            const estado = previsualizacion.routing;

            error.hidden = estado.ok;
            error.textContent = estado.ok ? "" : estado.error;

            diff.textContent = "";
            const cambios = estado.diff.filter((linea) => linea.kind !== "same");
            if (cambios.length === 0) {
              diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
            } else {
              for (const linea of estado.diff) {
                diff.append(
                  el(
                    "div",
                    `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                    linea.kind,
                  ),
                );
              }
            }

            const evaluador = estado.roles.find((r) => r.role === "gate-evaluator");
            // El aviso lleva números medidos, no adjetivos: en el mismo gate de
            // 14 proposiciones, Jev tarda 0,8 s y cuesta $0,000158; un modelo de
            // chat con razonamiento por defecto **no termina** en 90 s.
            avisoJev.textContent =
              evaluador !== undefined && evaluador.probabilistic
                ? "El evaluador de gates usa Jev: emite probabilidades calibradas y el código compara contra umbrales. Medido en un gate de 14 proposiciones: 0,8 s y $0,000158."
                : "⚠ El evaluador de gates está configurado con un modelo de chat. El gate sigue funcionando, pero pasa a ser un juez que interpreta texto: pierde la calibración y dos ejecuciones del mismo ticket pueden no coincidir. Medido: 36 s y $0,00073 con esfuerzo bajo, y más de 90 s —el límite— con el razonamiento por defecto. Si eliges esta vía, pon el esfuerzo en «low».";

            guardar.disabled = !estado.ok || cambios.length === 0;
            guardar.textContent =
              cambios.length === 0 ? "Sin cambios" : "Guardar el routing";
            // La cuenta de la barra fija: es lo que dice si hay algo pendiente sin
            // tener que bajar hasta el botón.
            cuenta.className = cambios.length === 0 ? "cuenta" : "cuenta pendiente";
            cuenta.textContent =
              cambios.length === 0
                ? "Todo guardado."
                : `${cambios.length} cambio(s) sin guardar.`;
            textoPrevio = previsualizacion.text;
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          try {
            const r = await api("PUT", "/api/routing", { text: textoPrevio });
            if (r.routing.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
              guardado.text = r.text;
              // Se recarga la vista: los orígenes cambian de "preset" a
              // "proyecto", y esa es justamente la información que importa.
              await vistaModelos();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.routing.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        });

        await refrescar();
      }

      // ── Perfiles de modelos ──────────────────────────────────────────────

      /**
       * La sección «Perfiles» de la vista Modelos: ver, crear a partir de otro,
       * editar y elegir. Solo habla con `/api/perfiles`; el archivo lo escribe el
       * servidor con las mismas funciones que usa el código.
       */
      /**
       * «Modelo por fase»: el modelo efectivo de cada fase del agente con su origen, y al lado
       * el último que el cliente reportó haber usado (R-PERF-005, R-PERF-006).
       *
       * Solo lee `GET /api/modelos/fases`. El costo es el que reportó el cliente
       * (equivalente de suscripción, no factura) y se rotula así.
       */
      async function seccionModeloPorFase(cont) {
        cont.append(el("h2", "Modelo por fase"));
        const barra = el("div", undefined, "selector-ejecutor");
        const salida = el("div", undefined, "resultado");
        const zona = el("div");
        cont.append(barra, salida, zona);

        const ORIGEN_FASE = {
          proyecto: "definido en el proyecto",
          preset: "del preset",
          sistema: "valor del sistema",
          "sin-asignar": "sin asignar",
        };
        const origenLegible = (origen) =>
          origen.source === "perfil" && origen.perfil
            ? `perfil ${origen.perfil.id} (${origen.perfil.alcance})`
            : (ORIGEN_FASE[origen.source] ?? origen.source);

        const pintar = (datos) => {
          zona.textContent = "";
          if (datos.aviso) {
            salida.className = "resultado error";
            salida.textContent = datos.aviso;
          } else {
            salida.className = "resultado";
            salida.textContent = "";
          }
          if (!datos.fases || datos.fases.length === 0) return;
          const tabla = el("table", undefined, "modelo-fase");
          const cabecera = el("tr");
          for (const columna of ["Fase", "Efectivo", "Origen", "Usado"]) cabecera.append(el("th", columna));
          const thead = el("thead");
          thead.append(cabecera);
          const tbody = el("tbody");
          for (const fase of datos.fases) {
            const u = fase.usado;
            const tr = el("tr", undefined, u !== null && u.coincide === false ? "discrepancia" : undefined);
            const celda = (rotulo) => {
              const td = el("td");
              td.setAttribute("data-rotulo", rotulo);
              return td;
            };

            const cFase = celda("Fase");
            cFase.append(el("div", fase.fase, "fase-nombre"));
            const cEfectivo = celda("Efectivo");
            cEfectivo.append(
              el("div", fase.model === "" ? "(sin modelo)" : fase.model, "modelo-id"),
              el("div", `${fase.provider === "" ? "(sin proveedor)" : fase.provider} · esfuerzo ${fase.effort}`, "detalle-fase"),
            );
            const cOrigen = celda("Origen");
            cOrigen.append(el("span", origenLegible(fase.origen), "resultado"));

            const cUsado = celda("Usado");
            if (u === null) {
              cUsado.append(el("span", "sin registros", "resultado"));
            } else {
              cUsado.append(
                el("div", u.modeloUsado === null ? "sin reportar" : u.modeloUsado, "modelo-id"),
                el("div", `ticket ${u.ticketId} · ${u.ejecutor}`, "detalle-fase"),
                el(
                  "div",
                  u.costeUsd === null ? "costo: sin reportar" : `costo: US$ ${u.costeUsd.toFixed(4)} (reportado por el cliente)`,
                  "detalle-fase",
                ),
              );
              if (u.coincide === false) {
                cUsado.append(el("div", `discrepancia: se declaró ${u.modelo}`, "marca-discrepancia"));
              }
            }
            tr.append(cFase, cEfectivo, cOrigen, cUsado);
            tbody.append(tr);
          }
          tabla.append(thead, tbody);
          zona.append(tabla);
        };

        const cargar = async (ejecutor) => {
          salida.className = "resultado";
          salida.textContent = "Cargando el modelo por fase…";
          try {
            pintar(
              await api(
                "GET",
                ejecutor === "" ? "/api/modelos/fases" : "/api/modelos/fases?ejecutor=" + encodeURIComponent(ejecutor),
              ),
            );
          } catch (fallo) {
            zona.textContent = "";
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        let datos;
        try {
          datos = await api("GET", "/api/modelos/fases");
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
          return;
        }
        const etiquetaEjecutor = el("label", "Ejecutor");
        const selector = document.createElement("select");
        selector.append(new Option("sin ejecutor", ""));
        for (const id of datos.ejecutores ?? []) selector.append(new Option(id, id));
        selector.addEventListener("change", () => void cargar(selector.value));
        barra.append(etiquetaEjecutor, selector);
        pintar(datos);
      }

      async function seccionPerfiles(cont, catalogo) {
        cont.append(el("h2", "Perfiles"));
        const salida = el("div", undefined, "resultado");
        const lista = el("div", undefined, "perfiles");
        const editor = el("div", undefined, "editor-perfil");
        cont.append(lista, salida, editor);

        salida.textContent = "Cargando perfiles…";
        let datos;
        try {
          datos = await api("GET", "/api/perfiles");
        } catch (fallo) {
          salida.className = "resultado error";
          salida.textContent = fallo.message;
          return;
        }
        salida.textContent = "";
        if (datos.error) {
          salida.className = "resultado error";
          salida.textContent = datos.error;
        }
        const { perfiles, seleccion, ejecutores, roles } = datos;

        const recargar = async () => {
          await vistaModelos();
        };

        const elegir = async (perfil, ejecutor) => {
          salida.className = "resultado";
          salida.textContent = "Guardando la elección…";
          try {
            const cuerpo = ejecutor === undefined ? { perfil } : { perfil, ejecutor };
            const r = await api("PUT", "/api/perfiles/seleccion", cuerpo);
            if (r.written) {
              await recargar();
            } else {
              salida.className = "resultado error";
              salida.textContent = r.errores.join(" ");
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          }
        };

        const abrirEditor = (base, editando) => {
          editor.textContent = "";
          const copia = {};
          for (const rol of roles) {
            const ruta = base.roles[rol.id];
            copia[rol.id] = {
              provider: ruta?.provider ?? "",
              model: ruta?.model ?? "",
              effort: ruta?.effort ?? "auto",
            };
          }
          editor.append(
            el("h3", editando ? `Editar ${base.id}` : `Nuevo perfil a partir de ${base.id}`),
          );

          const etiquetaId = el("label", "Id del perfil");
          const campoId = document.createElement("input");
          campoId.type = "text";
          campoId.value = editando ? base.id : "";
          campoId.disabled = editando;
          campoId.spellcheck = false;
          campoId.placeholder = "mi-perfil";
          etiquetaId.append(campoId);

          const etiquetaDesc = el("label", "Descripción");
          const campoDesc = document.createElement("input");
          campoDesc.type = "text";
          campoDesc.value = editando ? base.description : "";
          etiquetaDesc.append(campoDesc);
          editor.append(etiquetaId, etiquetaDesc);

          for (const rol of roles) {
            const fila = el("div", undefined, "fila-rol-perfil");
            fila.append(el("div", rol.id, "rol"));
            fila.append(
              selectorDeModelo({
                provider: copia[rol.id].provider,
                model: copia[rol.id].model,
                catalog: catalogo,
                onProvider: (id) => {
                  copia[rol.id].provider = id;
                },
                onModel: (id) => {
                  copia[rol.id].model = id;
                },
              }),
            );
            const etiquetaEsfuerzo = el("label", `Esfuerzo de ${rol.id}`);
            const esfuerzo = document.createElement("select");
            for (const valor of ["auto", "low", "medium", "high"]) {
              esfuerzo.append(new Option(valor, valor));
            }
            esfuerzo.value = copia[rol.id].effort;
            esfuerzo.addEventListener("change", () => {
              copia[rol.id].effort = esfuerzo.value;
            });
            etiquetaEsfuerzo.append(esfuerzo);
            fila.append(etiquetaEsfuerzo);
            editor.append(fila);
          }

          const guardarPerfil = el("button", "Guardar el perfil");
          const cancelar = el("button", "Cancelar");
          const resultado = el("div", undefined, "resultado");
          cancelar.addEventListener("click", () => {
            editor.textContent = "";
          });
          guardarPerfil.addEventListener("click", async () => {
            guardarPerfil.disabled = true;
            resultado.className = "resultado";
            resultado.textContent = "Guardando…";
            try {
              const cuerpo = {
                id: campoId.value.trim(),
                description: campoDesc.value.trim(),
                roles: copia,
              };
              if (!editando) cuerpo.base = base.id;
              const r = await api("PUT", "/api/perfiles", cuerpo);
              if (r.written) {
                await recargar();
                return;
              }
              // Cada línea tal como llega: dice el rol y el modelo que no existe.
              resultado.className = "resultado error";
              resultado.textContent = "";
              for (const linea of r.errores) resultado.append(el("div", linea));
            } catch (fallo) {
              resultado.className = "resultado error";
              resultado.textContent = fallo.message;
            } finally {
              guardarPerfil.disabled = false;
            }
          });
          editor.append(guardarPerfil, cancelar, resultado);
        };

        for (const perfil of perfiles) {
          const delProyecto = perfil.origen === "proyecto";
          const fila = el("div", undefined, "fila-perfil");
          fila.append(
            el("strong", perfil.id),
            el("span", delProyecto ? "del proyecto" : "incorporado", "origen-perfil"),
            el("span", perfil.description, "descripcion"),
          );
          if (seleccion.proyecto === perfil.id) {
            fila.append(el("span", "elegido para el proyecto", "marca-perfil"));
          }
          for (const ejecutor of ejecutores) {
            if (seleccion.ejecutores[ejecutor] === perfil.id) {
              fila.append(el("span", `elegido para ${ejecutor}`, "marca-perfil"));
            }
          }
          const crear = el("button", "Crear a partir de este");
          crear.addEventListener("click", () => abrirEditor(perfil, false));
          fila.append(crear);
          if (delProyecto) {
            const editar = el("button", "Editar");
            editar.addEventListener("click", () => abrirEditor(perfil, true));
            fila.append(editar);
          }
          lista.append(fila);
        }

        const selectorDeEleccion = (titulo, actual, ejecutor) => {
          const etiqueta = el("label", titulo);
          const sel = document.createElement("select");
          sel.append(new Option(ejecutor === undefined ? "sin perfil" : "sin perfil propio", ""));
          for (const perfil of perfiles) sel.append(new Option(perfil.id, perfil.id));
          sel.value = actual ?? "";
          sel.addEventListener("change", () => {
            void elegir(sel.value === "" ? null : sel.value, ejecutor);
          });
          etiqueta.append(sel);
          return etiqueta;
        };
        const elecciones = el("div", undefined, "elecciones-perfil");
        elecciones.append(selectorDeEleccion("Perfil del proyecto", seleccion.proyecto, undefined));
        for (const ejecutor of ejecutores) {
          elecciones.append(
            selectorDeEleccion(`Perfil de ${ejecutor}`, seleccion.ejecutores[ejecutor], ejecutor),
          );
        }
        cont.insertBefore(elecciones, salida);
      }

      // ── Vista: configuración ──────────────────────────────────────────────

      /**
       * El editor de `.valmen/config.yaml`.
       *
       * El texto es la fuente y se edita en crudo, así que los comentarios
       * sobreviven. Antes de guardar se muestra qué entendió el harness y qué
       * archivos generados quedan desactualizados: sin eso, el usuario tendría
       * que saber que `AGENTS.md` se genera, que es justo el conocimiento que la
       * app debe evitar exigir.
       */
      async function vistaConfiguracion() {
        const cont = $("contenido");
        cont.textContent = "";

        const datos = await api("GET", "/api/config");
        const estadoInicial = datos.config;

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Se guarda solo si el harness puede leerlo. "),
          el(
            "span",
            "El formato admite un subconjunto de YAML: escalares, listas de bloque y mapas por indentación. Si algo no encaja, se dice aquí y el archivo no se toca.",
          ),
        );
        cont.append(nota, el("h2", "Configuración del proyecto"));
        cont.append(el("div", estadoInicial.path, "ruta"));

        const editor = document.createElement("textarea");
        editor.className = "editor";
        editor.spellcheck = false;
        editor.value = estadoInicial.text;
        editor.setAttribute("aria-label", "Contenido de .valmen/config.yaml");

        // El panel de interpretación: lo que el harness entendió del texto.
        const interpretacion = el("div", undefined, "interpretacion");
        const diff = el("div", undefined, "diff");
        const error = el("div", undefined, "error-parser");
        error.hidden = true;

        const guardar = el("button", "Guardar los cambios", "principal");
        guardar.disabled = true;
        const regenerar = el("button", "Regenerar");
        regenerar.hidden = true;
        const salida = el("div", undefined, "resultado");
        salida.style.marginRight = "auto";

        let ultimo = null;

        const campo = (rotulo, valor) => {
          const caja = el("div", undefined, "campo");
          caja.append(el("div", rotulo, "rotulo"), el("div", valor, "valor"));
          return caja;
        };

        // Las políticas autónomas: lo que el harness entendió de cada una. «Editar» no
        // abre otro formato: lleva el editor de texto a la línea de la clave, o le agrega
        // un ejemplo comentado, y guardar sigue siendo el camino que valida y muestra el
        // efecto. Insertar el ejemplo no activa nada: está comentado.
        const politicas = el("div", undefined, "politicas");
        const editarPolitica = (politica) => {
          const lineas = editor.value.split("\n");
          const indice = lineas.findIndex((linea) => linea.startsWith(`${politica.clave}:`));
          if (indice >= 0) {
            if (typeof editor.setSelectionRange === "function") {
              const inicio = lineas.slice(0, indice).join("\n").length + (indice > 0 ? 1 : 0);
              editor.focus();
              editor.setSelectionRange(inicio, inicio + lineas[indice].length);
              editor.scrollTop = indice * 18;
            }
            return;
          }
          if (politica.ejemplo === null) return;
          const separador = editor.value === "" || editor.value.endsWith("\n") ? "" : "\n";
          editor.value = `${editor.value}${separador}\n${politica.ejemplo}\n`;
          analizar();
        };
        const pintarPoliticas = (resumen) => {
          politicas.textContent = "";
          politicas.hidden = resumen === null;
          if (resumen === null) return;
          for (const politica of resumen.policies ?? []) {
            const tarjeta = el("div", undefined, `politica ${politica.estado}`);
            const titulo = el("div", undefined, "titulo-politica");
            titulo.append(
              el("span", politica.titulo),
              el("span", politica.estado, "estado-politica"),
            );
            tarjeta.append(titulo);
            if (politica.error !== null) {
              tarjeta.append(el("div", politica.error, "error-politica"));
            } else {
              const lista = el("ul");
              for (const linea of politica.resumen) lista.append(el("li", linea));
              tarjeta.append(lista);
            }
            if (politica.soloLectura) {
              tarjeta.append(
                el(
                  "div",
                  "Solo lectura: los umbrales los firma una persona en el archivo, con su nombre y el motivo.",
                  "nota-politica",
                ),
              );
            } else {
              const existe = resumen.keys.includes(politica.clave);
              const editar = el(
                "button",
                existe ? "Editar en el archivo" : "Agregar un ejemplo",
              );
              editar.addEventListener("click", () => editarPolitica(politica));
              tarjeta.append(editar);
              if (!existe) {
                tarjeta.append(
                  el(
                    "div",
                    "El ejemplo se agrega comentado: no activa nada hasta que lo descomentes y guardes.",
                    "nota-politica",
                  ),
                );
              }
            }
            politicas.append(tarjeta);
          }
        };

        const pintar = (respuesta) => {
          const { config, impact } = respuesta;

          error.hidden = config.ok;
          error.textContent = config.ok ? "" : config.error;
          editor.classList.toggle("mal", !config.ok);

          pintarPoliticas(config.summary);
          interpretacion.textContent = "";
          if (config.summary !== null) {
            const s = config.summary;
            interpretacion.append(
              campo("nombre", s.name),
              campo(
                "registro de tickets",
                s.ticketsDir === "" ? "(por defecto)" : s.ticketsDir,
              ),
              campo(
                "gates declarados",
                s.gates.length === 0 ? "ninguno" : s.gates.join(", "),
              ),
              campo("claves", s.keys.join(", ")),
            );
            if (!s.adopted) {
              interpretacion.append(campo("adopción", "el archivo todavía no existe"));
            }
          }

          diff.textContent = "";
          const cambios = config.diff.filter((linea) => linea.kind !== "same");
          if (cambios.length === 0) {
            diff.append(el("div", "Sin cambios respecto de lo guardado.", "same"));
          } else {
            for (const linea of config.diff) {
              diff.append(
                el(
                  "div",
                  `${linea.kind === "add" ? "+" : linea.kind === "remove" ? "-" : " "} ${linea.text}`,
                  linea.kind,
                ),
              );
            }
          }

          // El aviso que evita la trampa de editar el archivo generado: se dice
          // aquí, antes de guardar, y no en un documento aparte.
          if (config.ok && impact !== null && impact.stale > 0) {
            const aviso = el("div", undefined, "same");
            aviso.append(
              el(
                "div",
                impact.stale === 1
                  ? `Quedará 1 archivo generado desactualizado: ${impact.files
                      .filter((f) => f.stale)
                      .map((f) => f.path)
                      .join(", ")}.`
                  : `Quedarán ${impact.stale} archivos generados desactualizados: ${impact.files
                      .filter((f) => f.stale)
                      .map((f) => f.path)
                      .join(", ")}.`,
              ),
              el(
                "div",
                impact.files.every((f) => f.path === "AGENTS.md")
                  ? "Es un archivo generado: editarlo a mano se pierde en la siguiente sincronización."
                  : "Son archivos generados: editarlos a mano se pierde en la siguiente sincronización.",
              ),
            );
            diff.append(aviso);
            regenerar.hidden = false;
            regenerar.textContent =
              impact.stale === 1
                ? "Regenerar 1 archivo"
                : `Regenerar ${impact.stale} archivos`;
          } else {
            regenerar.hidden = true;
          }

          ultimo = config;
          guardar.disabled = !config.ok || cambios.length === 0;
          guardar.textContent =
            cambios.length === 0 ? "Sin cambios" : "Guardar los cambios";
        };

        let temporizador;
        const analizar = () => {
          clearTimeout(temporizador);
          temporizador = setTimeout(async () => {
            try {
              pintar(await api("POST", "/api/config/check", { text: editor.value }));
            } catch (fallo) {
              salida.className = "resultado error";
              salida.textContent = fallo.message;
            }
          }, 250);
        };
        editor.addEventListener("input", analizar);

        guardar.addEventListener("click", async () => {
          guardar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "guardando…";
          try {
            const r = await api("PUT", "/api/config", { text: editor.value });
            pintar(r);
            if (r.config.written) {
              salida.className = "resultado ok";
              salida.textContent = "Guardado.";
            } else {
              salida.className = "resultado error";
              salida.textContent = "No se guardó: el texto no es válido.";
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
            // La petición falló, así que el botón vuelve a estar disponible
            // según lo que se sepa del texto; no se deja deshabilitado.
            guardar.disabled = ultimo?.ok !== true;
          }
        });

        // Regenerar existe para que nadie tenga que saber que `AGENTS.md` es un
        // archivo derivado. Se hace con la misma proyección que `valmen sync`.
        regenerar.addEventListener("click", async () => {
          regenerar.disabled = true;
          salida.className = "resultado";
          salida.textContent = "regenerando…";
          try {
            const r = await api("POST", "/api/config/sync");
            // Se repinta con el estado que devuelve el servidor: el aviso de
            // archivos pendientes desaparece porque ya no queda ninguno.
            pintar(await api("GET", "/api/config"));
            if (r.ok) {
              salida.className = "resultado ok";
              salida.textContent =
                r.written.length === 0
                  ? "Ya estaba al día."
                  : `Regenerados: ${r.written.join(", ")}.`;
            } else {
              salida.className = "resultado error";
              salida.textContent = r.error;
            }
          } catch (fallo) {
            salida.className = "resultado error";
            salida.textContent = fallo.message;
          } finally {
            regenerar.disabled = false;
          }
        });

        const acciones = el("div", undefined, "acciones");
        acciones.style.justifyContent = "flex-start";
        acciones.style.marginTop = "14px";
        acciones.append(salida, regenerar, guardar);

        cont.append(editor, error, el("h2", "Lo que el harness entiende"), interpretacion);
        // QA por agente: quién autorizó qué, con su frase literal. Crear y revocar son
        // escrituras de una persona: llevan el token del servidor y nunca van sin frase.
        const qaAgente = el("div", undefined, "qa-agente");
        const pintarQaAgente = async () => {
          qaAgente.textContent = "";
          qaAgente.append(el("div", "QA por agente", "titulo-politica"));
          const mensaje = el("div", "", "qa-mensaje");
          let datosQa;
          try {
            datosQa = await enviar("GET", "/api/qa/authorizations");
          } catch (falla) {
            qaAgente.append(el("div", String(falla.message ?? falla), "qa-mensaje mal"));
            return;
          }
          const lista = datosQa.authorizations ?? [];
          if (lista.length === 0) {
            qaAgente.append(el("div", "No hay autorizaciones: la QA por agente está apagada.", "nota-politica"));
          }
          for (const a of lista) {
            const fila = el("div", undefined, "qa-item");
            const detalle = el(
              "span",
              `${a.id} · ${a.types.join(", ")} · ${a.modules.join(", ")} · riesgo hasta ${a.maxRisk} · cupo ${a.dailyQuota}/día · hasta ${a.validUntil.slice(0, 10)} · ${a.actor}: «${a.quote}»`,
            );
            const derecha = el("span");
            derecha.append(el("span", a.estado, `qa-estado ${a.estado}`));
            if (a.estado === "vigente") {
              const revocar = el("button", "Revocar");
              revocar.addEventListener("click", async () => {
                const actor = prompt("¿Quién revoca? (tu nombre)");
                if (actor === null || actor.trim() === "") return;
                const frase = prompt("Escribe tu frase literal de revocación:");
                if (frase === null || frase.trim() === "") return;
                try {
                  await enviar("POST", "/api/qa/authorizations/revoke", { id: a.id, actor, quote: frase });
                  await pintarQaAgente();
                } catch (falla) {
                  mensaje.textContent = String(falla.message ?? falla);
                  mensaje.className = "qa-mensaje mal";
                }
              });
              derecha.append(revocar);
            }
            fila.append(detalle, derecha);
            qaAgente.append(fila);
          }
          const campo = (etiqueta, valor, tipo = "text") => {
            const entrada = el("input");
            entrada.type = tipo;
            entrada.value = valor;
            const rotulo = el("label", etiqueta);
            rotulo.append(entrada);
            return { rotulo, entrada };
          };
          const tipos = campo("Tipos (BUGFIX, IMPROVEMENT, CHORE, FEATURE)", "BUGFIX");
          const modulos = campo("Módulos (separados por coma)", "");
          const riesgo = campo("Riesgo máximo (low o normal)", "normal");
          const cupo = campo("Cupo diario", "1", "number");
          const dias = campo("Vigencia en días", "30", "number");
          const actor = campo("Responsable", "");
          const frase = campo("Frase literal de quien autoriza", "");
          const fila1 = el("div", undefined, "qa-fila");
          fila1.append(tipos.rotulo, modulos.rotulo, riesgo.rotulo, cupo.rotulo, dias.rotulo);
          const fila2 = el("div", undefined, "qa-fila");
          fila2.append(actor.rotulo, frase.rotulo);
          const crear = el("button", "Autorizar");
          crear.addEventListener("click", async () => {
            mensaje.className = "qa-mensaje";
            try {
              const r = await enviar("POST", "/api/qa/authorizations", {
                actor: actor.entrada.value,
                quote: frase.entrada.value,
                types: tipos.entrada.value,
                modules: modulos.entrada.value,
                maxRisk: riesgo.entrada.value,
                dailyQuota: Number(cupo.entrada.value),
                validDays: Number(dias.entrada.value),
              });
              await pintarQaAgente();
              qaAgente.append(el("div", `Autorización ${r.authorization.id} creada.`, "qa-mensaje"));
            } catch (falla) {
              mensaje.textContent = String(falla.message ?? falla);
              mensaje.className = "qa-mensaje mal";
            }
          });
          qaAgente.append(fila1, fila2, crear, mensaje);
        };
        pintarQaAgente();

        // Aprobación automática: quién autorizó qué, con su frase literal. Crear y revocar son
        // escrituras de una persona: llevan el token del servidor y nunca van sin frase.
        const aprobacionAuto = el("div", undefined, "qa-agente");
        const pintarAprobacionAuto = async () => {
          aprobacionAuto.textContent = "";
          aprobacionAuto.append(el("div", "Aprobación automática de planes y análisis", "titulo-politica"));
          const mensaje = el("div", "", "qa-mensaje");
          let datosQa;
          try {
            datosQa = await enviar("GET", "/api/approval/authorizations");
          } catch (falla) {
            aprobacionAuto.append(el("div", String(falla.message ?? falla), "qa-mensaje mal"));
            return;
          }
          const lista = datosQa.authorizations ?? [];
          if (lista.length === 0) {
            aprobacionAuto.append(el("div", "No hay autorizaciones: toda aprobación de un plan la hace una persona.", "nota-politica"));
          }
          for (const a of lista) {
            const fila = el("div", undefined, "qa-item");
            const detalle = el(
              "span",
              `${a.id} · ${a.types.join(", ")} · ${a.modules.join(", ")} · riesgo hasta ${a.maxRisk} · impactos: ${a.impacts.length === 0 ? "ninguno" : a.impacts.join(", ")} · ${a.stages.join("+")} · modo ${a.mode} · cupo ${a.dailyQuota}/día · hasta ${a.validUntil.slice(0, 10)} · ${a.actor}: «${a.quote}»`,
            );
            const derecha = el("span");
            derecha.append(el("span", a.estado, `qa-estado ${a.estado}`));
            if (a.estado === "vigente") {
              const revocar = el("button", "Revocar");
              revocar.addEventListener("click", async () => {
                const actor = prompt("¿Quién revoca? (tu nombre)");
                if (actor === null || actor.trim() === "") return;
                const frase = prompt("Escribe tu frase literal de revocación:");
                if (frase === null || frase.trim() === "") return;
                try {
                  await enviar("POST", "/api/approval/authorizations/revoke", { id: a.id, actor, quote: frase });
                  await pintarAprobacionAuto();
                } catch (falla) {
                  mensaje.textContent = String(falla.message ?? falla);
                  mensaje.className = "qa-mensaje mal";
                }
              });
              derecha.append(revocar);
            }
            fila.append(detalle, derecha);
            aprobacionAuto.append(fila);
          }
          const campo = (etiqueta, valor, tipo = "text") => {
            const entrada = el("input");
            entrada.type = tipo;
            entrada.value = valor;
            const rotulo = el("label", etiqueta);
            rotulo.append(entrada);
            return { rotulo, entrada };
          };
          const tipos = campo("Tipos (BUGFIX, IMPROVEMENT, CHORE, FEATURE, SYNC, INTEGRATION, AGENT)", "BUGFIX");
          const modulos = campo("Módulos (separados por coma)", "");
          const riesgo = campo("Riesgo máximo (low o normal)", "normal");
          const impactos = campo("Impactos admitidos (sync_impact, migration_impact, docker_impact)", "");
          const etapas = campo("Etapas (analysis, plan)", "analysis,plan");
          const modo = campo("Modo (on-approve o reviewer)", "on-approve");
          const cupo = campo("Cupo diario", "1", "number");
          const dias = campo("Vigencia en días", "30", "number");
          const actor = campo("Responsable", "");
          const frase = campo("Frase literal de quien autoriza", "");
          const fila1 = el("div", undefined, "qa-fila");
          fila1.append(tipos.rotulo, modulos.rotulo, riesgo.rotulo, impactos.rotulo, etapas.rotulo, modo.rotulo, cupo.rotulo, dias.rotulo);
          const fila2 = el("div", undefined, "qa-fila");
          fila2.append(actor.rotulo, frase.rotulo);
          const crear = el("button", "Autorizar");
          crear.addEventListener("click", async () => {
            mensaje.className = "qa-mensaje";
            try {
              const r = await enviar("POST", "/api/approval/authorizations", {
                actor: actor.entrada.value,
                quote: frase.entrada.value,
                types: tipos.entrada.value,
                modules: modulos.entrada.value,
                maxRisk: riesgo.entrada.value,
                impacts: impactos.entrada.value,
                stages: etapas.entrada.value,
                mode: modo.entrada.value,
                dailyQuota: Number(cupo.entrada.value),
                validDays: Number(dias.entrada.value),
              });
              await pintarAprobacionAuto();
              aprobacionAuto.append(el("div", `Autorización ${r.authorization.id} creada.`, "qa-mensaje"));
            } catch (falla) {
              mensaje.textContent = String(falla.message ?? falla);
              mensaje.className = "qa-mensaje mal";
            }
          });
          aprobacionAuto.append(fila1, fila2, crear, mensaje);
        };
        pintarAprobacionAuto();

        cont.append(el("h2", "Políticas autónomas"), politicas);
        cont.append(el("h2", "Autorización de QA por agente"), qaAgente);
        cont.append(el("h2", "Aprobación automática de planes"), aprobacionAuto);
        cont.append(el("h2", "Diferencias antes de guardar"), diff, acciones);
        pintar(datos);
      }

      // ── Vista: proveedores ────────────────────────────────────────────────

      let proveedores = [];
      let proveedorActual = null;

      const origen = (p) =>
        p.source === "environment"
          ? "variable de entorno"
          : p.source === "credentials-file"
            ? "archivo de credenciales"
            : p.source === "cli"
              ? "token del CLI"
              : p.source === "none" && p.configured
                ? "no requiere"
                : "—";

      async function vistaProveedores() {
        const cont = $("contenido");
        cont.textContent = "";

        const nota = el("div", undefined, "nota");
        nota.append(
          el("strong", "Las claves se prueban antes de guardarse. "),
          el(
            "span",
            "Si la conexión falla no se escribe nada, así que una clave mal pegada falla aquí y no en la mitad de un gate. Después de guardarla no se vuelve a mostrar: solo se puede reemplazar.",
          ),
        );
        cont.append(nota, el("h2", "Proveedores"));

        const datos = await api("GET", "/api/providers");
        proveedores = datos.providers;

        const tabla = el("table");
        const thead = el("thead");
        const filaCabecera = el("tr");
        for (const columna of ["Proveedor", "Autenticación", "Estado", "Origen", ""]) {
          filaCabecera.append(el("th", columna));
        }
        thead.append(filaCabecera);
        const tbody = el("tbody");

        for (const p of proveedores) {
          const tr = el("tr");

          const celdaNombre = el("td");
          const punto = el("span", undefined, `punto ${p.configured ? "ok" : "no"}`);
          celdaNombre.append(punto, el("span", p.name, "nombre"), el("div", p.id, "id"));
          tr.append(celdaNombre);

          tr.append(
            el(
              "td",
              p.auth === "api-key"
                ? "API key"
                : p.auth === "subscription"
                  ? "suscripción"
                  : "ninguna",
            ),
          );

          const celdaEstado = el("td");
          // «Configurada» y «detectada» no son lo mismo, y confundirlas hace que
          // alguien crea que hizo algo que no hizo: Codex aparece en verde
          // porque su CLI ya tenía sesión, no porque nadie lo configurara aquí.
          const estado = !p.configured
            ? "sin configurar"
            : p.source === "none"
              ? "local"
              : p.source === "cli"
                ? "detectada en el CLI"
                : `configurada${p.keyLength === null ? "" : ` · ${p.keyLength} caracteres`}`;
          celdaEstado.append(el("div", estado));
          if (p.legacyFieldName) {
            celdaEstado.append(
              el(
                "div",
                "campo con el nombre anterior; se normaliza al reescribir",
                "resultado",
              ),
            );
          }
          const salida = el("div", undefined, "resultado");
          salida.dataset.id = p.id;
          celdaEstado.append(salida);
          tr.append(celdaEstado);

          const celdaOrigen = el("td");
          celdaOrigen.append(el("div", origen(p), "resultado"));
          if (p.probeable && p.probeHost) {
            celdaOrigen.append(el("div", `se prueba contra ${p.probeHost}`, "resultado"));
          }
          tr.append(celdaOrigen);

          const celdaAcciones = el("td");
          const acciones = el("div", undefined, "acciones");

          // Un proveedor de suscripción no tiene endpoint: su credencial es el
          // token que ya vive en el CLI. Un botón que siempre falla parece un
          // error del usuario, así que en su lugar se dice qué usa.
          if (p.probeable) {
            const probar = el("button", "Probar");
            probar.title = `Se prueba contra ${p.probeHost}`;
            probar.addEventListener("click", () => void probarConexion(p, salida, probar));
            acciones.append(probar);
          } else if (p.tokenSource) {
            salida.className = "resultado";
            salida.textContent = p.configured
              ? `Detectada en ${p.tokenSource}. No hay endpoint que probar.`
              : `No se encontró ${p.tokenSource}. Inicia sesión con el CLI de ${p.name} y vuelve a recargar.`;
          }

          if (p.auth === "api-key") {
            const configurar = el(
              "button",
              p.configured ? "Reemplazar" : "Configurar",
              p.configured ? "" : "principal",
            );
            configurar.addEventListener("click", () => abrirDialogo(p));
            acciones.append(configurar);
          }
          if (p.configured && p.auth === "api-key" && p.source === "credentials-file") {
            const borrar = el("button", "Borrar", "peligro");
            borrar.addEventListener("click", () => void borrarClave(p, borrar));
            acciones.append(borrar);
          }

          celdaAcciones.append(acciones);
          tr.append(celdaAcciones);
          tbody.append(tr);
        }

        tabla.append(thead, tbody);
        cont.append(tabla);
      }

      async function probarConexion(p, salida, boton) {
        boton.disabled = true;
        salida.className = "resultado";
        salida.textContent = "probando…";
        try {
          const r = await api("POST", `/api/providers/${p.id}/probe`);
          // Un 400 con la credencial aceptada no es un error de credencial: se
          // muestra aparte para que no mande a buscar la clave donde no está.
          salida.className = `resultado ${r.ok ? "ok" : r.credentialAccepted === true ? "alerta" : "error"}`;
          salida.textContent = `${r.detail} · ${r.latencyMs} ms`;
        } catch (error) {
          salida.className = "resultado error";
          salida.textContent = error.message;
        } finally {
          boton.disabled = false;
        }
      }

      function abrirDialogo(p) {
        proveedorActual = p;
        $("titulo").textContent = `Configurar ${p.name}`;
        $("ayuda").textContent =
          "La clave se prueba contra el endpoint del proveedor antes de guardarse.";
        $("clave").value = "";
        $("aviso").textContent =
          p.source === "environment"
            ? `Ahora mismo se usa la variable de entorno ${p.envVar}, que tiene prioridad sobre el archivo.`
            : "";
        $("dialogo").showModal();
        $("clave").focus();
      }

      async function guardar() {
        const clave = $("clave").value.trim();
        if (clave === "") {
          $("aviso").textContent = "Escribe la clave antes de guardar.";
          return;
        }
        const boton = $("guardar");
        boton.disabled = true;
        boton.textContent = "Probando…";
        try {
          const r = await api("PUT", `/api/providers/${proveedorActual.id}/credential`, {
            apiKey: clave,
          });
          const id = proveedorActual.id;
          // La lista de proveedores usables acaba de cambiar, así que el catálogo
          // de modelos cacheado ya no vale: un proveedor recién configurado tiene
          // que aparecer en el selector sin recargar la página.
          cacheModelos = null;
          $("dialogo").close();
          await vistaProveedores();
          const salida = document.querySelector(`.resultado[data-id="${id}"]`);
          if (salida) {
            salida.className = "resultado ok";
            salida.textContent = `${r.probe.detail} · ${r.probe.latencyMs} ms`;
          }
        } catch (error) {
          $("aviso").textContent = error.message;
        } finally {
          boton.disabled = false;
          boton.textContent = "Probar y guardar";
        }
      }

      async function borrarClave(p, boton) {
        if (
          !confirm(
            `¿Borrar la clave de ${p.name}? Dejará de estar disponible para los gates.`,
          )
        )
          return;
        boton.disabled = true;
        try {
          await api("DELETE", `/api/providers/${p.id}/credential`);
          cacheModelos = null;
          await vistaProveedores();
        } catch (error) {
          alert(error.message);
          boton.disabled = false;
        }
      }

      // ── Estado en vivo ────────────────────────────────────────────────────

      /**
       * El servidor avisa cuando algo cambia en disco, y la vista se rehace.
       *
       * Dos cosas que **no** se hacen, y son deliberadas:
       *
       * 1. No se refresca mientras hay un diálogo abierto o alguien está
       *    escribiendo. Perder lo que se está a medio escribir es peor que ver
       *    un dato un segundo viejo.
       * 2. No se refresca mientras hay una petición en vuelo lanzada por el
       *    usuario: mover el estado y repintar a la vez daría una pantalla que
       *    parpadea justo cuando se acaba de pulsar un botón.
       */
      let refrescoPendiente = null;
      let ocupado = false;
      let suscripcionDeEventos = null;
      const cursoresDeEjecucion = new Map();
      const reconciliacionesDeEjecucion = new Map();
      const prefijoCursorDeEjecucion = "valmen.execution-cursor.";

      function leerCursorDeEjecucion(projectId) {
        const enMemoria = cursoresDeEjecucion.get(projectId);
        if (Number.isSafeInteger(enMemoria) && enMemoria >= 0) return enMemoria;
        try {
          const guardado = typeof sessionStorage === "undefined"
            ? null
            : sessionStorage.getItem(prefijoCursorDeEjecucion + projectId);
          const cursor = Number(guardado);
          if (Number.isSafeInteger(cursor) && cursor >= 0) {
            cursoresDeEjecucion.set(projectId, cursor);
            return cursor;
          }
        } catch {
          // El almacenamiento puede estar bloqueado por el navegador. La copia
          // en memoria conserva la misma protección durante esta pestaña.
        }
        return 0;
      }

      function guardarCursorDeEjecucion(projectId, cursor, opciones = {}) {
        if (!Number.isSafeInteger(cursor) || cursor < 0) return false;
        const anterior = leerCursorDeEjecucion(projectId);
        // Una página lenta no puede hacer retroceder el cursor. La única
        // excepción es la frontera inválida declarada por el servidor: después
        // de pedir la foto actual se vuelve a anclar en su último cursor.
        if (!opciones.reiniciar && cursor <= anterior) return false;
        cursoresDeEjecucion.set(projectId, cursor);
        try {
          if (typeof sessionStorage !== "undefined") {
            sessionStorage.setItem(prefijoCursorDeEjecucion + projectId, String(cursor));
          }
        } catch {
          // La memoria ya contiene el cursor para la sesión presente.
        }
        return cursor !== anterior;
      }

      function cursorDelMensajeDeEjecucion(mensaje) {
        let cursor = Number(mensaje.lastEventId);
        try {
          const dato = JSON.parse(mensaje.data);
          if (Number.isSafeInteger(dato.cursor)) cursor = dato.cursor;
        } catch {
          // En un SSE malformado solo queda el identificador del evento.
        }
        return Number.isSafeInteger(cursor) && cursor >= 0 ? cursor : null;
      }

      async function reconciliarEventosDeEjecucion(projectId) {
        const pendiente = reconciliacionesDeEjecucion.get(projectId);
        if (pendiente !== undefined) return pendiente;

        const reconciliacion = (async () => {
          let cursor = leerCursorDeEjecucion(projectId);
          let huboCambios = false;
          for (;;) {
            const pagina = await api(
              "GET",
              `/api/execution-events?after=${encodeURIComponent(cursor)}&limit=100`,
            );
            if (projectId !== proyectoSeleccionado) return false;

            if (pagina.cursorValid === false) {
              const frontera = Number(pagina.latestCursor);
              if (Number.isSafeInteger(frontera) && frontera >= 0) {
                guardarCursorDeEjecucion(projectId, frontera, { reiniciar: true });
              }
              // La foto completa de jornadas reancla el navegador cuando el
              // registro local fue rotado y su cursor ya no existe.
              return true;
            }

            for (const evento of pagina.events ?? []) {
              const cursorDelEvento = Number(evento.cursor);
              if (guardarCursorDeEjecucion(projectId, cursorDelEvento)) huboCambios = true;
            }
            const siguiente = Number(pagina.nextCursor);
            if (!Number.isSafeInteger(siguiente) || siguiente < cursor) return huboCambios;
            if (pagina.hasMore !== true || siguiente === cursor) return huboCambios;
            cursor = siguiente;
          }
        })();
        reconciliacionesDeEjecucion.set(projectId, reconciliacion);
        try {
          return await reconciliacion;
        } finally {
          if (reconciliacionesDeEjecucion.get(projectId) === reconciliacion) {
            reconciliacionesDeEjecucion.delete(projectId);
          }
        }
      }

      function puedeRefrescar() {
        if (ocupado) return false;
        if (document.querySelector("dialog[open]") !== null) return false;
        const foco = document.activeElement;
        if (foco === null) return true;
        return !["INPUT", "TEXTAREA", "SELECT"].includes(foco.tagName);
      }

      function programarRefrescoPorEvento(rutas) {
        // Los contadores de la navegación se actualizan siempre: son un número
        // chico y dicen si hay algo esperando, aunque la vista no se repinte.
        void marcarPendientes();

        if (!elCambioTocaLaVista(rutas)) return;

        if (!puedeRefrescar()) {
          // La persona está escribiendo, tiene un diálogo abierto, o el harness
          // está en medio de una mutación: no se le mueve la pantalla, y se le
          // dice que hay algo nuevo para mirar cuando quiera.
          avisarQueHayCambios();
          return;
        }

        clearTimeout(refrescoPendiente);
        // Un margen corto: una mutación escribe el ticket, el índice y el
        // recibo en milisegundos, y sin él la vista se reharía tres veces.
        refrescoPendiente = setTimeout(() => {
          if (!puedeRefrescar()) {
            avisarQueHayCambios();
            return;
          }
          if (!elCambioTocaLaVista(rutas)) return;
          marcarActualizado();
          // Conservando la vista: refrescar no es navegar, y nadie tiene por qué
          // perder dónde estaba leyendo.
          void navegar({ conservarVista: true });
        }, 300);
      }

      function conectarEventos() {
        if (suscripcionDeEventos !== null) suscripcionDeEventos.close();
        const ruta =
          proyectoSeleccionado === ""
            ? "/api/events"
            : `/api/events?project=${encodeURIComponent(proyectoSeleccionado)}`;
        const eventos = new EventSource(ruta);
        suscripcionDeEventos = eventos;
        // «conectando…» es cierto hasta que la conexión abre, y después es una
        // mentira tranquila: la pantalla se queda diciendo que está conectando
        // cuando ya está conectada y lo único que pasa es que nadie escribió.
        eventos.onopen = () => {
          if (suscripcionDeEventos !== eventos) return;
          const marca = $("actualizado");
          if (marca !== null) marca.textContent = "en vivo";
        };
        eventos.onerror = () => {
          if (suscripcionDeEventos !== eventos) return;
          const marca = $("actualizado");
          if (marca !== null) marca.textContent = "sin conexión";
        };
        eventos.addEventListener("execution", (mensaje) => {
          if (suscripcionDeEventos !== eventos) return;
          const cursor = cursorDelMensajeDeEjecucion(mensaje);
          if (cursor !== null && guardarCursorDeEjecucion(proyectoSeleccionado, cursor)) {
            programarRefrescoPorEvento([]);
          }
        });
        eventos.addEventListener("reconcile", () => {
          const projectId = proyectoSeleccionado;
          if (projectId === "" || suscripcionDeEventos !== eventos) return;
          void reconciliarEventosDeEjecucion(projectId)
            .then((huboCambios) => {
              if (huboCambios && suscripcionDeEventos === eventos && projectId === proyectoSeleccionado) {
                programarRefrescoPorEvento([]);
              }
            })
            .catch((error) => {
              // Cambiar de proyecto invalida a propósito la respuesta anterior;
              // no es un error visible ni una razón para repintar datos ajenos.
              if (error !== RESPUESTA_DE_PROYECTO_OBSOLETA) {
                const marca = $("actualizado");
                if (marca !== null) marca.textContent = "sin conexión";
              }
            });
        });
        eventos.onmessage = (mensaje) => {
          if (suscripcionDeEventos !== eventos) return;
          // Lo que cambió viene en el aviso. Si no se puede leer, se asume que
          // toca todo: refrescar de más es molesto, refrescar de menos miente.
          let rutas = [];
          try {
            const dato = JSON.parse(mensaje.data);
            if (Array.isArray(dato.paths)) rutas = dato.paths.map(String);
          } catch {
            rutas = [];
          }

          programarRefrescoPorEvento(rutas);
        };
      }

      function marcarActualizado() {
        const marca = $("actualizado");
        if (marca === null) return;
        const ahora = new Date();
        marca.textContent =
          "actualizado " +
          String(ahora.getHours()).padStart(2, "0") +
          ":" +
          String(ahora.getMinutes()).padStart(2, "0") +
          ":" +
          String(ahora.getSeconds()).padStart(2, "0");
      }

      /**
       * El título de la barra, que dice en qué vista se está.
       *
       * La navegación dejó de marcar la vista con una línea debajo de cada
       * pestaña: en la barra lateral el destino se ve por dónde está el resalte,
       * y el título de arriba lo dice con palabras —también cuando la vista es
       * una que no está en la lista, como el detalle de un ticket—.
       */
      const TITULOS = {
        tickets: "Tickets",
        ticket: "Ticket",
        features: "Features",
        feature: "Feature",
        procesos: "Procesos",
        portafolio: "Portafolio",
        jornadas: "Corrida",
        corrida: "Corrida",
        estandares: "Estándares",
        configurar: "Configurar",
        modelos: "Modelos",
        configuracion: "Configuración",
        proveedores: "Proveedores",
      };

      function marcarTitulo(nombre, parametro) {
        const titulo = $("titulo-vista");
        const sello = $("sello-vista");
        if (titulo === null) return;
        titulo.textContent = TITULOS[nombre] ?? "Tickets";
        if (sello === null) return;
        // El identificador del sujeto abierto, cuando lo hay: sin él, dos
        // pantallas distintas del mismo tipo se ven iguales en la barra.
        sello.textContent = parametro ?? "";
        sello.style.display = parametro === undefined ? "none" : "";
      }

      /**
       * Los números que piden atención, en la navegación.
       *
       * Un menú dice a dónde se puede ir; esto dice **a dónde conviene ir**: las
       * propuestas que esperan una decisión y los tickets que esperan una prueba
       * de la persona. Son las dos cosas que se quedan quietas si nadie mira, y
       * por eso están a la vista desde cualquier pantalla.
       */
      async function marcarPendientes() {
        const poner = (vista, cuantos, alerta) => {
          const enlace = document.querySelector(`nav a[data-vista="${vista}"]`);
          if (enlace === null) return;
          const previo = enlace.querySelector(".cuenta");
          if (previo !== null) previo.remove();
          if (cuantos === 0) return;
          enlace.append(el("span", String(cuantos), alerta ? "cuenta alerta" : "cuenta"));
        };

        try {
          const [estandares, tickets] = await Promise.all([
            api("GET", "/api/standards"),
            api("GET", "/api/tickets"),
          ]);
          poner(
            "estandares",
            estandares.proposals.filter((p) => p.state === "propuesto").length,
            true,
          );
          poner(
            "tickets",
            (tickets.tickets ?? []).filter((t) => t.workflowStatus === "awaiting_user_tests")
              .length,
            true,
          );
        } catch {
          // Sin números no se rompe nada: la navegación se queda sin contadores.
        }
      }

      /** El pliegue de la barra lateral, recordado entre visitas. */
      function montarPliegue() {
        const boton = $("pliegue");
        if (boton === null) return;
        const guardado = localStorage.getItem("valmen-lateral");
        if (guardado === "oculta") document.body.classList.add("lateral-oculta");
        boton.addEventListener("click", () => {
          const oculta = document.body.classList.toggle("lateral-oculta");
          localStorage.setItem("valmen-lateral", oculta ? "oculta" : "visible");
        });
      }

      // ── Enrutado ──────────────────────────────────────────────────────────

      /**
       * Dónde estaba mirando la persona, y qué tenía abierto.
       *
       * El refresco en vivo repinta la vista entera, y sin esto la pantalla volvía
       * al principio cada vez que el agente escribía algo: se perdía el scroll y
       * los acordeones que la persona había abierto. El síntoma que lo hizo
       * evidente: revisar las compuertas de un ticket mientras el agente lo
       * escribe era imposible —cada mutación subía la pantalla— y había que
       * esperar a que terminara.
       */
      function instantaneaDeLaVista() {
        const cont = $("contenido");
        const abiertos = [];
        if (cont !== null) {
          for (const caja of cont.querySelectorAll("details.acordeon")) {
            const clave = caja.dataset.acordeon;
            if (caja.open && clave !== undefined && clave !== "") abiertos.push(clave);
          }
        }
        return { scrollY: window.scrollY, abiertos };
      }

      function restaurarVista(antes) {
        const cont = $("contenido");
        if (cont !== null) {
          for (const caja of cont.querySelectorAll("details.acordeon")) {
            if (antes.abiertos.includes(caja.dataset.acordeon)) caja.open = true;
          }
        }
        // El scroll se restaura **después** de pintar: el documento cambia de alto
        // con el contenido nuevo, y hacerlo antes deja la pantalla a mitad de
        // camino —que es el salto que se quería evitar—.
        if (antes.scrollY > 0) window.scrollTo(0, antes.scrollY);
      }

      /** Muestra «hay cambios» sin repintar: el refresco se difirió. */
      function avisarQueHayCambios() {
        const boton = $("hay-cambios");
        if (boton !== null) boton.hidden = false;
      }

      function ocultarAvisoDeCambios() {
        const boton = $("hay-cambios");
        if (boton !== null) boton.hidden = true;
      }

      /**
       * Si el cambio toca lo que se está mirando.
       *
       * El servidor avisa con las rutas que cambiaron, así que una mutación de
       * **otro** ticket no tiene por qué repintar esta pantalla. Las vistas que
       * agregan —listas, tableros, procesos— se refrescan siempre: cualquier
       * cambio puede mover un contador. La de un ticket solo cuando el cambio lo
       * nombra; los recibos de ese ticket llevan su identificador en el nombre del
       * archivo, así que entran solos.
       */
      function elCambioTocaLaVista(rutas) {
        const ruta = location.hash.replace(/^#\//, "") || "tickets";
        const [nombre, parametro] = ruta.split("/");
        if (nombre !== "ticket" || parametro === undefined) return true;
        if (rutas.length === 0) return true;
        return rutas.some((p) => p.includes(parametro));
      }

      async function navegar(opciones = {}) {
        clearTimeout(refrescoPendiente);
        bandaDeFasesActual = null;
        const ruta = location.hash.replace(/^#\//, "") || "tickets";
        const [nombre, parametro] = ruta.split("/");
        clearTimeout(refrescoDeCorrida);
        if (nombre !== "jornadas" && nombre !== "corrida") revisionVistaJornadas += 1;

        // Navegar de verdad empieza arriba; **refrescar** no mueve a nadie.
        const antes = opciones.conservarVista === true ? instantaneaDeLaVista() : null;

        marcarTitulo(nombre, parametro);

        for (const enlace of document.querySelectorAll("nav a")) {
          // Un ticket pertenece a la vista de tickets: la pestaña sigue marcada
          // para que la navegación no parezca perderse al abrir uno.
          const activa =
            enlace.dataset.vista === nombre ||
            (nombre === "ticket" && enlace.dataset.vista === "tickets") ||
            (nombre === "feature" && enlace.dataset.vista === "features");
          if (activa) enlace.setAttribute("aria-current", "page");
          else enlace.removeAttribute("aria-current");
        }

        try {
          if (nombre === "ticket" && parametro !== undefined) await vistaTicket(parametro);
          else if (nombre === "feature" && parametro !== undefined)
            await vistaFeature(parametro);
          else if (nombre === "configurar") await vistaConfigurar();
          else if (nombre === "modelos") await vistaModelos();
          else if (nombre === "configuracion") await vistaConfiguracion();
          else if (nombre === "proveedores") await vistaProveedores();
          else if (nombre === "features") await vistaFeatures();
          else if (nombre === "procesos") await vistaProcesos();
          else if (nombre === "portafolio") await vistaPortafolio();
          else if (nombre === "corrida" || nombre === "jornadas") await vistaCorrida();
          else if (nombre === "estandares") await vistaEstandares();
          else await vistaTickets();
        } catch (error) {
          if (error === RESPUESTA_DE_PROYECTO_OBSOLETA) return;
          const cont = $("contenido");
          cont.textContent = "";
          cont.append(el("div", `No se pudo cargar la vista: ${error.message}`, "vacio"));
        } finally {
          if (antes !== null) restaurarVista(antes);
          ocultarAvisoDeCambios();
        }
      }

      $("hay-cambios").addEventListener("click", () => {
        marcarActualizado();
        void navegar({ conservarVista: true });
      });
      $("cancelar").addEventListener("click", () => $("dialogo").close());
      $("guardar").addEventListener("click", () => void guardar());
      $("clave").addEventListener("keydown", (e) => {
        if (e.key === "Enter") void guardar();
      });
      window.addEventListener("hashchange", () => void navegar());

      void refrescarProyectoVisible();
      void cargarSelectorDeProyectos();
      montarPliegue();
      conectarEventos();
      void marcarPendientes();
      void navegar();
    </script>
  </body>
</html>
